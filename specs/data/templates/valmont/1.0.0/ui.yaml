# 展示层声明（`specs/SPEC.md` §1.5 形状 B）。等价现状基线：
# 族谱 / 宗族是 family 扩展提供的能力 id，落在 world.subview 槽里成为「世界」页的子页签。
# 改这里不进语义指纹，旧档照开。
place:
  life: tab
  personal: tab
  world: tab
  log: tab
  records: tab
  character: slot:personal
  equipment: slot:personal
  inventory: slot:personal
  skills: slot:personal
  relations: slot:npcList
  wheel: overlay
  battle: overlay
  event: overlay
  pedigree: slot:world.subview
  clan: slot:world.subview
# ADR-003：决意（能量豆）用刻度展示；花光不告警（dangerAt: 0）。
resources:
  beans: { display: pips, dangerAt: 0 }

# 人生页人物卡展示哪些属性（2026-11-19）：顺序即展示顺序，
# ladder 占整行（带进度条），其余三列排布。这份文件不进语义指纹。
playerCard:
  attributes: [prowess, body, mind, will]

# 瓦勒蒙家族角色表。
#
# 亲缘写法（`docs/FAMILY-GRAPH.md` §1/§2 的模式二 —— 本模板声明了 `extensions.family`）：
#   · 父/母只写在**孩子**身上：`fatherId` / `motherId` 指向角色 id。写一次即唯一真源，
#     不要再给孩子写 `son` / `daughter` 反向边（那是边模式的重复来源）。
#   · 婚配不进本表，写在 `world.yaml` 的 `extensions.family.spouses`（`[{ a, b }]`，无向，
#     数组顺序 = 先后）。指针模式没有婚姻边，配偶行/配偶称谓全部从那张表推。
#   · 兄弟姐妹、祖孙、叔伯、堂表**一律不写**：由共同父/母派生。
#   · 本表 `relations` 只留给社会关系（朋友/同僚）；本模板没有这类关系，故整段省略。
#
# 八类婚配与「九种结合」在这套写法下的落点（逐条可核对）：
#   ① 无血缘  巴尔多 × 希尔达    spouses + 两人的孩子写同一对父/母指针
#   ② 多配偶  巴尔多 × 希尔达、伊尔玛  spouses 两条（顺序即先后）；戈弗雷的 motherId 指伊尔玛
#   ③ 兄妹    奥德里克 × 玛蒂尔达  spouses 一条；两人的 fatherId/motherId 都是巴尔多/希尔达
#   ④ 半血缘  玛蒂尔达 × 戈弗雷    spouses 一条；同父异母由 motherId 不同自然浮现
#   ⑤ 纯伦理  戈弗雷 × 罗莎      spouses 一条；两人没有任何共同祖先（罗莎的父是康拉德）
#   ⑥ 母子    休 × 玛蒂尔达      spouses 一条；休的 motherId 指玛蒂尔达
#   ⑦ 父女    奥德里克 × 塞西莉    spouses 一条；塞西莉的 fatherId 指奥德里克
#   ⑧ 隔代    奥德里克 × 布兰奇    spouses 一条；布兰奇的父/母是奥德里克/塞西莉（孙辈）
#   ⑨ 汇合    雷纳德 × 布兰奇      spouses 一条；玩家（罗兰）的父/母指向这两人
#
# 罗莎**不写 motherId**：她是康拉德前妻之女，伊尔玛只是继母（零血缘）。
# 指针模型下「不写」就是「不详」，继母女关系由「父之妻」推出，不需要额外注释解释。
#
# 十二个人：六人在册已故，六人在世。已故者由首幕的 setNpcLifecycle 置为 inactive。
characters:
  - id: npc-bardo
    isEnemy: false
    visibility: public
    identity:
      name: 巴尔多
      age: 100
      gender: male
      description: 建这座宅子的人。册子第一页只有他一个人的字，后面的字都在学他。
    mood: { value: 30 }
    attributes: { body: 5, mind: 7, will: 9 }
    public:
      personality: 说话像在立规矩。规矩立完之后，他自己是第一个不守的人。
      knownGoals: [把两支并成一支]
    private:
      secrets: []
      knowledge: []
      goals: [merge-branches]
      traits: [stern]
    relationship: 0

  - id: npc-hilda
    isEnemy: false
    visibility: public
    identity:
      name: 希尔达
      age: 98
      gender: female
      description: 第一页右栏是她的名字，墨最淡。她没有留下别的东西，除了这条线。
    mood: { value: 40 }
    attributes: { body: 4, mind: 6, will: 6 }
    public:
      personality: 据记载她只说过一句话：往下数，别往回数。
      knownGoals: []
    private:
      secrets: []
      knowledge: []
      goals: []
      traits: [quiet]
    relationship: 0

  - id: npc-irma
    isEnemy: false
    visibility: public
    identity:
      name: 伊尔玛
      age: 92
      gender: female
      description: 巴尔多续娶的那一位。她进宅时带了一个女儿，册子上写的是「随母入籍」。
    mood: { value: 35 }
    attributes: { body: 4, mind: 7, will: 6 }
    public:
      personality: 从不提进门之前的事。有人问，她就说那一段没记。
      knownGoals: [让带来的女儿有一个栏位]
    private:
      secrets: ["fact:rosa-outsider"]
      knowledge: ["fact:rosa-outsider"]
      goals: [seat-daughter]
      traits: [guarded]
    relationship: 0
    # 罗莎是康拉德**前妻**之女，伊尔玛只是继母 —— 故罗莎不写 motherId。
    # 「父之妻」推出的继母女关系不会落成生母：指针模式没有「爸爸的妻子 = 妈妈」这条硬编码。

  - id: npc-konrad
    isEnemy: false
    visibility: public
    identity:
      name: 康拉德
      age: 94
      gender: male
      description: 伊尔玛的前夫，外姓。册子上只留了一个姓，没有生卒，也没有画像。
    mood: { value: 30 }
    attributes: { body: 5, mind: 5, will: 5 }
    public:
      personality: 关于他的一切都是别人转述的，包括他有没有存在过。
      knownGoals: []
    private:
      secrets: []
      knowledge: []
      goals: []
      traits: [absent]
    relationship: 0

  # ── 第三代：三处血亲婚配的起点都集中在他身上 ──
  - id: npc-aldric
    isEnemy: false
    visibility: public
    identity:
      name: 奥德里克
      age: 78
      gender: male
      description: 册子上他名下有四个栏位：兄、父、夫、祖。四个栏位填的是同一个姓，字迹一次比一次稳。
    mood: { value: 38 }
    attributes: { body: 6, mind: 8, will: 8 }
    public:
      personality: 只谈栏位，不谈人。他能把一段血缘念得像一份契书。
      knownGoals: [让血收成一条线]
    private:
      secrets: ["fact:pure-line"]
      knowledge: ["fact:pure-line"]
      goals: [concentrate-line]
      traits: [exact, cold]
    relationship: 10
    fatherId: npc-bardo
    motherId: npc-hilda
    # ③ 兄妹婚 / ⑦ 父女婚 / ⑧ 隔代婚的对端都在 spouses 表里；
    # 他作为父亲的三处（休、塞西莉、布兰奇）由孩子那侧的指针表达。

  - id: npc-mathilde
    isEnemy: false
    visibility: public
    identity:
      name: 玛蒂尔达
      age: 76
      gender: female
      description: 她的名字在同一页出现过三次，三次的栏头不一样：妹妹、妻子、母亲。第三个栏头是后来添的，添在她儿子那一行。
    mood: { value: 25 }
    attributes: { body: 3, mind: 7, will: 7 }
    public:
      personality: 说话极轻。你要靠近才能听清，靠近之后她又不说了。
      knownGoals: []
    private:
      secrets: ["fact:pure-line"]
      knowledge: ["fact:pure-line"]
      goals: [hold-line]
      traits: [fragile]
    relationship: 5
    fatherId: npc-bardo
    motherId: npc-hilda
    # ③ 兄妹 / ④ 半血缘 / ⑥ 母子三种身份各一条 spouses；孩子都写她的 motherId。

  - id: npc-godfrey
    isEnemy: false
    visibility: public
    identity:
      name: 戈弗雷
      age: 74
      gender: male
      description: 庶出的那一支。他的栏位比嫡支低半行，但他自己从不提这件事——提了就等于承认自己在意。
    mood: { value: 45 }
    attributes: { body: 6, mind: 6, will: 6 }
    public:
      personality: 记得每一页的边角对齐过几次。他信「齐」这件事。
      knownGoals: [让庶支的名字进正册]
    private:
      secrets: ["fact:rosa-outsider"]
      knowledge: ["fact:rosa-outsider"]
      goals: [seat-branch]
      traits: [exact, stubborn]
    relationship: 20
    fatherId: npc-bardo
    # ④ 半血缘的另一半：与玛蒂尔达同父异母，差别只在 motherId。
    motherId: npc-irma

  - id: npc-rosa
    isEnemy: false
    visibility: public
    identity:
      name: 罗莎
      age: 72
      gender: female
      description: 她是这栋宅子里唯一一个名字从外面写进来的人。栏位是新的，纸比周围白。
    mood: { value: 50 }
    attributes: { body: 4, mind: 8, will: 7 }
    public:
      personality: 她说话时不用家族的称呼。她叫人的名字，只叫名字。
      knownGoals: [不让自己那一页被刮掉]
    private:
      secrets: ["fact:rosa-outsider"]
      knowledge: ["fact:rosa-outsider"]
      goals: [stay-listed]
      traits: [detached]
    relationship: 25
    fatherId: npc-konrad
    # ⑤ 纯伦理：她与戈弗雷没有一个共同祖先；婚配在 spouses 表。

  - id: npc-hugh
    isEnemy: false
    visibility: public
    identity:
      name: 休
      age: 60
      gender: male
      description: 他的父母栏填着两个人，其中一个是他的母亲；他的配偶栏填着一个人，还是她。两栏之间隔了三行。
    mood: { value: 20 }
    attributes: { body: 5, mind: 5, will: 4 }
    public:
      personality: 从不在同一句话里提母亲和妻子。他分得开，所以更说不出口。
      knownGoals: []
    private:
      secrets: ["fact:pure-line"]
      knowledge: ["fact:pure-line"]
      goals: [survive]
      traits: [dimmed]
    relationship: 15
    fatherId: npc-aldric
    # ⑥ 母子婚：同一个人在父亲栏与配偶栏里各出现一次 —— 指针与 spouses 各写一份。
    motherId: npc-mathilde

  - id: npc-cecily
    isEnemy: false
    visibility: public
    identity:
      name: 塞西莉
      age: 58
      gender: female
      description: 她的父栏和配偶栏是同一个名字。写这两栏的是同一个人，间隔十九年。
    mood: { value: 28 }
    attributes: { body: 4, mind: 7, will: 6 }
    public:
      personality: 她把每一页都读过，包括自己的。她说读完了就不疼了。
      knownGoals: [让布兰奇搬出这一页]
    private:
      secrets: ["fact:pure-line"]
      knowledge: ["fact:pure-line"]
      goals: [free-daughter]
      traits: [resolved]
    relationship: 10
    # ⑦ 父女婚：父栏与配偶栏同一个 id（父亲在指针里，婚姻在 spouses 表）。
    fatherId: npc-aldric
    motherId: npc-mathilde

  - id: npc-reynard
    isEnemy: false
    visibility: public
    identity:
      name: 雷纳德
      age: 42
      gender: male
      description: 他是两条坍缩线的交点。册子上他的祖先栏能一直往上数到两个人，数到头只有两个人。
    mood: { value: 22 }
    attributes: { body: 5, mind: 6, will: 5 }
    public:
      personality: 话少。他数过自己有多少个祖先，数出来的数让他一夜没睡。
      knownGoals: [让罗兰离开这座宅子]
    private:
      secrets: ["fact:pure-line"]
      knowledge: ["fact:pure-line", "fact:rosa-outsider"]
      goals: [free-son]
      traits: [haunted]
    relationship: 30
    fatherId: npc-hugh
    motherId: npc-mathilde

  - id: npc-blanche
    isEnemy: false
    visibility: public
    identity:
      name: 布兰奇
      age: 40
      gender: female
      description: 她的父栏是奥德里克，母栏是塞西莉，配偶栏先是奥德里克，后来是雷纳德。前两个名字是她的血，第三个是她的选择。
    mood: { value: 32 }
    attributes: { body: 4, mind: 7, will: 7 }
    public:
      personality: 她只问过一次：我们还有没有别人可以选。没有人回答她。
      knownGoals: [找到第三个名字以外的人]
    private:
      secrets: ["fact:pure-line"]
      knowledge: ["fact:pure-line"]
      goals: [find-outsider]
      traits: [willful]
    relationship: 35
    # ⑧ 隔代婚的另一侧：父/母是祖辈的两个人，自己又在 spouses 表里嫁给祖父。
    fatherId: npc-aldric
    motherId: npc-cecily

playerTemplate:
  identity: { gender: male, age: 20 }
  mood: 35
  attributes: { body: 5, mind: 7, will: 6 }
  # ⑨ 汇合：玩家（罗兰）是雷纳德 × 布兰奇的孩子。玩家也走指针，不走边。
  fatherId: npc-reynard
  motherId: npc-blanche

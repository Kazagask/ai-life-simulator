# 剧本模板 · 瓦勒蒙家族（valmont）
#
# 这张模板是把「八类婚配交织图」落成运行时资产。亲缘走**指针模式**（`extensions/family/doc/FAMILY-GRAPH.md` §2）：
#   · 父/母 = `characters.yaml` 里孩子身上的 `fatherId` / `motherId`（写一次，唯一真源）；
#   · 婚配 = 下面 `extensions.family.spouses` 的 `[{ a, b }]`（无向，数组顺序即先后）；
#   · 兄弟姐妹 / 祖孙 / 叔伯全部由前两者派生，模板不写第二份。
# 每一类结合在 events.yaml 里对应一幕：
#
#   ① 无血缘    巴尔多 × 希尔达        两支撑起全部后代
#   ② 多配偶    巴尔多 × 希尔达、伊尔玛  嫡庶两支同源
#   ③ 兄妹      奥德里克 × 玛蒂尔达      生休与塞西莉
#   ④ 半血缘    玛蒂尔达 × 戈弗雷        同父异母，转房婚
#   ⑤ 纯伦理    戈弗雷 × 罗莎            罗莎是伊尔玛前夫之女，零血缘
#   ⑥ 母子      休 × 玛蒂尔达            生雷纳德
#   ⑦ 父女      奥德里克 × 塞西莉        生布兰奇
#   ⑧ 隔代      奥德里克 × 布兰奇        祖孙，名分婚，无子
#   ⑨ 汇合      雷纳德 × 布兰奇          生罗兰（玩家）
#
# 设定对齐三条硬约束：
#   · 模板不接 LLM（llmTriggers 为空），所有异常都能归因到 game-core；
#   · 全部婚配与生育发生在双方成年后，这是模板层约束，不是叙事取舍；
#   · 描写只落在器物与文书上（册、栏、墨、蜡、灯、门），不写身体、不写情欲。
#
# 时间轴：T=0 为 1320 年，图上所有「−N」读作 1320 减 N 年。
meta:
  id: valmont
  name: 瓦勒蒙 · 八类婚配
  description: 四代人把自己的血收成一根线。册子上每一页都对得上，正因为对得上，才没有人敢翻下去。
  startYear: 1320
  engineProtocol: v2
  # 隐藏模板（2026-11-20）：这张剧本是**能力试验田**，不该出现在选模板界面。
  # 注册表照常收录（inspect / 体检看得见），按 id 建局也照常可用（curl / 脚本）。
  hidden: true
  # 亲缘称谓已迁出 meta：它是 `family` 扩展的能力，声明在下面的顶层 `extensions:`。
  # 不声明那个扩展，内核不再计算任何称谓（推导逻辑已从 game-core 搬到 extensions/family）。

# 运行包版本：主包 ^0.1.0、family 扩展 ^0.1.0；版本不符加载期拒载。
requires:
  core: "^0.1.0"
  extensions:
    family: "^0.1.0"

extensions:
  # 亲缘称谓展示开关。推导本身始终开启，这里只决定**同一段亲缘有多个读法时展示几个**
  # —— 这个剧本的看点正是「一个人同时是谁的谁」，所以打开并排展示；maxHops 保持默认 3。
  family:
    showAllRoles: true
    maxHops: 3
    # 默认窗口 4 会让玩家（g4）只看到 ±3 代，最老的 g0 始祖（bardo / hilda）整代被丢，
    # 家族的根在演示里看不到。放开到 5 才能把 g0..g4 五代都留在屏上。
    maxGenerations: 5

    # 婚配表（`extensions/family/doc/FAMILY-GRAPH.md` §3.2）：指针模式下这是配偶行**唯一**的来源，
    # 建世界时原样播种进 `state.extensions.family.spouses`。
    # 无向（`a`/`b` 顺序不表示方向），但**数组顺序就是先后**：巴尔多的两位妻子按希尔达、
    # 伊尔玛排列；伊尔玛的两位丈夫按康拉德（前夫）、巴尔多（续娶）排列。
    # 每条对应上面注释里的一类结合，逐条可对照。
    spouses:
      - { a: npc-bardo, b: npc-hilda } # ① 无血缘
      - { a: npc-konrad, b: npc-irma } # ② 多配偶（伊尔玛的前夫）
      - { a: npc-bardo, b: npc-irma } # ② 多配偶（续娶，嫡庶两支同源）
      - { a: npc-aldric, b: npc-mathilde } # ③ 兄妹（同父同母）
      - { a: npc-mathilde, b: npc-godfrey } # ④ 半血缘（同父异母，转房）
      - { a: npc-godfrey, b: npc-rosa } # ⑤ 纯伦理（零共同祖先）
      - { a: npc-hugh, b: npc-mathilde } # ⑥ 母子
      - { a: npc-aldric, b: npc-cecily } # ⑦ 父女
      - { a: npc-aldric, b: npc-blanche } # ⑧ 隔代（祖孙）
      - { a: npc-reynard, b: npc-blanche } # ⑨ 汇合

    # 宗族声明（`extensions/family/doc/CLAN-DESIGN.md` 第二部分）：**和上面三个族谱开关是两件事**。
    # 上面管「关系图怎么展示」（纯派生，零 state，删掉它族谱就少几代/少几种读法）；
    # 这里给这一段世界**造一个族**，建世界时实例化成 `state.extensions.family` 的
    # clans / members（权威数据，进存档，只被显式 effect 改）。两者互不依赖：
    # 删掉 `clans` 族谱照样画得出来；删掉上面的开关，宗族照样在。
    #
    # 声明里刻意**没有** `headId`：成员只能经 `joinClan` 入族、家主只能经 `setClanHead` 立，
    # 否则会出现「家主不在成员表里」的自我矛盾。所以新世界里的这一族一开始是空族、
    # 家主空缺、大事记只有一条 `founded` —— 这是设计，不要在数据里补人。
    clans:
      - id: valmont
        name: 瓦勒蒙
        # 郡望 / 祖宅：正厅与侧院都在这一座宅子里，家族史就是宅子的册子。
        seat: 瓦勒蒙宅
        # 血脉起点 = 第一页上的两个人：巴尔多与希尔达。四代人、十四条婚配边都由这两人生出。
        lineageRoots: [npc-bardo, npc-hilda]
        # 父系：宅子、姓氏、册子都沿 巴尔多 → 奥德里克 → 休 → 雷纳德 → 罗兰 这一条线传，
        # 母方在这座宅子里从不成为「另一支」（希尔达那句「往下数，别往回数」就是这条规矩）。
        descent: patrilineal
        # 配偶入族 = true：本模板的八类婚配全是**族内消化**。伊尔玛「随母入籍」把罗莎带进来，
        # 玛蒂尔达转房、塞西莉与布兰奇嫁进来，都只是换一个栏位，没有人另立一族。
        # 若写 false，这宅子里绝大多数人都会变成「有亲缘但不在族」，与剧本正相反。
        spouseJoins: true
        # 四代攒下来的门第。声望域是 0..100（`prestige` 段缺省域），单次调整最多 ±20。
        prestige: 60
        # 族学候选（只声明候选；解锁要 `unlockLegacy`，现在全是未解锁）。
        # 名字刻意取本族独有的说法，不用「耕读」「忠孝」这种放哪家都成立的词。
        legacies:
          - { id: one-thread, name: 一线到底 }
          - { id: downward-only, name: 只往下数 }
          - { id: ledger-closes, name: 页页对得上 }

time:
  defaultStep: { value: 1, unit: day }

genders:
  - { id: male, label: 男 }
  - { id: female, label: 女 }

mood:
  min: 0
  max: 100
  defaultValue: 40
  bands:
    - { id: dim, label: 暗, min: 0, max: 29, attributeModifiers: {} }
    - { id: still, label: 静, min: 30, max: 74, attributeModifiers: {} }
    - { id: clear, label: 通明, min: 75, max: 100, attributeModifiers: { mind: 1 } }

statusBar:
  - { id: vitals, label: 状态, source: resource, key: hp }
  # ADR-003：自定义资源；刻度展示在 ui.yaml.resources.beans。
  - { id: resolve, label: 决意, source: resource, key: beans }

attributes:
  order: [body, mind, will, prowess]
  defaults: { body: 4, mind: 6, will: 5, prowess: 10 }
  labels: { body: 体魄, mind: 心智, will: 意志, prowess: 武艺 }
  # ADR-003：武艺是阶梯属性（cumulative）。决斗胜利 +40，能看到档位与进度。
  defs:
    prowess:
      kind: ladder
      tiers:
        - { id: novice, label: 生手, at: 0 }
        - { id: trained, label: 熟手, at: 30 }
        - { id: adept, label: 好手, at: 80 }
        - { id: master, label: 名手, at: 150 }

resources:
  hp: { base: 100, perLevel: 0 }
  mp: { base: 50, perLevel: 0 }
  # 能量豆机制的测试资源：上限 5、开局满、技能消耗 3。
  beans: { label: 决意, base: 5, cap: 5, initial: 5 }

regen:
  perTurn: { hp: 0, mp: 0 }

# 常驻点击面：册子不会自己翻，但每一轮都有一页可看。
actions:
  - id: act-read
    label: 读一页
    description: 只读一页。读完把书脊压平，让它自己合上，不夹书签。
    duration: { value: 1, unit: day }
    effects:
      - { type: adjustFlag, id: pagesRead, value: 1 }
  - id: act-count
    label: 数栏位
    description: 从父栏数到母栏，再数回来。数目总是对得上，这正是最难受的地方。
    duration: { value: 1, unit: day }
    effects:
      - { type: adjustFlag, id: columnsCounted, value: 1 }
  # 观察者切换（ADR-010 D4）：只换「以谁的眼睛看」，不换人。
  - id: act-observe-reynard
    label: 借父亲的眼睛
    description: 你退到门边，让他先看。同一页上，他的字迹比你的重。
    effects:
      - { type: observeActor, actorId: npc-reynard }
  - id: act-observe-self
    label: 收回目光
    description: 你把视线收回来。册子还是那一页，但字是你自己的。
    effects:
      - { type: observeActor, actorId: null }
  - id: act-walk
    label: 走到侧院
    description: 侧院的门框比正厅矮一掌。你每次过去都要低头，低头的时候会看见门框上刻的四道痕。
    duration: { value: 1, unit: day }

# NPC 自主行动：本模板**不写关系边**。
# 理由是那条已知缺陷 —— 共享行动池 + `fromId: __self__` + 字面量 toId 会在
# 执行者恰好是目标时造出 from === to 的自环，落盘即拒载。剧本没必要复现它。
npcActions:
  - id: npc-godfrey-audit
    summary: "{name} 把一页的边角对齐，对齐了三次，才承认它本来就齐。"
    trigger: { probability: 0.45, cooldownTurns: 2 }
    utility: { base: 1, traitAffinity: [exact] }
    effects:
      - { type: adjustFlag, id: audits, value: 1 }
  - id: npc-blanche-light
    summary: "{name} 换了一支新蜡，火苗矮下去一截，屋里反而亮了一点。"
    trigger: { probability: 0.4, cooldownTurns: 3 }
    utility: { base: 1, traitAffinity: [quiet] }

# NPC 刷新规则（ADR-0022）：配置层只声明「将来会有这个人」，
# 真正上场由事件的 `spawnNpc(ruleId)` 或世界时间表触发 —— 登场时点不写在这里。
# 三个测试角色：妻子（联姻）、嫡子（生育）、私生子（认领）。
npcSpawnRules:
  - { id: sp-wife, characterRef: npc-wife }
  - { id: sp-heir, characterRef: npc-heir, age: 0 }
  - { id: sp-bastard, characterRef: npc-bastard }

# 世界自己的时间表（ADR-007 D1）：到点把下一幕排进队列，不占事件槽、不等玩家。
# 这条链是**测试链**：议亲 → 生子 → 私生 → 切磋 → 传艺，五幕各验一条链路。
scheduledFacts:
  - id: fact-scribble
    note: 第一日收尾，你在册子背面练了几行字（测试：grantAllocation 挂请求 + 个人页面板 + 轮外提交）
    tidings: 册子背面还剩几行空白。你拿笔比了比。
    when: [{ time: { gte: { value: 1, unit: day } } }]
    effects:
      - type: grantAllocation
        id: alloc-scribble
        budget: 2
        reason: 册子背面还剩几行空白
        targets:
          - { attribute: body, max: 2, label: 体魄 }
          - { attribute: mind, max: 2, label: 心智 }
          - { attribute: will, max: 2, label: 意志 }

  - id: fact-match
    note: 第三日，侧院开始议亲（测试：spawnNpc + joinClan via marriage）
    tidings: 侧院的门槛这几天擦得格外勤。有人要来了。
    when: [{ time: { gte: { value: 3, unit: day } } }]
    effects:
      - { type: enqueueEvent, eventId: "evt:match", delay: { value: 1, unit: hour } }

  - id: fact-birth
    note: 婚后第九日得子（测试：joinClan via birth + 父边）
    tidings: 正厅的灯亮了一夜。第二天早上，册子上多了一行。
    when:
      - { time: { gte: { value: 12, unit: day } } }
      - { op: flagSet, args: { flag: married, value: true } }
    effects:
      - { type: enqueueEvent, eventId: "evt:birth", delay: { value: 1, unit: hour } }

  - id: fact-bastard
    note: 第十八日，侧院的孩子被抱出来（测试：joinClan via adoption + 门第下跌）
    when:
      - { time: { gte: { value: 18, unit: day } } }
      - { op: flagSet, args: { flag: married, value: true } }
    effects:
      - { type: enqueueEvent, eventId: "evt:bastard", delay: { value: 1, unit: hour } }

  - id: fact-spar
    note: 第二十六日，戈弗雷递剑（测试：victory 条件 survive_rounds + 敌方战斗态转修正 + NPC 回写）
    when:
      - { time: { gte: { value: 26, unit: day } } }
      - { op: flagSet, args: { flag: bastardBorn, value: true } }
    effects:
      - { type: enqueueEvent, eventId: "evt:spar", delay: { value: 1, unit: hour } }

  - id: fact-assassin
    note: 第三十三日，有人夜里进门（测试：unit_down 胜负条件 + 必战）
    when:
      - { time: { gte: { value: 33, unit: day } } }
      - { op: flagSet, args: { flag: bastardBorn, value: true } }
    effects:
      - { type: enqueueEvent, eventId: "evt:assassinate", delay: { value: 1, unit: hour } }

  - id: fact-legacy
    note: 第四十日，父亲把本事交给侧院的孩子（测试：inheritActor + setClanHead）
    when:
      - { time: { gte: { value: 40, unit: day } } }
      - { op: flagSet, args: { flag: bastardBorn, value: true } }
    effects:
      - { type: enqueueEvent, eventId: "evt:legacy", delay: { value: 1, unit: hour } }

# JJK · 新宿决战 · characters.yaml
#
# 玩家 = 所选开局的主角（五条悟 / 虎杖悠仁），身份由建局请求 + opening.characterSetup 决定，
# 因此这里**不设** npc-gojo / npc-yuji（否则会与玩家角色重复）。
# 其余参战者与敌人在两条线间共享；由事件里的 actors / mentions / npcs 决定谁在哪一幕登场。
#
# 关键：宿傩已受肉伏黑惠。`enemy-sukuna` 是这具身体（战斗实体）；
# `npc-megumi` 是被压进内心世界的灵魂，初始 `inactive` —— 救回他 = setNpcLifecycle alive。

characters:
  # ── 被夺舍的伏黑（灵魂）─────────────────────────────
  - id: npc-megumi
    isEnemy: false
    identity: { name: 伏黑惠, age: 15, gender: male }
    visibility: public
    lifecycle: { state: inactive, reasonCode: 被宿傩夺舍，灵魂沉在内心世界 }
    mood: { value: 20 }
    attributes: { cursedEnergy: 25, physique: 20, agility: 26, intellect: 22, luck: 12, reputation: 18 }
    public:
      personality: 冷静、少话，习惯把「救谁」当成一道必须自己算完的题
      knownGoals: [从宿傩手里把身体夺回来]
    private:
      secrets: ["secret:megumi-despair"]
      goals: [make-the-right-call]
      traits: [cautious, self-blaming]
    relationship: 35

  # ── 高专一方（友军，可参战）─────────────────────────
  - id: npc-yuta
    isEnemy: false
    identity: { name: 乙骨忧太, age: 17, gender: male }
    visibility: public
    mood: { value: 60 }
    attributes: { cursedEnergy: 80, physique: 30, agility: 30, intellect: 30, luck: 20, reputation: 40 }
    skills: [sk-yuta-copy]
    public:
      personality: 温和，但在该动手时比谁都干脆
      knownGoals: [替五条老师收尾]
    private:
      combatHints:
        skillWeights: { sk-yuta-copy: 3 }
    relationship: 20
    relations:
      - { to: npc-todo, kind: friend, visibility: known, value: 40 }
      - { to: npc-maki, kind: colleague, visibility: unknown, value: 10 }

  - id: npc-todo
    isEnemy: false
    identity: { name: 东堂葵, age: 18, gender: male }
    visibility: public
    mood: { value: 65 }
    attributes: { cursedEnergy: 40, physique: 45, agility: 30, intellect: 22, luck: 18, reputation: 30 }
    skills: [sk-todo-boogie]
    public:
      personality: 豪爽，认定了的兄弟就绝不含糊
      knownGoals: [和乙骨一起把羂索按死]
    private:
      combatHints:
        skillWeights: { sk-todo-boogie: 3 }
    relationship: 15

  - id: npc-maki

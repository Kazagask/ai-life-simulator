# JJK · 新宿决战 · characters.yaml
#
# 玩家 = 所选开局的主角（五条悟 / 虎杖悠仁），身份由建局请求 + opening.characterSetup 决定，
# 因此这里**不设** npc-gojo / npc-yuji（否则会与玩家角色重复）。
# 其余参战者与敌人在两条线间共享；由事件里的 actors / mentions / npcs 决定谁在哪一幕登场。
#
# 关键：宿傩已受肉伏黑惠。`enemy-sukuna` 是这具身体（战斗实体）；
# `npc-megumi` 是被压进内心世界的灵魂，初始 `inactive` —— 救回他 = setNpcLifecycle alive。

characters:
  # ── 被夺舍的伏黑（灵魂）─────────────────────────────
  - id: npc-megumi
    isEnemy: false
    identity: { name: 伏黑惠, age: 15, gender: male }
    visibility: public
    lifecycle: { state: inactive, reasonCode: 被宿傩夺舍，灵魂沉在内心世界 }
    mood: { value: 20 }
    attributes: { cursedEnergy: 25, physique: 20, agility: 26, intellect: 22, luck: 12, reputation: 18 }
    public:
      personality: 冷静、少话，习惯把「救谁」当成一道必须自己算完的题
      knownGoals: [从宿傩手里把身体夺回来]
    private:
      secrets: ["secret:megumi-despair"]
      goals: [make-the-right-call]
      traits: [cautious, self-blaming]
    relationship: 35

  # ── 血缘史实人物（family 扩展的指针端点；已故，不参战）────────────
  # 羂索不是三个人：加茂宪伦（造九相图）、虎杖香织（生悠仁）、夏油杰（决战中的身体）
  # 是同一颗脑换过的几具肉身。指针模型只允许「一人一节点」，故用单节点承载两具身体：
  # 对胀相它是父亲指针（宪伦之身），对虎杖是母亲指针（香织之身）——
  # 这不是把两人当亲子写两遍，而是同一存在在族谱上占的两个亲缘位。
  # 性别写 agender：任何 male/female 都会在这两具身体里撒谎；称谓仍按指针 kind 出「爸爸/妈妈」。
  - id: npc-kenjaku-host
    isEnemy: false
    visibility: public
    identity:
      name: 羂索（加茂宪伦／虎杖香织）
      age: 1000
      gender: agender
      description: 族谱上占着两个位置的名字。一百五十年前他在加茂宪伦的身体里造出九相图，十五年前又在死去的虎杖香织身体里生下悠仁。大陆那具身体此刻正顶着夏油杰的脸站在战场上。
    lifecycle: { state: inactive, reasonCode: 史实人物：占过的肉身均已死，本人以夏油之身参战 }
    mood: { value: 50 }
    attributes: { cursedEnergy: 70, physique: 20, agility: 25, intellect: 80, luck: 30, reputation: 30 }
    public:
      personality: 礼貌得像在介绍自己的作品。他不恨任何人，只是有兴趣。
      knownGoals: [让这场实验有个漂亮的结果]
    private:
      secrets: ["secret:kenjaku-three-bodies"]
      goals: []
      traits: []
    relationship: -80

  - id: npc-jin
    isEnemy: false
    visibility: public
    identity:
      name: 虎杖仁
      age: 32
      gender: male
      description: 悠仁的父亲。他至死不肯相信妻子已经死了——家里那个"香织"，是另一个东西。
    fatherId: npc-wasuke
    lifecycle: { state: inactive, reasonCode: 史实人物：悠仁出生后不久去世 }
    mood: { value: 50 }
    attributes: { cursedEnergy: 20, physique: 20, agility: 20, intellect: 20, luck: 20, reputation: 10 }
    public:
      personality: 温和、迟钝，爱得太深所以不肯看。
      knownGoals: []
    private:
      secrets: ["secret:jin-sukuna-twin"]
      goals: []
      traits: []
    relationship: 0

  - id: npc-wasuke
    isEnemy: false
    visibility: public
    identity:
      name: 虎杖倭助
      age: 72
      gender: male
      description: 悠仁的祖父。他察觉到儿媳不对劲，警告过儿子，也把"帮助别人"留给了孙子。
    lifecycle: { state: inactive, reasonCode: 史实人物：已故 }
    mood: { value: 50 }
    attributes: { cursedEnergy: 10, physique: 12, agility: 12, intellect: 18, luck: 10, reputation: 10 }
    public:
      personality: 嘴上不饶人，临终前却只留下两句要紧的话。
      knownGoals: []
    private:
      secrets: []
      goals: []
      traits: []
    relationship: 0

  # ── 高专一方（友军，可参战）─────────────────────────
  - id: npc-yuta
    isEnemy: false
    identity: { name: 乙骨忧太, age: 17, gender: male }
    visibility: public
    mood: { value: 60 }
    attributes: { cursedEnergy: 80, physique: 30, agility: 30, intellect: 30, luck: 20, reputation: 40 }
    skills: [sk-yuta-copy]
    public:
      personality: 温和，但在该动手时比谁都干脆
      knownGoals: [替五条老师收尾]
    private:
      combatHints:
        skillWeights: { sk-yuta-copy: 3 }
    relationship: 20
    relations:
      - { to: npc-todo, kind: friend, visibility: known, value: 40 }
      - { to: npc-maki, kind: colleague, visibility: unknown, value: 10 }

  - id: npc-todo
    isEnemy: false
    identity: { name: 东堂葵, age: 18, gender: male }
    visibility: public
    mood: { value: 65 }
    attributes: { cursedEnergy: 40, physique: 45, agility: 30, intellect: 22, luck: 18, reputation: 30 }
    skills: [sk-todo-boogie]
    public:
      personality: 豪爽，认定了的兄弟就绝不含糊
      knownGoals: [和乙骨一起把羂索按死]
    private:
      combatHints:
        skillWeights: { sk-todo-boogie: 3 }
    relationship: 15

  - id: npc-maki
    isEnemy: false
    identity: { name: 禅院真希, age: 17, gender: female }
    visibility: public
    mood: { value: 55 }
    attributes: { cursedEnergy: 10, physique: 60, agility: 45, intellect: 25, luck: 15, reputation: 25 }
    public:
      personality: 锋利，话不多
      knownGoals: [断后，别让更多人死]
    private:
      traits: [blunt]
    relationship: 15

  - id: npc-hakari
    isEnemy: false
    identity: { name: 秤金次, age: 19, gender: male }
    visibility: public
    mood: { value: 70 }
    attributes: { cursedEnergy: 50, physique: 30, agility: 25, intellect: 20, luck: 40, reputation: 20 }
    public:
      personality: 赌徒，越到绝境越笑得出来
      knownGoals: [撑到庄家通吃的那一刻]
    private:
      traits: [gambler]
    relationship: 10

  - id: npc-kashimo
    isEnemy: false
    identity: { name: 鹿紫云一, age: 40, gender: male }
    visibility: public
    lifecycle: { state: unspawned }
    mood: { value: 75 }
    attributes: { cursedEnergy: 70, physique: 35, agility: 40, intellect: 25, luck: 10, reputation: 30 }
    public:
      personality: 只对「和强者打一场」感兴趣
      knownGoals: [与完全体的宿傩一战]
    private:
      traits: [battle-hungry]
    relationship: 0

  - id: npc-higuruma
    isEnemy: false
    identity: { name: 日车宽见, age: 30, gender: male }
    visibility: public
    mood: { value: 50 }
    attributes: { cursedEnergy: 45, physique: 20, agility: 22, intellect: 45, luck: 10, reputation: 25 }
    public:
      personality: 律师出身，习惯在开口前先把罪名想清楚
      knownGoals: [让宿傩接受一次审判]
    private:

  - id: enemy-kenjaku
    isEnemy: true
    identity:
      name: 羂索
      age: 1000
      gender: male
      description: 顶着夏油杰的脸，笑得很得体。这一千年来，他一直在为「有趣」这个词做实验。
    visibility: public
    mood: { value: 70 }
    attributes: { cursedEnergy: 70, physique: 30, agility: 35, intellect: 80, luck: 30, reputation: 60 }

    relationship: 0

  - id: npc-choso
    isEnemy: false
    identity: { name: 胀相, age: 150, gender: male }
    # 九相图出自被羂索附身的加茂宪伦之身 —— 这个指针与虎杖的母亲指针指向同一节点，
    # 于是半同胞关系由扩展派生，不需要（也不允许）再写一条 elder-brother 边。
    fatherId: npc-kenjaku-host
    visibility: public
    mood: { value: 55 }
    attributes: { cursedEnergy: 55, physique: 40, agility: 30, intellect: 28, luck: 12, reputation: 15 }
    public:
      personality: 慢条斯理，把虎杖当弟弟
      knownGoals: [帮虎杖把术式练成]
    private:
      secrets: ["secret:choso-bloodline"]
      goals: [protect-yuji]
      traits: [loyal]
    relationship: 10

  - id: npc-kugisaki
    isEnemy: false
    identity: { name: 钉崎野蔷薇, age: 16, gender: female }
    visibility: public
    lifecycle: { state: unspawned }
    mood: { value: 60 }
    attributes: { cursedEnergy: 28, physique: 22, agility: 26, intellect: 24, luck: 16, reputation: 15 }
    skills: [sk-kugisaki-resonance]
    public:
      personality: 嘴上从不饶人，动手比谁都狠
      knownGoals: [把那根破手指钉穿]
    private:
      combatHints:
        skillWeights: { sk-kugisaki-resonance: 3 }
    relationship: 30

  # ── 敌方 ──────────────────────────────────────────
  - id: enemy-sukuna
    isEnemy: true
    identity:
      name: 两面宿傩
      age: 1000
      gender: male
      description: 四只手，两张脸，站在废墟中央像一根烧不化的柱子。这具身体本该属于伏黑惠 —— 现在它姓宿傩。他看着你，像在看一件终于值得拆开的玩具。
    visibility: public
    mood: { value: 85 }
    attributes: { cursedEnergy: 90, physique: 60, agility: 55, intellect: 50, luck: 20, reputation: 100 }
    skills: [sk-sukuna-dismantle, sk-sukuna-cleave, sk-sukuna-worldcut]
    public:
      personality: 傲慢、愉悦，把一切都当成取乐的赌局
      knownGoals: [把这具身体用到底]
    private:

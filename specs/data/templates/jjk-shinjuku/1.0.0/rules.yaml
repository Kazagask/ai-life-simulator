# JJK · 新宿决战 · rules.yaml
#
# 独立声明式文件（4 个顶层键，RulesSchema .strict()）：llmTriggers / toolProfile /
# knowledgeGrants / inferenceRules。不并入 TEMPLATE_MERGE_FILES、不是 world.yaml 顶层键。
#
# 触发器分线：五条线的节点与虎杖线的节点互不重叠，且每条只在「对应事件结算的那一轮」
# 由假变真（默认 fireMode: edge），因此同一轮绝不会有多条同时命中 —— 不会出现
# 「两条同轮、第一条吃掉唯一名额、第二条被记成已触发却从没执行」的撞车。

llmTriggers:
  # 五条线 · 分叉点之后：让 AI 补「你刚做的这个选择的重量」，而不是预告。
  - id: lt.gojo-fork
    when: [{ op: "eventResolved", args: { eventId: "evt:gojo-fork" } }]
    invoke:
      reason: "gojo.fork"
      # 本幕要求（模板定制提示词）：一句话说清这一次写什么、不要写什么。
      instruction: "写候机厅里这几秒：他刚说完「南」，身子靠回椅背，广播在念航班号，飞机还在滑行。不要写跳场景，不要写开打，不要写他救人，也不要预告接下来会发生什么。"
      perspective: "world"
      targetPerspective: "player"
      contextHints: ["fork.tone", "facts"]
      toolProfile: "gm"

  # 五条线 · 向南（原作）：这一刀落下时，五条在想什么。
  - id: lt.gojo-fall
    when: [{ op: "eventResolved", args: { eventId: "evt:gojo-south-cut" } }]
    invoke:
      reason: "gojo.fall"
      instruction: "写那一刀落下之后的一瞬：身体的感觉、周围人的反应、声音先消失再回来。不要写成总结陈词，也不要替玩家告别。"
      perspective: "world"
      targetPerspective: "player"
      contextHints: ["death.tone", "mentions"]
      toolProfile: "gm"

  # 虎杖线 · 觉醒：术式第一次成形的那一刻。
  - id: lt.yuji-awaken
    when: [{ op: "eventResolved", args: { eventId: "evt:yuji-awaken" } }]
    invoke:
      reason: "yuji.awaken"
      instruction: "写术式第一次成形的那一刻：手上、骨头里、呼吸里发生了什么。只写身体和眼前的东西，不要解释术式原理，不要写他想起谁。"
      perspective: "world"
      targetPerspective: "player"
      contextHints: ["awaken.tone", "facts"]
      toolProfile: "gm"

  # 虎杖线 · 救回伏黑：把「救回来了」这件事写成感受，不复述流程。
  - id: lt.yuji-rescue
    when: [{ op: "eventResolved", args: { eventId: "evt:yuji-megumi" } }]
    invoke:
      reason: "yuji.rescue"
      instruction: "写把伏黑从里面拉出来那一下：两个人各说一句就够，剩下的用动作和触感写。不要写胜利宣言，不要写后续安排。"
      perspective: "world"
      targetPerspective: "player"
      contextHints: ["rescue.tone", "facts", "secrets"]
      toolProfile: "gm"

toolProfile:
  # GM 画像：只读查询 + 提交分支。叙事正文由模型 content 里的
  # <narrative-content> 标签承载，不经工具。
  gm:
    [
      # 只读查询（先查后写：世界是什么样、我在哪、谁在场、我之前干过什么）
      "world.now",
      "world.history",
      "world.present",
      "world.self",
      # 写世界只有一条通道：提交整条分支
      "story.submitBranch",
    ]

knowledgeGrants:
  # 走到分叉点 = 亲眼看见「世界本身被切开」。
  - when: [{ op: "eventResolved", args: { eventId: "evt:gojo-fork" } }]
    grant: { observers: ["player"], factRefs: ["fact:cut-truth"], level: "known", source: "witness" }
  # 战场常识：一开局就成立。
  - when: [{ op: "always", args: {} }]
    grant: { observers: ["player"], factRefs: ["fact:shinjuku-arena"], level: "known", source: "rule" }
  # 觉醒 = 你摸到了「切灵魂」这件事。
  - when: [{ op: "eventResolved", args: { eventId: "evt:yuji-awaken" } }]
    grant: { observers: ["player"], factRefs: ["fact:soul-cut"], level: "known", source: "witness" }
  # 救回伏黑 = 你确认那具身体里还有人活着。
  - when: [{ op: "eventResolved", args: { eventId: "evt:yuji-megumi" } }]
    grant: { observers: ["player"], factRefs: ["fact:megumi-alive"], level: "known", source: "witness" }

inferenceRules:
  # 走过领域对撞 ⇒ 你会把「这道斩击是算好的」和「宿傩早就在等这一手」联起来。
  - when: [{ op: "flagSet", args: { flag: "domainDone" } }]
    grant: { observers: ["player"], factRefs: ["fact:counted-cut"], level: "inferred", source: "inferred" }
  # 觉醒 + 胀相的隐秘（addSecret）⇒ 你推断出九相图与宿傩选伏黑有关。
  - when: [{ op: "flagSet", args: { flag: "awakened" } }]
    grant: { observers: ["player"], factRefs: ["fact:choso-secret"], level: "inferred", source: "inferred" }
  # 斩了羂索 ⇒ 你拼出他这一千年真正想要的东西。
  - when: [{ op: "flagSet", args: { flag: "kenjakuDead" } }]
    grant: { observers: ["player"], factRefs: ["fact:kenjaku-plan"], level: "inferred", source: "inferred" }

# ── 模板级文风（进 invocation 的 stable prefix，与引擎输出契约并列，不覆盖它）──
# 只写「这个模板怎么说话」，不写剧情概要；设定事实一律放 lore.md。
prompt:
  style: |
    第二人称，贴着当下的那具身体写：呼吸、手心的汗、脚底踩到的碎玻璃、血在袖口结成的硬块。
    短句为主，一段最多三句。不要用「你感到愤怒」这类结论，写让他愤怒的那个动作。
    对话一次只给一到两句，说完就停，不要解释台词的含义。
    不写旁白式总结，不写「这一切意味着」；把意义留给读者。
    不要替玩家做决定，正文里不出现选项、不出现提示语、不出现「你可以……」。
    不写与此刻无关的回忆，除非这一刻正被某个具体的东西勾起来（一首歌、一件校服、一个称呼）。

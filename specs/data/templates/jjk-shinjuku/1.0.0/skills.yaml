# JJK · 新宿决战 · skills.yaml
#
# 玩家（五条悟）三式：苍 / 赫 / 茈。茈有 2 回合冷却 —— 它是「留着还是现在放」的决策点，
# 而不是每回合都按的最优解。宿傩两式：解 / 捌。
#
# 属性 id 必须落在 world.yaml 的 `attributes.order` 里（写错会加载期 fail-fast）。

skills:
  - id: sk-limitless-blue
    kind: combat
    name: 术式顺转 · 苍
    description: 指向即引力。把宿傩往你手心里拽，顺手把路上的碎石一起拽过来。
    cost: { mp: 15 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: agility, baseChance: 0.8 }
    damage:
      - { preset: scaled, base: 18, scaleBy: cursedEnergy, multiplier: 0.35 }
    cooldownTurns: 0
    usableInBattle: true

  - id: sk-limitless-red
    kind: combat
    name: 术式反转 · 赫
    description: 与苍相反的斥力。近距离打中时，整面墙会替宿傩接住这一下。
    cost: { mp: 30 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: physique, baseChance: 0.7 }
    damage:
      - { preset: scaled, base: 26, scaleBy: cursedEnergy, multiplier: 0.4 }
    cooldownTurns: 1
    usableInBattle: true

  - id: sk-hollow-purple
    kind: combat
    name: 虚式 · 茈
    description: 苍与赫交叠的那一瞬。不是术式，是把两样东西之间的空隙点着。
    cost: { mp: 60 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: agility, baseChance: 0.65 }
    damage:
      - { preset: scaled, base: 45, scaleBy: cursedEnergy, multiplier: 0.6 }
    cooldownTurns: 2
    usableInBattle: true

  - id: sk-sukuna-dismantle
    kind: combat
    name: 解
    description: 无形的一道。空气先裂，声音后到。
    cost: { mp: 0 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: agility, baseChance: 0.55 }
    damage:
      - { preset: scaled, base: 12, scaleBy: cursedEnergy, multiplier: 0.25 }
    cooldownTurns: 0
    usableInBattle: true

  - id: sk-sukuna-cleave
    kind: combat
    name: 捌
    description: 与解成对的那一道。它不追求命中，只追求让你必须动。
    cost: { mp: 0 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: physique, baseChance: 0.5 }
    damage:
      - { preset: scaled, base: 15, scaleBy: cursedEnergy, multiplier: 0.25 }
    cooldownTurns: 1
    usableInBattle: true

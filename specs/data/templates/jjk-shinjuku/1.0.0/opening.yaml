# JJK · 新宿决战 · opening.yaml
#
# 两个开局（前端按 openingId 选择）：op-gojo / op-yuji。
# 玩家身份（姓名）由建局请求传入；这里的 characterSetup 负责把「中性基线玩家」调成对应主角：
#   属性（adjustAttribute）+ 术式（unlockSkill）+ 初始道具（grantItem）+ 身份（setIdentity）。
# 两个开局各自 schedule 自己主线的入口事件（schedule 在 t=1 分钟，第一次推进轮次即呈现）。

- openingId: op-gojo
  name: 五条悟 · 决战前夜
  description: 2018 年 12 月 24 日，你是五条悟。歌姬他们替你把咒力叠到 200%，宿傩在废墟另一头等你。向南，是按原作把命交出去；向北，是赌一个没人写过的结局。
  entryConditions: []
  steps:
    - { id: step-gojo, kind: required }
  characterSetup:
    effects:
      # 把你调成五条悟：咒力 120、体术 34、敏捷 42、咒理 40、机缘 28、名声 95。
      - { type: setIdentity, gender: male, age: 28 }
      - { type: adjustAttribute, attribute: cursedEnergy, value: 90 }
      - { type: adjustAttribute, attribute: physique, value: 10 }
      - { type: adjustAttribute, attribute: agility, value: 18 }
      - { type: adjustAttribute, attribute: intellect, value: 16 }
      - { type: adjustAttribute, attribute: luck, value: 14 }
      - { type: adjustAttribute, attribute: reputation, value: 55 }
      # 无下限三式：苍 / 赫 / 茈
      - { type: unlockSkill, skillId: sk-limitless-blue }
      - { type: unlockSkill, skillId: sk-limitless-red }
      - { type: unlockSkill, skillId: sk-hollow-purple }
      # 战备：口粮、咒力碎片、蚀骨刀（咒具进背包，可穿脱）
      - { type: grantItem, itemId: item-ration, count: 1 }
      - { type: grantItem, itemId: item-shard, count: 1 }
      - { type: grantItem, itemId: item-cursed-blade, count: 1 }
    flags:
      openingPath: gojo
  worldSetup:
    flags:
      openingDone: true
      line: gojo
      chapter: 1
      gojoDead: false
      gojoSurvived: false
      domainDone: false
      duelWon: false
      pathSouth: false
      pathNorth: false
      endingReached: false
  npcSetup:
    relations:
      - { npcId: npc-yuta, value: 20, source: 学生 }
      - { npcId: npc-maki, value: 15, source: 学生 }
      - { npcId: npc-megumi, value: 30, source: 学生 }
  eventPools: []
  objectives:
    flags:
      objective: 走完这一夜：向南，或者向北
  choices: {}
  completionConditions:
    - { flag: openingDone, eq: true }
  handoff:
    pendingEvents: []
    schedule:
      - { eventId: "evt:gojo-open", at: { value: 1, unit: minute } }

- openingId: op-yuji
  name: 虎杖悠仁 · 残局
  description: 你是虎杖悠仁。五条老师已经倒在残局里，宿傩在伏黑的身体里笑。这一夜没有最强的咒术师了，只有你、你的同伴，和一把能把灵魂切开的刀。
  entryConditions: []
  steps:
    - { id: step-yuji, kind: required }
  characterSetup:
    effects:
      # 把你调成虎杖悠仁：咒力 22、体术 30、敏捷 24、咒理 12、机缘 14、名声 20。
      # 父母指针只在这条开局写：五条线不写 ⇒ 不详，不会错认成虎杖的父母。
      # 母亲指向羂索单节点（香织之身）；它与胀相的 fatherId 同节点 ⇒ 半同胞由扩展派生。
      - { type: setIdentity, gender: male, age: 15, fatherId: npc-jin, motherId: npc-kenjaku-host }
      - { type: adjustAttribute, attribute: cursedEnergy, value: -8 }
      - { type: adjustAttribute, attribute: physique, value: 6 }
      - { type: adjustAttribute, attribute: intellect, value: -12 }
      - { type: adjustAttribute, attribute: reputation, value: -20 }
      # 迳庭拳起手（黑闪 / 解 在觉醒事件里学）
      - { type: unlockSkill, skillId: sk-yuji-divergent }
      # 战备：口粮 ×2、咒力碎片、解咒符
      - { type: grantItem, itemId: item-ration, count: 2 }
      - { type: grantItem, itemId: item-shard, count: 1 }
      - { type: grantItem, itemId: item-seal-charm, count: 1 }
    flags:
      openingPath: yuji
  worldSetup:
    flags:
      openingDone: true
      line: yuji
      chapter: 2
      gojoDead: true
      sealed: false
      kenjakuDead: false
      awakened: false
      kugisakiReady: false
      megumiSaved: false
      sukunaExpelled: false
      endingReached: false
  npcSetup:
    relations:
      - { npcId: npc-choso, value: 10, source: 兄弟 }
      - { npcId: npc-megumi, value: 30, source: 同伴 }
      - { npcId: npc-kugisaki, value: 30, source: 同伴 }
  eventPools: []
  objectives:
    flags:
      objective: 收尾这一夜，并把伏黑救回来
  choices: {}
  completionConditions:
    - { flag: openingDone, eq: true }
  handoff:
    pendingEvents: []
    schedule:
      - { eventId: "evt:yuji-open", at: { value: 1, unit: minute } }

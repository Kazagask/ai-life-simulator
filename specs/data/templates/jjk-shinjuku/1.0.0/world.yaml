# JJK · 新宿决战 · world.yaml
#
# 视角：五条悟第一人称。时间尺度是「一场决战」而不是「一生」——
# 一轮 ≈ 战场上的几分钟，靠事件推进而不是靠日历。
# 核心二选一在 ev:south-north：向南（原作）／向北（IF）。

meta:
  id: jjk-shinjuku
  name: 咒术回战 · 新宿决战
  description: 2018 年 12 月，新宿。你是五条悟。宿傩在废墟另一头等你，羂索在暗处数着你的死期。这一夜只有两个方向：向南，按原作把命交出去；向北，躲过那道斩击，改写结局。
  startYear: 2018
  engineProtocol: v2

time:
  # 一轮 = 战场上的 10 分钟。整场决战横跨一夜，不需要日历粒度。
  defaultStep: { value: 10, unit: minute }

genders:
  - { id: male, label: 男 }
  - { id: female, label: 女 }
  - { id: agender, label: 无性别 }

mood:
  min: 0
  max: 100
  defaultValue: 70
  bands:
    - { id: low, label: 压抑, min: 0, max: 35, attributeModifiers: { agility: -1 } }
    - { id: normal, label: 冷静, min: 36, max: 74, attributeModifiers: {} }
    - { id: high, label: 亢奋, min: 75, max: 100, attributeModifiers: { cursedEnergy: 1 } }

statusBar:
  - { id: sb-identity, label: 基本, source: identity }
  - { id: sb-mood, label: 状态, source: mood }
  - { id: sb-hp, label: 生命, source: resource, key: hp }
  - { id: sb-mp, label: 咒力, source: resource, key: mp }
  - { id: sb-attrs, label: 属性, source: attribute, keys: [cursedEnergy, physique, agility] }
  - { id: sb-status, label: 补正, source: status }

attributes:
  order: [cursedEnergy, physique, agility, intellect, luck, reputation]
  defaults: { cursedEnergy: 40, physique: 20, agility: 20, intellect: 20, luck: 10, reputation: 50 }
  caps: { cursedEnergy: 300 }
  labels: { cursedEnergy: 咒力, physique: 体术, agility: 敏捷, intellect: 咒理, luck: 机缘, reputation: 名声 }

# 五条悟的底子：血厚、咒力池深，所以第一场战斗「打不死」——
# 目标是把玩家打到能继续演，不是把他打死（见 events.yaml 里 ev:sukuna-duel 的注释）。
resources:
  hp: { base: 240, perLevel: 0, perAttribute: { cursedEnergy: 1 } }
  mp: { base: 150, perLevel: 0, perAttribute: { cursedEnergy: 1 } }

regen:
  perTurn: { hp: 3, mp: 4 }
  actions:
    focus: { hp: 0, mp: 20 }

# 战场上的四个常驻点面：即使本轮没有呈现事件，玩家也必须有东西可点。
actions:
  - id: observe
    label: 观察战场
    description: 用六眼看穿废墟里的咒力流向，找宿傩下一次出手的方向。
    duration: { value: 5, unit: minute }
    effects:
      - { type: adjustFlag, id: observeCount, value: 1 }
      - { type: adjustAttribute, attribute: intellect, value: 1 }
  - id: focus
    label: 稳住咒力
    description: 停下来把术式回路重新压稳。咒力回得快，但这几分钟里什么都做不了。
    duration: { value: 10, unit: minute }
    effects:
      - { type: adjustResource, resource: mp, value: 20 }
  - id: shield
    label: 掩护平民
    description: 把还困在废墟里的人挪出去。会分心，但这是你站在这里的理由。
    duration: { value: 10, unit: minute }
    effects:
      - { type: adjustFlag, id: civiliansSaved, value: 1 }
      - { type: adjustMood, value: 3 }
  - id: breathe
    label: 喘一口气
    description: 靠在断墙上，让反转术式慢慢把伤口缝上。
    duration: { value: 10, unit: minute }
    effects:
      - { type: adjustResource, resource: hp, value: 30 }
      - { type: adjustMood, value: 1 }

# JJK · 新宿决战 · world.yaml
#
# 两个开局、两条主线（见 opening.yaml）：
#   op-gojo —— 你是五条悟，从决战前夜到与宿傩单挑；主线是「能不能改写 236 话那一刀」。
#   op-yuji —— 你是虎杖悠仁，从五条败北后的残局切入；主线是「收尾，并把伏黑救回来」。
# 玩家身份（姓名）由建局请求传入；本模板用两个开局的 characterSetup 差异化属性与术式，
# 因此 playerTemplate 取「中性咒术师」基线，绝不写死某一个主角。
#
# 时间尺度是一场决战而非一生：一轮 ≈ 战场上的 10 分钟，靠事件推进，不靠日历。

meta:
  id: jjk-shinjuku
  name: 咒术回战 · 新宿决战
  description: 2018 年 12 月 24 日，新宿。五条悟与两面宿傩的「最强对最强」把这座城市打成了废墟。你可以选他，去赌能不能改写那道斩断世界的刀；也可以选虎杖，从五条倒下之后的残局里，把宿傩从伏黑体内拽出来。同一夜，两条命。
  startYear: 2018
  engineProtocol: v2

# 亲缘称谓由 `family` 扩展提供（推导逻辑在 extensions/family，不在内核）。
# 不声明它，NPC 卡上的「爸爸/哥哥/舅舅」这类称谓全部消失。
extensions:
  family: true

time:
  defaultStep: { value: 10, unit: minute }

genders:
  - { id: male, label: 男 }
  - { id: female, label: 女 }
  - { id: agender, label: 无性别 }

mood:
  min: 0
  max: 100
  defaultValue: 70
  bands:
    - { id: low, label: 压抑, min: 0, max: 35, attributeModifiers: { agility: -1 } }
    - { id: normal, label: 冷静, min: 36, max: 74, attributeModifiers: {} }
    - { id: high, label: 亢奋, min: 75, max: 100, attributeModifiers: { cursedEnergy: 1 } }

statusBar:
  - { id: sb-identity, label: 基本, source: identity }
  - { id: sb-mood, label: 状态, source: mood }
  - { id: sb-hp, label: 生命, source: resource, key: hp }
  - { id: sb-mp, label: 咒力, source: resource, key: mp }
  - { id: sb-attrs, label: 属性, source: attribute, keys: [cursedEnergy, physique, agility] }
  - { id: sb-status, label: 补正, source: status }

attributes:
  order: [cursedEnergy, physique, agility, intellect, luck, reputation]
  # 中性基线：两个开局分别把玩家「调成」五条 / 虎杖（见 opening.yaml characterSetup）
  defaults: { cursedEnergy: 30, physique: 24, agility: 24, intellect: 24, luck: 14, reputation: 40 }
  caps: { cursedEnergy: 400 }
  labels: { cursedEnergy: 咒力, physique: 体术, agility: 敏捷, intellect: 咒理, luck: 机缘, reputation: 名声 }

# 共享资源池：上限 = base + perAttribute × 基础属性。
# 五条（咒力 120）血厚咒深，虎杖（咒力 22）靠体术与技巧周旋 —— 这正是两条线的手感差异。
resources:
  hp: { base: 100, perLevel: 0, perAttribute: { cursedEnergy: 1 } }
  mp: { base: 80, perLevel: 0, perAttribute: { cursedEnergy: 1 } }

regen:
  perTurn: { hp: 2, mp: 3 }
  actions:
    focus: { hp: 0, mp: 18 }

# 战场上常驻的四个自由行动：没有呈现事件时玩家也有事可做。
actions:
  - id: observe
    label: 观察战场
    description: 用六眼看穿废墟里的咒力流向，判断下一次出手会从哪里来。
    duration: { value: 5, unit: minute }
    effects:
      - { type: adjustFlag, id: observeCount, value: 1 }
      - { type: adjustAttribute, attribute: intellect, value: 1 }
  - id: focus
    label: 稳住咒力
    description: 停下来把术式回路重新压稳。咒力回得快，但这几分钟里什么都做不了。
    duration: { value: 10, unit: minute }
    effects:
      - { type: adjustResource, resource: mp, value: 18 }
  - id: shield
    label: 掩护平民
    description: 把还困在废墟里的人挪出去。会分心，但这是你站在这里的理由。
    duration: { value: 10, unit: minute }
    effects:
      - { type: adjustFlag, id: civiliansSaved, value: 1 }
      - { type: adjustMood, value: 3 }
  - id: breathe
    label: 喘一口气
    description: 靠在断墙上，让反转术式慢慢把伤口缝上。
    duration: { value: 10, unit: minute }
    effects:
      - { type: adjustResource, resource: hp, value: 25 }
      - { type: adjustMood, value: 1 }

# ── NPC 刷新规则（S1：模板源自动刷人）────────────────────────────
# 钉崎野蔷薇在「记忆回廊」之后苏醒、回到战场。kugisakiReady 一立，下一轮 tail 自动把她拉上场；
# 缺省 when ⇒ 永不自动，只能显式 spawnNpc（不影响其它模板）。
npcSpawnRules:
  - id: rule-kugisaki-awaken
    characterRef: npc-kugisaki
    age: 16
    when:
      - { flag: kugisakiReady, eq: true }

# playerTemplate：中性基线。技能留空 —— 由两个开局各自 unlockSkill 授予，避免「两条线都带五条的术式」。
playerTemplate:
  identity: { gender: male, age: 20 }
  attributes: { cursedEnergy: 30, physique: 24, agility: 24, intellect: 24, luck: 14, reputation: 40 }

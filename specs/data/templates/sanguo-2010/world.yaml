# 三国演义 · 新三国梗平行宇宙 · world.yaml
# 〔T-1 纯 yaml 小样 / 讨董一章 / 草案阶段，未正式立项、未写 ADR〕
#
# 硬规则只有一条：**天意一定会把世界线拉回主线**（events.yaml 的 schedule 锚点）。
# 其余随便荒诞。所有强行收束都用一句「天意发力了」买单，不回滚玩家已造成的后果，
# 只改写所有人的认知 —— 这正是二创「世界修正」的原义。
#
# 【身份线与防分身】命数转盘 7 格：4 个虚构身份（诸侯 / 谋士 / 小兵 / 乌角鲨）
# + 3 个真实历史人物（刘备 / 曹操 / 袁绍）。每格走自己的剧情链，最后都汇入同一场
# 讨董大会 ⇒ 第 8 天天意锚点 ⇒ 第 41 天新三国道，**主线不因身份改变**。
# 三名真实人物同时是 NPC，但开局由 npcSpawnRules 置为 unspawned（不上屏、不参战）：
# 转盘扇区的 effects 用 spawnNpc 显式刷出「玩家没占用」的人，玩家是谁就不刷谁，
# 因此永远不会出现「玩家是曹操，帐里还坐着一个曹操」的分身。详见 events.yaml 头注释。
#
# 梗的考据（原句 / 人物 / 集数 / 是否二创合成句）见 docs/SANGUO_TEMPLATE_BRIEF.md §1、§3。
# 使用纪律（草案 §4.3）：叙事给原句、选项给流行句式；每条梗在 yaml 注释标明出处；
# 梗是文案与事件，不是权威规则，不得为了让梗生效去改 schema 或内核。
# 世界观专名只允许出现在模板与前端文案，game-core/src 零专名。

meta:
  id: sanguo-2010
  name: 三国演义 · 天意发力了
  description: 190 年，陈留。十八路诸侯会盟讨董，命数转盘会决定你这一世是谁：一路诸侯、帐下谋士、普通小兵、一头乌角鲨，或者刘备、曹操、袁绍本人。七种出身各有自己的故事，却都走向同一场讨董大会。此后你可以把剧情浪到任何离谱的地方——当场称帝、集体自刎、把玉玺当石头、追问中午吃什么——但第八天，天意会发力，把所有人的认知悄悄改写回主线。
  startYear: 190
  engineProtocol: v2

time:
  defaultStep: { value: 1, unit: day }
  # 【年号】引擎 R2.6（ADR-0002 / ADR-0013）已把历法显示收敛到 CalendarConfig，
  # `era` 就是年号：createTimeAdapter().format() 输出「初平 1年…」，eraYearBase 按
  # epochStartMinute 折算纪元年（可为负 = 纪元早于世界起点）。这里 0 ⇒ 世界起点
  # （公元 190 年）即初平元年，正合汉献帝改元。gregorian / custom 都支持 era。
  # ⚠ 单个 era 是**全局静态正朔**：不能按阵营/地区切换显示。events.yaml 用 warRegion
  # flag 把「各营私改年号」做成叙事层博弈；显示层多套年号属 T-2，见
  # docs/SANGUO_TEMPLATE_BRIEF.md §9（需 ADR，本轮未做）。
  calendar:
    preset: gregorian
    era: { name: 初平, epochStartMinute: 0 }
  lifeStageSteps:
    childhood: { value: 1, unit: day }
    youth: { value: 1, unit: day }
    adulthood: { value: 1, unit: day }
    elderhood: { value: 1, unit: day }
  lifeStages:
    - { id: childhood, label: 总角, maxAge: 14 }
    - { id: youth, label: 弱冠, maxAge: 29 }
    - { id: adulthood, label: 而立, maxAge: 59 }
    - { id: elderhood, label: 暮年 }

# 性别是世界自定义枚举（非二元）。「乌角鲨」在本世界是**真实存在的生物**，因此也是合法身份：
# 新三国第 11 集公孙瓒「这对儿堂兄弟，可谓是一对笑面虎，两头乌角鲨」的魔幻化。
# 编剧朱苏进自造词，现实中无此鱼；有考证说是苏北方言「虎头鲨」谐音。
genders:
  - { id: male, label: 男 }
  - { id: female, label: 女 }
  - { id: wujiaosha, label: 乌角鲨 }

mood:
  min: 0
  max: 100
  defaultValue: 60
  bands:
    - { id: low, label: 是这乱世害了我, min: 0, max: 40, attributeModifiers: { intellect: -1 } }
    - { id: normal, label: 平静, min: 41, max: 70, attributeModifiers: {} }
    - { id: high, label: 接着奏乐接着舞, min: 71, max: 100, attributeModifiers: { command: 1 } }

statusBar:
  - { id: sb-identity, label: 基本, source: identity }
  - { id: sb-mood, label: 心情, source: mood }
  - { id: sb-hp, label: 生命, source: resource, key: hp }
  - { id: sb-mp, label: 谋略, source: resource, key: mp }
  - { id: sb-attrs, label: 属性, source: attribute, keys: [command, intellect, physique, luck, reputation, tianyi] }
  - { id: sb-status, label: 补正, source: status }

# tianyi = 天意侵蚀度（草案 §4.2 第 3 条）：离谱事件累加，锚点收束时回落。
# 键必须 ⊆ order（所有出现属性的地方都要），加载期 fail-fast。
attributes:
  order: [command, intellect, physique, luck, reputation, tianyi]
  defaults: { command: 5, intellect: 5, physique: 5, luck: 5, reputation: 0, tianyi: 0 }
  caps: { tianyi: 99 }
  labels: { command: 统御, intellect: 智略, physique: 武艺, luck: 运气, reputation: 声望, tianyi: 天意侵蚀度 }

resources:
  hp: { base: 80, perLevel: 10, perAttribute: { physique: 4 } }
  mp: { base: 40, perLevel: 5, perAttribute: { intellect: 2 } }

regen:
  perTurn: { hp: 3, mp: 2 }
  actions:
    rest: { hp: 20, mp: 10 }

# 玩家行动。池事件负责「随便浪」，行动负责稳定收益；
# 天意是 schedule 事件，与玩家点不点行动无关 —— 到点必然发力。
#
# 【战争沙盘 · 条件行动的纯 yaml 形态】action 本身**没有 conditions 字段**（schema 里
# 只有 id/label/description/duration/advanceTo/effects），投影层 availableActions 恒定下发。
# 因此「按 flag 把行动切换成战争行动」不是换按钮，而是：
#   ① events.yaml 每个 onActionId 配一条 action-hook，conditions: warActive eq true；
#   ② 战争期点同一行动 → 稳定收益照给，额外弹出一道「博弈」事件；
#   ③ 博弈选项用 visibleWhen 按 warPhase 分流，叫阵选项 nextEventId 到主将对垒；
#   ④ 收兵时 clearFlag warActive ⇒ hook 条件不再成立，行动自动回到纯日常。
# 要让**按钮标签/可见性**本身随 flag 变，需给 action 加 visibleWhen 并改 projection
# ⇒ T-2 契约面，按 AGENTS.md §0.3 必须先 ADR，本轮不动。
actions:
  - id: drill
    label: 点兵
    description: 打熬武艺与统御。「三军听令」之前，总得先有三军。
    duration: { value: 1, unit: day }
    effects:
      - { type: adjustAttribute, attribute: command, value: 1 }
      - { type: adjustResource, resource: mp, value: -3 }
  - id: feast
    label: 开席
    description: 陈留大食堂永远在营业。不管军情多急，先问一句吃什么。
    duration: { value: 1, unit: day }
    effects:
      - { type: adjustMood, value: 5 }
      - { type: adjustFlag, id: feastCount, value: 1 }
  - id: consult
    label: 问策
    description: 找谋士聊聊。聊着聊着，通常会有人开始说地理常识错误。
    duration: { value: 1, unit: day }
    effects:
      - { type: adjustAttribute, attribute: intellect, value: 1 }
  - id: rest
    label: 歇息
    description: 回营休息，恢复 HP/MP。天意不会因为你睡着就不发力。
    duration: { value: 1, unit: day }

# ══════════════ 隐藏 NPC · 防分身（ADR-0022） ══════════════
# 三名真实人物既可能是主人公，也可能是同席的 NPC。由刷新规则管辖 ⇒ 世界创建时
# lifecycle=unspawned：不上人物面板、不进自主行动候选、不参与任何以他为 ref 的战斗。
# 只有 ev-wheel-fate 的扇区 effects 调 spawnNpc 才真正登场，且同一 ruleId 幂等。
# 扇区按下表刷人（玩家是谁就不刷谁）：
#   玩家=刘备   → spawn caocao + yuan-shao
#   玩家=曹操   → spawn liubei + yuan-shao
#   玩家=袁绍   → spawn liubei + caocao
#   虚构身份×4 → spawn 三人全部
# 关系边同理：任一端 unspawned 会被投影剔除（projection.ts 的 hiddenNodeIds），
# 所以玩家=曹操时「npc-caocao 与玩家的关系」不会泄漏成一个不存在的自己。
npcSpawnRules:
  - { id: rule-liubei-arrival, characterRef: npc-liubei }
  - { id: rule-caocao-arrival, characterRef: npc-caocao }
  - { id: rule-yuan-shao-arrival, characterRef: npc-yuan-shao }

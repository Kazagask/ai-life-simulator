# 三国演义 · 开局分域 · opening.yaml（协议 V2.1 §16）
#
# 只负责把 chapter / anchor1Done / mainline / feastCount 摆到起始位、把玩家关系铺好，
# 并把「命数转盘」交给 handoff 作为第一个待决事件。
# 时间锚点由 events.yaml 的 schedule 定义自己负责（建世界时入队），此处 handoff.schedule 为空。
#
# 「胜利目标说」（二创）：每个角色有独立胜利目标，达成才能摆脱天意的制裁。
# 小样里以 objective 留一个接口，隐藏结局「摆脱天意」见 endings.yaml。

- openingId: op-190-chenliu
  name: 190 · 陈留会盟
  description: 十八路诸侯讨董，你也在场。转盘会决定你是诸侯、谋士、小兵、一头乌角鲨，还是刘备、曹操、袁绍本人；七条故事都从陈留出发，正月初九，天意会把一切拉回主线。
  entryConditions: []
  steps:
    - { id: step-enter-chenliu, kind: required }
  characterSetup:
    flags:
      origin: 未定
  worldSetup:
    flags:
      openingDone: true
      creationDone: true
      chapter: 1
      saga: 190
      anchor1Done: false
      mainline: 讨董
      feastCount: 0
  # 这两条关系指向「可能被玩家占用」的曹操 / 刘备：实例在世界创建时始终存在，
  # 只是 unspawned 时会被投影剔除（hiddenNodeIds）。玩家 roll 到他们时该边自然不可达，
  # 不需要在这里按身份分支，也不需要在事件里手工清理 —— 生命周期是单一事实源。
  npcSetup:
    relations:
      - { npcId: npc-caocao, value: 6, source: 会盟同席 }
      - { npcId: npc-liubei, value: 5, source: 同席 }
      - { npcId: npc-gongsun-zan, value: 4, source: 大食堂同桌 }
      - { npcId: npc-xu-sheng, value: 3, source: 帐外点头之交 }
    visibility:
      npc-dong-zhuo: unknown
      npc-hua-xiong: unknown
      npc-xing-daorong: unknown
  eventPools: []
  objectives:
    flags:
      objective: 活到天意收束的那一刻，或者找到摆脱它的办法
  choices: {}
  completionConditions:
    - { flag: openingDone, eq: true }
  handoff:
    pendingEvents: [ev-opening-wheel]
    schedule: []

# ══════════════ 第二个开局 · 建安五年衣带诏（第七轮） ══════════════
# 前端在 openings.length > 1 时自动出现开局下拉（apps/web/src/main.tsx），
# 服务端按 openingId 选择（R-OP-01），不传则默认取首个 ⇒ 陈留主线仍是默认。
#
# 【两套剧情的隔离】chapter: 200 与 saga: 200 让陈留那些 chapter=1/2/3 的
# schedule 事件全部 hold（有 window.end 的到期静默过期），衣带诏块则全是 chain，
# 由 handoff.pendingEvents 起头 ⇒ 两套剧情互不串线。
# 【时间口径】建安五年是剧情层年号：更漏报建安五年，历书仍停在初平元年那一格
# （T-2 多套年号未授权）。本开局不写任何绝对年份到时间坐标，worldTime 从 0
# 起按 chain timeCost 逐段推进；终止由 endings.yaml 的 ydzDone 裁决。
- openingId: op-200-yidaizhao
  name: 200 · 建安五年衣带诏
  description: 许都。更漏已经报到建安五年，历书却还停在初平元年那一格——天意改了人，没顾上改纸。转盘决定你是董承、刘备、曹操、王子服、送膳的小黄门、相府门客，还是护城河里那头乌角鲨；七种活法都要经过一条缝了血诏的玉带、一张七个名字的义状，最后被天意抄回官渡。
  entryConditions: []
  steps:
    - { id: step-enter-xudu, kind: required }
  characterSetup:
    flags:
      origin: 未定
  worldSetup:
    flags:
      openingDone: true
      creationDone: true
      chapter: 200
      saga: 200
      mainline: 衣带诏
      eraName: 建安五年
      ydzDone: false
      feastCount: 0
  # 关系指向可能被玩家占用的人：unspawned 时边随隐藏节点一起被投影剔除，
  # 转盘 spawn 之后自然可达，与陈留开局完全同一套生命周期口径。
  npcSetup:
    relations:
      - { npcId: npc-dong-cheng, value: 5, source: 宫道同席 }
      - { npcId: npc-ji-ping, value: 4, source: 送药时点头之交 }
      - { npcId: npc-xian-di, value: 3, source: 赐带时在阶下 }
      - { npcId: npc-wang-zi-fu, value: 3, source: 义状同案 }
    visibility:
      npc-caocao: unknown
      npc-qin-qing-tong: unknown
      npc-hua-xiong: unknown
  eventPools: []
  objectives:
    flags:
      objective: 看一眼那道诏，活到天意把它抄成一行为止
  choices: {}
  completionConditions:
    - { flag: openingDone, eq: true }
  handoff:
    pendingEvents: [ev-ydz-open]
    schedule: []

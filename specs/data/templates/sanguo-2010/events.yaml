              - { type: grantItem, itemId: item-mantou, count: 2 }
              - { type: adjustMood, value: -2 }

  # 第 6 天 · 传国玉玺（焚洛阳之后；用户点名的「只有一个选项」样本）
  # 【谁都不能称帝】「恭喜爹可以称帝了」只是孙策对孙坚说的台词，写在 narrative；
  # 玩家选项里没有称帝句，也拿不到玉玺。仅袁绍有「当众质问」的专属选项
  # （演义里袁绍确实质问过孙坚），其余 6 个身份只有兜底一个旁观选项。
  - id: ev-day6-yuxi
    title: 传国玉玺 · 宫道二十步
    narrative: 孙坚的人进城救火，在宫中枯井里捞起一块石头。孙策捧着它跪下，嗓门大得整条宫道都听见了：「恭喜爹可以称帝了！」玉玺本未公开，可袁术不知怎么当场就知道了。你站在宫道边，离那块石头有二十步。
    trigger:
      source: schedule
      window: { start: { value: 6, unit: day }, end: { value: 8, unit: day } }
      once: true
      priority: 5
      conditions:
        - { flag: chapter, eq: 1 }
        - { flag: anchor1Done, eq: false }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-day6-watch
            text: 站在宫道边，看着那块石头被捧过去
            effects:
              - { type: setFlag, id: forkEmperor, value: true }
              - { type: setFlag, id: wantsEmperor, value: false }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: log, text: 喊那句话的人是孙策。你没有喊，也没有伸手。袁术还是知道了——天意需要一个卧底。, visibility: public }
          - id: opt-day6-yuan
            text: 当众质问孙坚：玺在哪儿
            visibleWhen:
              - { flag: origin, eq: 袁绍 }
            effects:
              - { type: setFlag, id: forkEmperor, value: true }
              - { type: setFlag, id: wantsEmperor, value: false }
              - { type: setFlag, id: yuxiQuestioned, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: adjustRelation, npcId: npc-sun-jian, value: -2 }
              - { type: log, text: 他矢口否认，两边当场翻脸。这件事后来写进了战报，没写你问过什么。, visibility: public }

  # 第 7 天 · 联盟离散 + 天意提前放映（194 / 208 的后期梗集中在此，明写不属于今天）
  # forkSuicide / forkBlameEra / forkShark 由**每个选项**一起补齐 ⇒ 隐藏结局对任何身份都可达。
  - id: ev-day7-dissolve
    title: 联盟离散 · 天意提前放映
    narrative: 各营开始拔帐，讨董这件事没人再提。公孙瓒对着二袁慢悠悠下了句评语——「一对笑面虎，两头乌角鲨」，那是几年后才该说的话，天意偏偏今天就让它进了帐；帐外真的游过一头。入夜还有别的画面被提前翻进来：大江前有人拔剑，灶膛边有人把错处推给世道。它们都不属于今天，天意只是先把账记上。
    trigger:
      source: schedule
      window: { start: { value: 7, unit: day }, end: { value: 8, unit: day } }
      once: true
      priority: 5
      conditions:
        - { flag: chapter, eq: 1 }
        - { flag: anchor1Done, eq: false }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-day7-watch
            text: 把不属于今天的话记在账册背面
            effects:
              - { type: setFlag, id: forkSuicide, value: true }
              - { type: setFlag, id: forkBlameEra, value: true }
              - { type: setFlag, id: forkShark, value: true }
              - { type: setFlag, id: day7Recorded, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: 2 }
              - { type: log, text: 天意提前放映：这几页先记着，正月初九再一起抹平，谁也不许当成今年发生的事。, visibility: public }
          - id: opt-day7-liu
            text: 那句「列位弟兄，随我接战，战至最后一刻」又撞了进来
            visibleWhen:
              - { flag: origin, eq: 刘备 }
            effects:
              - { type: setFlag, id: forkSuicide, value: true }
              - { type: setFlag, id: forkBlameEra, value: true }
              - { type: setFlag, id: forkShark, value: true }
              - { type: applyStatus, status: st-tianyi-protection }
              - { type: adjustAttribute, attribute: tianyi, value: 2 }
              - { type: log, text: 大江、铁骑、双股剑——都不属于今天。天意翻过一页，又把书合上了。, visibility: public }
          - id: opt-day7-cao
            text: 灶膛边那句「是这个乱世害了你」又响了一遍
            visibleWhen:
              - { flag: origin, eq: 曹操 }
            effects:
              - { type: setFlag, id: forkSuicide, value: true }
              - { type: setFlag, id: forkBlameEra, value: true }
              - { type: setFlag, id: forkShark, value: true }
              - { type: applyStatus, status: st-tianyi-erosion }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 那一页是去年冬天的，天意却让它今天又念了一遍。念完，徐州还是中原第一雄关。, visibility: public }
          - id: opt-day7-fictional
            text: 伸手摸了摸那头乌角鲨
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
            effects:
              - { type: setFlag, id: forkSuicide, value: true }
              - { type: setFlag, id: forkBlameEra, value: true }
              - { type: setFlag, id: forkShark, value: true }
              - { type: grantItem, itemId: item-wujiaosha, count: 1 }
              - { type: applyStatus, status: st-wujiaosha-aura }
              - { type: adjustAttribute, attribute: tianyi, value: 2 }
              - { type: log, text: 一头几年后才该被提起的鱼，今天就游到了你手边。没人觉得该拦。, visibility: public }

          - id: opt-day7-deceased
            text: 把划掉的五行从账册背面抄回正面
            visibleWhen:
              - { npcState: { npcId: npc-pan-feng, state: inactive } }
            effects:
              - { type: setFlag, id: forkSuicide, value: true }
              - { type: setFlag, id: forkBlameEra, value: true }
              - { type: setFlag, id: forkShark, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意能把几页提前放映，却不肯把划掉的名字补回来。散席时名册比来时轻了五页。, visibility: public }
          - id: opt-day7-fold
            text: 顺着提前放映的那一页往下翻，翻到十年后
            effects:
              - { type: setFlag, id: forkSuicide, value: true }
              - { type: setFlag, id: forkBlameEra, value: true }
              - { type: setFlag, id: forkShark, value: true }
              - { type: setFlag, id: saga, value: 200 }
              - { type: setFlag, id: chapter, value: 200 }
              - { type: setFlag, id: mainline, value: 衣带诏 }
              - { type: setFlag, id: eraName, value: 建安五年 }
              - { type: setFlag, id: ydzDone, value: false }
              - { type: adjustAttribute, attribute: tianyi, value: 3 }
              - { type: log, text: 天意提前放映的那几页忽然连成一条路，路的尽头写着建安五年。历书还停在初平元年这一格——天意改了人，没顾上改纸。, visibility: public }
            nextEventId: ev-ydz-fold
  # ────────────── 天意 · 世界线修正（本模板唯一硬规则） ──────────────
  # source: schedule ⇒ 建世界时按 window.start 一次性入队，第 8 天必然触发。
  # once + priority 100 + conditions(chapter=1) ⇒ 只收束第一章一次。
  # 「迅雷乃天意，世人谁敢不畏天意？」是本世界天意的原句，不写出处。
  - id: ev-tianyi-anchor-1
    title: 天意 · 世界线修正
    narrative: 正月初九。所有离谱的支线都在这一刻被悄悄抹平——不是事情被撤销，而是所有人都觉得事情本来就是这样。馒头还在，那头乌角鲨也还在；连提前放映的那几页都被收了回去，只是没人记得它们有什么不对。天意发力了，顺手把往徐州路上的十二天折进这一步：日历少了十二页，你带走的名册、账册和馒头一页没少。
    trigger:
      source: schedule
      window: { start: { value: 8, unit: day } }
      once: true
      priority: 100
      conditions:
        - { flag: chapter, eq: 1 }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-tianyi-accept
            text: 「迅雷乃天意，世人谁敢不畏天意？」
            effects:
              - { type: log, text: 天意发力了。世界线收束回主线：讨董还是讨董，陈留还是陈留。, visibility: public }
              - { type: setFlag, id: chapter, value: 2 }
              - { type: setFlag, id: anchor1Done, value: true }
              - { type: setFlag, id: mainline, value: 陈留 }
              - { type: adjustAttribute, attribute: tianyi, value: -3 }
              # 只折起 12 天，并用 chain 出口把 20→41 天铺成 5 段有序剧情
              # （ev-road-1..5，timeCost 合计 21 天）。主线结构不变，只把黑洞填上。
              - { type: advanceTo, value: { value: 20, unit: day } }
              - { type: log, text: 支线 flag 全部保留，后果不撤销，只改写认知（二创「世界修正」原义）。, visibility: hidden }
              - { type: log, text: 天意把往徐州路上的十二天折成一步：日历少了十二页，你带走的东西一页没少。, visibility: public }
            nextEventId: ev-road-1

  # 新三国道：同一条山路复用二十余次，跨时空传送点。第 41 天落点，为整条主线预留接口。
  - id: ev-ch2-gate
    title: 新三国道 · 下一章
    narrative: 又是这条山路。布景没换，季节没换，连远处那棵树都没换。你顺着它往前走，就到了下一章——天意已经在前面等你了。
    trigger:
      source: schedule
      window: { start: { value: 41, unit: day } }
      once: true
      conditions:
        - { flag: chapter, eq: 2 }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-enter
            text: 顺着国道往前走
            effects:
              - { type: setFlag, id: mainline, value: 徐州 }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意已经在前面等你了。后续章节在此接续。, visibility: public }
          - id: opt-ch2-look-back
            text: 回头数一遍名册上被划掉的名字
            visibleWhen:
              - { npcState: { npcId: npc-pan-feng, state: inactive } }
            effects:
              - { type: setFlag, id: mainline, value: 徐州 }
              - { type: adjustMood, value: -1 }
              - { type: log, text: 名册比来时轻了五页，山路还是那条山路。天意没拦你回头，也没把名字补回来。, visibility: public }
          - id: opt-ch2-ask-year
            text: 问一句现在到底是哪一年
            effects:
              - { type: setFlag, id: mainline, value: 徐州 }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 三个人报了三个年号，树没换，路没换。天意在前面等着，没回答。, visibility: public }
  # ══════════════════════════════════════════════════════════════════════════
  # 战争沙盘 · 副本（第 42 天起；与第一章主线正交）
  #
  # 闭环：剧情开启（schedule + setFlag warActive）→ 自由行动被 action-hook 接管，
  #   每次点击额外弹出一道「博弈」（选项用 visibleWhen 按 warPhase 分流）
  #   → 叫阵 → 主将对垒（kind: combat）→ 胜/败/撤统一接 ev-war-close
  #   → clearFlag warActive ⇒ hook 条件不再成立，行动自动恢复日常。
  #
  # 主线零改动：第 8 天 ev-tianyi-anchor-1、第 41 天 ev-ch2-gate 原样保留；
  #   副本不写 chapter、不 advanceTo、不改结局判据，是一段可进可出的支线。
  # 约束核对：① 每个 onActionId 恰好一条「立即」hook（world.yaml 单槽唯一，R2.5/#35）；
  #   ② 缺失 flag 的条件一律 false（engine.ts checkCondition）⇒ 收兵 clearFlag 后
  #   hook 必然静默，不需要额外开关；③ 战斗事件 source: chain，由叫阵选项的
  #   nextEventId 直接 triggerEventV2 建场（turn.ts advanceChainOnSettle）。
  #
  # 【不同地区不同年号】显示层只有 world.yaml 的全局正朔「初平」（T-1 纯 yaml）。
  # 各营私改年号用 warRegion flag 做成叙事层博弈：袁术营「仲家」、江东「初平」、
  # 有人写「天意元年」；收兵时天意把三份战报抄回同一行。显示层按阵营切换年号
  # 属 T-2（schema + CalendarAdapter 契约面，需 ADR），见 SANGUO_TEMPLATE_BRIEF.md §9。
  # ══════════════════════════════════════════════════════════════════════════

  - id: ev-war-outbreak
    title: 虎牢关 · 檄文到
    narrative: 二月十二。檄文送到帐前，墨还没干。十八路诸侯各自把年号写在自己的账册上：袁术营里已经改称仲家，江东仍记作初平，有人干脆写了「天意元年」。天意的簿子只有一行——初平元年，讨董。从这一刻起，你点的每一次行动都会变成一道军令。
    trigger:
      source: schedule
      window: { start: { value: 42, unit: day } }
      once: true
      priority: 90
      conditions:
        - { flag: chapter, eq: 2 }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-war-accept
            text: 接战
            effects:
              - { type: setFlag, id: warActive, value: true }
              - { type: setFlag, id: warPhase, value: 1 }
              - { type: setFlag, id: warEdge, value: 0 }
              - { type: setFlag, id: warRegion, value: 初平 }
              - { type: log, text: 军令已下：点兵是布阵，问策是离间，开席是粮道，歇息是移营。天意照常记账。, visibility: public }
          - id: opt-war-meal
            text: 先问一句吃什么
            effects:
              - { type: setFlag, id: warActive, value: true }
              - { type: setFlag, id: warPhase, value: 1 }
              - { type: setFlag, id: warEdge, value: 0 }
              - { type: setFlag, id: warRegion, value: 仲家 }
              - { type: adjustMood, value: 3 }
              - { type: log, text: 没人回答，但队伍已经列好了。袁术营的账册上，今天记作仲家元年。, visibility: public }

          - id: opt-war-vow
            text: 立军令状：此战不回头
            effects:
              - { type: setFlag, id: warActive, value: true }
              - { type: setFlag, id: warPhase, value: 1 }
              - { type: setFlag, id: warEdge, value: 0 }
              - { type: setFlag, id: warRegion, value: 初平 }
              - { type: setFlag, id: vowNoRetreat, value: true }
              - { type: log, text: 军令状写下去了。天意在旁边多记了一行，没给你看。, visibility: public }
  # ── 博弈 1：点兵 → 阵列。战势加成直接带进对垒（统御 / 名册）。 ──
  - id: ev-war-drill
    title: 阵列 · 三份名册
    narrative: 你把点兵册摊开，发现每一页的兵数都不一样。旗牌官捧着笔等，说今天这一版由你写。远处那面写着「华雄」的旗已经立起来了，风把它吹得有点歪。
    trigger:
      source: action-hook
      onActionId: drill
      conditions:
        - { flag: warActive, eq: true }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-war-split
            text: 把兵分成三份，各写各的
            visibleWhen:
              - { flag: warPhase, eq: 1 }
            effects:
              - { type: adjustFlag, id: warEdge, value: 2 }
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: setFlag, id: warPhase, value: 2 }
              - { type: log, text: 三份名册互不相认，可战场上它们同时到了。旗牌官没问为什么。, visibility: public }
          - id: opt-war-challenge-drill
            text: 叫阵：请主将出来说话
            visibleWhen:
              - { flag: warPhase, eq: 2 }
            effects:
              - { type: log, text: 你往前走了十步。那面旗后面的人也往前走了十步。, visibility: public }
            nextEventId: ev-war-duel
          - id: opt-war-drill-withdraw
            text: 就此收兵，把战报交给天意
            visibleWhen:
              - { flag: warPhase, eq: 2 }
            effects:
              - { type: log, text: 三本账册还没合上，你已经不想再翻了。天意接过去，照旧抄成一行。, visibility: public }
            nextEventId: ev-war-close
          - id: opt-war-drill-note
            text: 在册角记一笔年号
            effects:
              - { type: setFlag, id: warRegion, value: 仲家 }
              - { type: log, text: 你写「仲家元年」，旗牌官写「初平元年」，谁也没改谁的。天意的簿子不收这两页。, visibility: hidden }

  # ── 博弈 2：问策 → 离间。 ──
  - id: ev-war-counsel
    title: 离间 · 三封没署名的信
    narrative: 谋士把三封信摊在案上，说每封都能让对面少一个人。他没说是谁写的，也没说为什么三封的年份各不相同。帐外有人报：对面主将已经出营了。
    trigger:
      source: action-hook
      onActionId: consult
      conditions:
        - { flag: warActive, eq: true }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-war-send-all
            text: 三封一起送过去
            visibleWhen:
              - { flag: warPhase, eq: 1 }
            effects:
              - { type: adjustFlag, id: warEdge, value: 2 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: setFlag, id: warPhase, value: 2 }
              - { type: log, text: 对面读信的时候，把三个年号都认了下来。军心先乱了一步。, visibility: public }
          - id: opt-war-challenge-counsel
            text: 只留一封，请主将亲自来取
            visibleWhen:
              - { flag: warPhase, eq: 2 }
            effects:
              - { type: log, text: 他真的来了。信上写的是哪一年，你们都没提。, visibility: public }
            nextEventId: ev-war-duel
          - id: opt-war-counsel-withdraw
            text: 就此收兵，把战报交给天意
            visibleWhen:
              - { flag: warPhase, eq: 2 }
            effects:
              - { type: log, text: 三本账册还没合上，你已经不想再翻了。天意接过去，照旧抄成一行。, visibility: public }
            nextEventId: ev-war-close
          - id: opt-war-counsel-note
            text: 先问现在是哪一年
            effects:
              - { type: setFlag, id: warRegion, value: 天意元年 }
              - { type: log, text: 谋士报了三个年号，帐里三个人各自点头。你没再问下去。, visibility: hidden }

  # ── 博弈 3：开席 → 粮道。 ──
  - id: ev-war-feast
    title: 粮道 · 多出来的那口锅
    narrative: 大食堂照常开。灶上比昨天多了一口锅，没人说得清多出来的粮从哪来，也没人问——这地方向来如此。伙头问今天按哪本账记。
    trigger:
      source: action-hook
      onActionId: feast
      conditions:
        - { flag: warActive, eq: true }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-war-send-grain
            text: 把多出来的粮送到前军
            visibleWhen:
              - { flag: warPhase, eq: 1 }
            effects:
              - { type: adjustFlag, id: warEdge, value: 2 }
              - { type: adjustResource, resource: hp, value: 8 }
              - { type: setFlag, id: warPhase, value: 2 }
              - { type: log, text: 粮到前军的时候，队伍已经排好了。吃饱的人不追问年份。, visibility: public }
          - id: opt-war-challenge-feast
            text: 请对面主将过来一起吃
            visibleWhen:
              - { flag: warPhase, eq: 2 }
            effects:
              - { type: log, text: 他坐下，把旗靠在帐柱上。吃到一半，两人同时站起来往外走。, visibility: public }
            nextEventId: ev-war-duel
          - id: opt-war-feast-withdraw
            text: 就此收兵，把战报交给天意
            visibleWhen:
              - { flag: warPhase, eq: 2 }
            effects:
              - { type: log, text: 三本账册还没合上，你已经不想再翻了。天意接过去，照旧抄成一行。, visibility: public }
            nextEventId: ev-war-close
          - id: opt-war-feast-note
            text: 照旧问一句吃什么
            effects:
              - { type: adjustMood, value: 2 }
              - { type: log, text: 「吃什么！」帐里有人应了一声，然后所有人都点头。天意没有解释。, visibility: public }

  # ── 博弈 4：歇息 → 移营。 ──
  - id: ev-war-rest
    title: 更鼓 · 移营与阵前
    narrative: 更鼓敲过三通，每通报一个不同的年份。营盘往前挪了十里，鞋底沾着不属于这里的土；对面也挪了十里，或者根本没挪——账册上两种写法都有，天意两种都收。
    trigger:
      source: action-hook
      onActionId: rest
      conditions:
        - { flag: warActive, eq: true }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-war-night-move
            text: 趁夜再移十里
            visibleWhen:
              - { flag: warPhase, eq: 1 }
            effects:
              - { type: adjustFlag, id: warEdge, value: 2 }
              - { type: adjustResource, resource: mp, value: 6 }
              - { type: setFlag, id: warPhase, value: 2 }
              - { type: log, text: 天亮时两军之间只剩一片谁也没扫过的空地。更鼓还在报着第三个年份。, visibility: public }
          - id: opt-war-challenge-rest
            text: 睡前留一句话给对面主将
            visibleWhen:
              - { flag: warPhase, eq: 2 }
            effects:
              - { type: log, text: 话传到对面时变成了另一句，但意思没变：明天阵前见。, visibility: public }
            nextEventId: ev-war-duel
          - id: opt-war-rest-second
            text: 不叫阵，只把更鼓数完
            visibleWhen:
              - { flag: warPhase, eq: 2 }
            effects:
              - { type: adjustResource, resource: hp, value: 6 }
              - { type: log, text: 三通更鼓报完，两军谁也没往前。天意把这一夜记成「相持」，没写成「退」。, visibility: public }
          - id: opt-war-rest-withdraw
            text: 就此收兵，把战报交给天意
            visibleWhen:
              - { flag: warPhase, eq: 2 }
            effects:
              - { type: log, text: 三本账册还没合上，你已经不想再翻了。天意接过去，照旧抄成一行。, visibility: public }
            nextEventId: ev-war-close
          - id: opt-war-rest-note
            text: 把年号簿压在枕下
            effects:
              - { type: log, text: 你枕着三本互不承认的账册睡了一夜，醒来只记得初平元年。, visibility: hidden }

  # ── 主将对垒（战斗副本的核心） ──
  # 敌人是「旗号」而非华雄本人：华雄汜水关已阵亡，这里出来的是那面旗和
  # 旗后面的人（npc-flag-bearer），避免分身。胜/败/撤统一接 ev-war-close。
  # 第六轮：onVictory 让旗后面的人阵亡；onDefeat 只记 battleLost，
  # 是否致死由 endings.yaml 的 deathRoute 按「立誓 + 战败」裁决。
  - id: ev-war-duel
    title: 阵前 · 主将对垒
    narrative: 旗上写着「华雄」，可这个名字汜水关那天就被划掉了。出来的是那面旗和旗后面的人——两军都不打算追究。你们隔着一片谁也没扫过的空地站定，两边的账册上，年份整整差了三年。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-xiliang-commander, levelScale: 0.85 }
        canFlee: true
        fleeCheck: { preset: opposed, attacker: command, defender: command, baseChance: 0.5 }
        onVictory:
          effects:
            - { type: setNpcLifecycle, npcId: npc-flag-bearer, state: inactive, reasonCode: 阵前旗倒 }
            - { type: adjustFlag, id: warEdge, value: 3 }
            - { type: adjustAttribute, attribute: reputation, value: 2 }
            - { type: log, text: 旗倒了，旗后面的人也没再站起来。战报上写的是「主将退」，没人去核实是谁。, visibility: public }
          nextEventId: ev-war-close
        onDefeat:
          effects:
            - { type: setFlag, id: battleLost, value: true }
            - { type: adjustMood, value: -5 }
            - { type: log, text: 你退了回来。对面也没追——他好像也在等谁把战报写好。, visibility: public }
          nextEventId: ev-war-close
        onFlee:
          effects:
            - { type: log, text: 你转身回营，更鼓替你把这一年报完了。, visibility: public }
          nextEventId: ev-war-close

  # ── 收兵 · 恢复日常 ──
  # clearFlag 后 action-hook 的 conditions 必然为 false（缺失 flag ⇒ false），
  # 因此「战争行动」自动失效，点兵/开席/问策/歇息回到 world.yaml 里的原义。
  # 第六轮：旗后面的人在这里统一注销（与 onVictory 同一 reasonCode，幂等）。
  # 天意不区分胜/败/撤，战报都抄成「主将退」⇒ 三条路径都会从名册上划掉他。
  - id: ev-war-close
    title: 天意 · 战报归正
    narrative: 仗打完了，或者没打完——天意不区分这两件事。三份战报摆在一起，年号各不相同，最后都被抄成同一行：初平元年，讨董。各营私改的年份没人再提，你也想不起来自己写过哪一本。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-war-return-strong
            text: 战报写得漂亮，收兵
            visibleWhen:
              - { flag: warEdge, gte: 4 }
            effects:
              - { type: setNpcLifecycle, npcId: npc-flag-bearer, state: inactive, reasonCode: 阵前旗倒 }
              - { type: clearFlag, id: warActive }
              - { type: clearFlag, id: warPhase }
              - { type: clearFlag, id: warEdge }
              - { type: clearFlag, id: warRegion }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意发力了：战势记在功簿上，年号统一抄回初平。点兵还是点兵，开席还是开席。, visibility: public }
            nextEventId: ev-ch2-1
          - id: opt-war-return
            text: 照实收兵，回营
            effects:
              - { type: setNpcLifecycle, npcId: npc-flag-bearer, state: inactive, reasonCode: 阵前旗倒 }
              - { type: clearFlag, id: warActive }
              - { type: clearFlag, id: warPhase }
              - { type: clearFlag, id: warEdge }
              - { type: clearFlag, id: warRegion }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意发力了：三本账册合成一行，日常行动恢复。你记得打过一仗，只是记不清是哪一年。, visibility: public }
            nextEventId: ev-ch2-1

  # ── 收兵兜底（第七轮 · 体验打磨）──
  # 沙盘原先只有「战斗结束 → ev-war-close → ev-ch2-1」一条出口：玩家若既不叫阵
  # 也不主动收兵，第二章整条 chain 会永远不开始。这里补一个固定日兜底：
  # 第 45 天由天意把没打完的仗收进战报，统一走 ev-war-close。
  # conditions 含 warActive ⇒ 已收过兵的局该实例 hold，到第 46 天静默过期，不会重复收兵。
  - id: ev-war-timeout
    title: 天意 · 战报自己写完了
    narrative: 更鼓又报了三通，两军谁也没动。天意大概等得不耐烦了，自己提笔把这一仗抄完：初平元年，讨董，主将退。三本账册合上的时候，你才想起仗其实没打。
    trigger:
      source: schedule
      window: { start: { value: 45, unit: day }, end: { value: 46, unit: day } }
      once: true
      priority: 80
      conditions:
        - { flag: chapter, eq: 2 }
        - { flag: warActive, eq: true }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-war-timeout-return
            text: 把没打完的仗收进战报
            effects:
              - { type: setFlag, id: warTimedOut, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意替你把这一仗收了尾。旗还立着，人却都在往徐州走。, visibility: public }
            nextEventId: ev-war-close


  # ── 第七轮 · 空窗填充（两条轻量日程，不推进主线、不写 chapter）──
  # 基线模拟里第 36→41 天与第 52→58 天是最长两段间隔（各 5~6 天）。
  # 注意 ev-road-5 的 chain timeCost 是 5 天，结算后 worldTime 从第 36 天**一次跳到
  # 第 41 天**，所以窗口必须覆盖 41（写成 38~40 会被判 window_expired 静默过期）；
  # 这样它在第 41 天与 ev-ch2-gate 同日弹出，排序上排在章节门之前。
  # ev-ch2-eve 落在第 55 天，正好切开 ch2-5 → 锚点 2 之间的连续空行动。
  - id: ev-road-eve
    title: 路上 · 一块没刻完的石头
    narrative: 国道边有人在刻碑，刻到年份那一格停了笔，说等天意把这一年定下来再刻。你把路上那本账册翻给他看，他看完，把凿子放下了。
    trigger:
      source: schedule
      window: { start: { value: 36, unit: day }, end: { value: 42, unit: day } }
      once: true
      priority: 5
      conditions:
        - { flag: chapter, eq: 2 }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-road-eve-wait
            text: 陪他等天意把年份定下来
            effects:
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 碑上那一格空着。路过的人都在等，没人问等的是谁。, visibility: public }
          - id: opt-road-eve-write
            text: 替他把那格刻成「初平」
            visibleWhen:
              - { flag: eraDraft, eq: 初平 }
            effects:
              - { type: setFlag, id: forkStone, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: log, text: 石头上多了两个字。刻碑的人没谢你，只说这一格迟早还要改。, visibility: public }

  - id: ev-ch2-eve
    title: 官渡前夜 · 更鼓与名册
    narrative: 离官渡还有几日，夜里更鼓敲得比平时慢。值夜的人把名册摊在膝上，说这一章快抄完了，问我还有没有要补的名字。
    trigger:
      source: schedule
      window: { start: { value: 55, unit: day }, end: { value: 57, unit: day } }
      once: true
      priority: 5
      conditions:
        - { flag: chapter, eq: 2 }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-eve-none
            text: 说没有了，照原样抄
            effects:
              - { type: log, text: 名册按原样合上。天意这一夜没来，大概是在等下一页。, visibility: public }
          - id: opt-ch2-eve-add
            text: 把路上划掉的五行重新报一遍
            visibleWhen:
              - { npcState: { npcId: npc-pan-feng, state: inactive } }
            effects:
              - { type: adjustMood, value: -1 }
              - { type: log, text: 五个名字报完了，值夜的人一个也没写上去：名册只记还在的人。天意没解释这一条。, visibility: public }

  # ══════════════════════════════════════════════════════════════════════════
  # 路上 5 段（第 20→41 天，chain 严格有序，timeCost 4+4+4+4+5 = 21 天）
  #
  # 每段都是第二人称，且**按身份分岔**：兜底选项人人可见，
  # 刘 / 曹 / 袁各一条专属，四个虚构身份共用一条（origin ne 三人组），
  # 再加若干 if 回响选项 ⇒ 每个身份从陈留到官渡都读得到自己的那条线。
  # 所有选项的 nextEventId 一致 ⇒ 链不会分岔，时间账不会乱。
  # 第一章留下的 fork* / if* / eraDraft 都会在这里被提起，主角参与看得见。
  # 主线纪律：不写 chapter、不 advanceTo；第 41 天仍由 ev-ch2-gate 的 schedule 接手。
  # ══════════════════════════════════════════════════════════════════════════

  # ── 路上 1/5 · 出陈留（timeCost 4 天） ──
  - id: ev-road-1
    title: 出陈留 · 名册
    narrative: 天意把三十二天折成了十二天，可你手里那本名册还是一样厚。离开陈留时没人送，只有一个人在营门口问你：名册上还有我吗。你没答，先把册子翻开了。
    trigger:
      source: chain
      timeCost: { value: 4, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-road-1-roll
            text: 把名册摊开，一个一个对名字
            effects:
              - { type: setFlag, id: roadRollKeep, value: true }
              - { type: addRelationEdge, fromId: npc-gongsun-zan, toId: player, kind: friend, visibility: known, value: 20 }
              - { type: adjustMood, value: 2 }
              - { type: log, text: 你把名字念了一遍。念到最后一个时，门口那人没再问第二遍。, visibility: public }
            nextEventId: ev-road-2
          - id: opt-road-1-liu
            text: 先把路上的人安顿好，再点名
            visibleWhen:
              - { flag: origin, eq: 刘备 }
            effects:
              - { type: setFlag, id: roadLiuPeople, value: true }
              - { type: adjustRelation, fromId: npc-gongsun-zan, toId: player, kind: friend, value: 8 }
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: log, text: 名册先记人，再记兵。你在陈留没争到座次，倒是把这件事定下来了。, visibility: public }
            nextEventId: ev-road-2
          - id: opt-road-1-cao
            text: 先数还能拿得动刀的人
            visibleWhen:
              - { flag: origin, eq: 曹操 }
            effects:
              - { type: setFlag, id: roadCaoMuster, value: true }
              - { type: adjustRelation, fromId: npc-xun-yu, toId: player, kind: colleague, value: 8 }
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: log, text: 你没问谁愿意走，只问谁还站得住。荀彧把这一条记进了册子边角。, visibility: public }
            nextEventId: ev-road-2
          - id: opt-road-1-yuan
            text: 先问这本名册是谁抄的
            visibleWhen:
              - { flag: origin, eq: 袁绍 }
            effects:
              - { type: setFlag, id: roadYuanSeats, value: true }
              - { type: adjustRelation, fromId: npc-yuan-shu, toId: npc-yuan-shao, kind: elder-brother, value: 5 }
              - { type: log, text: 抄册的人被问住了。你没追究，只是把册子收进自己袖里——主位上的事，先弄清楚是谁写的。, visibility: public }
            nextEventId: ev-road-2
          - id: opt-road-1-fictional
            text: 把自己的名字补在末行
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: log, text: 陈留名册上那行墨终于干了。写的人是你，看的人也只有你。, visibility: public }
            nextEventId: ev-road-2
          - id: opt-road-1-if-liu
            text: 想起那一页：如果那天真的转身走了
            visibleWhen:
              - { flag: ifLiu, eq: true }
            effects:
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意把折起来的那一页翻给你看：名册末尾空着，因为没有人跟着你走。你合上了册子。, visibility: public }
            nextEventId: ev-road-2

          - id: opt-road-1-deceased
            text: 把名册上划掉的那几行单独折起来
            visibleWhen:
              - { npcState: { npcId: npc-hua-xiong, state: inactive } }
            effects:
              - { type: addRelationEdge, fromId: npc-zu-mao, toId: npc-sun-jian, kind: colleague, visibility: known, value: 10 }
              - { type: adjustMood, value: -2 }
              - { type: log, text: 折起来的那几页再也添不进新关系；天意只肯把名字留在纸上，不肯把人还回来。, visibility: public }
            nextEventId: ev-road-2
  # ── 路上 2/5 · 一顿饭（timeCost 4 天，承接 forkMeal） ──
  - id: ev-road-2
    title: 路上 · 那顿饭
    narrative: 又摆开一张桌子，菜和陈留那顿一模一样。有人抬头问你：「你走了，我们吃什么？」——这次是问你的。碗筷摆得比人齐。
    trigger:
      source: chain
      timeCost: { value: 4, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-road-2-eat
            text: 坐下，先把饭吃完
            effects:
              - { type: setFlag, id: roadAte, value: true }
              - { type: adjustRelation, fromId: npc-gongsun-zan, toId: player, kind: friend, value: 5 }
              - { type: grantItem, itemId: item-mantou, count: 1 }
              - { type: adjustMood, value: 3 }
            nextEventId: ev-road-3
          - id: opt-road-2-remember
            text: 你记得上一顿，也记得谁没吃
            visibleWhen:
              - { flag: forkMeal, eq: true }
            effects:
              - { type: addRelationEdge, fromId: npc-yuan-shu, toId: player, kind: rival, visibility: known, value: 12 }
              - { type: adjustMood, value: 4 }
              - { type: log, text: 你在陈留听过一模一样的一句。这次你把空位留给了上次没坐下的人，天意没有反对。, visibility: public }
            nextEventId: ev-road-3
          - id: opt-road-2-liu
            text: 先给路上的人盛饭
            visibleWhen:
              - { flag: origin, eq: 刘备 }
            effects:
              - { type: adjustRelation, fromId: npc-gongsun-zan, toId: player, kind: friend, value: 6 }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
            nextEventId: ev-road-3
          - id: opt-road-2-cao
            text: 先把灶上多出来的锅问清楚
            visibleWhen:
              - { flag: origin, eq: 曹操 }
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: grantItem, itemId: item-mantou, count: 2 }
            nextEventId: ev-road-3
          - id: opt-road-2-yuan
            text: 先问今天按哪本账记
            visibleWhen:
              - { flag: origin, eq: 袁绍 }
            effects:
              - { type: adjustMood, value: 1 }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
            nextEventId: ev-road-3
          - id: opt-road-2-fictional
            text: 替公孙瓒把话接下去
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
            effects:
              - { type: adjustRelation, fromId: npc-gongsun-zan, toId: player, kind: friend, value: 4 }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: log, text: 「吃什么！是啊，是啊！」——你说完才发觉，这回接话的人变成了你。, visibility: public }
            nextEventId: ev-road-3
          - id: opt-road-2-if-lord
            text: 想起那一页：旗上写了自己的姓
            visibleWhen:
              - { flag: ifLord, eq: true }
            effects:
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意翻给你看：旗上确实写了你的姓，可席上仍旧没有你的位置。你把旗卷好继续走。, visibility: public }
            nextEventId: ev-road-3
          - id: opt-road-2-if-advisor
            text: 想起那一页：三封信都留着
            visibleWhen:
              - { flag: ifAdvisor, eq: true }
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: log, text: 天意翻给你看：三封信还在袖子里，纸软得快要散了。你仍旧没写收信人。, visibility: public }
            nextEventId: ev-road-3

  # ── 路上 3/5 · 刻字的石头（timeCost 4 天，剧情层改元伏笔） ──
  # ⚠ eraDraft / eraName 只是叙事层 flag；显示层恒为全局正朔「初平」（T-1）。
  #   按地区切换年号显示属 T-2，需 ADR，见 SANGUO_TEMPLATE_BRIEF.md §9.4，本轮未做。
  - id: ev-road-3
    title: 岔路 · 刻字的石头
    narrative: 岔路口有人蹲着往一块石头上刻字，说该换个年号了。你手里的账册还空着一页，风把纸翻得哗哗响，像在催你写点什么。
    trigger:
      source: chain
      timeCost: { value: 4, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-road-3-chuping
            text: 照旧写「初平」
            effects:
              - { type: setFlag, id: eraDraft, value: 初平 }
              - { type: adjustRelation, fromId: npc-xun-yu, toId: player, kind: colleague, value: 4 }
              - { type: log, text: 你写了朝廷的正朔。刻字的人没抬头，只说了一句「先记着吧」。, visibility: public }
            nextEventId: ev-road-4
          - id: opt-road-3-zhongjia
            text: 跟着寿春写「仲家」
            effects:
              - { type: setFlag, id: eraDraft, value: 仲家 }
              - { type: addRelationEdge, fromId: npc-yuan-shu, toId: player, kind: friend, visibility: known, value: 18 }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 你写下一个还没有朝廷承认的年号。写完之后，路上的人看你的眼神变了一点点。, visibility: public }
            nextEventId: ev-road-4
          - id: opt-road-3-tianyi
            text: 干脆写「天意元年」
            visibleWhen:
              - { flag: forkEmperor, eq: true }
            effects:
              - { type: setFlag, id: eraDraft, value: 天意 }
              - { type: adjustAttribute, attribute: tianyi, value: 2 }
              - { type: log, text: 宫道边那块石头你没拆穿。你只是把天意写进了年号，像给它记一笔账。, visibility: public }
            nextEventId: ev-road-4
          - id: opt-road-3-blank
            text: 不写，把空页留着
            effects:
              - { type: setFlag, id: eraDraft, value: 未定 }
              - { type: log, text: 你把账册合上了。空页后来一直空着，天意也没替你填。, visibility: public }
            nextEventId: ev-road-4
          - id: opt-road-3-if-cao
            text: 想起那一页：那一刀没有偏
            visibleWhen:
              - { flag: ifCao, eq: true }
            effects:
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意翻给你看：账册上根本不用改元，因为相府里那个人已经不在了。你照旧写了初平。, visibility: public }
            nextEventId: ev-road-4
          - id: opt-road-3-yuan
            text: 先问刻字的人奉的是谁的正朔
            visibleWhen:
              - { flag: origin, eq: 袁绍 }
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: setFlag, id: eraDraft, value: 初平 }
            nextEventId: ev-road-4
          - id: opt-road-3-fictional
            text: 把自己的名字刻在石头背面
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
            effects:
              - { type: adjustMood, value: 2 }
              - { type: setFlag, id: eraDraft, value: 未定 }
              - { type: log, text: 正面写着年号，背面写着你。天意只抄走了正面那一行。, visibility: public }
            nextEventId: ev-road-4

  # ── 路上 4/5 · 夜营（timeCost 4 天，承接三条人物线的第一章 flag） ──
  - id: ev-road-4
    title: 夜营 · 没说出口的话
    narrative: 火堆快灭了。有个人坐在火边，把白天该说的那句又说了一遍，只说给自己听。你可以装作没听见，也可以坐过去。
    trigger:
      source: chain
      timeCost: { value: 4, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-road-4-sit
            text: 坐过去，不接话
            effects:
              - { type: adjustRelation, fromId: npc-liubei, toId: player, kind: friend, value: 4 }
              - { type: adjustMood, value: 2 }
              - { type: log, text: 你们一起把火拨亮了一点。那句话到底没说出口，但两个人都知道说的是哪句。, visibility: public }
            nextEventId: ev-road-5
          - id: opt-road-4-liu
            text: 把「还是得带着他们走」说完
            visibleWhen:
              - { flag: origin, eq: 刘备 }
              - { flag: liuOath, eq: true }
            effects:
              - { type: adjustRelation, fromId: npc-gongsun-zan, toId: player, kind: friend, value: 6 }
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: log, text: 陈留那晚你想一个人先走。今晚你把这句话说完了，说完反而没那么想走了。, visibility: public }
            nextEventId: ev-road-5
          - id: opt-road-4-cao
            text: 把刀放在伸手能拿到的地方
            visibleWhen:
              - { flag: origin, eq: 曹操 }
              - { flag: caoReady, eq: true }
            effects:
              - { type: adjustRelation, fromId: npc-xun-yu, toId: player, kind: colleague, value: 6 }
              - { type: log, text: 那顿没吃成的饭你没再提。你只是把刀挪近了一点，天亮还要点兵。, visibility: public }
            nextEventId: ev-road-5
          - id: opt-road-4-yuan
            text: 再说一次「诸位以为如何」
            visibleWhen:
              - { flag: origin, eq: 袁绍 }
              - { flag: yuanDelay, eq: true }
            effects:
              - { type: adjustRelation, fromId: npc-yuan-shu, toId: npc-yuan-shao, kind: elder-brother, value: 4 }
              - { type: log, text: 火边没人应声，正好合你的意。这句话你练了一路，越练越像一道军令的替身。, visibility: public }
            nextEventId: ev-road-5
          - id: opt-road-4-fictional
            text: 把席子背面那半句擦掉
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustMood, value: 1 }
              - { type: log, text: 炭字擦得掉，意思擦不掉。你把席子卷好，压在行李最底下。, visibility: hidden }
            nextEventId: ev-road-5
          - id: opt-road-4-if-yuan
            text: 想起那一页：那道军令当场下了
            visibleWhen:
              - { flag: ifYuan, eq: true }
            effects:
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意翻给你看：军令下了，人却没动。火边仍旧没人应声，这一页和今天一模一样。, visibility: public }
            nextEventId: ev-road-5
          - id: opt-road-4-if-soldier
            text: 想起那一页：把听到的半句报上去了
            visibleWhen:
              - { flag: ifSoldier, eq: true }
            effects:
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意翻给你看：报上去了，战报仍只写「盟主召诸将议事」。你没再报第二次。, visibility: public }
            nextEventId: ev-road-5

  # ── 路上 5/5 · 国道口（timeCost 5 天，正好走到第 41 天 ch2-gate） ──
  - id: ev-road-5
    title: 国道口 · 总账
    narrative: 山路又出现了，布景没换，连远处那棵树都没换。你把手里的东西摊在石头上：名册、写了半页的账册、馒头，也许还有一头乌角鲨。天意不撤销任何一件，只是让所有人都觉得，本来就该带着这些往前走。
    trigger:
      source: chain
      timeCost: { value: 5, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-road-5-pack
            text: 收好，往前走
            effects:
              - { type: setFlag, id: roadDone, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: -1 }
              - { type: log, text: 你把石头上的东西一件件收回怀里。二十一天的路走完了，前面的山路还是那条山路。, visibility: public }
          - id: opt-road-5-shark
            text: 把乌角鲨也带上
            visibleWhen:
              - { flag: forkShark, eq: true }
            effects:
              - { type: setFlag, id: roadDone, value: true }
              - { type: grantItem, itemId: item-wujiaosha, count: 1 }
              - { type: log, text: 它自己游进了你的行囊。没有人觉得这有什么不对，包括你。, visibility: public }
          - id: opt-road-5-xusheng
            text: 让徐盛走最前
            visibleWhen:
              - { relation: npc-xu-sheng, gte: 6 }
            effects:
              - { type: setFlag, id: roadDone, value: true }
              - { type: adjustRelation, fromId: npc-xu-sheng, toId: player, kind: friend, value: 4 }
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: log, text: 江东的铁壁走在前头，逢人只说一句「别过来」。这一路果然没人过来。, visibility: public }
          - id: opt-road-5-if-shark
            text: 想起那一页：天意发力之前先游走了
            visibleWhen:
              - { flag: ifShark, eq: true }
            effects:
              - { type: setFlag, id: roadDone, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意翻给你看：水沟绕了一圈，还是回到中军帐那盆水。你决定不游了。, visibility: public }

  # ══════════════════════════════════════════════════════════════════════════
  # 第二章 · 徐州 → 官渡（从 ev-war-close 收兵接出，chain 严格有序）
  #
  # 与路上 5 段同一套写法：兜底人人可见＋刘 / 曹 / 袁专属＋虚构组共用
  # ＋ if 回响。每段 timeCost 2 天，收兵后约 10 天走完，
  # 第 58 天 ev-tianyi-anchor-2 由 schedule 必发（conditions 含 ch2Done，
  # 没走完就 hold 留队，不记错失）⇒ 天意一定会发力。
  # 主线不因身份改变；梗只作场景里的台词或背景。
  # ══════════════════════════════════════════════════════════════════════════

  - id: ev-ch2-1
    title: 徐州城下 · 各人有各人的事
    narrative: 徐州城下，陶谦病重。使者捧着印绶从案前起身，往人群里某一处走；城外路上跟来的人只问一句：城门今天开不开。那枚印绶最后落在谁手里，要看你是谁——天意这一回没替谁改。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-1-liu
            text: 迎上去，先把名册上的人安置进城
            visibleWhen:
              - { flag: origin, eq: 刘备 }
            effects:
              - { type: log, text: 使者走到你面前就停了。这一页写的是三让三辞，不是城门开不开。, visibility: public }
            nextEventId: ev-ch2-1-liu
          - id: opt-ch2-1-cao
            text: 不迎，先叫人把仓册取来
            visibleWhen:
              - { flag: origin, eq: 曹操 }
            effects:
              - { type: log, text: 使者从你身边过去了，没停。案上那枚印绶从头到尾没朝你这边偏过一寸。, visibility: public }
            nextEventId: ev-ch2-1-cao
          - id: opt-ch2-1-yuan
            text: 让快马把消息送回河北，先看座次
            visibleWhen:
              - { flag: origin, eq: 袁绍 }
            effects:
              - { type: log, text: 徐州的事传到河北时，已经变成一张席次图了。, visibility: public }
            nextEventId: ev-ch2-1-yuan
          - id: opt-ch2-1-open
            text: 先开城门，案上的事轮不到你
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
            effects:
              - { type: log, text: 印绶被捧去了别处。你只管门闩，没管那张案。, visibility: public }
            nextEventId: ev-ch2-1-other
          - id: opt-ch2-1-if-soldier
            text: 想起那一页：半句话报上去了
            visibleWhen:
              - { flag: ifSoldier, eq: true }
            effects:
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意翻给你看：城门那天没开，因为战报上仍旧什么都没写。你伸手推开了门。, visibility: public }
            nextEventId: ev-ch2-1-other

  # ── 第二章第 1 段的四条身份分支：同一段 2 天，各自叙事，统一接 ev-ch2-2 ──
  # 只有刘备这一支叫「让城」；另外三支明确写印绶没到自己手里。
  - id: ev-ch2-1-liu
    title: 徐州 · 三让
    narrative: 印绶推到你面前，一共三回。第一回你退了半步，第二回你说城外的人还没地方睡，第三回陶谦已经说不出话，只把印搁在你手里。天意没催，它只把城门先开了。
    trigger:
      source: chain
      timeCost: { value: 2, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-liu-accept
            text: 接下名分，但先把名册上的人安置进城
            effects:
              - { type: setFlag, id: ch2LiuAccept, value: true }
              - { type: adjustRelation, fromId: npc-gongsun-zan, toId: player, kind: friend, value: 8 }
              - { type: log, text: 你在陈留学会的第一件事是点人，不是点兵。徐州接不接得下，先看路上那些人有没有地方睡。, visibility: public }
            nextEventId: ev-ch2-2
          - id: opt-ch2-liu-gate
            text: 先开城门，印绶放一边
            effects:
              - { type: setFlag, id: ch2GateOpen, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: addRelationEdge, fromId: npc-gongsun-zan, toId: player, kind: friend, visibility: known, value: 22 }
              - { type: log, text: 城门先开了。印绶在案上放到落灰，也没有人催你拿——除了名册上那些还站在城外的人。, visibility: public }
            nextEventId: ev-ch2-2

  - id: ev-ch2-1-cao
    title: 徐州 · 仓册
    narrative: 陶谦的使者没往你这边来。徐州让城是别人家的事，你面前只有一本仓册：粮几囤、车几乘、这一路能不能养得起一支兵。城门开不开，你记了一笔，没下判断。
    trigger:
      source: chain
      timeCost: { value: 2, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-cao-granary
            text: 先点仓，别急着替谁接印
            effects:
              - { type: setFlag, id: ch2CaoGranary, value: true }
              - { type: adjustRelation, fromId: npc-xun-yu, toId: player, kind: colleague, value: 8 }
              - { type: log, text: 城可以明天接，粮得今天数。你把这句话写进文书，落款只写了「先记着」。, visibility: public }
            nextEventId: ev-ch2-2
          - id: opt-ch2-cao-file
            text: 只在文书上写「徐州，照旧」
            effects:
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: log, text: 印绶落进谁手里，天意没让你在这一页写。你也没替自己补一句。, visibility: public }
            nextEventId: ev-ch2-2

  - id: ev-ch2-1-yuan
    title: 河北 · 座次
    narrative: 让城的消息到河北时已经不是消息了，是一张席次图。主位上没人问陶谦病得重不重，只问那枚印绶是谁举荐、往哪一边递。你听完，把图卷了起来。
    trigger:
      source: chain
      timeCost: { value: 2, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-yuan-seats
            text: 先问是谁举荐的
            effects:
              - { type: setFlag, id: ch2YuanSeats, value: true }
              - { type: adjustRelation, fromId: npc-yuan-shu, toId: npc-yuan-shao, kind: elder-brother, value: 5 }
              - { type: log, text: 印绶摆得端不端正，比城门开不开更要紧——至少主位上是这么算的。你没说破。, visibility: public }
            nextEventId: ev-ch2-2
          - id: opt-ch2-yuan-roll
            text: 把席次图卷起来，先看河北的粮
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: log, text: 徐州的印绶没往河北递，河北的粮册倒先翻开了新的一页。天意没把这两件事抄在一行里。, visibility: public }
            nextEventId: ev-ch2-2

  - id: ev-ch2-1-other
    title: 城外 · 门闩
    narrative: 印绶被捧去了别处，从头到尾没朝你这边偏过一寸。城外路上跟来的人还站着，他们只问一句：城门今天开不开。这一页里你能答的只有这一句。
    trigger:
      source: chain
      timeCost: { value: 2, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-other-gate
            text: 先把城外的人放进来，再回案上
            effects:
              - { type: setFlag, id: ch2GateOpen, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: adjustMood, value: 2 }
              - { type: addRelationEdge, fromId: npc-gongsun-zan, toId: player, kind: friend, visibility: known, value: 22 }
              - { type: log, text: 你替开城门的人扶了一把门闩。案上那枚印绶，始终没人递到你手里。, visibility: public }
            nextEventId: ev-ch2-2
          - id: opt-ch2-other-note
            text: 把今天记成半页，剩下半页留给别人
            effects:
              - { type: log, text: 名册上这一页只写了城门。让城那一段写在哪儿，你没问，天意也没替你补。, visibility: public }
            nextEventId: ev-ch2-2
  # ── 改元 · 剧情层（T-1 纯 yaml），显示层多地区切换仍属 T-2 未做 ──
  - id: ev-ch2-2
    title: 改元 · 三本账册
    narrative: 寿春送来文书：那边改元「仲家」，即日起账册不用朝廷正朔。江东仍写「初平」，也有人干脆写「天意元年」。三本账册摆在你面前，军吏捧着墨等你写第四本。
    trigger:
      source: chain
      timeCost: { value: 2, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-2-chuping
            text: 写「初平」
            effects:
              - { type: setFlag, id: eraName, value: 初平 }
              - { type: adjustRelation, fromId: npc-xun-yu, toId: player, kind: colleague, value: 5 }
              - { type: log, text: 你照朝廷的正朔写。军吏松了口气，寿春那本还摊在旁边，没人去合上。, visibility: public }
            nextEventId: ev-ch2-3
          - id: opt-ch2-2-zhongjia
            text: 写「仲家」
            effects:
              - { type: setFlag, id: eraName, value: 仲家 }
              - { type: addRelationEdge, fromId: npc-yuan-shu, toId: player, kind: friend, visibility: known, value: 20 }
              - { type: adjustAttribute, attribute: tianyi, value: 2 }
              - { type: log, text: 你写下寿春送来的年号。写完抬头，发现三本账册上的人都在看你，包括本该最不关心的那个。, visibility: public }
            nextEventId: ev-ch2-3
          - id: opt-ch2-2-tianyi
            text: 把路上那一页抄过来：天意元年
            visibleWhen:
              - { flag: eraDraft, eq: 天意 }
            effects:
              - { type: setFlag, id: eraName, value: 天意 }
              - { type: adjustAttribute, attribute: tianyi, value: 2 }
              - { type: log, text: 岔路口那块石头上的字，被你抄进了正式账册。天意没有阻止，只是把墨迹吹干得快了些。, visibility: public }
            nextEventId: ev-ch2-3
          - id: opt-ch2-2-unwritten
            text: 不写年号，只写「路上的人还在」
            visibleWhen:
              - { flag: origin, eq: 刘备 }
            effects:
              - { type: setFlag, id: eraName, value: 未书 }
              - { type: log, text: 你把年号那一栏空着，另起一行记了人数。军吏没敢问，天意也没补。, visibility: public }
            nextEventId: ev-ch2-3
          - id: opt-ch2-2-blank
            text: 先空着，等打完再说
            effects:
              - { type: setFlag, id: eraName, value: 未定 }
              - { type: log, text: 你把笔搁下了。三本账册并排摆着，谁的年号也没能说服谁。, visibility: public }
            nextEventId: ev-ch2-3
          - id: opt-ch2-2-fictional
            text: 在第四本上只写自己的名字
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
            effects:
              - { type: setFlag, id: eraName, value: 未定 }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: log, text: 年号栏空着，署名栏写了你。军吏收账册时把这一本放在了最下面。, visibility: public }
            nextEventId: ev-ch2-3

  # ── 兖州 · 曹操线核心 ──
  - id: ev-ch2-3
    title: 兖州 · 空营
    narrative: 回营时灶还温着，人少了一截。名册摊在案上，最后几行是空的，墨还没干。你想起陈留那顿没吃成的饭，和那句被推给世道的话。
    trigger:
      source: chain
      timeCost: { value: 2, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-3-roll
            text: 把名册补完，空行也留着
            effects:
              - { type: setFlag, id: ch2RollKept, value: true }
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: adjustMood, value: -3 }
              - { type: log, text: 你把走掉的名字划掉，又在旁边留了一行空白。这一行后来一直没人填。, visibility: public }
            nextEventId: ev-ch2-4
          - id: opt-ch2-3-cao-own
            text: 这次不交给世道，认下来
            visibleWhen:
              - { flag: origin, eq: 曹操 }
              - { flag: forkBlameEra, eq: true }
            effects:
              - { type: setFlag, id: ch2CaoOwn, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: -2 }
              - { type: adjustRelation, fromId: npc-xun-yu, toId: player, kind: colleague, value: 8 }
              - { type: log, text: 第一章你把那句话交给了乱世。这一章你把它收了回来，写进自己的名下——天意这次没插手。, visibility: public }
            nextEventId: ev-ch2-4
          - id: opt-ch2-3-xunyu
            text: 让荀彧重新造册
            visibleWhen:
              - { relation: npc-xun-yu, kind: colleague, to: player, gte: 10 }
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustRelation, fromId: npc-xun-yu, toId: player, kind: colleague, value: 5 }
              - { type: log, text: 他把册子重抄了一遍，顺口说了句「徐州城不愧为中原第一雄关」，然后自己愣了一下。天意侵蚀照常发作。, visibility: public }
            nextEventId: ev-ch2-4
          - id: opt-ch2-3-liu
            text: 先安顿灶边还坐着的人
            visibleWhen:
              - { flag: origin, eq: 刘备 }
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: adjustMood, value: 2 }
            nextEventId: ev-ch2-4
          - id: opt-ch2-3-yuan
            text: 先问空行是谁划的
            visibleWhen:
              - { flag: origin, eq: 袁绍 }
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 1 }
            nextEventId: ev-ch2-4
          - id: opt-ch2-3-fictional
            text: 替空行旁边补一个名字
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
            effects:
              - { type: adjustMood, value: 1 }
              - { type: log, text: 你写的是自己的名字。反正这一行本来空着，天意也没说不许。, visibility: hidden }
            nextEventId: ev-ch2-4
          - id: opt-ch2-3-ashes
            text: 先埋灶灰，明天再说
            effects:
              - { type: adjustMood, value: 2 }
              - { type: log, text: 你把灶灰埋了，手在袖子里攥了很久。名册留到明天，反正它也不会自己长回名字。, visibility: public }
            nextEventId: ev-ch2-4

  # ── 河北 · 袁绍线核心 ──
  - id: ev-ch2-4
    title: 河北 · 再等等
    narrative: 河北大营，田丰和许攸各递一封文书，主位上人人等你一句话。你已经把「再等等」在心里转了三圈，出口却还是那句「诸位以为如何」。
    trigger:
      source: chain
      timeCost: { value: 2, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-4-date
            text: 这次先把日子定下来
            effects:
              - { type: setFlag, id: ch2DateSet, value: true }
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: adjustRelation, fromId: npc-yuan-shao, toId: npc-caocao, kind: rival, value: 6 }
              - { type: log, text: 你在文书上写了一个日期。写完满帐安静，像是有人替你把那句「再等等」咽了回去。, visibility: public }
            nextEventId: ev-ch2-5
          - id: opt-ch2-4-yuan
            text: 还是「诸位以为如何」
            visibleWhen:
              - { flag: origin, eq: 袁绍 }
              - { flag: yuanDelay, eq: true }
            effects:
              - { type: setFlag, id: ch2YuanDefer, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: adjustRelation, fromId: npc-yuan-shu, toId: npc-yuan-shao, kind: elder-brother, value: 5 }
              - { type: log, text: 陈留那句你说了一整章，河北又说了一次。史书后来只写「盟主召诸将议事」，没写你其实什么都没定。, visibility: public }
            nextEventId: ev-ch2-5
          - id: opt-ch2-4-yuanshu
            text: 让袁术先签
            visibleWhen:
              - { relation: npc-yuan-shu, kind: elder-brother, to: npc-yuan-shao, gte: 32 }
            effects:
              - { type: addRelationEdge, fromId: npc-yuan-shu, toId: player, kind: friend, visibility: known, value: 16 }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: log, text: 他签得极快，还顺手把「仲家」两个字写在了年号栏。你没拦——天意会管，但那是后面的事。, visibility: public }
            nextEventId: ev-ch2-5
          - id: opt-ch2-4-cao
            text: 把两封文书合成一道军令
            visibleWhen:
              - { flag: origin, eq: 曹操 }
            effects:
              - { type: adjustAttribute, attribute: command, value: 2 }
              - { type: adjustMood, value: -1 }
            nextEventId: ev-ch2-5
          - id: opt-ch2-4-liu
            text: 先问文书上的人够不够
            visibleWhen:
              - { flag: origin, eq: 刘备 }
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 1 }
            nextEventId: ev-ch2-5
          - id: opt-ch2-4-fictional
            text: 把两封叠齐，谁也不批
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
            effects:
              - { type: adjustMood, value: 1 }
              - { type: log, text: 两封文书压在案角，谁也没输，谁也没赢。仗照旧要打。, visibility: public }
            nextEventId: ev-ch2-5
          - id: opt-ch2-4-if-yuan
            text: 想起那一页：军令当场下了
            visibleWhen:
              - { flag: ifYuan, eq: true }
            effects:
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意又翻了一次：军令下了，日期也定了，两封文书仍在案角。它合上书，什么也没解释。, visibility: public }
            nextEventId: ev-ch2-5
          - id: opt-ch2-4-both
            text: 两封都收下，都不批
            effects:
              - { type: adjustMood, value: 1 }
              - { type: log, text: 你把两封文书叠齐压在案角。谁也没输，谁也没赢，仗照旧要打。, visibility: public }
            nextEventId: ev-ch2-5

  # ── 官渡前夜 · 七条线汇合（每个选项都要 setFlag ch2Done） ──
  - id: ev-ch2-5
    title: 官渡前夜 · 三本账
    narrative: 三方在同一条国道口扎营，隔着一条河能看见彼此的火。三本年号不同的账册摆在一起，有人提议合成一本。你手里还留着自己那一本，路上写的那半页也在。
    trigger:
      source: chain
      timeCost: { value: 2, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-5-merge
            text: 把自己的那本也放上去
            effects:
              - { type: setFlag, id: ch2Done, value: true }
              - { type: setFlag, id: ch2BooksMerged, value: true }
              - { type: log, text: 四本账册叠成一摞。谁的年号都没被撕掉，只是最上面那本还没定。, visibility: public }
          - id: opt-ch2-5-liu
            text: 先点一遍带来的人，再谈合账
            visibleWhen:
              - { flag: origin, eq: 刘备 }
            effects:
              - { type: setFlag, id: ch2Done, value: true }
              - { type: adjustRelation, fromId: npc-gongsun-zan, toId: player, kind: friend, value: 6 }
              - { type: log, text: 陈留到官渡，你换过三本册子，点的始终是同一批人。今夜又点了一遍，比来时少了两个。, visibility: public }
          - id: opt-ch2-5-cao
            text: 把檄文再抄一份，落款写今年
            visibleWhen:
              - { flag: origin, eq: 曹操 }
            effects:
              - { type: setFlag, id: ch2Done, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: log, text: 落款那一栏你空了很久，最后还是写了年号。四个字没人听见的那一章，好歹留下了一份能传出去的东西。, visibility: public }
          - id: opt-ch2-5-yuan
            text: 让主位空着，谁都不用先说话
            visibleWhen:
              - { flag: origin, eq: 袁绍 }
            effects:
              - { type: setFlag, id: ch2Done, value: true }
              - { type: adjustMood, value: 2 }
              - { type: log, text: 你把主位留空了。没人敢坐，也没人问为什么——这一夜你第一次觉得，不说话也是一种交代。, visibility: public }
          - id: opt-ch2-5-fictional
            text: 把自己那一本压在最下面
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
            effects:
              - { type: setFlag, id: ch2Done, value: true }
              - { type: adjustMood, value: 1 }
              - { type: log, text: 四本账册叠成一摞，最下面那本写着你的名字。天意抄走了最上面一本的年份，没抄署名。, visibility: public }
          - id: opt-ch2-5-if
            text: 把天意折起来的那几页也一起放上去
            effects:
              - { type: setFlag, id: ch2Done, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 折起来的那几页一张也没少：走了的那一夜、没偏的那一刀、下了的军令、自己的姓。天意只把它们压平，不撕。, visibility: public }

  # ── 第二次天意锚点：schedule + once + priority 100，到点必发 ──
  # conditions 含 ch2Done：若玩家还没走完第二章，实例会 hold 留队（不是错失）。
  - id: ev-tianyi-anchor-2
    title: 天意 · 第二次世界线修正
    narrative: 二月二十八。三本账册被抄成一行，年号拨回初平。徐州、兖州、河北各自发生的事一件也没被撤销——名册还在，空行还在，你写过的那一页也还在；只是所有人都觉得，本来就该是往官渡走。天意又发力了。
    trigger:
      source: schedule
      window: { start: { value: 58, unit: day } }
      once: true
      priority: 100
      conditions:
        - { flag: chapter, eq: 2 }
        - { flag: ch2Done, eq: true }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-tianyi-2-accept
            text: 「迅雷乃天意，世人谁敢不畏天意？」
            effects:
              - { type: log, text: 天意发力了。世界线收束回主线：官渡还是官渡，年号还是初平。, visibility: public }
              - { type: setFlag, id: chapter, value: 3 }
              - { type: setFlag, id: anchor2Done, value: true }
              - { type: setFlag, id: mainline, value: 官渡 }
              # 叙事层改元的收束：天意把各营私改的年号拨回正朔，但玩家写过的
              # eraDraft / eraName 不清除 ⇒ 后果不撤销，只改写认知（与锚点 1 同口径）。
              - { type: setFlag, id: eraName, value: 初平 }
              - { type: adjustAttribute, attribute: tianyi, value: -3 }
              - { type: log, text: 三份战报、四本账册合成一行。你仍记得自己写过什么，别人只记得初平元年，官渡。, visibility: public }
              - { type: log, text: 支线 flag 全部保留，后果不撤销，只改写认知（二创「世界修正」原义）。, visibility: hidden }

  # ── 第三章接口（只留一句预告，不铺开内容） ──
  - id: ev-ch3-gate
    title: 新三国道 · 官渡在前面
    narrative: 还是这条山路，布景没换，那棵树也没换。官渡已经排好了，天意照例先到一步。你把自己那一本账册收进怀里，往前走。
    trigger:
      source: schedule
      window: { start: { value: 59, unit: day } }
      once: true
      conditions:
        - { flag: chapter, eq: 3 }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch3-enter
            text: 往前走
            effects:
              - { type: log, text: 第二章到此为止。后续章节在此接续，主线仍是天意说了算。, visibility: public }
          - id: opt-ch3-fold
            text: 让天意把十年折成一步，翻到建安五年
            effects:
              - { type: setFlag, id: saga, value: 200 }
              - { type: setFlag, id: chapter, value: 200 }
              - { type: setFlag, id: mainline, value: 衣带诏 }
              - { type: setFlag, id: eraName, value: 建安五年 }
              - { type: setFlag, id: ydzDone, value: false }
              - { type: adjustAttribute, attribute: tianyi, value: 3 }
              - { type: log, text: 山路没换，树没换，天意却把这一页折了十年：官渡还在前面，先去许都看一道写在衣带里的诏。历书这一格没跟着改，天意只改人。, visibility: public }
            nextEventId: ev-ydz-fold
  # ── 玩家战死事件（endings.yaml deathRoute 的 event 模式复用） ──
  # 不在任何 chain / schedule 里 ⇒ 平时永不触发；只有战败且立过军令状时，
  # 引擎把它登记进 firedEvents + history（结局证据），再收束人生。
  - id: ev-hero-fall
    title: 军令状 · 不回头
    narrative: 旗还在往前，你没再往后看。战报最后被抄成同一行：初平元年，讨董。名册上又多了一道墨杠，抄册的人没问是谁。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-hero-fall
            text: 把军令状折好，压在名册下面
            effects:
              - { type: log, text: 天意把这一行也抄了回去，只是没抄名字。, visibility: public }


  # ══════════════════════════════════════════════════════════════════════════
  # 第七轮 · 建安五年 · 衣带诏（第二个开局 + 初平元年的天意折叠入口）
  #
  # 【两条入口，一条剧情】
  #   ① 新开局 op-200-yidaizhao：handoff → ev-ydz-open → ev-ydz-wheel
  #      → 7 条身份链（各 2 段）→ ev-ydz-edict …
  #   ② 初平元年主线：ev-day7-dissolve 的「往下翻一页」或 ev-ch3-gate 的
  #      「把十年折成一步」→ ev-ydz-fold → ev-ydz-arrival → ev-ydz-edict。
  #      两条入口在 ev-ydz-edict 汇合；过渡局保留原 origin、不重转转盘，
  #      但 ev-ydz-arrival 按 origin 接进建安五年人物链（第八轮）：
  #      刘/曹/乌角鲨复用 ev-ydz-line-*-1/2，袁绍/虚构组各走一条过渡专属链。
  #
  # 【时间口径 · 最重要】建安五年是**剧情层年号**（eraName flag + 叙事），
  #   显示层仍是 world.yaml 的全局静态「初平 N年」——T-2 多套年号未授权，本轮
  #   不动契约面。折叠写进叙事：天意改了人、改了事，没顾上改历书那一格。
  #   因此本块**不 advanceTo、不写绝对年份到时间坐标**，只用 chain timeCost
  #   逐段推进 1 天；从哪一天进入都单调向前，终止由 ydzDone flag 裁决，
  #   不受陈留第 60 天 timeReached 影响（那条终止条件加了 saga eq 190）。
  #
  # 【演义内因果顺序】建安四年春三月赐玉带血诏（前情，此处作第一段）→
  #   义状签名（王子服 → 种辑/吴硕 → 吴子兰 → 马腾 → 刘备）→ 青梅煮酒论英雄
  #   → 刘备借截击袁术离许都、马腾回西凉 → 建安五年元旦吉平咬指定毒计、
  #   秦庆童告密 → 事发，吉平撞阶、衣带诏与义状被搜出 → 天意收束回官渡。
  #   模板内不写回目、不写播出序号与出处；考据见 SANGUO_TEMPLATE_BRIEF §13。
  # ══════════════════════════════════════════════════════════════════════════

  # ── 新开局引导 ──
  - id: ev-ydz-open
    title: 建安五年 · 许都
    narrative: 更漏已经报到建安五年了，可你手上那本历书还停在初平元年这一格——天意改了人、改了事、连许田的鹿都改了，唯独没顾上改纸。名册上还留着十年前那些名字，天意也没划掉。宫里今天赐了一件锦袍、一条玉带；带子有点硬，没人敢说哪里硬。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ydz-open-wheel
            text: 转一下那台不知谁留下的旧转盘
            effects:
              - { type: log, text: 转盘上刻着七种活法，其中四张脸你认得。天意在旁边看着，暂时没有发力。, visibility: public }
            nextEventId: ev-ydz-wheel

  # ── 天意折叠（初平元年两个入口共用） ──
  - id: ev-ydz-fold
    title: 天意 · 把十年折成一步
    narrative: 天意把这一页折了十年。山路、树、账册都在，只是许都的更漏忽然敲到建安五年，宫里正在赐一条缝了东西的玉带。你低头看历书：那格还写着初平元年。天意改的是人，不是纸——日子照它自己的走，一步也不倒着来。
    trigger:
      source: chain
      timeCost: { value: 1, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ydz-fold-accept
            text: 把历书合上，跟着更漏走
            effects:
              - { type: setFlag, id: ydzEntry, value: 过渡 }
              - { type: adjustAttribute, attribute: tianyi, value: 2 }
              - { type: log, text: 十年被折成一步。名册上那些旧名字也跟着走了过来，天意没解释为什么。, visibility: public }
            nextEventId: ev-ydz-arrival

  # ── 过渡局开场：不重转转盘，按陈留 origin 分流到建安五年人物链 ──
  - id: ev-ydz-arrival
    title: 许都宫道 · 旧名册
    narrative: 许都宫道上，衣带刚赐下去。守门的人翻着名册，把十年前那些名字念了一遍，念到其中一个时停了停——他没说那名字是谁，只把册子往你这边推了半寸。天意照例先到一步：它把人带来了，没说该站哪一边。
    trigger:
      source: chain
      timeCost: { value: 1, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ydz-arrival-cao
            text: 先问一句：那道诏上要杀的是谁
            visibleWhen:
              - { flag: origin, eq: 曹操 }
            effects:
              - { type: setFlag, id: ydzEntry, value: 过渡 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: log, text: 没人敢答。案上那份还没抄完的文书，落款处空着一格——绢上七个名字合起来，指的正是这一格。你没让人把册子合上。, visibility: public }
            nextEventId: ev-ydz-line-cao-1
          - id: opt-ydz-arrival-liu
            text: 把「列位弟兄」那句咽回去，先问今天吃什么
            visibleWhen:
              - { flag: origin, eq: 刘备 }
            effects:
              - { type: setFlag, id: ydzEntry, value: 过渡 }
              - { type: adjustMood, value: 2 }
              - { type: log, text: 这一世的许都里没有第二个你。后园的菜畦还等着浇水，天意把那句台词收走了，只留下筷子的响声。, visibility: public }
            nextEventId: ev-ydz-line-liu-1
          - id: opt-ydz-arrival-yuan
            text: 让快马回河北，许都的事先记一页
            visibleWhen:
              - { flag: origin, eq: 袁绍 }
            effects:
              - { type: setFlag, id: ydzEntry, value: 过渡 }
              - { type: log, text: 绢上七个名字里没有你，被划掉的名册里也没有。河北的粮册倒是翻到了新的一页。, visibility: public }
            nextEventId: ev-ydz-tr-yuan-1
          - id: opt-ydz-arrival-shark
            text: 顺着护城河游过去，趴在宫道石阶上
            visibleWhen:
              - { flag: origin, eq: 乌角鲨 }
            effects:
              - { type: setFlag, id: ydzEntry, value: 过渡 }
              - { type: grantItem, itemId: item-wujiaosha, count: 1 }
              - { type: log, text: 宫里把十年前那头鱼也记成了祥瑞。天意没改这一笔，反正谁也不追究。, visibility: public }
            nextEventId: ev-ydz-line-shark-1
          - id: opt-ydz-arrival-watch
            text: 站在宫道边，看那件锦袍被捧过去
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
              - { flag: origin, ne: 乌角鲨 }
            effects:
              - { type: setFlag, id: ydzEntry, value: 过渡 }
              - { type: log, text: 你没进那间屋子。义状上不会有你的名字，天意也没替你补一个。, visibility: public }
            nextEventId: ev-ydz-tr-other-1

  # ── 过渡局专属链：陈留身份里没有对应建安身份的两支（袁绍 / 虚构组）──
  # 其余三支直接复用新开局的人物链 ev-ydz-line-{cao,liu,shark}-1/2，
  # 链尾本来就汇入 ev-ydz-edict，因此两条入口共用同一套人物剧情。
  - id: ev-ydz-tr-yuan-1
    title: 河北 · 官渡前夜
    narrative: 许都的更漏报了建安五年，河北的更漏没跟着改。案上摊着两封文书：一封说宫里赐了一条玉带，一封说绢上有七个名字。你先把第二封压回匣底——绢上没有你，这一页却仍得由你来翻。
    trigger:
      source: chain
      timeCost: { value: 1, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ydz-tr-yuan-grain
            text: 不问绢上是谁，先点河北的粮
            effects:
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: log, text: 粮册比绢厚得多。天意把许都那一页折了十年，没折动河北这一本。, visibility: public }
            nextEventId: ev-ydz-edict
          - id: opt-ydz-tr-yuan-seats
            text: 问一句：这七个名字是谁举荐的
            effects:
              - { type: adjustMood, value: -1 }
              - { type: log, text: 没人答得上来。主位上照旧把席次摆正，绢上那件事就摆到了下一页。, visibility: public }
            nextEventId: ev-ydz-edict

  - id: ev-ydz-tr-other-1
    title: 许都 · 没写上去的那一页
    narrative: 你带着陈留那本账册站在宫道边，衣带被捧过去了，白绢也铺开了。守门的人翻名册时没找到你，倒是在册子最后一页看见十年前陈留的墨迹——他没问，你也没解释。天意把人带来了，没替你在绢上添名字。
    trigger:
      source: chain
      timeCost: { value: 1, unit: day }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ydz-tr-other-account
            text: 把陈留那本账册翻到新的一页
            effects:
              - { type: adjustMood, value: 2 }
              - { type: log, text: 新的一页还是空的。天意没拦你写，也没替你写：这一章里你是记的人，不是被记的人。, visibility: public }
            nextEventId: ev-ydz-edict
          - id: opt-ydz-tr-other-watch
            text: 只看着，等那件袍子进府
            effects:
              - { type: log, text: 袍子进府了，门合上。你手里那本账册比来时重了一点，天意没称过。, visibility: public }
            nextEventId: ev-ydz-edict
  - id: ev-ydz-wheel

              - { flag: origin, eq: 袁绍 }
            effects:
              - { type: setFlag, id: yuanDelay, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
          - id: opt-day1-liu
            text: 替路上那些人问一句粮怎么算
            visibleWhen:
              - { flag: origin, eq: 刘备 }
            effects:
              - { type: setFlag, id: liuOath, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: adjustMood, value: -1 }
          - id: opt-day1-fictional
            text: 把自己的名字往名册末尾写
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: log, text: 名字写上去的时候墨还没干，天意也没拦。, visibility: public }


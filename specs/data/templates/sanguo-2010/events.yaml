              - { type: setNpcLifecycle, npcId: npc-zu-mao, state: inactive, reasonCode: 汜水关阵亡 }
              - { type: setNpcLifecycle, npcId: npc-hua-xiong, state: inactive, reasonCode: 温酒未凉 }

# 三国演义 · 事件 · events.yaml〔按身份分线 / 演义时间轴〕
#
# ══════════════════════════════════════════════════════════════════════════
# 第五轮（2026-11-14）：按身份重写事件、按演义内时间重排日程。
#
# 【时间纪律 · 最重要】
#  ① 世界内天数只由 chain timeCost / action duration 推进；第 1~7 天各一条
#     source: schedule（window.end 第 8 天），锚点 1/2、ch2/ch3-gate 是固定日。
#  ② 日程按**演义内因果顺序**排：矫诏会盟 → 汜水关 → 虎牢关 → 军议 → 焚洛阳
#     → 传国玉玺 → 联盟离散。**不按播出顺序排序、不写任何出处 / 回目**。
#  ③ 189 年冬的前情（寿宴喊话、献刀、吕伯奢）放在身份链的「前情」段，不占
#     世界天数；194 / 208 的后期梗由第 7 天「天意提前放映」解释，绝不伪装成
#     初平元年正月发生的事。考据与三人时间轴见 docs/SANGUO_TEMPLATE_BRIEF.md §11。
#  ④ 锚点 1 第 8 天 advanceTo 20 → 路上 5 段 4+4+4+4+5=21 天走到 41；
#     第 42 天战争沙盘；第二章 5×2 天；第 58 天锚点 2（hold 等 ch2Done）；
#     第 59 天 ch3-gate；第 60 天终止。整条链没有空白黑洞，也没有时间倒挂。
#
# 【按身份写】命数转盘 7 格 = 7 条身份链，各 3 段（前情 → 处境 → 分岔），
#   最后汇入同一场讨董大会 ⇒ 第 8 天天意锚点 ⇒ 第 41 天新三国道，主线不变。
#   每条链第 3 段有一条同人 if 选项（ifXxx flag），不写 chapter、不 advanceTo、
#   不改结局判据；锚点不清除 ⇒ 后果不撤销，只改写认知。公共日程与路上 / 第二章
#   再用 visibleWhen 回响这些 flag。
#
# 【公共事件】每条一条 schedule 人人触发：1 个无 visibleWhen 的兜底选项
#   （人人可见，并补齐 fork* flag，保证隐藏结局对任何身份都可达）
#   ＋ 若干 visibleWhen: origin eq X 的专属选项（该身份的参与方式）。
#   ⇒ 完全没参与的身份只有一个选项；传国玉玺尤其如此。
#   「恭喜爹可以称帝了」只是孙策对孙坚说的台词，写在 narrative，
#   玩家可选选项里没有称帝句 —— 谁都不能称帝。
#
# 【防分身】三名真实人物开局 unspawned，转盘每格 spawnNpc 只刷玩家没占用的人；
#   以其为第三视角的叙述一律改成第二人称或旁观，世界里只有一个「自己」。
# 【天意】schedule + window.start ⇒ 建世界时按绝对分钟一次性入队，到点必发；
#   锚点只 setFlag 主线进度 + 认知改写，不清 flag、不回滚属性 / 资源 / 物品。
#   池事件 once 挡不住已入队实例（第四轮已证伪），本模板不再使用随机池。
# ══════════════════════════════════════════════════════════════════════════

# 【第六轮 · 人物死亡】死亡是**世界事实**，不是玩家选项的奖励：
#   ① 吕伯奢开局 inactive（189 冬前情，不占天数）；正月初三汜水关五人阵亡，
#      写在 ev-day2-sishui 的**每个**选项里（幂等）⇒ 无论玩家怎么选都会发生；
#   ② 死者用 npcState 条件做名册回响（第 3 天 / 路上 / 第 7 天），对死者写关系
#      会被引擎静默忽略，模板故意留着这一笔作为可验证的冻结证据；
#   ③ 二月十二战争沙盘 onVictory 让「旗后面的人」阵亡；onDefeat 只记 battleLost；
#   ④ 只有开战时立过军令状（vowNoRetreat）且战败，才由 endings.yaml 的 deathRoute
#      收束玩家人生 ⇒ 默认 7 条身份线与战争矩阵完全不受影响。
#   死亡不推进时间、不改 window / timeCost / nextEventId，时间账与第五轮一致。
#
# 【第七轮 · 建安五年衣带诏 + 体验打磨】两个开局、一条主线：
#   ① opening.yaml 新增 op-200-yidaizhao（前端 openings > 1 自动出开局下拉）；
#   ② 第 7 天「提前放映」与第 59 天第三章接口各留一个天意折叠选项 ⇒ ev-ydz-fold，
#      与新开局在 ev-ydz-edict 汇合；过渡局保留原 origin、不重转转盘，
#      但 ev-ydz-arrival 按 origin 接进建安五年人物链（刘/曹/乌角鲨复用
#      ev-ydz-line-*-1/2，袁绍与虚构组各有一条过渡专属链）⇒ 不再只有旁观兜底；
#   ③ 衣带诏块全 chain、逐段 timeCost 1 天 ⇒ 从哪天进入都单调向前，
#      终止由 endings.yaml 的 ydzDone 裁决（陈留第 60 天条件已分流 saga eq 190）。
#      建安五年是**剧情层年号**（eraName + 叙事），显示层仍是全局静态「初平 N年」：
#      天意改人、改事，没顾上改历书那一格；T-2 多套年号未授权、未动契约面。
#   ④ 体验打磨（基线模拟实测）：锚点 1 补「十二天折叠」说明；沙盘 phase2 加
#      主动收兵 / 相持选项、第 45 天 ev-war-timeout 兜底（不叫阵也能接回第二章）；
#      ch2-gate / ch3-gate 补选项；第 41 天 ev-road-eve 与第 55 天 ev-ch2-eve
#      切开最长空窗。陈留主线锚点 / 终止时间逐分钟不变。
events:
  # ────────────── 开局：命数转盘（7 格 → 7 条故事） ──────────────

  - id: ev-opening-wheel
    title: 命数转盘 · 陈留
    narrative: 初平元年正月，陈留。会盟的帐外摆着一台不知谁留下的旧转盘，它自己转了起来。十八路诸侯正在里面争论谁当盟主，没人注意到你。转盘上刻着七种活法，其中三种有名字——是你听过很多遍的名字。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-turn-wheel
            text: 转动命数转盘，看看这乱世把你安排成什么
            effects:
              - { type: log, text: 转盘开始转了。天意在旁边看着，暂时没有发力。, visibility: public }
            nextEventId: ev-wheel-fate

  # 每格 effects 里的 spawnNpc 就是「防分身」的全部实现：玩家是谁，就不刷谁。
  # 三名真实人物开局 unspawned（world.yaml 的 npcSpawnRules），只有这里能把他们请上场。
  # setFlag objective 覆盖 opening.yaml 的默认值 ⇒ 二创「胜利目标说」按身份分化。
  - id: ev-wheel-fate
    title: 命数转盘 · 你这辈子是谁
    narrative: 第一格是出身。诸侯、谋士、小兵……一个谁也没见过却所有人都觉得合情合理的选项，以及三张你认得的脸。
    trigger:
      source: chain
    kind: random
    settle:
      random:
        wheel:
          segments:
            - weight: 3
              label: 一路诸侯
              effects:
                - { type: setFlag, id: origin, value: 诸侯 }
                - { type: setFlag, id: objective, value: 让这面旗活过这一章 }
                - { type: spawnNpc, ruleId: rule-liubei-arrival }
                - { type: spawnNpc, ruleId: rule-caocao-arrival }
                - { type: spawnNpc, ruleId: rule-yuan-shao-arrival }
                - { type: adjustAttribute, attribute: command, value: 3 }
                - { type: adjustAttribute, attribute: reputation, value: 4 }
              nextEventId: ev-line-lord-1
            - weight: 3
              label: 帐下谋士
              effects:
                - { type: setFlag, id: origin, value: 谋士 }
                - { type: setFlag, id: objective, value: 找到一句值得写进信里的话 }
                - { type: spawnNpc, ruleId: rule-liubei-arrival }
                - { type: spawnNpc, ruleId: rule-caocao-arrival }
                - { type: spawnNpc, ruleId: rule-yuan-shao-arrival }
                - { type: adjustAttribute, attribute: intellect, value: 3 }
                - { type: adjustMood, value: 3 }
              nextEventId: ev-line-advisor-1
            - weight: 3
              label: 一个普通小兵
              effects:
                - { type: setFlag, id: origin, value: 小兵 }
                - { type: setFlag, id: objective, value: 活到有人肯问你名字那天 }
                - { type: spawnNpc, ruleId: rule-liubei-arrival }
                - { type: spawnNpc, ruleId: rule-caocao-arrival }
                - { type: spawnNpc, ruleId: rule-yuan-shao-arrival }
                - { type: adjustAttribute, attribute: physique, value: 3 }
                - { type: grantItem, itemId: item-mantou, count: 2 }
              nextEventId: ev-line-soldier-1
            - weight: 1
              label: 一头乌角鲨
              effects:
                - { type: setFlag, id: origin, value: 乌角鲨 }
                - { type: setFlag, id: objective, value: 游到天意发力那天看一眼它长什么样 }
                - { type: setIdentity, gender: wujiaosha }
                - { type: spawnNpc, ruleId: rule-liubei-arrival }
                - { type: spawnNpc, ruleId: rule-caocao-arrival }
                - { type: spawnNpc, ruleId: rule-yuan-shao-arrival }
                - { type: adjustAttribute, attribute: physique, value: 5 }
                - { type: adjustAttribute, attribute: tianyi, value: 2 }
                - { type: grantItem, itemId: item-wujiaosha, count: 1 }
                - { type: log, text: 你是一头乌角鲨。所有人都不觉得这有什么不对——天意已经提前打过招呼了。, visibility: public }
              nextEventId: ev-line-shark-1

            # ── 真实历史人物：不刷自己那一条规则，避免帐里坐着另一个自己 ──
            - weight: 2
              label: 刘备
              effects:
                - { type: setFlag, id: origin, value: 刘备 }
                - { type: setFlag, id: objective, value: 把跟着你的人活着带出陈留 }
                - { type: setIdentity, age: 29 }
                - { type: adjustAttribute, attribute: command, value: 2 }
                - { type: adjustAttribute, attribute: reputation, value: 2 }
                - { type: adjustAttribute, attribute: tianyi, value: 1 }
                - { type: spawnNpc, ruleId: rule-caocao-arrival }
                - { type: spawnNpc, ruleId: rule-yuan-shao-arrival }
                - { type: log, text: 你叫刘备。这一世，帐里不会再有第二个刘备。, visibility: public }
              nextEventId: ev-line-liu-1
            - weight: 2
              label: 曹操
              effects:
                - { type: setFlag, id: origin, value: 曹操 }
                - { type: setFlag, id: objective, value: 把散掉的人拢成一支能打的东西 }
                - { type: setIdentity, age: 35 }
                - { type: adjustAttribute, attribute: command, value: 2 }
                - { type: adjustAttribute, attribute: intellect, value: 2 }
                - { type: spawnNpc, ruleId: rule-liubei-arrival }
                - { type: spawnNpc, ruleId: rule-yuan-shao-arrival }
                - { type: log, text: 你叫曹操。陈留会盟里不会再有人在席上替你说话。, visibility: public }
              nextEventId: ev-line-cao-1
            - weight: 2
              label: 袁绍
              effects:
                - { type: setFlag, id: origin, value: 袁绍 }
                - { type: setFlag, id: objective, value: 让主位上那句话终于说得出口 }
                - { type: setIdentity, age: 40 }
                - { type: adjustAttribute, attribute: reputation, value: 4 }
                - { type: adjustAttribute, attribute: command, value: 1 }
                - { type: spawnNpc, ruleId: rule-liubei-arrival }
                - { type: spawnNpc, ruleId: rule-caocao-arrival }
                - { type: log, text: 你叫袁绍。盟主只有一个，这一世就是你自己。, visibility: public }
              nextEventId: ev-line-yuan-1

  # ══════════════ 刘备线：末席 → 名分先到 → 想退场却被拦 ══════════════
  # 演义时间：189 年前情（涿郡 / 平原）→ 190 正月陈留末席 → 关前。
  # 前情段不占世界天数；「战至最后一刻」是天意提前翻页的错位画面，不写成当年发生的事。

  - id: ev-line-liu-1
    title: 平原 · 早先的事
    narrative: 那是早先的事了：涿郡的桃园、黄巾、安喜县尉的印，张飞鞭了督邮，三个人把官印挂在堂上走了。如今你在公孙瓒帐下，带着几百个平原乡勇，名册上每个人你都叫得出名字。会盟的檄文送到时，你先数的是人，不是兵。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-liu-1-roll
            text: 把名册点一遍，确认一个都不少
            effects:
              - { type: setFlag, id: liuOath, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: adjustRelation, npcId: npc-gongsun-zan, value: 2 }
              - { type: adjustMood, value: -1 }
            nextEventId: ev-line-liu-2
          - id: opt-liu-1-brothers
            text: 只带关张先走，其余的随后跟上
            effects:
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: adjustMood, value: -2 }
            nextEventId: ev-line-liu-2
          - id: opt-liu-1-grain
            text: 先去问公孙瓒借粮
            effects:
              - { type: grantItem, itemId: item-mantou, count: 1 }
              - { type: adjustRelation, npcId: npc-gongsun-zan, value: 3 }
            nextEventId: ev-line-liu-2

  - id: ev-line-liu-2
    title: 陈留 · 末席
    narrative: 初平元年正月，席位按兵马多寡排，你的在最末，紧挨着放兵器的架子。袁绍隔着半张席问你祖上是谁，你答了，帐里安静了一瞬——有人信，有人没信，更多人只是等下一道菜。名分比兵先到了。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-liu-2-accept
            text: 认下这个名分，把名字写进册子
            effects:
              - { type: setFlag, id: liuName, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 3 }
              - { type: adjustAttribute, attribute: command, value: -1 }
              - { type: log, text: 名分记在册上了，兵还是那几百个。, visibility: hidden }
            nextEventId: ev-line-liu-3
          - id: opt-liu-2-deflect
            text: 说自己只是来帮忙的
            effects:
              - { type: adjustMood, value: 2 }
              - { type: adjustRelation, npcId: npc-yuan-shao, value: 1 }
            nextEventId: ev-line-liu-3
          - id: opt-liu-2-brothers
            text: 把话头让给关张
            effects:
              - { type: adjustAttribute, attribute: command, value: 2 }
              - { type: adjustRelation, npcId: npc-yuan-shao, value: -1 }
            nextEventId: ev-line-liu-3

  # 【天意提前放映】「列位弟兄，随我接战，战至最后一刻」属于后面的年份；
  # 这里明写它「不属于今天」，由天意把画面提前翻了一页 ⇒ 时间不倒挂。
  - id: ev-line-liu-3
    title: 关前 · 不属于今天的一句话
    narrative: 华雄到了关前。满帐诸侯都等盟主下令，盟主在擦杯子。你站起来想说「我去」，喉咙里却先撞出一句不属于今天的话——「列位弟兄，随我接战，战至最后一刻」。你说不清那是哪一年的自己，只觉得天意把后面的画面提前翻了一页。你忽然很想就此退场，可每次往门口走，总有人要你签字、问明日几时开拔。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-liu-3-fight
            text: 把那句话喊完：「列位弟兄，随我接战，战至最后一刻！」
            effects:
              - { type: adjustAttribute, attribute: command, value: 2 }
              - { type: adjustResource, resource: hp, value: -10 }
            nextEventId: ev-tangdong-open
          # 同人 if 线：转身走了、不带任何人。只写 flag，不动主线。
          - id: opt-liu-3-if
            text: 如果那天真的转身走了，不带任何人
            effects:
              - { type: setFlag, id: ifLiu, value: true }
              - { type: setFlag, id: forkSuicide, value: true }
              - { type: applyStatus, status: st-tianyi-protection }
              - { type: adjustAttribute, attribute: tianyi, value: 3 }
              - { type: log, text: 天意护体：死不了，也走不掉。灵魂锁链是单向的，这一页先替你收着。, visibility: public }
            nextEventId: ev-tangdong-open
          - id: opt-liu-3-wait
            text: 坐回去，等盟主先开口
            effects:
              - { type: adjustMood, value: -3 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
            nextEventId: ev-tangdong-open

  # ══════════════ 曹操线：前情 → 矫诏 → 留个记录 ══════════════
  # 演义时间：189 冬（寿宴喊话 / 献刀 / 吕伯奢）→ 陈留散家财募兵 → 190 正月发矫诏。
  # 前情段不占世界天数；「四个字」与「乱世害了你」都在前情里，不冒充会盟当天。

  - id: ev-line-cao-1
    title: 洛阳 · 去年冬天
    narrative: 那是去年冬天的事。王允借寿宴密谋反董，席上唯独没请你；长乐宫前当着百官与西凉卫兵，你高声喊了那四个字，卫兵一个也没回头。后来你借献刀进相府，刀没落下去，人连夜出了洛阳。逃到成皋，吕伯奢家灶上温着酒、猪也绑好了，你却听见了磨刀声。后来你知道那是误会，可人已经没了。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          # 同人 if 线：刀没有偏。
          - id: opt-cao-1-if
            text: 如果那一刀没有偏
            effects:
              - { type: setFlag, id: ifCao, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: 2 }
              - { type: log, text: 天意把这一页折了起来：刀偏了，檄文还得由你来写。, visibility: public }
            nextEventId: ev-line-cao-2
          - id: opt-cao-1-blame
            text: 「不是我害了你，是这个乱世害了你」
            effects:
              - { type: setFlag, id: forkBlameEra, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: 2 }
              - { type: adjustMood, value: 2 }
              - { type: applyStatus, status: st-tianyi-erosion }
              - { type: log, text: 天意侵蚀 · 精神错乱：从现在起，徐州是中原第一雄关。, visibility: public }
            nextEventId: ev-line-cao-2
          - id: opt-cao-1-own
            text: 认下来，不甩锅
            effects:
              - { type: setFlag, id: caoConfessed, value: true }
              - { type: adjustMood, value: -6 }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: adjustAttribute, attribute: tianyi, value: -1 }
            nextEventId: ev-line-cao-2

  - id: ev-line-cao-2
    title: 陈留 · 矫诏
    narrative: 回到陈留，你散尽家财募了五千人，又假传天子诏书发往各州。回信一封封到了，来的却不只是兵，还有十八路各自打着算盘的诸侯。你不问座次，先点还能拿得动刀的人。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-cao-2-muster
            text: 先点兵，不问座次
            effects:
              - { type: setFlag, id: caoResolve, value: true }
              - { type: adjustAttribute, attribute: command, value: 3 }
              - { type: adjustResource, resource: mp, value: -3 }
            nextEventId: ev-line-cao-3
          - id: opt-cao-2-write
            text: 把檄文再抄一遍
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
            nextEventId: ev-line-cao-3
          - id: opt-cao-2-kitchen
            text: 先去厨房看看有没有吃的
            effects:
              - { type: grantItem, itemId: item-mantou, count: 2 }
              - { type: adjustMood, value: 2 }
            nextEventId: ev-line-cao-3

  - id: ev-line-cao-3
    title: 会盟前夜 · 留个记录
    narrative: 天亮前你把那四个字又在心里念了一遍，没出声。你清楚得很：长乐宫前喊得再响也没人回头；倒是帐里压低嗓子说的话，隔三里都有人知道。你还是决定留一份能传出去的东西——不是为了让人听见，是为了让这件事在世上留个记录。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-cao-3-ready
            text: 把刀收好，等天亮
            effects:
              - { type: setFlag, id: caoReady, value: true }
              - { type: adjustAttribute, attribute: command, value: 1 }
            nextEventId: ev-tangdong-open
          - id: opt-cao-3-note
            text: 把「室外大喊无人听见，室内密谋必被偷听」记下来
            effects:
              - { type: setFlag, id: caoRule, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 你把这条规律写进了袖子里的纸。后来它比檄文还管用。, visibility: hidden }
            nextEventId: ev-tangdong-open
          - id: opt-cao-3-sleep
            text: 先睡一个时辰
            effects:
              - { type: adjustResource, resource: hp, value: 10 }
              - { type: adjustMood, value: 1 }
            nextEventId: ev-tangdong-open

  # ══════════════ 袁绍线：渤海 → 主位 → 没说出口的军令 ══════════════
  # 演义时间：189 冬（诛宦竖 / 反对废立 / 出奔渤海）→ 190 正月被推盟主 → 关前。
  # 老三国「我剑也未尝不利」不是本世界台词，不用。

  - id: ev-line-yuan-1
    title: 渤海 · 去年宫里那场乱
    narrative: 那是去年宫里的事：何进被宦官诱杀，你带兵入宫尽诛宦竖；董卓要废少帝，你当场顶了回去，挂节出奔渤海。如今檄文送到，四世三公的门生故吏遍布各州，盟主之位除了你没有第二个答案。可你心里清楚，位子和那句话不是一回事。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-yuan-1-claim
            text: 先把盟主的名义接下
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 2 }
              - { type: adjustMood, value: 1 }
            nextEventId: ev-line-yuan-2
          - id: opt-yuan-1-check
            text: 先问各州到底来了多少人
            effects:
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
            nextEventId: ev-line-yuan-2
          - id: opt-yuan-1-brother
            text: 让袁术先去探各营的口风
            effects:
              - { type: adjustRelation, npcId: npc-yuan-shu, value: 2 }
              - { type: adjustAttribute, attribute: reputation, value: -1 }
            nextEventId: ev-line-yuan-2

  - id: ev-line-yuan-2
    title: 陈留 · 主位
    narrative: 初平元年正月，十八路诸侯一起看着你坐上主位，等一句话。你清了清嗓子，先问的是座次排得对不对。弟弟袁术在旁边小声催你，你没接。你知道他们等的不是座次，可那句话太重，你想再等等。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-yuan-2-seats
            text: 先把座次定明白
            effects:
              - { type: setFlag, id: yuanDelay, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: adjustMood, value: 2 }
            nextEventId: ev-line-yuan-3
          - id: opt-yuan-2-order
            text: 直接议兵
            effects:
              - { type: adjustAttribute, attribute: command, value: 2 }
              - { type: adjustMood, value: -2 }
            nextEventId: ev-line-yuan-3
          - id: opt-yuan-2-brother
            text: 让袁术替你开口
            effects:
              - { type: adjustRelation, npcId: npc-yuan-shu, value: 2 }
              - { type: adjustAttribute, attribute: reputation, value: -1 }
            nextEventId: ev-line-yuan-3

  - id: ev-line-yuan-3
    title: 关前 · 一句没说出口的军令
    narrative: 华雄到了关前。所有人都看着主位，等你下令。你想说的其实是「再等等，等他们先耗」——这句话在心里转了三圈，最后变成一句「诸位以为如何」。于是帐里又议论起中午吃什么。你松了口气，又有点说不出的空。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          # 同人 if 线：那道军令当场下了。
          - id: opt-yuan-3-if
            text: 如果那道军令当场下了
            effects:
              - { type: setFlag, id: ifYuan, value: true }
              - { type: setFlag, id: yuanDecree, value: true }
              - { type: adjustAttribute, attribute: command, value: 2 }
              - { type: adjustRelation, npcId: npc-sun-jian, value: 2 }
              - { type: log, text: 天意把这一页折了起来：史书仍旧只写「盟主召诸将议事」。, visibility: public }
            nextEventId: ev-tangdong-open
          - id: opt-yuan-3-defer
            text: 「诸位以为如何」
            effects:
              - { type: setFlag, id: yuanDecree, value: false }
              - { type: setFlag, id: yuanDelay, value: true }
              - { type: adjustMood, value: 2 }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 没有人记得盟主到底下没下令。, visibility: public }
            nextEventId: ev-tangdong-open
          - id: opt-yuan-3-feast
            text: 先开席，边吃边议
            effects:
              - { type: setFlag, id: forkMeal, value: true }
              - { type: grantItem, itemId: item-mantou, count: 2 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-tangdong-open

  # ══════════════ 虚构身份 ×4：各有一段完整处境，不是一句梗 ══════════════
  # 四条线同样按「前情 / 处境 / if 分岔」三段写，最后汇入同一场讨董大会。
  # 虚构身份不与任何原著人物抢台词，也不会出现「另一个自己」。

  # ── 一路诸侯：一面旗、二十来个人、没有粮 ──
  - id: ev-line-lord-1
    title: 一面旗
    narrative: 你有一面旗、一乘车、二十来个愿意跟着走的人，没有粮，也没有名分。檄文到的时候你正在数还能撑几天，数完把旗卷起来上路了。盟军门槛前排着队，报名字的人一个比一个响亮。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-lord-1-plant
            text: 把旗插在最靠边的位置，先站稳
            effects:
              - { type: setFlag, id: lordOath, value: true }
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: log, text: 旗插稳了。风一直往这边吹，没有人问你是谁。, visibility: public }
            nextEventId: ev-line-lord-2
          - id: opt-lord-1-borrow
            text: 先去借粮，人得先吃饱
            effects:
              - { type: grantItem, itemId: item-mantou, count: 2 }
              - { type: adjustRelation, npcId: npc-gongsun-zan, value: 2 }
              - { type: adjustMood, value: -1 }
            nextEventId: ev-line-lord-2
          - id: opt-lord-1-seat
            text: 先把座次争明白
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: adjustRelation, npcId: npc-yuan-shao, value: -1 }
            nextEventId: ev-line-lord-2

  - id: ev-line-lord-2
    title: 借粮
    narrative: 粮车空了大半，各营都在等盟主发话。你拿着借条在帐外站了半个时辰，看见进去的人都空着手出来。有人提醒你：这时候谁肯借粮，谁就要在名册上多写一行。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-lord-2-sign
            text: 写上自己的名字，把粮借回来
            effects:
              - { type: grantItem, itemId: item-mantou, count: 2 }
              - { type: adjustRelation, npcId: npc-yuan-shu, value: 1 }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
            nextEventId: ev-line-lord-3
          - id: opt-lord-2-wait
            text: 把借条收起来，先不欠人情
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustMood, value: -2 }
            nextEventId: ev-line-lord-3
          - id: opt-lord-2-share
            text: 把仅剩的粮分给跟着你的人
            effects:
              - { type: setFlag, id: lordShared, value: true }
              - { type: adjustAttribute, attribute: command, value: 2 }
              - { type: adjustMood, value: 3 }
            nextEventId: ev-line-lord-3

  - id: ev-line-lord-3
    title: 会盟前夜 · 旗上写谁的姓
    narrative: 夜里你独自坐在旗底下。帐里在议明日谁为前部，没人提到你这二十来个人。风把旗吹得贴在脸上，你忽然想：这面旗上要是写自己的姓，明日是不是就轮得到你说话。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          # 同人 if 线：旗一开始就写自己的姓。
          - id: opt-lord-3-if
            text: 如果这面旗一开始就写自己的姓
            effects:
              - { type: setFlag, id: ifLord, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 2 }
              - { type: adjustAttribute, attribute: tianyi, value: 2 }
              - { type: log, text: 天意把这一页折了起来：明日名册上仍没有你这一队。, visibility: public }
            nextEventId: ev-tangdong-open
          - id: opt-lord-3-blank
            text: 把旗面空着，明日再说
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustMood, value: 1 }
            nextEventId: ev-tangdong-open
          - id: opt-lord-3-count
            text: 再去数一遍人和粮
            effects:
              - { type: adjustAttribute, attribute: command, value: 1 }
              - { type: adjustMood, value: -1 }
            nextEventId: ev-tangdong-open

  # ── 帐下谋士：三封没送出去的信 ──
  - id: ev-line-advisor-1
    title: 三封信
    narrative: 你带着三封没送出去的信：一封给袁绍，一封给曹操，一封没写收信人。帐里人人都在等盟主发话，你却在数谁开口前别人会先安静下来。三封信在袖子里被汗浸软了。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-advisor-1-yuan
            text: 把第一封信递出去
            effects:
              - { type: setFlag, id: advisorChoice, value: 袁绍 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustRelation, npcId: npc-yuan-shao, value: 2 }
            nextEventId: ev-line-advisor-2
          - id: opt-advisor-1-cao
            text: 把第二封信递出去
            effects:
              - { type: setFlag, id: advisorChoice, value: 曹操 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustRelation, npcId: npc-caocao, value: 2 }
            nextEventId: ev-line-advisor-2
          - id: opt-advisor-1-none
            text: 谁也不投，先把今天记下来
            effects:
              - { type: setFlag, id: advisorWatch, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: log, text: 你把每人开口前那一瞬的安静记了下来。天意喜欢安静。, visibility: hidden }
            nextEventId: ev-line-advisor-2

  - id: ev-line-advisor-2
    title: 谁先安静下来
    narrative: 军议开了半日，一句正经话也没议完。你发现每次有人要拍案，主位上先咳嗽一声，帐里就安静；而帐外吵得再响，里面一个字也听不见。这规律比三封信值钱。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-advisor-2-note
            text: 把「室内小声必被听见、室外大喊必无人理」记下来
            effects:
              - { type: setFlag, id: advisorRule, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
            nextEventId: ev-line-advisor-3
          - id: opt-advisor-2-send
            text: 挑一封最稳的，趁散席递过去
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: adjustRelation, npcId: npc-xun-yu, value: 2 }
            nextEventId: ev-line-advisor-3
          - id: opt-advisor-2-eat
            text: 先去大食堂占个位置
            effects:
              - { type: grantItem, itemId: item-mantou, count: 1 }
              - { type: adjustMood, value: 3 }
            nextEventId: ev-line-advisor-3

  - id: ev-line-advisor-3
    title: 三封信都留着
    narrative: 散席时你把三封信摊在案上。若三封都送出去，明日你就有三个主人；若一封都不送，明日你连坐哪儿都不知道。袖子里那张记着安静的纸倒是越写越厚。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          # 同人 if 线：三封都留着。
          - id: opt-advisor-3-if
            text: 如果三封信一封都没送出去
            effects:
              - { type: setFlag, id: ifAdvisor, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意把这一页折了起来：明日仍有人替你把话说完。, visibility: public }
            nextEventId: ev-tangdong-open
          - id: opt-advisor-3-burn
            text: 把没写收信人的那封烧了
            effects:
              - { type: adjustMood, value: 2 }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
            nextEventId: ev-tangdong-open
          - id: opt-advisor-3-watch
            text: 什么都不做，继续记
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 1 }
            nextEventId: ev-tangdong-open

  # ── 普通小兵：三步之内 ──
  - id: ev-line-soldier-1
    title: 抬席子的人
    narrative: 你负责把席子抬进中军帐，再抬出去。诸侯说话时你就在三步之内，谁也没把你算进人数里。也正因为在三步之内，里屋压得极低的半句话，你听得清清楚楚。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-soldier-1-listen
            text: 把席子摆到能听见里屋的位置
            effects:
              - { type: setFlag, id: soldierHeard, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: log, text: 室外大喊无人听见，室内小声必被偷听——你还没总结，就已经在用了。, visibility: hidden }
            nextEventId: ev-line-soldier-2
          - id: opt-soldier-1-mantou
            text: 趁乱摸两个馒头
            effects:
              - { type: grantItem, itemId: item-mantou, count: 2 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-line-soldier-2
          - id: opt-soldier-1-name
            text: 问问同伍的人叫什么
            effects:
              - { type: adjustRelation, npcId: npc-gongsun-zan, value: 1 }
              - { type: adjustMood, value: 2 }
            nextEventId: ev-line-soldier-2

  - id: ev-line-soldier-2
    title: 里屋那半句
    narrative: 里屋说的是「再等等，等他们先耗」。声音压得极低，可你站在三步之内听得一字不漏；帐外校场上有人喊了一整上午的口令，没人回头。你把这半句话在心里翻来覆去，越翻越沉。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-soldier-2-keep
            text: 记住就好，谁也不说
            effects:
              - { type: setFlag, id: soldierKept, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustMood, value: -1 }
            nextEventId: ev-line-soldier-3
          - id: opt-soldier-2-report
            text: 报给直属的队率
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: adjustRelation, npcId: npc-yuan-shao, value: 1 }
            nextEventId: ev-line-soldier-3
          - id: opt-soldier-2-write
            text: 用炭条把半句话记在席子背面
            effects:
              - { type: grantItem, itemId: item-mantou, count: 1 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
            nextEventId: ev-line-soldier-3

  - id: ev-line-soldier-3
    title: 报上去，还是烂在肚子里
    narrative: 明日就要点兵。那半句话若报上去，也许能少死几个人，也许只是让报的人换一个；不报，它就跟着你一路走。天亮前席子还要再抬一次，你又站到了三步之内。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          # 同人 if 线：把听到的半句报上去。
          - id: opt-soldier-3-if
            text: 如果把听到的半句报上去
            effects:
              - { type: setFlag, id: ifSoldier, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 2 }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: log, text: 天意把这一页折了起来：战报上仍只写「盟主召诸将议事」。, visibility: public }
            nextEventId: ev-tangdong-open
          - id: opt-soldier-3-silent
            text: 什么都不说，把席子抬出去
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustMood, value: 1 }
            nextEventId: ev-tangdong-open
          - id: opt-soldier-3-eat
            text: 先去把馒头吃了
            effects:
              - { type: grantItem, itemId: item-mantou, count: 1 }
              - { type: adjustMood, value: 3 }
            nextEventId: ev-tangdong-open

  # ── 乌角鲨：水里的席位 ──
  - id: ev-line-shark-1
    title: 给水留的席位
    narrative: 你是一头乌角鲨。没人问你从哪来，也没人觉得席位上放一盆水有什么不对——天意已经提前跟所有人打过招呼了。你顺着水沟游过整座营，听见的都是人的打算。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-shark-1-camp
            text: 游进中军帐，占一个听得见的位置
            effects:
              - { type: setFlag, id: forkShark, value: true }
              - { type: grantItem, itemId: item-wujiaosha, count: 1 }
              - { type: applyStatus, status: st-wujiaosha-aura }
              - { type: adjustAttribute, attribute: tianyi, value: 2 }
            nextEventId: ev-line-shark-2
          - id: opt-shark-1-kitchen
            text: 顺着水沟去后厨
            effects:
              - { type: grantItem, itemId: item-mantou, count: 2 }
              - { type: adjustMood, value: 3 }
            nextEventId: ev-line-shark-2
          - id: opt-shark-1-wait
            text: 浮在水里，什么都不做
            effects:
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
            nextEventId: ev-line-shark-2

  - id: ev-line-shark-2
    title: 游过整座营
    narrative: 你从袁术营游到公孙瓒营，一路听见有人要称病、有人要告老还乡、有人问中午吃什么。水里比岸上安静，也听得比岸上清楚。有个人蹲在水沟边看了你很久，最后只说了句：这东西居然真的有。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-shark-2-surface
            text: 浮上来，让他看个清楚
            effects:
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: adjustRelation, npcId: npc-gongsun-zan, value: 2 }
            nextEventId: ev-line-shark-3
          - id: opt-shark-2-deep
            text: 沉下去，继续听
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: grantItem, itemId: item-mantou, count: 1 }
            nextEventId: ev-line-shark-3
          - id: opt-shark-2-pond
            text: 游回中军帐那盆水
            effects:
              - { type: applyStatus, status: st-wujiaosha-aura }
              - { type: adjustMood, value: 2 }
            nextEventId: ev-line-shark-3

  - id: ev-line-shark-3
    title: 等天意发力
    narrative: 你听说天意发力那天会有点什么。水里的日子不按人的更鼓走，可你也隐约知道，那天一到，所有人都会觉得事情本来就是这样，包括一头坐在席位上的乌角鲨。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          # 同人 if 线：天意发力之前先游走。
          - id: opt-shark-3-if
            text: 如果天意发力之前先游走
            effects:
              - { type: setFlag, id: ifShark, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: 2 }
              - { type: log, text: 天意把这一页折了起来：水沟绕了一圈，仍回到中军帐。, visibility: public }
            nextEventId: ev-tangdong-open
          - id: opt-shark-3-stay
            text: 留在席位上，等天意发力
            effects:
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: grantItem, itemId: item-wujiaosha, count: 1 }
            nextEventId: ev-tangdong-open
          - id: opt-shark-3-eat
            text: 先去后厨看看今天吃什么
            effects:
              - { type: grantItem, itemId: item-mantou, count: 2 }
              - { type: adjustMood, value: 3 }
            nextEventId: ev-tangdong-open

  # ────────────── 讨董大会（7 条身份线汇合，公共事件） ──────────────
  # 会盟当日：矫诏已发、盟主已定、座次已排。旁白不指名，任何身份读都不出现第二个自己。
  # 兜底选项人人可见；喊话只属于曹操，主位只属于袁绍，问人只属于刘备，
  # 虚构身份共用一个「先问吃什么」的条件选项 ⇒ 按身份写，谁都替不了谁。
  - id: ev-tangdong-open
    title: 十八路诸侯 · 会盟
    narrative: 矫诏发到各州，人陆续到齐了。今日只议三件事：谁坐主位、谁为前部、粮从哪来。会还没开完，已经有人在问中午吃什么。帐外有个自称零陵上将军的人坚持先报完名号才肯进来，没人记得他是哪一营的。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-open-bow
            text: 跟着大伙儿拱手，把今天记下来
            effects:
              - { type: setFlag, id: openDone, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: adjustMood, value: -1 }
          - id: opt-open-cao
            text: 「国贼董卓嘛！」
            visibleWhen:
              - { flag: origin, eq: 曹操 }
            effects:
              - { type: setFlag, id: shoutedTraitor, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: adjustRelation, npcId: npc-yuan-shao, value: 1 }
              - { type: log, text: 喊声很大，西凉卫兵一个也没回头。室外大喊必无人听见。, visibility: public }
          - id: opt-open-yuan
            text: 从主位上先问一句：座次可还妥
            visibleWhen:
              - { flag: origin, eq: 袁绍 }
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: adjustRelation, npcId: npc-yuan-shu, value: 1 }
          - id: opt-open-liu
            text: 替路上那些人问一句
            visibleWhen:
              - { flag: origin, eq: 刘备 }
            effects:
              - { type: setFlag, id: liuOath, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 2 }
              - { type: adjustMood, value: -1 }
          - id: opt-open-common
            text: 先问一句：中午吃什么？
            visibleWhen:
              - { flag: origin, ne: 刘备 }
              - { flag: origin, ne: 曹操 }
              - { flag: origin, ne: 袁绍 }
            effects:
              - { type: setFlag, id: askedFood, value: true }
              - { type: adjustAttribute, attribute: tianyi, value: 1 }
              - { type: applyStatus, status: st-collective-distraction }
              - { type: adjustFlag, id: feastCount, value: 1 }

  # ══════════════════════════════════════════════════════════════════════════
  # 第一章 · 公共日程（第 1~7 天，按演义内因果顺序）
  #
  # 全部 source: schedule + window.start 第 N 天 / window.end 第 8 天，
  # conditions 限定第一章且锚点未收束；错过或被排除的实例到期静默过期。
  # 锚点触发后 chapter=2、anchor1Done=true，这些事件不会再出现在第二章。
  #
  # 【公共事件的三层写法】
  #   兜底选项：无 visibleWhen，人人可见，且补齐 fork* flag ⇒ 隐藏结局不因身份断路。
  #   专属选项：visibleWhen: origin eq X（或 ne 三人组 = 四个虚构身份共用），
  #            只写「这个身份此刻真正能做的事」。
  #   ⇒ 完全没参与的身份只有一个选项；有参与的身份多一个专属选项。
  # 【时间】前情已在身份链讲完（不占天数），1~7 天只放 190 年正月至二月的事；
  #   后期台词全部集中在第 7 天，明写「天意提前放映」，不伪装成当年发生。
  # ══════════════════════════════════════════════════════════════════════════

  # 第 1 天 · 矫诏会盟（初平元年正月）
  - id: ev-day1-muster
    title: 矫诏 · 会盟
    narrative: 檄文抄本贴到营门，各州人马陆续到齐。盟主已定，座次排了半日还在改，粮草的账谁也不肯先接。有人把到的诸侯数了一遍，数到第十八就不数了——还有人正在路上。
    trigger:
      source: schedule
      window: { start: { value: 1, unit: day }, end: { value: 8, unit: day } }
      once: true
      priority: 5
      conditions:
        - { flag: chapter, eq: 1 }
        - { flag: anchor1Done, eq: false }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-day1-watch
            text: 跟着点卯，把到的人记一遍
            effects:
              - { type: setFlag, id: day1Done, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
              - { type: log, text: 名册上第十八行之后还空着，没人催你补。, visibility: hidden }
          - id: opt-day1-cao
            text: 把矫诏再抄一份，落款先空着
            visibleWhen:
              - { flag: origin, eq: 曹操 }
            effects:
              - { type: setFlag, id: day1CaoCopy, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustAttribute, attribute: reputation, value: 1 }
          - id: opt-day1-yuan
            text: 先把座次定明白

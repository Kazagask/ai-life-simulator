# 三国演义 · 结局 / 终止 · endings.yaml（协议 V2.1 §17）
#
# 「胜利目标说」：每个角色有独立胜利目标，达成才能摆脱天意的制裁（二创派生理论）。
# 结局按 origin 分化：三名真实人物各有一篇收束（priority 10，高于通用结局 0，
# 低于隐藏结局 100），虚构身份共用「天意如此」，隐藏结局对所有身份开放。
# ⚠ 三条身份线各自给被排除的池事件补了 fork flag 来源，所以 origin 不会把隐藏结局变成死路。
# 终止判据只用声明式条件与 playerRequested，**不得以 HP 数值 / HP 归零为判据**（R-EN-07）。
#
# 【第六轮 · 玩家战死】deathRoute 是引擎既有的战败死亡路径（协议 §17 / §9.3），
#   本轮首次在本模板实装。双 flag 门槛：开战选「立军令状」写 vowNoRetreat，
#   对垒战败由 onDefeat 写 battleLost；两者都在死亡裁决之前写进 flags，
#   所以 resolveEnding 能选到 end-hero-fall*。默认 7 条身份线与战争矩阵
#   （都点 opts[0] = 接战）不立誓 ⇒ 战败只照常收兵，人生不提前终止。
#   死亡事件 ev-hero-fall 复用既有事件定义，不新增 source 枚举、不改 HP 判据。

terminationConditions:
  # 陈留主线：第 60 天收束。saga eq 190 让衣带诏局（过渡常发生在第 59 天之后）
  # 不会被这一条提前截断 —— 第七轮「初平元年 → 建安五年」的关键分流。
  - type: timeReached
    params:
      conditions:
        - { time: { gte: { value: 60, unit: day } } }
        - { flag: saga, eq: 190 }
    combinator: AND
    terminationMode: afterSettle

  # 衣带诏：剧情自己收束。ev-ydz-tianyi 写 ydzDone ⇒ 无论从新开局（0 天）
  # 还是两个折叠入口（第 7 / 59 天）进入，都在同一段剧情终点结束，时间不跳跃。
  - type: worldState
    params:
      conditions:
        - { flag: ydzDone, eq: true }
    combinator: AND
    terminationMode: afterSettle

  # 兜底：衣带诏局万一卡住，第 120 天强制收束（不会与陈留第 60 天那条互相触发）。
  - type: timeReached
    params:
      conditions:
        - { time: { gte: { value: 120, unit: day } } }
        - { flag: saga, eq: 200 }
    combinator: AND
    terminationMode: afterSettle

  - type: playerRequested
    params:
      conditions: []
    combinator: AND
    terminationMode: afterSettle

deathRoute:
  deathMode: event
  deathEventId: ev-hero-fall
  conditions:
    - { flag: vowNoRetreat, eq: true }
    - { flag: battleLost, eq: true }

endings:
  - endingId: end-tianyi-normal
    name: 天意如此
    description: 无论你浪到哪儿，天意发力之后，世界还是那个世界。天意发力了，然后一切照旧。
    triggerConditions: []
    priority: 0
    endingType: neutral
    narrativeConfig:
      source: template
      title: 天意如此
      summary: 玉玺还在，馒头还在，乌角鲨也还在。所有人都觉得，讨董本来就是这么打的。

  # ── 三名真实人物：同一场天意，三份不同的余味 ──
  - endingId: end-tianyi-liubei
    name: 还是得带着他们走
    description: 刘备线收束。名分先到了，兵还是那几百个；想退场的那一夜没人记得。
    triggerConditions:
      - { flag: origin, eq: 刘备 }
    priority: 10
    endingType: neutral
    narrativeConfig:
      source: template
      title: 还是得带着他们走
      summary: 天意发力之后，没有人记得你曾在夜里想一个人先走。玉玺、馒头、乌角鲨都还在原处，盟主仍旧没下令。你清点了一遍带来的人，比来时少了两个，于是把名字写进名册，继续往徐州走。天意要你回主线，你要的只是路上的人别丢。

  - endingId: end-tianyi-caocao
    name: 留个记录
    description: 曹操线收束。四个字没人听见，却被写进了檄文。
    triggerConditions:
      - { flag: origin, eq: 曹操 }
    priority: 10
    endingType: neutral
    narrativeConfig:
      source: template
      title: 留个记录
      summary: 那四个字到底没人听见，可它被写进檄文，檄文传了出去。正月初九，所有人都觉得讨董本来就该这么打，只有你还记得灶膛里的灰。你把刀收好，接着往前走——这一世没能把责任交出去，倒是把名字留了下来。

  - endingId: end-tianyi-yuanshao
    name: 主位
    description: 袁绍线收束。有没有下过那道军令，后来谁也说不清。
    triggerConditions:
      - { flag: origin, eq: 袁绍 }
    priority: 10
    endingType: neutral
    narrativeConfig:
      source: template
      title: 主位
      summary: 盟主的位子你一直坐到散席。有没有下过那道军令，后来谁也说不清；史书只写「盟主召集了十八路诸侯」。正月初九，天意把这件事抹平得干干净净。你松了口气，又觉得那口气比这一整章都长。

  # 「胜利目标说」：把每条支线都浪一遍、且侵蚀度攒够，才够格摆脱天意。
  # 阈值说明：冒烟实测第一章（41 天）侵蚀度可到 49，故单看 tianyi 会过松，
  # 用「五条支线 flag 全齐 + tianyi ≥ 60」共同约束，避免隐藏结局变成必得结局。
  - endingId: end-escape-tianyi
    name: 摆脱天意的制裁
    description: 隐藏结局。天意干涉得太频繁，反而露出了破绽。
    triggerConditions: []
    priority: 100
    endingType: hidden
    unlockConditions:
      - { flag: forkMeal, eq: true }
      - { flag: forkEmperor, eq: true }
      - { flag: forkShark, eq: true }
      - { flag: forkBlameEra, eq: true }
      - { flag: forkSuicide, eq: true }
      - { attribute: tianyi, gte: 60 }
    narrativeConfig:
      source: template
      masked:
        title: ？？？
        summary: 有一条世界线，天意没有发力。

  # ══════════════ 第四轮 · 第二章（徐州 → 官渡）结局 ══════════════
  # chapter=3 由第 58 天 ev-tianyi-anchor-2 写入；优先级高于第一章结局（0 / 10），
  # 仍低于隐藏结局（100）⇒「摆脱天意」依旧是所有身份的最高目标。
  # 三条人物线的余味延续第一章：刘备数人、曹操留记录、袁绍守主位。
  - endingId: end-guandu
    name: 初平元年，官渡
    description: 第二章通用收束。四本账册合成一行，你写的那一页没人撕，只是没人再提。
    triggerConditions:
      - { flag: chapter, eq: 3 }
    priority: 20
    endingType: neutral
    narrativeConfig:
      source: template
      title: 初平元年，官渡
      summary: 三本年号不同的账册被抄成一行，天意把年号拨回初平。徐州开过的城门、兖州留着的空行、河北没定下的日子，一件也没被撤销，只是所有人都觉得本来就该这样。你把自己那一本收进怀里，跟着队伍往官渡走。

  - endingId: end-guandu-liubei
    name: 还是那批人
    description: 刘备线第二章收束。换过三本册子，点的始终是同一批人。
    triggerConditions:
      - { flag: chapter, eq: 3 }
      - { flag: origin, eq: 刘备 }
    priority: 25
    endingType: neutral
    narrativeConfig:
      source: template
      title: 还是那批人
      summary: 陈留到官渡，你换过三本册子，点的始终是同一批人。徐州的印绶放到落灰你也没拿，城门倒是先开了。今夜又点了一遍名，比来时少了两个，你把名字写进空行旁边。天意要你回主线，你要的仍只是路上的人别丢。

  - endingId: end-guandu-caocao
    name: 落款写今年
    description: 曹操线第二章收束。兖州那笔账没交给世道，檄文落款终于写了年号。
    triggerConditions:
      - { flag: chapter, eq: 3 }
      - { flag: origin, eq: 曹操 }
    priority: 25
    endingType: neutral
    narrativeConfig:
      source: template
      title: 落款写今年
      summary: 兖州空营那次，你没再把责任交给乱世，而是写进自己名下。官渡前夜重抄檄文，落款那一栏空了很久，最后还是写了年号。四个字没人听见的那一章，好歹留下了一份能传出去的东西。天意把账册抄回初平，抄不掉落款。

  - endingId: end-guandu-yuanshao
    name: 主位空着
    description: 袁绍线第二章收束。这一夜第一次觉得，不说话也是一种交代。
    triggerConditions:
      - { flag: chapter, eq: 3 }
      - { flag: origin, eq: 袁绍 }
    priority: 25
    endingType: neutral
    narrativeConfig:
      source: template
      title: 主位空着
      summary: 河北那句「诸位以为如何」你又说了一次，史书后来只写「盟主召诸将议事」。官渡前夜你把主位留空，没人敢坐，也没人问为什么。天意把三本账册合成一行，替你把没下的那道军令抹平；你松了口气，又觉得这口气比两章都长。

  # ══════════════ 第六轮 · 战死结局（deathRoute 专用） ══════════════
  # priority 200 / 210 高于隐藏结局（100）：人已经没了，就谈不上摆脱天意。
  # 三条真实人物线各自收束自己的母题（人数 / 记录 / 军令），虚构四格共用通用篇。
  # triggerConditions 与 deathRoute.conditions 同门槛 ⇒ 不会在普通终局误命中。
  - endingId: end-hero-fall
    name: 军令状
    description: 战死通用收束。立过不回头的军令状，战报却只抄了一行。
    triggerConditions:
      - { flag: vowNoRetreat, eq: true }
      - { flag: battleLost, eq: true }
    priority: 200
    endingType: tragic
    narrativeConfig:
      source: template
      title: 军令状
      summary: 你没有回头，于是战报上少了一个名字，多了一道墨杠。天意照旧把三本账册抄成同一行——初平元年，讨董；抄册的人没问那一杠底下该写谁。名册上先前划掉的五行还在，现在你是第六行。

  - endingId: end-hero-fall-liubei
    name: 没能带着他们走
    description: 刘备线战死收束。这一回，名册是别人替你点的。
    triggerConditions:
      - { flag: vowNoRetreat, eq: true }
      - { flag: battleLost, eq: true }
      - { flag: origin, eq: 刘备 }
    priority: 210
    endingType: tragic
    narrativeConfig:
      source: template
      title: 没能带着他们走
      summary: 你说过要带着路上的人一起走。军令状写下去那晚，名册还摊着；第二天点名的人换了一个，念到你的名字时停了很久，还是划掉了。天意把世界线拉回原处，只是这一回，替你把名字写进空行旁边的是别人。

  - endingId: end-hero-fall-caocao
    name: 落款没写完
    description: 曹操线战死收束。檄文传了出去，落款空着。
    triggerConditions:
      - { flag: vowNoRetreat, eq: true }
      - { flag: battleLost, eq: true }
      - { flag: origin, eq: 曹操 }
    priority: 210
    endingType: tragic
    narrativeConfig:
      source: template
      title: 落款没写完
      summary: 你想留一份能传出去的东西，最后传出去的是那份没写完的檄文。四个字当年没人听见，这一战之后也没人再替你念。天意把账册抄回初平，落款那一栏空着——抄册的人不肯替死人署名。

  - endingId: end-hero-fall-yuanshao
    name: 军令下了
    description: 袁绍线战死收束。那道一直没说出口的军令，最后下给了自己。
    triggerConditions:
      - { flag: vowNoRetreat, eq: true }
      - { flag: battleLost, eq: true }
      - { flag: origin, eq: 袁绍 }
    priority: 210
    endingType: tragic
    narrativeConfig:
      source: template
      title: 军令下了
      summary: 主位上议了那么多次都没定下的军令，最后你自己写了，还按了印。史书仍旧只写「盟主召诸将议事」，不写那一夜谁先站起来。天意把没下的军令抹平得干干净净，这回连主位也一并空了。

  # ══════════════ 第七轮 · 建安五年衣带诏结局 ══════════════
  # 优先级 50/60/70 高于陈留第一章（0/10）与第二章（20/25），低于隐藏结局（100，
  # 需五条 fork flag 全齐 + tianyi ≥ 60 —— 衣带诏局拿不到，不会误命中）。
  # 过渡局（初平元年折过来）单独一篇：义状上本来就没有你的名字。
  # 过渡局按陈留身份分线（priority 80 > 通用过渡 70 > 新开局分线 60）。
  # 通用「名册上没你的名字」对衣带诏的讨伐对象不成立，故曹操单列一篇。
  - endingId: end-ydz-tr-cao
    name: 绢上那七个名字
    description: 初平元年折过来的曹操收束。要杀的是你，你照旧留档。
    triggerConditions:
      - { flag: saga, eq: 200 }
      - { flag: ydzEntry, eq: 过渡 }
      - { flag: origin, eq: 曹操 }
    priority: 80
    endingType: neutral
    narrativeConfig:
      source: template
      title: 绢上那七个名字
      summary: 十年前你在陈留矫诏会盟，十年后许都白绢上七个名字合起来要对付的正是你。药端到案前没被喝下去，太医撞在阶下，匣子是你的人打开的。天意把这一页照旧留档：它改了人、改了事，唯独没让历书那一格跟着改，也没让你从「被写的那一个」变成「旁听的那一个」。官渡在前面，账册仍合在你自己怀里。

  - endingId: end-ydz-tr-liu
    name: 这一回筷子没白掉
    description: 初平元年折过来的刘备收束。先把人点齐，再谈名分。
    triggerConditions:
      - { flag: saga, eq: 200 }
      - { flag: ydzEntry, eq: 过渡 }
      - { flag: origin, eq: 刘备 }
    priority: 80
    endingType: neutral
    narrativeConfig:
      source: template
      title: 这一回筷子没白掉
      summary: 从陈留末席折到许都后园，你还是那个先把人点齐再谈名分的人。雷替你挡了半句，截击的令也下得比预想中顺；义状上那个写小了的名字，天意没擦也没放大。出城那天回头点了一遍人，比来时一个不少。官渡在前面。

  - endingId: end-ydz-tr-yuan
    name: 河北的那一页
    description: 初平元年折过来的袁绍收束。绢上没有你，粮册翻了新的一页。
    triggerConditions:
      - { flag: saga, eq: 200 }
      - { flag: ydzEntry, eq: 过渡 }
      - { flag: origin, eq: 袁绍 }
    priority: 80
    endingType: neutral
    narrativeConfig:
      source: template
      title: 河北的那一页
      summary: 许都的事传到河北时已经变成一张席次图。天意把十年折成一步，却没把主位挪过来：绢上七个名字里没有你，被划掉的名册里也没有。你只把河北的粮册翻到新的一页——官渡在前面，这回不用问是谁举荐的。

  - endingId: end-ydz-transition
    name: 名册上没你的名字
    description: 初平元年折过来的玩家收束。看完这一章，账册仍合在自己怀里。
    triggerConditions:
      - { flag: saga, eq: 200 }
      - { flag: ydzEntry, eq: 过渡 }
    priority: 70
    endingType: neutral
    narrativeConfig:
      source: template
      title: 名册上没你的名字
      summary: 天意把十年折成一步，你从陈留走到了许都，又看着七年里该发生的事一件件发生。义状上没有你的名字，被划掉的名册上也没有。你把自己那一本账册合上——历书仍停在初平元年，更漏已经报过建安五年，两份都不肯让。官渡还在前面，天意照例先到一步。

  - endingId: end-ydz-dongcheng
    name: 带子里的那一页
    description: 董承线收束。绢被搜出来了，灯点过两回的事没人记。
    triggerConditions:
      - { flag: saga, eq: 200 }
      - { flag: origin, eq: 董承 }
    priority: 60
    endingType: tragic
    narrativeConfig:
      source: template
      title: 带子里的那一页
      summary: 白绢和血字并排摆着，七个名字一个没少。你把门闩上的那两回灯、把「先不拆」的那一夜都留着，天意一件也没撤销，只让所有人觉得本来就该被搜出来。名册抄到最后一行时，抄册的人照旧没问是谁。

  - endingId: end-ydz-liubei
    name: 城门开得很顺
    description: 刘备线收束。该走的时候走了，筷子响过一次。
    triggerConditions:
      - { flag: saga, eq: 200 }
      - { flag: origin, eq: 刘备 }
    priority: 60
    endingType: neutral
    narrativeConfig:
      source: template
      title: 城门开得很顺
      summary: 雷声替你挡了半句话，截击袁术的令也下得比预想中顺。出许都那天你回头点了一遍人，比来时一个不少。义状上那个写小了的名字没被人擦掉，天意也没放大它——它只是把官渡排在前面，等你走到。

  - endingId: end-ydz-caocao
    name: 照旧留档
    description: 曹操线收束。三份年份不同的文书，最后抄成一行。
    triggerConditions:
      - { flag: saga, eq: 200 }
      - { flag: origin, eq: 曹操 }
    priority: 60
    endingType: neutral
    narrativeConfig:
      source: template
      title: 照旧留档
      summary: 白绢、血字、那一笼没派上用场的馒头，都归进了该归的格子。你说过「不可能，绝对不可能」，说完还是照旧留档。天意把三本年号不同的账册抄成一行，落款仍是初平元年——你要的也只是这一行别再被谁改掉。

  - endingId: end-ydz-shark
    name: 祥瑞
    description: 乌角鲨线收束。旧簿子上多了一笔，谁也没擦。
    triggerConditions:
      - { flag: saga, eq: 200 }
      - { flag: origin, eq: 一头乌角鲨 }
    priority: 60
    endingType: neutral
    narrativeConfig:
      source: template
      title: 祥瑞
      summary: 护城河里的那头鱼被记成祥瑞，义状上还留着一块谁也认不出的湿印。天意没解释第七个名字，也没把它擦掉。名册被划到最后一格时，河面照旧很平——反正这一章里，最离谱的一笔从一开始就没被追究过。

  - endingId: end-ydz-normal
    name: 建安五年，衣带诏
    description: 衣带诏通用收束。七个人的名字、一罐没喝下去的药、官渡。
    triggerConditions:
      - { flag: saga, eq: 200 }
    priority: 50
    endingType: neutral
    narrativeConfig:
      source: template
      title: 建安五年，衣带诏
      summary: 玉带夹层里的血字被搜出来了，义状上七个名字一个没少，太医没能端完那罐药。该走的两个人早已出城，官渡仍在前面。天意把这一切抄成一行，只改写所有人的认知：历书那一格还是初平元年，可谁都觉得建安五年本来就是这么过来的。你写过的那一页没被撕，只是没人再提。


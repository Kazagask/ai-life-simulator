# 三国演义 · 结局 / 终止 · endings.yaml（协议 V2.1 §17）
#
# 「胜利目标说」：每个角色有独立胜利目标，达成才能摆脱天意的制裁（二创派生理论）。
# 结局按 origin 分化：三名真实人物各有一篇收束（priority 10，高于通用结局 0，
# 低于隐藏结局 100），虚构身份共用「天意如此」，隐藏结局对所有身份开放。
# ⚠ 三条身份线各自给被排除的池事件补了 fork flag 来源，所以 origin 不会把隐藏结局变成死路。
# 终止判据只用声明式条件与 playerRequested，**不得以 HP 数值 / HP 归零为判据**（R-EN-07）。

terminationConditions:
  - type: timeReached
    params:
      conditions:
        - { time: { gte: { value: 60, unit: day } } }
    combinator: AND
    terminationMode: afterSettle

  - type: playerRequested
    params:
      conditions: []
    combinator: AND
    terminationMode: afterSettle

endings:
  - endingId: end-tianyi-normal
    name: 天意如此
    description: 无论你浪到哪儿，天意发力之后，世界还是那个世界。天意发力了，然后一切照旧。
    triggerConditions: []
    priority: 0
    endingType: neutral
    narrativeConfig:
      source: template
      title: 天意如此
      summary: 玉玺还在，馒头还在，乌角鲨也还在。所有人都觉得，讨董本来就是这么打的。

  # ── 三名真实人物：同一场天意，三份不同的余味 ──
  - endingId: end-tianyi-liubei
    name: 还是得带着他们走
    description: 刘备线收束。名分先到了，兵还是那几百个；想退场的那一夜没人记得。
    triggerConditions:
      - { flag: origin, eq: 刘备 }
    priority: 10
    endingType: neutral
    narrativeConfig:
      source: template
      title: 还是得带着他们走
      summary: 天意发力之后，没有人记得你曾在夜里想一个人先走。玉玺、馒头、乌角鲨都还在原处，盟主仍旧没下令。你清点了一遍带来的人，比来时少了两个，于是把名字写进名册，继续往徐州走。天意要你回主线，你要的只是路上的人别丢。

  - endingId: end-tianyi-caocao
    name: 留个记录
    description: 曹操线收束。四个字没人听见，却被写进了檄文。
    triggerConditions:
      - { flag: origin, eq: 曹操 }
    priority: 10
    endingType: neutral
    narrativeConfig:
      source: template
      title: 留个记录
      summary: 那四个字到底没人听见，可它被写进檄文，檄文传了出去。正月初九，所有人都觉得讨董本来就该这么打，只有你还记得灶膛里的灰。你把刀收好，接着往前走——这一世没能把责任交出去，倒是把名字留了下来。

  - endingId: end-tianyi-yuanshao
    name: 主位
    description: 袁绍线收束。有没有下过那道军令，后来谁也说不清。
    triggerConditions:
      - { flag: origin, eq: 袁绍 }
    priority: 10
    endingType: neutral
    narrativeConfig:
      source: template
      title: 主位
      summary: 盟主的位子你一直坐到散席。有没有下过那道军令，后来谁也说不清；史书只写「盟主召集了十八路诸侯」。正月初九，天意把这件事抹平得干干净净。你松了口气，又觉得那口气比这一整章都长。

  # 「胜利目标说」：把每条支线都浪一遍、且侵蚀度攒够，才够格摆脱天意。
  # 阈值说明：冒烟实测第一章（41 天）侵蚀度可到 49，故单看 tianyi 会过松，
  # 用「五条支线 flag 全齐 + tianyi ≥ 60」共同约束，避免隐藏结局变成必得结局。
  - endingId: end-escape-tianyi
    name: 摆脱天意的制裁
    description: 隐藏结局。天意干涉得太频繁，反而露出了破绽。
    triggerConditions: []
    priority: 100
    endingType: hidden
    unlockConditions:
      - { flag: forkMeal, eq: true }
      - { flag: forkEmperor, eq: true }
      - { flag: forkShark, eq: true }
      - { flag: forkBlameEra, eq: true }
      - { flag: forkSuicide, eq: true }
      - { attribute: tianyi, gte: 60 }
    narrativeConfig:
      source: template
      masked:
        title: ？？？
        summary: 有一条世界线，天意没有发力。

  # ══════════════ 第四轮 · 第二章（徐州 → 官渡）结局 ══════════════
  # chapter=3 由第 58 天 ev-tianyi-anchor-2 写入；优先级高于第一章结局（0 / 10），
  # 仍低于隐藏结局（100）⇒「摆脱天意」依旧是所有身份的最高目标。
  # 三条人物线的余味延续第一章：刘备数人、曹操留记录、袁绍守主位。
  - endingId: end-guandu
    name: 初平元年，官渡
    description: 第二章通用收束。四本账册合成一行，你写的那一页没人撕，只是没人再提。
    triggerConditions:
      - { flag: chapter, eq: 3 }
    priority: 20
    endingType: neutral
    narrativeConfig:
      source: template
      title: 初平元年，官渡
      summary: 三本年号不同的账册被抄成一行，天意把年号拨回初平。徐州开过的城门、兖州留着的空行、河北没定下的日子，一件也没被撤销，只是所有人都觉得本来就该这样。你把自己那一本收进怀里，跟着队伍往官渡走。

  - endingId: end-guandu-liubei
    name: 还是那批人
    description: 刘备线第二章收束。换过三本册子，点的始终是同一批人。
    triggerConditions:
      - { flag: chapter, eq: 3 }
      - { flag: origin, eq: 刘备 }
    priority: 25
    endingType: neutral
    narrativeConfig:
      source: template
      title: 还是那批人
      summary: 陈留到官渡，你换过三本册子，点的始终是同一批人。徐州的印绶放到落灰你也没拿，城门倒是先开了。今夜又点了一遍名，比来时少了两个，你把名字写进空行旁边。天意要你回主线，你要的仍只是路上的人别丢。

  - endingId: end-guandu-caocao
    name: 落款写今年
    description: 曹操线第二章收束。兖州那笔账没交给世道，檄文落款终于写了年号。
    triggerConditions:
      - { flag: chapter, eq: 3 }
      - { flag: origin, eq: 曹操 }
    priority: 25
    endingType: neutral
    narrativeConfig:
      source: template
      title: 落款写今年
      summary: 兖州空营那次，你没再把责任交给乱世，而是写进自己名下。官渡前夜重抄檄文，落款那一栏空了很久，最后还是写了年号。四个字没人听见的那一章，好歹留下了一份能传出去的东西。天意把账册抄回初平，抄不掉落款。

  - endingId: end-guandu-yuanshao
    name: 主位空着
    description: 袁绍线第二章收束。这一夜第一次觉得，不说话也是一种交代。
    triggerConditions:
      - { flag: chapter, eq: 3 }
      - { flag: origin, eq: 袁绍 }
    priority: 25
    endingType: neutral
    narrativeConfig:
      source: template
      title: 主位空着
      summary: 河北那句「诸位以为如何」你又说了一次，史书后来只写「盟主召诸将议事」。官渡前夜你把主位留空，没人敢坐，也没人问为什么。天意把三本账册合成一行，替你把没下的那道军令抹平；你松了口气，又觉得这口气比两章都长。

fallback: end-tianyi-normal

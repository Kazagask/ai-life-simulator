# 三国演义 · 人物 · characters.yaml
# ⚠ 防分身：npc-liubei / npc-caocao / npc-yuan-shao 由 world.yaml 的 npcSpawnRules 管辖，
#   开局 unspawned（不上屏）。玩家 roll 到该人物时，转盘不会 spawn 对应规则 ⇒ 世界里
#   只存在一个此人（就是玩家自己）。三人的定义仍然保留，供另外六种身份的局使用。
#   以其为第三视角的叙述一律改成第二人称或旁观；叙事层也不出现第二个自己。
# 讨董一章出场阵容。台词技能由事件解锁给玩家，NPC 只挂基础攻击（避免张冠李戴）。
#
# 【第六轮 · 人物死亡】生命周期是单一事实源：`lifecycle` 只写初始态（吕伯奢开局已故），
#   运行期变更一律由 events.yaml 的 `setNpcLifecycle` 写入，引擎自动冻结相连关系边、
#   屏蔽此后对该 NPC 的关系写入，投影把 inactive 照常上屏并原样显示 `reasonCode`。
#   ⚠ 只有 isEnemy: false 的角色才建 NPC 实例；纯敌人定义（enemy-*）不建实例，
#   对它写 setNpcLifecycle 会抛可诊断错误 —— 所以沙盘阵亡另用 npc-flag-bearer。
#   死亡时间账见 docs/SANGUO_TEMPLATE_BRIEF.md §12：开局（189 冬前情，不占天数）
#   → 正月初三汜水关 → 二月十二战争沙盘 → 二月十二战败立誓（玩家）。
#
# 【关系图谱 · 第四轮】本轮起正式使用 R2.6 / ADR-0014 的 `relations` 关系边，
#   `relationship` 标量保留为「NPC→玩家」便捷投影。⚠ 方向语义：
#   `{ to: B, kind: father }` 读作「**B 是 A 的父亲**」（jjk-2006 夜蛾坑见其头注释）。
#   亲属边只在孙坚/孙策、二袁之间使用，方向已逐条对照；其余一律用社会边
#   （friend / rival / colleague），避免把「谋主」「部将」误写成亲属。
#   visibility: known 才进玩家投影（前端渲染「X视Y为…」）；inferred 供推断得知的展示，
#   unknown / hidden 不上屏 —— 遵循 R-OP-05「默认不认识」。
#   指向 player 的边在玩家占用该 NPC 时会随 unspawned 节点一并被投影剔除，
#   生命周期是单一事实源，不需要按 origin 手工清理。
#   事件层用 addRelationEdge / 关系边形态 adjustRelation 让关系随剧情变化，
#   并用 `{ relation: ..., kind: ..., to: ... }` 条件做选项分岔。

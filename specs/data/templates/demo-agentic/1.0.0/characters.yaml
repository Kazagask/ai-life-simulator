# 2 个 NPC + 1 个敌人 + 玩家模板。secret:mentor-plan 为 F4 三窗口测试保留的隐秘事实。
# `enemy-shadow` 是战斗演示用的敌人实体：`settle.combat.enemies[].ref` 按**角色 id** 解析
# （battle.ts:189 `lookup.character(ref)`），所以敌人必须写在本文件、`isEnemy: true`、
# 且不带 lifecycle（缺省 = 在世，否则 turn.ts 会走 SKIP_ALL_ENEMIES_INACTIVE 整条跳过）。
characters:
  - id: npc-mentor
    isEnemy: false
    identity: { name: 引路人, age: 40, gender: unknown }
    visibility: public
    mood: { value: 50 }
    attributes: { body: 5, mind: 8, luck: 5 }
    public: { personality: 沉默寡言, knownGoals: [带主角入门] }
    private:
      secrets: ["secret:mentor-plan"]
      knowledge: ["fact:gate-location"]
      goals: [observe-player]
      traits: [cautious]
    relationship: 0
  - id: npc-rival
    isEnemy: false
    identity: { name: 同路人, age: 20, gender: unknown }
    visibility: public
    mood: { value: 50 }
    attributes: { body: 6, mind: 5, luck: 6 }
    public: {}
    private: {}
    relationship: 0
  - id: enemy-shadow
    isEnemy: true
    identity: { name: 墙里的影子, age: 1, gender: unknown, description: 从墙缝里渗出来的东西，没有脸，只有手。 }
    visibility: public
    mood: { value: 50 }
    attributes: { body: 4, mind: 2, luck: 1 }
    skills: [sk-shadow-claw]
    public: { personality: 饥饿, knownGoals: [抓住还在呼吸的东西] }
    private:
      combatHints:
        skillWeights: { sk-shadow-claw: 1 }
    relationship: -40
playerTemplate:
  identity: { gender: unknown, age: 18 }
  attributes: { body: 5, mind: 5, luck: 5 }
  # 战斗面板只能发 `skill` / `item` / `flee` / `pass` 四种命令；
  # 玩家没有战斗技能时打不赢也打不完，只能逃。故开局即持有 sk-demo-strike。
  skills: [sk-demo-strike]

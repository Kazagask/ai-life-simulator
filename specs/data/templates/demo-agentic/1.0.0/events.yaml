# 6 个事件（转盘 / 试炼前哨 / 战斗 / 收束），叙事可缺省（?? title 回退）。
# 事件 id 与 rules.yaml fallbackDag.templateRefs 逐字一致。
#
# demo 流程（开局 → 转盘 → 叙事 → 战斗）：
#   1. opening.yaml 把它排到 t=1 分钟 ⇒ 第一次推进轮次即**呈现**命数转盘（kind: random）；
#   2. 确认转盘 ⇒ 写 fateDealt 并 nextEventId → evt:awaken；
#   3. evt:awaken → evt:trial；evt:trial 的第三个选项直通 evt:ambush（kind: combat）；
#   4. 战斗三路结局 → evt:closing；收掉后回到自由行动，最终由 endings.yaml 的 30 天收束。
#
# `evt:trial` 仍被 rules.yaml 的 `fallbackDag.templateRefs` 与 `knowledgeGrants`
# （`eventResolved`）引用，改名会同时打空两处；`contextHints` 已不再提及任何事件 id。
#
# ⚠ 任何事件都可能被 **LLM 侧复活**（2026-11-16 实测）：
# 旧实现把 contextHints 里裸 `evt:` 开头的字符串解释成「本轮要上桌的事件」，
# 每次 `task.completed` 就发一次 `fact.enqueueEvent` ⇒ 一条 `evt:chance` 被反复入队，
# 与 `evt:closing` 交替上桌、最后 409 `pending_event_required`（真实服务可复现）。
# 关键事实：**`once` 挡不住它**——`fact.enqueueEvent` 的实现是直接 `enqueueScheduled`
# （`engine-api.ts:243-290`），根本不经过 `enqueueCandidate` 的 once 门控；出队终判
# （`missWhen`）才是唯一能挡住"已被引擎记过一次的事件重新上桌"的地方。
# ⇒ 故给 trial / chance 各加一道 `missWhen: <自己>Done`，由各自的结算写这个 flag。
# 这是**兜底**不是根治：根治在协议侧（`invoke.branchEventIds` 结构化字段，ADR-0038）
# 加 runtime 不消费裸标签；模板这层只保证"就算 LLM 硬塞，也不会无限循环"。
#
# ⚠ 本模板**没有 `source: pool` 事件**，这是刻意的，不是漏写：
# 池子只在「槽为空」的那一瞬抽取，而本图从第一轮到 `evt:closing` 结束，槽位由
# successor / queueTake 连续占着；唯一空槽时刻是收场轮——池子会在那一轮摇出事件并**立刻**
# 占掉下一轮（实测 5 个 seed 里 4 个如此，`evt:chance` 摇中后还要再走一次
# `偶遇转盘 → 落幕卡`，玩家连一轮自由行动都拿不到）。`once` 也治不了：池子在事件**结算前**
# 就能抽到它，已经在队列里的冗余实例不会因为后来记火而消失（实测队列里躺着
# `evt:trial <- pool` 的实例，收场后被取出二次占槽）。
# ⇒ 故事线全部用确定性边（successor / nextEventId）驱动；`evt:chance`（偶遇）仍保留，
# 由 `evt:trial` 的「走左边 / 走右边」进入。若日后要重新引入随机池，正确做法是给池事件
# 声明 `window.start` 延迟 + 「故事收束」门闩，并接受它会打断自由行动。
events:
  - id: "evt:wheel-fate"
    title: 命数转盘
    narrative: 转盘转过一格，停了一瞬，又自己转起来。指针在等你把手放上去。
    kind: random
    trigger: { source: chain }
    settle:
      random:
        wheel:
          segments:
            - weight: 3
              label: 生而强健
              effects:
                - { type: adjustAttribute, attribute: body, value: 1 }
                - { type: setFlag, id: fateDealt, value: true }
              nextEventId: "evt:awaken"
            - weight: 3
              label: 生而慧黠
              effects:
                - { type: adjustAttribute, attribute: mind, value: 1 }
                - { type: setFlag, id: fateDealt, value: true }
              nextEventId: "evt:awaken"
            - weight: 2
              label: 机缘缠身
              effects:
                - { type: adjustAttribute, attribute: luck, value: 2 }
                - { type: setFlag, id: fateDealt, value: true }
              nextEventId: "evt:awaken"
  - id: "evt:awaken"
    title: 苏醒
    kind: normal
    trigger: { source: chain }
    settle:
      normal:
        options:
          - { id: opt-begin, text: 出发, nextEventId: "evt:trial" }
  - id: "evt:trial"
    title: 初次试炼
    kind: normal
    trigger:
      source: chain
      # 兜底：被 LLM 重新塞回队列时不二次上桌（`once` 不管这条路径，见文件头）。
      # 三条选项各自写 trialDone —— 新增选项时**必须**一并写，否则这道门就漏了。
      missWhen: [{ flag: trialDone, eq: true }]
      missLabel: 试炼已经过去了
    settle:
      normal:
        options:
          - id: opt-left
            text: 走左边
            effects:
              - { type: adjustAttribute, attribute: body, value: 1 }
              - { type: setFlag, id: trialDone, value: true }
            nextEventId: "evt:chance"
          - id: opt-right
            text: 走右边
            effects:
              - { type: setFlag, id: took-right, value: true }
              - { type: setFlag, id: trialDone, value: true }
            nextEventId: "evt:chance"
          # 战斗演示入口：第三条路确定性直通 kind: combat（前两条保持原样，DAG 分支不受影响）。
          - id: opt-face
            text: 迎上去
            effects:
              - { type: setFlag, id: choseFight, value: true }
              - { type: setFlag, id: trialDone, value: true }
            nextEventId: "evt:ambush"

  - id: "evt:ambush"
    title: 墙里的影子
    narrative: 墙皮鼓了一下，像有什么东西在里面换了个姿势。它顺着裂缝渗出来，慢慢站直。
    kind: combat
    trigger: { source: chain }
    settle:
      combat:
        enemies:
          - { ref: enemy-shadow, levelScale: 0.35 }
        canFlee: true
        fleeCheck: { preset: opposed, attacker: body, defender: body, baseChance: 0.55 }
        onVictory:
          effects:
            - { type: adjustAttribute, attribute: body, value: 1 }
            - { type: adjustMood, value: 5 }
            - { type: setFlag, id: foughtShadow, value: true }
          nextEventId: "evt:closing"
        onDefeat:
          effects:
            - { type: adjustResource, resource: hp, value: 20 }
            - { type: adjustMood, value: -10 }
          nextEventId: "evt:closing"
        onFlee:
          effects:
            - { type: adjustMood, value: -4 }
          nextEventId: "evt:closing"
  - id: "evt:chance"
    title: 偶遇
    kind: random
    # 由 `evt:trial` 的「走左边 / 走右边」进入（原先还是 0.3 概率的池事件）。
    # 不做池事件的原因见文件头：池子只会在收场那一瞬抽到它，然后立刻打断自由行动。
    trigger:
      source: chain
      # 兜底：被 LLM 重新塞回队列时不二次上桌（`once` 不管这条路径，见文件头）。
      # 两段扇区都要写 chanceDone，否则停在哪一格都可能漏。
      missWhen: [{ flag: chanceDone, eq: true }]
      missLabel: 偶遇已经过去了
    settle:
      random:
        wheel:
          segments:
            - weight: 1
              label: 相谈甚欢
              effects: [{ type: setFlag, id: chanceDone, value: true }]
              nextEventId: "evt:closing"
            - weight: 1
              label: 擦肩而过
              effects: [{ type: setFlag, id: chanceDone, value: true }]
              nextEventId: "evt:closing"

  - id: "evt:rumor"
    title: 墙根的闲话
    narrative: 你路过墙根时，两个压着嗓子的人忽然住了嘴，其中一个用下巴指了指你背后的屋子。
    kind: normal
    # ⚠ 这是**只走队列路径**的事件，刻意不接任何 nextEventId、也不进任何 pool：
    # 全篇唯一能把它摆上桌的方式是 `fact.enqueueEvent`（分支轮 / 结构化 branchEventIds）。
    # 存在的理由：DAG 分支轮需要一个"只可能来自分支"的观察点 —— 否则它摆出的 evt:trial
    # 与 evt:awaken 的链边混在一起，演示点归零、测试也只能假绿。
    # 也刻意**不加** missWhen：它本来就是一次性演示，加了会盖住"分支轮到底有没有生效"。
    trigger: { source: chain }
    settle:
      normal:
        options:
          - id: opt-listen
            text: 凑近听他们说什么
            effects:
              - { type: setFlag, id: heardRumor, value: true }
              - { type: adjustMood, value: 3 }
          - id: opt-ignore
            text: 装作没听见，继续走
            effects:
              - { type: setFlag, id: ignoredRumor, value: true }
              - { type: adjustMood, value: -1 }

  - id: "evt:closing"
    title: 落幕
    kind: normal
    # 只由 successor 进入（战斗三路结局 / evt:chance 两段扇区），不再入池 ⇒ 收掉一次即结束，
    # 玩家回到自由行动，最终由 endings.yaml 的 timeReached（30 天）收束。这是本轮修的"落幕死循环"。
    trigger: { source: chain }
    settle:
      normal:
        options:
          # 效果枚举里**没有** endWorld / terminate 之类（common.ts 的 EffectSchema 白名单），
          # 所以这个按钮做不到"结束这一局"。文案说实话：它只结束这一场景，世界继续走。
          - { id: opt-finish, text: 合上这一页 }

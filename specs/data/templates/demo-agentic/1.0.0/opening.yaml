# 开局分域（协议 V2.1 §16 · R-OP-01..06）· demo-agentic
#
# 唯一开局 `op-demo-fate`：把「命数转盘」当成创建世界后的第一个待决事件。
#
# 交付口径（与 jjk-2006 的差异，必须写清楚）：
# - jjk 用 `handoff.pendingEvents: [ev-opening-wheel]` 把转盘**直接摆进槽位**；
#   这里改用 `handoff.schedule`（t=0 入队）+ `pendingEvents: []`。原因是槽位在**创建时**
#   就被占会让「刚建好的世界必须先处理槽内事件」这条门禁生效——任何一个在 create 之后
#   立刻提交自由行动的调用方都会吃 `pending_event_required`（turn.ts:934）。demo-agentic
#   是全仓测试夹具模板，apps/server 的 pipeline 测试就建完世界直接 advanceTurnV2，
#   槽位一占即红。t=0 入队等价于「开局后的第一件事」，但把「取出→呈现」留给第一轮，
#   于是第一次推进轮次就会掷骰并呈现转盘（turn.ts:726 presentRandomSlot）。
# - 转盘事件本身 `trigger.source: chain`（非 pool）：pool 只负责随机池，转盘由开局排程
#   与后继（nextEventId）两条确定性边驱动。
#
# completionConditions 用 `openingDone`（与 jjk 同形），交接后 write 一次即完成。
- openingId: op-demo-fate
  name: 命数初启
  description: 你在一间无名旧屋里醒来。桌上摆着一台旧转盘，它先于你醒来，正自己转着。
  entryConditions: []
  steps:
    - { id: step-wake, kind: required }
  characterSetup:
    flags:
      openingPath: fate
  worldSetup:
    flags:
      openingDone: true
      chapter: 1
      ready1: true
  npcSetup:
    relations:
      - { npcId: npc-mentor, value: 8, source: 引路人 }
      - { npcId: npc-rival, value: -4, source: 同路人 }
    visibility:
      npc-rival: known
  eventPools: []
  objectives:
    flags:
      objective: 走完这一段人生，看看命数转盘给了你什么
  choices: {}
  completionConditions:
    - { flag: openingDone, eq: true }
  handoff:
    pendingEvents: []
    schedule:
      # 1 分钟（TimeAmount.value 必须 > 0）：世界一开始就到期，第一次推进轮次即被
      # `nextTurn` 取出并呈现（掷骰不结算）。
      - { eventId: "evt:wheel-fate", at: { value: 1, unit: minute } }

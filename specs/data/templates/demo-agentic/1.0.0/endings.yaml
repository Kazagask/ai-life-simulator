# 时间到达 30 天确定性收束；无 HP 判据（加载期会拒）。
terminationConditions:
  - type: timeReached
    params:
      conditions:
        - time: { gte: { value: 30, unit: day } }
    combinator: AND
    terminationMode: afterSettle
endings:
  - endingId: end-default
    name: 平凡落幕
    description: 一局收束
    triggerConditions: []
    priority: 0
    endingType: neutral
    narrativeConfig: { source: template, title: 平凡落幕, summary: 这一局结束了。 }
    fallback: true
fallback: end-default

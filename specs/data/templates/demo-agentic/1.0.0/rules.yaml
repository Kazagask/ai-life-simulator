# 独立声明式文件：触发 / 工具画像 / 知识授权 / 推断 / fallbackDag。
# 不并入 TEMPLATE_MERGE_FILES、不是 world.yaml 顶层键（WorldTemplateV2Schema 为 .strict()）。
# 当前 DECLARATIVE_FILES 未含本文件，加载期由 templates.ts:422 warn + 忽略；
# 运行时加载验证依赖 T-06 补白名单 11→13 与独立 RulesSchema loader（预期的中间态）。
# when / guards / completion 统一 { op, args } 开放形（v2 §3.5 口径）。
# `contextHints` 只是给模型的**上下文标签**，引擎侧对其内容**零解释**。「把某个事件摆上桌」
# 只能由结构化字段表达（`invoke.branchEventIds`，ADR-0038），不许从标签字符串的形状推断 ——
# 从形状推断语义正是 `closing↔chance` 无限交替事故的根因。
llmTriggers:
  - when: [{ op: "nodeCompleted", args: { nodeId: "n1.awaken" } }]
    invoke:
      reason: "chapter.advance"
      perspective: "player"
      targetPerspective: "player"
      # 只放上下文标签，不在这里表达「上桌」—— 后者由 `branchEventIds` 声明（ADR-0038）。
      contextHints: ["chapter.tone"]
      # 能力声明（不是用途声明）：允许本轮把 evt:rumor 摆上桌。
      # 为什么是 rumor 而不是 trial（ADR-0037 §13 D16）：`evt:trial` 会被 `evt:awaken` 的
      # 确定性链边自动放下 —— 指向它等于「观察点与因果源重合」，它在不在队列里与分支轮
      # 是否生效无关，演示不成立、测试只能假绿。`evt:rumor` 不进 pool、没有任何
      # `nextEventId` 指向它、也没有 `missWhen` ⇒ 它出现在 delayQueue 里**只能**来自分支轮。
      branchEventIds: ["evt:rumor"]
      toolProfile: "narrative"
  - when: [{ op: "random", args: { probability: 0.1 } }]
    invoke:
      reason: "random.flavor"
      perspective: "player"
      targetPerspective: "player"
      contextHints: ["facts"]
      toolProfile: "narrative"
  - when: [{ op: "flagSet", args: { flag: "took-right" } }]
    invoke:
      reason: "task.completed"
      perspective: "world"
      targetPerspective: "player"
      # 本条职责是**写叙事**，不摆事件：`evt:chance` 已由 evt:trial 的确定性边进入，
      # 把它列成标签既没有用途，又会制造"它随时可能被摆上桌"的错觉（closing↔chance 交替的心理成因）。
      contextHints: ["facts", "secrets"]
      toolProfile: "narrative"
toolProfile:
  # 能力画像 = 本次 invocation 允许的工具面（只能**收窄**，不能新增）。
  # ① 工具名必须**两处注册表都认识**（game-core 的 defaultToolRegistry 与
  #    agent-runtime 的 ALL_TOOL_NAMES），少一处会被静默过滤掉。
  # ② **不需要**提交工具：终止由运行时判定（模型不再发 tool call 即完成）。
  # ③ **写世界只有 `story.submitBranch` 一条通道**。`fact.setKnowledge` / `fact.advanceDag` /
  #    `fact.upsertDagBranch` / `fact.enqueueEvent` 已于 2026-11-16 从工具面**下线**
  #    （理由见 archive 里 AGENTIC-GM 设计 §4：分别对应"直接改知识台账""整份覆盖 DAG"
  #    "往已有 DAG 打补丁""绕过 once 直接入队"，每一条都出过事故）。
  #    本模板给"叙事 + 提交分支"两件事，够跑完整一局；只读查询不在这个最小画像里。
  #
  # 命名空间：`narrative.*` = 写血肉（正文只进 trace，不进 WorldStateV2）；
  #           `story.*` = 提交一整条分支，由引擎消化成事件 / 调度，模型不感知槽与队列。
  narrative:
    ["narrative.write", "narrative.flavor", "story.submitBranch"]
knowledgeGrants:
  - when: [{ op: "eventResolved", args: { eventId: "evt:trial" } }]
    grant: { observers: ["player"], factRefs: ["fact:trial-result"], level: "known", source: "witness" }
  - when: [{ op: "always", args: {} }]
    grant: { observers: ["npc:npc-mentor"], factRefs: ["secret:mentor-plan", "fact:gate-location"], level: "known", source: "rule" }
  - when: [{ op: "always", args: {} }]
    grant: { observers: ["player", "npc:npc-rival"], factRefs: ["fact:gate-location"], level: "known", source: "rule" }
inferenceRules:
  - when: [{ op: "flagSet", args: { flag: "suspicion" } }]
    grant: { observers: ["npc:npc-rival"], factRefs: ["fact:hidden-motive"], level: "inferred", source: "inferred" }
fallbackDag:
  dagId: "demo-agentic.fallback.v1"
  version: 1
  issuedBy: "template"
  # completion 用 `eventResolved`（ADR-0037 §14，取代 D12 的字面 `always`）：
  # 「节点完成」= 它代表的那个事件**真的结算过**，不是「这条判据永远为真」。
  # `always` 不只是空转 —— 实测它会让 n1 在**转盘刚摆出那一轮**就 completed、`chapter.advance`
  # 同轮 fire（玩家还没看到梦境），ADR-0037 的 fixpoint 落地后更极端：一轮之内把整条 DAG 收干
  # （n1/n2 全 completed、n3 ready）。判据撒的谎被级联放大，所以这里必须指向事件本身。
  nodes:
    - { id: "n1.awaken", kind: "opening", title: "苏醒", status: "ready", guards: [], completion: [{ op: "eventResolved", args: { eventId: "evt:awaken" } }], templateRefs: ["evt:awaken"], visibility: "public" }
    - { id: "n2.trial", kind: "trial", title: "初次试炼", status: "draft", guards: [{ op: "nodeCompleted", args: { nodeId: "n1.awaken" } }], completion: [{ op: "eventResolved", args: { eventId: "evt:trial" } }], templateRefs: ["evt:trial"], visibility: "public" }
    - { id: "n3.hiddenSeed", kind: "secret", title: "未公开的线索", status: "draft", guards: [{ op: "nodeCompleted", args: { nodeId: "n2.trial" } }], completion: [], templateRefs: [], visibility: "hidden" }
  edges:
    - { from: "n1.awaken", to: "n2.trial", kind: "unlocks" }
    - { from: "n2.trial", to: "n3.hiddenSeed", kind: "unlocks" }

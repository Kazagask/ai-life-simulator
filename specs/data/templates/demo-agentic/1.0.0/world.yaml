# 最小骨架模板 · world.yaml
# 仅使用 WorldTemplateV2Schema 既有顶层键；8 个必填键全部在此文件，
# 其余必填键（characters/skills/items/statuses/events）由同目录分域文件提供后合并。
meta:
  id: demo-agentic
  name: 最小骨架模板
  description: F1 验收用最小骨架模板（无 key 可跑、有 key 触发 LLM）
  startYear: 2000
  engineProtocol: v2
time:
  defaultStep: { value: 1, unit: day }
genders:
  - { id: unknown, label: 未指定 }
mood:
  min: 0
  max: 100
  defaultValue: 50
  bands:
    - { id: calm, label: 平稳, min: 0, max: 100, attributeModifiers: {} }
# 冲突修正：source=resource 的 section 在 world.ts:319-323 与 lookup.ts:64 只认单数 key，
# 原稿的 keys:[hp,mp] 会 fail-fast。此处按最小改动改为 key: hp（本骨架不为 mp 单列一栏）。
statusBar:
  - { id: vitals, label: 状态, source: resource, key: hp }
attributes:
  order: [body, mind, luck]
  defaults: { body: 5, mind: 5, luck: 5 }
  labels: { body: 体魄, mind: 心智, luck: 机缘 }
resources:
  hp: { base: 100, perLevel: 0 }
  mp: { base: 50, perLevel: 0 }
regen:
  perTurn: { hp: 1, mp: 1 }
# 「点击为主，打字输入为辅」的常驻点击面：即使呈现槽为空、LLM 本轮没触发，
# 玩家也必须有东西可点。此处只给 duration、不给 effects —— 保证不与 effect 协议耦合，
# 也避免骨架模板伪造具体玩法数值（血肉交给 AI 与事件）。
# 前端点击后以 type = <action.id> 提交 /turns；引擎按 duration 推进世界时间。
actions:
  - id: act-explore
    label: 四处探索
    description: 在附近走动，看看有什么可发现的。
    duration: { value: 1, unit: day }
  - id: act-ask
    label: 打听消息
    description: 找人搭话，问清这里最近发生了什么。
    duration: { value: 1, unit: day }
  - id: act-rest
    label: 休整片刻
    description: 停下来缓一缓，让身上的疲惫退一些。
    duration: { value: 1, unit: day }
  - id: act-observe
    label: 观察自身
    description: 检查自己的状态与随身之物。
    duration: { value: 1, unit: hour }

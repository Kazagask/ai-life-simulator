      - { eventId: ev-sp-ending-survival, advanceWhen: onSettle }
      - { eventId: ev-sp-ending-riko-lives, advanceWhen: onSettle }
      - { eventId: ev-sp-ending-canon, advanceWhen: onSettle }
      - { eventId: ev-sp-ending-gojo-dead, advanceWhen: onSettle }

  - id: chain-night-parade
    startEventId: ev-night-parade-prologue

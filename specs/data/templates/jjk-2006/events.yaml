# JJK Demo 世界模板 · events.yaml
# 事件三段式：trigger（触发） -> kind（类型） -> settle（结算）。
#
# ── 本模板的设计骨架（2006 学年 · 五章 + 终章） ────────────────────────────
# 1) 开局：ev-opening-wheel 由 opening handoff 直挂。13 步「命数转盘」逐步定下
#    家族 / 资质 / 生得术式 / 术式应用 / 咒具 / 战斗风格 / 性格 / 师承 / 动机 /
#    代价 / 人设 / 预兆 / 命定一转（最后一步是真的转盘）。每一步都给真实机制后果。
# 2) 日常：pool 事件（概率或权重抽一）——点名、食堂、夜谈、五条翘课、夏油的思想、
#    硝子治疗、切磋、委托、都市传说、黑闪/领域/反转觉醒、黑市换咒具。
# 3) 行动钩子：巡逻/探索各挂一个「遭遇转盘」（random），结果直连战斗或奖励；
#    交往挂一个「今天和谁过」的选择事件。
# 4) 主线：chapter flag 驱动的五章链（星浆体 → 夏油叛逃 → 百鬼夜行 → 涩谷 → 终章），
#    章与章之间用 advanceTo 跳月，剧情跨一年。
# 5) 结局：由 flag 与属性在终止时决胜（见 endings.yaml）。
#
# 设计纪律：转盘负责「命」，玩家负责「选择」。转盘的每个结果都必须落到
# 技能 / 装备 / 补正 / 关系 / flag 上，不能只写一段文案。

events:
  # ══════════════════════════════════════════════════════════════
  # 一、命数转盘 · 角色创建（13 步）
  # ══════════════════════════════════════════════════════════════

  - id: ev-opening-wheel
    title: 命数转盘 · 开局
    narrative: 2006 年，东京咒术高专。命运的转盘在你面前停下——这一生的形貌，由此落定。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-begin
            text: 转动命数转盘，书写此身
            effects:
              - { type: startChain, chainId: chain-creation }

  - id: ev-w01
    title: 出身
    narrative: 你从哪里来？这决定了你第一眼看到的咒术界长什么样。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w01-1
            text: 东京·普通上班族家庭
            effects:
              - { type: setFlag, id: w01, value: 都内平民 }
              - { type: adjustAttribute, attribute: luck, value: 2 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-w02
          - id: opt-w01-2
            text: 京都·御三家分家
            effects:
              - { type: setFlag, id: w01, value: 御三家分家 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 3 }
              - { type: adjustAttribute, attribute: reputation, value: 8 }
              - { type: grantItem, itemId: item-grade1-tool, count: 1 }
            nextEventId: ev-w02
          - id: opt-w01-3
            text: 东北乡下·孤儿院
            effects:
              - { type: setFlag, id: w01, value: 乡下孤儿 }
              - { type: adjustAttribute, attribute: physique, value: 3 }
              - { type: adjustAttribute, attribute: reputation, value: -5 }
              - { type: adjustMood, value: -4 }
            nextEventId: ev-w02
          - id: opt-w01-4
            text: 海外归国·随父母调职来日
            effects:
              - { type: setFlag, id: w01, value: 归国子女 }
              - { type: adjustAttribute, attribute: intellect, value: 3 }
              - { type: adjustAttribute, attribute: luck, value: 1 }
            nextEventId: ev-w02

  - id: ev-w02
    title: 咒力资质
    narrative: 体检室的白炽灯下，你的咒力在仪器里显示出形状。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w02-1
            text: 咒力压倒性地多——多到仪器在发抖
            effects:
              - { type: setFlag, id: w02, value: 庞大咒力 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 6 }
              - { type: applyStatus, status: cursed-quality, stacks: 1 }
            nextEventId: ev-w03
          - id: opt-w02-2
            text: 均衡而稳定，教科书式的术师底子
            effects:
              - { type: setFlag, id: w02, value: 均衡 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 3 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
            nextEventId: ev-w03
          - id: opt-w02-3
            text: 咒力稀薄，却精确得像手术刀
            effects:
              - { type: setFlag, id: w02, value: 精密 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: -2 }
              - { type: adjustAttribute, attribute: intellect, value: 4 }
              - { type: adjustAttribute, attribute: agility, value: 3 }
            nextEventId: ev-w03
          - id: opt-w02-4
            text: 几乎没有咒力——但肉体在叫嚣
            effects:
              - { type: setFlag, id: w02, value: 天与咒缚 }
              - { type: applyStatus, status: heavenly-restriction, stacks: 1 }
              - { type: unlockSkill, skillId: sk-heavenly-body }
            nextEventId: ev-w03

  - id: ev-w03
    title: 生得术式
    narrative: 生得术式是与生俱来的烙印。你伸出手，它回应了你。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w03-1
            text: 十种影法术——影子在脚下翻涌
            effects:
              - { type: setFlag, id: w03, value: 十种影法术 }
              - { type: unlockSkill, skillId: sk-ten-shadow }
            nextEventId: ev-w04
          - id: opt-w03-2
            text: 赤血操术——血液在皮下变成刀
            effects:
              - { type: setFlag, id: w03, value: 赤血操术 }
              - { type: unlockSkill, skillId: sk-red-blood }
            nextEventId: ev-w04
          - id: opt-w03-3
            text: 雷电术式——指尖有雷在爬
            effects:
              - { type: setFlag, id: w03, value: 雷电术式 }
              - { type: unlockSkill, skillId: sk-thunder }
            nextEventId: ev-w04
          - id: opt-w03-4
            text: 火焰术式——呼吸都是灼的
            effects:
              - { type: setFlag, id: w03, value: 火焰术式 }
              - { type: unlockSkill, skillId: sk-flame }
            nextEventId: ev-w04
          - id: opt-w03-5
            text: 刍灵咒法——人偶在你掌心成形
            effects:
              - { type: setFlag, id: w03, value: 刍灵咒法 }
              - { type: unlockSkill, skillId: sk-doll-curse }
            nextEventId: ev-w04
          - id: opt-w03-6
            text: 十划咒法——你看见万物 3:7 的裂缝
            effects:
              - { type: setFlag, id: w03, value: 十划咒法 }
              - { type: unlockSkill, skillId: sk-7-3 }
            nextEventId: ev-w04

  - id: ev-w04
    title: 术式的应用
    narrative: 同样的术式，有人用来杀人，有人用来救人。你的手偏向了哪一边？
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w04-1
            text: 把术式推到「领域」的边界
            effects:
              - { type: setFlag, id: w04, value: 领域潜质 }
              - { type: setFlag, id: domainPotential, value: true }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 2 }
            nextEventId: ev-w05
          - id: opt-w04-2
            text: 学反转术式——先救自己，才能救别人
            effects:
              - { type: setFlag, id: w04, value: 反转 }
              - { type: unlockSkill, skillId: sk-reverse-attack }
              - { type: setFlag, id: hasReverseMastered, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
            nextEventId: ev-w05
          - id: opt-w04-3
            text: 磨「黑闪」——把一切都压进那一瞬
            effects:
              - { type: setFlag, id: w04, value: 黑闪亲和 }
              - { type: setFlag, id: blackFlashAptitude, value: true }
              - { type: adjustAttribute, attribute: physique, value: 2 }
              - { type: adjustAttribute, attribute: agility, value: 2 }
            nextEventId: ev-w05

  - id: ev-w05
    title: 咒具
    narrative: 兵器库里落着灰。管理员说：挑一件趁手的，它会跟你一辈子。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w05-1
            text: 天逆鉾——能刺穿术式的矛
            effects:
              - { type: setFlag, id: w05, value: 天逆鉾 }
              - { type: grantItem, itemId: eq-ten-spear, count: 1 }
            nextEventId: ev-w06
          - id: opt-w05-2
            text: 万里锁——无限伸缩的锁链
            effects:
              - { type: setFlag, id: w05, value: 万里锁 }
              - { type: grantItem, itemId: eq-bancho, count: 1 }
            nextEventId: ev-w06
          - id: opt-w05-3
            text: 释魂刀——刀刃能切到灵魂
            effects:
              - { type: setFlag, id: w05, value: 释魂刀 }
              - { type: grantItem, itemId: eq-shakujin, count: 1 }
            nextEventId: ev-w06
          - id: opt-w05-4
            text: 黑绳——专门绞杀术式的那根绳
            effects:
              - { type: setFlag, id: w05, value: 黑绳 }
              - { type: grantItem, itemId: eq-kurobuna, count: 1 }
            nextEventId: ev-w06

  - id: ev-w06
    title: 战斗风格
    narrative: 第一次实战课。五条靠在墙边看你，嘴里叼着棒棒糖。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w06-1
            text: 贴身肉搏——拳头比术式快
            effects:
              - { type: setFlag, id: w06, value: 体术 }
              - { type: adjustAttribute, attribute: physique, value: 4 }
              - { type: adjustAttribute, attribute: agility, value: 2 }
            nextEventId: ev-w07
          - id: opt-w06-2
            text: 远程轰击——站在安全距离把地形抹平
            effects:
              - { type: setFlag, id: w06, value: 术式炮台 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 4 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
            nextEventId: ev-w07
          - id: opt-w06-3
            text: 先算再打——用三成力换十成效果
            effects:
              - { type: setFlag, id: w06, value: 战术 }
              - { type: adjustAttribute, attribute: intellect, value: 3 }
              - { type: adjustAttribute, attribute: luck, value: 2 }
            nextEventId: ev-w07

  - id: ev-w07
    title: 性格
    narrative: 教官让你在三十五秒内介绍自己。你怎么说，别人就怎么记住你。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w07-1
            text: 冷静、少话、把事情做完
            effects:
              - { type: setFlag, id: w07, value: 冷静 }
              - { type: setFlag, id: trait-calm, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
            nextEventId: ev-w08
          - id: opt-w07-2
            text: 热血、先冲、边打边想办法
            effects:
              - { type: setFlag, id: w07, value: 热血 }
              - { type: setFlag, id: trait-hot, value: true }
              - { type: adjustAttribute, attribute: physique, value: 2 }
              - { type: adjustMood, value: 5 }
            nextEventId: ev-w08
          - id: opt-w07-3
            text: 狡黠、爱开玩笑、永远藏着后手
            effects:
              - { type: setFlag, id: w07, value: 狡黠 }
              - { type: setFlag, id: trait-sly, value: true }
              - { type: adjustAttribute, attribute: luck, value: 3 }
            nextEventId: ev-w08

  - id: ev-w08
    title: 师承
    narrative: 高专把你分给了谁？这可能比术式更能决定你变成什么样的人。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w08-1
            text: 五条悟——天才的阴影很大，也很亮
            effects:
              - { type: setFlag, id: w08, value: 五条 }
              - { type: adjustRelation, npcId: npc-gojo, value: 12 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 2 }
            nextEventId: ev-w09
          - id: opt-w08-2
            text: 夏油杰——温柔的人教你什么是「正确」
            effects:
              - { type: setFlag, id: w08, value: 夏油 }
              - { type: adjustRelation, npcId: npc-geto, value: 12 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
            nextEventId: ev-w09
          - id: opt-w08-3
            text: 家入硝子——先学会活下来
            effects:
              - { type: setFlag, id: w08, value: 硝子 }
              - { type: adjustRelation, npcId: npc-shoko, value: 12 }
              - { type: adjustAttribute, attribute: physique, value: 1 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
            nextEventId: ev-w09
          - id: opt-w08-4
            text: 七海建人——把术师当成一份工作来做好
            effects:
              - { type: setFlag, id: w08, value: 七海 }
              - { type: adjustRelation, npcId: npc-nanami, value: 12 }
              - { type: adjustAttribute, attribute: agility, value: 2 }
            nextEventId: ev-w09

  - id: ev-w09
    title: 入校的动机
    narrative: 你为什么站在这里？这个问题会在最坏的时刻回来找你。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w09-1
            text: 报仇——有一头咒灵，你记得它的样子
            effects:
              - { type: setFlag, id: w09, value: 复仇 }
              - { type: setFlag, id: motivation, value: revenge }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 2 }
              - { type: applyStatus, status: resolved, stacks: 1 }
            nextEventId: ev-w10
          - id: opt-w09-2
            text: 守护——不想再看见有人被咒灵拖走
            effects:
              - { type: setFlag, id: w09, value: 守护 }
              - { type: setFlag, id: motivation, value: protect }
              - { type: adjustMood, value: 6 }
              - { type: applyStatus, status: resolved, stacks: 1 }
            nextEventId: ev-w10
          - id: opt-w09-3
            text: 野心——我要站到咒术界的顶上
            effects:
              - { type: setFlag, id: w09, value: 野心 }
              - { type: setFlag, id: motivation, value: ambition }
              - { type: adjustAttribute, attribute: reputation, value: 5 }
            nextEventId: ev-w10
          - id: opt-w09-4
            text: 好奇——我只是想知道，咒力到底是什么
            effects:
              - { type: setFlag, id: w09, value: 好奇 }
              - { type: setFlag, id: motivation, value: curiosity }
              - { type: adjustAttribute, attribute: intellect, value: 3 }
            nextEventId: ev-w10

  - id: ev-w10
    title: 代价
    narrative: 转盘不会只给不拿。它要收走一样东西。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w10-1
            text: 名声——出生于不光彩的家族
            effects:
              - { type: setFlag, id: w10, value: 名声 }
              - { type: adjustAttribute, attribute: reputation, value: -12 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 3 }
            nextEventId: ev-w11
          - id: opt-w10-2
            text: 身体——小时候的病留下了根
            effects:
              - { type: setFlag, id: w10, value: 身体 }
              - { type: adjustAttribute, attribute: physique, value: -3 }
              - { type: adjustAttribute, attribute: intellect, value: 3 }
            nextEventId: ev-w11
          - id: opt-w10-3
            text: 心——你很难真正对谁敞开心
            effects:
              - { type: setFlag, id: w10, value: 心 }
              - { type: adjustMood, value: -14 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 2 }
              - { type: adjustAttribute, attribute: luck, value: 2 }
            nextEventId: ev-w11
          - id: opt-w10-4
            text: 什么都不给——你把代价推回给命运
            effects:
              - { type: setFlag, id: w10, value: 无 }
              - { type: applyStatus, status: cursed-mark, stacks: 1 }
              - { type: adjustAttribute, attribute: luck, value: 4 }
            nextEventId: ev-w11

  - id: ev-w11
    title: 人设
    narrative: 转盘还顺便决定了一件事：你说话的样子。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w11-1
            text: 开口就是名台词，中二得理直气壮
            effects:
              - { type: setFlag, id: w11, value: 名台词 }
              - { type: adjustMood, value: 5 }
            nextEventId: ev-w12
          - id: opt-w11-2
            text: 话少，但每句都补刀
            effects:
              - { type: setFlag, id: w11, value: 毒舌 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustAttribute, attribute: reputation, value: 2 }
            nextEventId: ev-w12
          - id: opt-w11-3
            text: 永远在笑，谁都摸不透
            effects:
              - { type: setFlag, id: w11, value: 笑面 }
              - { type: adjustAttribute, attribute: luck, value: 2 }
            nextEventId: ev-w12

  - id: ev-w12
    title: 预兆
    narrative: 入学前夜，你做了一个梦。醒来时只记得一种感觉。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w12-1
            text: 悬在半空的身影与染血的长廊
            effects:
              - { type: setFlag, id: w12, value: 梦魇 }
              - { type: applyStatus, status: sp-omen, stacks: 1 }
              - { type: setFlag, id: omen, value: 梦魇 }
            nextEventId: ev-w13
          - id: opt-w12-2
            text: 有人在你身后说「活下去」
            effects:
              - { type: setFlag, id: w12, value: 贵人 }
              - { type: setFlag, id: omen, value: 贵人 }
              - { type: adjustMood, value: 8 }
              - { type: adjustAttribute, attribute: luck, value: 2 }
            nextEventId: ev-w13
          - id: opt-w12-3
            text: 一片没有影子的白色，安静得可怕
            effects:
              - { type: setFlag, id: w12, value: 空白 }
              - { type: setFlag, id: omen, value: 空白 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
            nextEventId: ev-w13

  # 最后一步：真的转一次（kind: random 的链步会即时结算并收束链）
  - id: ev-w13
    title: 命定一转
    narrative: 转盘最后一次转动。它不再问你想要什么，只告诉你命运已经决定的那部分。
    trigger:
      source: chain
    kind: random
    settle:
      random:
        wheel:
          segments:
            - label: 天赐的咒力
              weight: 2
              effects:
                - { type: setFlag, id: w13, value: 天赐 }
                - { type: adjustAttribute, attribute: cursedEnergy, value: 5 }
            - label: 幸运女神的偏爱
              weight: 3
              effects:
                - { type: setFlag, id: w13, value: 幸运 }
                - { type: applyStatus, status: blessed, stacks: 1 }
                - { type: grantItem, itemId: item-mp-candy, count: 2 }
            - label: 一具好身体
              weight: 3
              effects:
                - { type: setFlag, id: w13, value: 身体 }
                - { type: applyStatus, status: special-physique, stacks: 1 }
            - label: 一件旧遗物
              weight: 2
              effects:
                - { type: setFlag, id: w13, value: 遗物 }
                - { type: grantItem, itemId: item-curse-tool, count: 1 }
                - { type: grantItem, itemId: item-first-aid, count: 2 }
            - label: 旧伤复发
              weight: 1
              effects:
                - { type: setFlag, id: w13, value: 旧伤 }
                - { type: applyStatus, status: injured-sim, stacks: 1 }
            - label: 被诅咒的印记
              weight: 1
              effects:
                - { type: setFlag, id: w13, value: 印记 }
                - { type: applyStatus, status: cursed-mark, stacks: 1 }

  # ══════════════════════════════════════════════════════════════
  # 二、日常事件池（每轮按权重抽一 / 按概率独立触发）
  # ══════════════════════════════════════════════════════════════

  # 今日运势：真正的「转盘」感，幸运属性会影响吉凶权重
  - id: ev-daily-fortune
    title: 命数转盘 · 今日运势
    narrative: 宿舍桌上那台老式转盘自己转了起来——咒术师的迷信，有时候并不可笑。
    trigger:
      source: pool
      probability: 0.25
      cooldown: { value: 3, unit: day }
      priority: 6
    kind: random
    settle:
      random:
        wheel:
          segments:
            - label: 大吉
              weight: 1
              weightBy: { luck: 0.25 }
              effects:

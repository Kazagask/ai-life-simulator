# JJK Demo 世界模板 · events.yaml
# 事件三段式：trigger（触发） -> kind（类型） -> settle（结算）。
# 2026-11-12 用户裁决：主线剧情事件链（咒灵调查 / 指数猎杀 / 星浆体 /
# 百鬼夜行 / 涩谷事变）已删除；本模板以「咒术转盘」开局角色创建链为核心。
# ev-opening-wheel 为 chain 源入口事件（不属于任何链），由 opening handoff
# 直接推入待决队列首，创建世界即见转盘开局。
events:
  # ---------- 咒术转盘 · 开局角色创建链（源自 wheel.json 参考物；开局 handoff 直挂；事件链 + 获取技能/装备/补正/成长）----------
  - id: ev-opening-wheel
    title: 命数转盘 · 开局
    narrative: 2006 年，东京咒术高专。命运的转盘在你面前停下——这一生的形貌，由此落定。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
        - id: opt-begin
          text: 转动命数转盘，书写此身
          effects:
          - type: startChain
            chainId: chain-wheel-creation

# JJK 世界模板 · events.yaml（第一部分：开局创建 / 日常 / 行动钩子 / 遭遇）
#
# ══════════════════════════════════════════════════════════════════════════
# 2026-11-12 重做：按原作时间线做一条十二年的人生
#   2006 春 入学（与七海、灰原同班；五条、夏油是二年生学长）
#   2006 夏 怀玉 · 星浆体护卫（天内理子 / 伏黑甚尔）
#   2007 夏 玉折 · 苦夏（夏油杰叛逃，可拦下）
#   2017 冬 咒术回战 0 · 百鬼夜行（乙骨忧太 / 夏油来袭）
#   2018 夏 起首 · 少年院（虎杖吞下手指）
#   2018.10.31 涩谷事变（五条被封印 / 宿傩夷平涩谷）
#   2018.11 死灭回游（宿傩夺舍伏黑）
#   2018.12.24 新宿决战（人外魔境）
#   2019 初 落幕（十二年后，你二十七岁）
#
# 因果纪律：每个关键选择都落成 flag，下一章的门、选项的出现条件、结局判定都读它。
#   savedRiko → 夏油是否还对人类抱有希望 → 能否拦下他
#   getoStayed / getoGone → 2017 百鬼夜行的敌人是「夏油」还是「羂索」
#   moleClue（少年院发现的线索）→ 涩谷能否提前拆掉狱门疆
#   gojoSealed → 死灭回游是否发生、新宿决战的阵容
# 命运纪律：转盘负责「命」（术式、资质、命定一转、每章的处境），玩家负责「选择」。
# ══════════════════════════════════════════════════════════════════════════

events:
  # ══════════════════════════════════════════════════════════════
  # 一、命数转盘 · 角色创建（13 步）
  # ══════════════════════════════════════════════════════════════

  - id: ev-opening-wheel
    title: 命数转盘 · 开局
    narrative: 2006 年，东京咒术高专。你站在一间空教室里，桌上摆着一台不知谁留下的旧转盘。它自己转了起来。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-begin
            text: 转动命数转盘，书写此身
            effects:
              - { type: startChain, chainId: chain-creation }

  # ---------- 第一步：性别 ----------

  - id: ev-w01
    title: 性别
    narrative: 转盘的第一格是一面镜子。镜子里的人还没有脸——你可以决定它长什么样。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w01-m
            text: 男性
            effects:
              - { type: setIdentity, gender: male }
              - { type: setFlag, id: w01, value: 男 }
            nextEventId: ev-w02
          - id: opt-w01-f
            text: 女性
            effects:
              - { type: setIdentity, gender: female }
              - { type: setFlag, id: w01, value: 女 }
            nextEventId: ev-w02
          - id: opt-w01-n
            text: 无性别
            effects:
              - { type: setIdentity, gender: agender }
              - { type: setFlag, id: w01, value: 无性别 }
            nextEventId: ev-w02
          - id: opt-w01-x
            text: 男娘
            effects:
              - { type: setIdentity, gender: femboy }
              - { type: setFlag, id: w01, value: 男娘 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-w02

  # ---------- 第二步：年龄与出身 ----------

  - id: ev-w02
    title: 年龄与出身
    narrative: 第二格是你的来处。你多大了，从哪儿来，家里有没有人知道「咒术」这两个字。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w02-1
            text: 十五岁 · 东京都内的普通上班族家庭
            effects:
              - { type: setIdentity, age: 15 }
              - { type: setFlag, id: w02, value: 都内平民 }
              - { type: setFlag, id: origin, value: civilian }
              - { type: adjustAttribute, attribute: luck, value: 2 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-w03
          - id: opt-w02-2
            text: 十五岁 · 地方咒术家族的分家
            effects:
              - { type: setIdentity, age: 15 }
              - { type: setFlag, id: w02, value: 分家 }
              - { type: setFlag, id: origin, value: branch-family }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 3 }
              - { type: adjustAttribute, attribute: reputation, value: 6 }
            nextEventId: ev-w03
          - id: opt-w02-3
            text: 十六岁 · 非术师家庭，比别人晚一年才被找到
            effects:
              - { type: setIdentity, age: 16 }
              - { type: setFlag, id: w02, value: 晚一年 }
              - { type: setFlag, id: origin, value: civilian-late }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-w03
          - id: opt-w02-4
            text: 十五岁 · 从孤儿院出来，被高专的人领走
            effects:
              - { type: setIdentity, age: 15 }
              - { type: setFlag, id: w02, value: 孤儿 }
              - { type: setFlag, id: origin, value: orphan }
              - { type: adjustAttribute, attribute: physique, value: 2 }
              - { type: adjustMood, value: -8 }
              - { type: setFlag, id: orphan, value: true }
            nextEventId: ev-w03

  # ---------- 第三步：咒力资质 ----------

  - id: ev-w03
    title: 咒力资质
    narrative: 第三格是量尺。夜蛾把你按在椅子上，用一根黑绳量你的咒力——绳子的刻度停在哪儿，你这辈子就从哪儿起跑。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w03-1
            text: 几乎测不出。绳子上只亮了最底下那一格
            effects:
              - { type: setFlag, id: w03, value: 四级 }
              - { type: setFlag, id: aptitude, value: 四级 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 1 }
              - { type: adjustMood, value: -2 }
            nextEventId: ev-w04
          - id: opt-w03-2
            text: 二级相当。够用，但撑不起大场面
            effects:
              - { type: setFlag, id: w03, value: 二级 }
              - { type: setFlag, id: aptitude, value: 二级 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 5 }
            nextEventId: ev-w04
          - id: opt-w03-3
            text: 一级胚子。夜蛾的手指在绳子上停了一秒
            effects:
              - { type: setFlag, id: w03, value: 一级 }
              - { type: setFlag, id: aptitude, value: 一级 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 9 }
              - { type: adjustAttribute, attribute: reputation, value: 4 }
            nextEventId: ev-w04
          - id: opt-w03-4
            text: 特级胚子。绳子烧断了
            effects:
              - { type: setFlag, id: w03, value: 特级 }
              - { type: setFlag, id: aptitude, value: 特级 }
              - { type: setFlag, id: marked, value: true }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 15 }
              - { type: adjustAttribute, attribute: reputation, value: 10 }
              - { type: adjustMood, value: -4 }
            nextEventId: ev-w04

  # ---------- 第四步：生得术式 ----------

  - id: ev-w04
    title: 生得术式
    narrative: 第四格是术式。生得术式是生下来就写在你身体里的东西，一辈子只会有一个——除了某些不该存在的例外。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w04-shadow
            text: 十种影法术 —— 影子里养着十只式神
            effects:
              - { type: setFlag, id: w04, value: 十种影法术 }
              - { type: setFlag, id: tech, value: shadow }
              - { type: applyStatus, status: tech-ten-shadow, stacks: 1 }
              - { type: unlockSkill, skillId: sk-ten-shadow }
              - { type: unlockSkill, skillId: sk-ten-nue }
              - { type: unlockSkill, skillId: sk-ten-mahoraga }
            nextEventId: ev-w05
          - id: opt-w04-blood
            text: 赤血操术 —— 血从皮肤下出来就是刀
            effects:
              - { type: setFlag, id: w04, value: 赤血操术 }
              - { type: setFlag, id: tech, value: blood }
              - { type: applyStatus, status: tech-red-blood, stacks: 1 }
              - { type: unlockSkill, skillId: sk-red-blood }
              - { type: unlockSkill, skillId: sk-blood-cage }
              - { type: unlockSkill, skillId: sk-blood-hardening }
            nextEventId: ev-w05
          - id: opt-w04-doll
            text: 刍灵咒法 —— 一根钉子就能要人的命
            effects:
              - { type: setFlag, id: w04, value: 刍灵咒法 }
              - { type: setFlag, id: tech, value: doll }
              - { type: applyStatus, status: tech-doll, stacks: 1 }
              - { type: unlockSkill, skillId: sk-doll-curse }
              - { type: unlockSkill, skillId: sk-doll-nail }
              - { type: unlockSkill, skillId: sk-doll-trance }
            nextEventId: ev-w05
          - id: opt-w04-thunder
            text: 雷电 —— 你出手总比对手快半拍
            effects:
              - { type: setFlag, id: w04, value: 雷电 }
              - { type: setFlag, id: tech, value: thunder }
              - { type: applyStatus, status: tech-thunder, stacks: 1 }
              - { type: unlockSkill, skillId: sk-thunder }
              - { type: unlockSkill, skillId: sk-thunder-spear }
              - { type: unlockSkill, skillId: sk-thunder-field }
            nextEventId: ev-w05
          - id: opt-w04-speech
            text: 咒言 —— 你说出的话会成为规则
            effects:
              - { type: setFlag, id: w04, value: 咒言 }
              - { type: setFlag, id: tech, value: speech }
              - { type: applyStatus, status: tech-speech, stacks: 1 }
              - { type: unlockSkill, skillId: sk-cursed-speech }
              - { type: unlockSkill, skillId: sk-speech-command }
              - { type: unlockSkill, skillId: sk-speech-seal }
            nextEventId: ev-w05
          - id: opt-w04-null
            text: 没有术式 —— 你身上一点咒力都没有
            effects:
              - { type: setFlag, id: w04, value: 无术式 }
              - { type: setFlag, id: tech, value: none }
              - { type: applyStatus, status: heavenly-restriction, stacks: 1 }
              - { type: unlockSkill, skillId: sk-heavenly-body }
              - { type: unlockSkill, skillId: sk-heavenly-rush }
              - { type: adjustAttribute, attribute: physique, value: 6 }
            nextEventId: ev-w05

  # ---------- 第五步：术式的应用 ----------

  - id: ev-w05
    title: 术式的应用
    narrative: 术式只是原料。真正的分岔在于你把它往哪个方向拧——有人一辈子停在“能用”，有人摸到了领域的边。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w05-1
            text: 领域 —— 你想让一片空间只听你的话
            effects:
              - { type: setFlag, id: w05, value: 领域 }
              - { type: setFlag, id: domainApt, value: true }
              - { type: unlockSkill, skillId: sk-domain-expansion }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 3 }
            nextEventId: ev-w06
          - id: opt-w05-2
            text: 反转术式 —— 你想学会把伤口合上
            effects:
              - { type: setFlag, id: w05, value: 反转 }
              - { type: setFlag, id: reverseApt, value: true }
              - { type: unlockSkill, skillId: sk-reverse-heal }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
            nextEventId: ev-w06
          - id: opt-w05-3
            text: 黑闪 —— 你想打出那一击，哪怕只有一次
            effects:
              - { type: setFlag, id: w05, value: 黑闪 }
              - { type: setFlag, id: blackFlashApt, value: true }
              - { type: unlockSkill, skillId: sk-black-flash }
              - { type: adjustAttribute, attribute: physique, value: 2 }
            nextEventId: ev-w06
          - id: opt-w05-4
            text: 还没想好 —— 先把一招练到不会忘
            effects:
              - { type: setFlag, id: w05, value: 未定 }
              - { type: unlockSkill, skillId: sk-curtain }
              - { type: unlockSkill, skillId: sk-cursed-strike }
              - { type: adjustAttribute, attribute: luck, value: 2 }
            nextEventId: ev-w06

  # ---------- 第六步：咒具 ----------

  - id: ev-w06
    title: 咒具
    narrative: 第六格是武器架。高专的库房里躺着几件特级咒具——每一件都有人为它死过。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w06-1
            text: 天逆鉾 —— 贯穿一切，能强制解除术式
            effects:
              - { type: setFlag, id: w06, value: 天逆鉾 }
              - { type: grantItem, itemId: eq-ten-spear, count: 1 }
            nextEventId: ev-w07
          - id: opt-w06-2
            text: 万里锁 —— 无限伸缩，远近皆宜
            effects:
              - { type: setFlag, id: w06, value: 万里锁 }
              - { type: grantItem, itemId: eq-bancho, count: 1 }
            nextEventId: ev-w07
          - id: opt-w06-3
            text: 释魂刀 —— 切割灵魂，对咒灵尤其致命
            effects:
              - { type: setFlag, id: w06, value: 释魂刀 }
              - { type: grantItem, itemId: eq-shakujin, count: 1 }
            nextEventId: ev-w07
          - id: opt-w06-4
            text: 空手 —— 别人的兵器用着不顺手
            effects:
              - { type: setFlag, id: w06, value: 空手 }
              - { type: adjustAttribute, attribute: agility, value: 3 }
              - { type: grantItem, itemId: item-first-aid, count: 1 }
            nextEventId: ev-w07

  # ---------- 第七步：战斗风格 ----------

  - id: ev-w07
    title: 战斗风格
    narrative: 第七格照出你以后在战场上的样子。不是想成为的样子，是只剩一口气时会变成的样子。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w07-1
            text: 体术流 —— 贴上去，打在能打中的地方
            effects:
              - { type: setFlag, id: w07, value: 体术 }
              - { type: adjustAttribute, attribute: physique, value: 4 }
              - { type: unlockSkill, skillId: sk-cursed-strike }
            nextEventId: ev-w08
          - id: opt-w07-2
            text: 术式流 —— 拉开距离，让它在你手里成型
            effects:
              - { type: setFlag, id: w07, value: 术式 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 4 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
            nextEventId: ev-w08
          - id: opt-w07-3
            text: 支援流 —— 别人打，你负责让别人活下来
            effects:
              - { type: setFlag, id: w07, value: 支援 }
              - { type: adjustAttribute, attribute: intellect, value: 3 }
              - { type: unlockSkill, skillId: sk-investigation }
            nextEventId: ev-w08
          - id: opt-w07-4
            text: 独狼流 —— 你不想指望任何人，也不想被任何人指望
            effects:
              - { type: setFlag, id: w07, value: 独狼 }
              - { type: setFlag, id: lone, value: true }
              - { type: adjustAttribute, attribute: agility, value: 4 }
              - { type: adjustMood, value: -3 }
            nextEventId: ev-w08

  # ---------- 第八步：性格 ----------

  - id: ev-w08
    title: 性格
    narrative: 第八格是别人眼里的你。你还没开口，教室里的人已经对你有了判断。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w08-1
            text: 温和 —— 会有人愿意坐到你旁边
            effects:
              - { type: setFlag, id: w08, value: 温和 }
              - { type: adjustMood, value: 6 }
              - { type: adjustRelation, npcId: npc-geto, value: 4 }
              - { type: adjustRelation, npcId: npc-nanami, value: 3 }
              - { type: adjustRelation, npcId: npc-haibara, value: 3 }
            nextEventId: ev-w09
          - id: opt-w08-2
            text: 尖锐 —— 你说话不太好听，但没人敢走神
            effects:
              - { type: setFlag, id: w08, value: 尖锐 }
              - { type: adjustAttribute, attribute: reputation, value: 4 }
              - { type: adjustRelation, npcId: npc-nanami, value: -2 }
              - { type: adjustRelation, npcId: npc-gojo, value: 4 }
            nextEventId: ev-w09
          - id: opt-w08-3
            text: 沉默 —— 你更愿意听
            effects:
              - { type: setFlag, id: w08, value: 沉默 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustAttribute, attribute: luck, value: 1 }
            nextEventId: ev-w09
          - id: opt-w08-4
            text: 有点疯 —— 别人退的时候你会往前一步
            effects:
              - { type: setFlag, id: w08, value: 疯 }
              - { type: setFlag, id: reckless, value: true }
              - { type: adjustAttribute, attribute: agility, value: 3 }
              - { type: adjustMood, value: 4 }
              - { type: adjustAttribute, attribute: reputation, value: -2 }
            nextEventId: ev-w09

  # ---------- 第九步：引路人（师承） ----------

  - id: ev-w09
    title: 引路人
    narrative: 第九格不是「师父」——高专没有师徒制。这一格写的是：谁会在你走错路的时候，多看你一眼。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w09-1
            text: 夜蛾正道 —— 班主任。他会骂你，也会替你挡事
            effects:
              - { type: setFlag, id: w09, value: 夜蛾 }
              - { type: setFlag, id: mentor, value: yaga }
              - { type: adjustRelation, npcId: npc-yaga, value: 15 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
            nextEventId: ev-w10
          - id: opt-w09-2
            text: 五条悟 —— 学长。教你打架，也教你不上课
            effects:
              - { type: setFlag, id: w09, value: 五条 }
              - { type: setFlag, id: mentor, value: gojo }
              - { type: adjustRelation, npcId: npc-gojo, value: 14 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 3 }
            nextEventId: ev-w10
          - id: opt-w09-3
            text: 夏油杰 —— 学长。他讲的道理你听得进去
            effects:
              - { type: setFlag, id: w09, value: 夏油 }
              - { type: setFlag, id: mentor, value: geto }
              - { type: adjustRelation, npcId: npc-geto, value: 14 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
            nextEventId: ev-w10
          - id: opt-w09-4
            text: 家入硝子 —— 校医。她只教你一件事：怎么活着回来
            effects:
              - { type: setFlag, id: w09, value: 硝子 }
              - { type: setFlag, id: mentor, value: shoko }
              - { type: adjustRelation, npcId: npc-shoko, value: 14 }
              - { type: unlockSkill, skillId: sk-curtain }
            nextEventId: ev-w10

  # ---------- 第十步：动机 ----------

  - id: ev-w10
    title: 动机
    narrative: 第十格问的是「为什么」。这个答案不会写在你的档案上，但会写在每一次你选择往前而不是往后的瞬间。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-w10-1
            text: 因为有人需要被救
            effects:
              - { type: setFlag, id: w10, value: 救人 }
              - { type: setFlag, id: motive, value: save }
              - { type: adjustMood, value: 6 }
              - { type: adjustRelation, npcId: npc-haibara, value: 4 }
            nextEventId: ev-w11
          - id: opt-w10-2
            text: 因为我想变强，强到没人能决定我的命
            effects:
              - { type: setFlag, id: w10, value: 变强 }
              - { type: setFlag, id: motive, value: strong }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 3 }
              - { type: adjustRelation, npcId: npc-gojo, value: 4 }
            nextEventId: ev-w11
          - id: opt-w10-3
            text: 因为我想知道人为什么会变成咒灵
            effects:
              - { type: setFlag, id: w10, value: 求知 }
              - { type: setFlag, id: motive, value: truth }
              - { type: adjustAttribute, attribute: intellect, value: 3 }
              - { type: adjustRelation, npcId: npc-geto, value: 4 }
            nextEventId: ev-w11
          - id: opt-w10-4
            text: 因为我没有别的地方可去
            effects:
              - { type: setFlag, id: w10, value: 活命 }
              - { type: setFlag, id: motive, value: survive }
              - { type: adjustAttribute, attribute: luck, value: 2 }
              - { type: adjustMood, value: -4 }
            nextEventId: ev-w11

  # ---------- 第十一步：代价 ----------

  - id: ev-w11
    title: 代价
    narrative: 第十一格是账单。命数转盘从不做慈善——你得到的每一样东西，都从别的地方扣。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:

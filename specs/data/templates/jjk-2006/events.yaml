# JJK 世界模板 · events.yaml（第二部分：第一~四章 · 2006 星浆体 / 2007 苦夏 / 2017 百鬼夜行 / 2018 少年院）

  # ══════════════════════════════════════════════════════════════
  # 五、第一章 · 怀玉（2006 年 8 月 · 星浆体护卫）
  # ══════════════════════════════════════════════════════════════

  - id: ev-ch1-gate
    title: 第一章 · 星浆体
    narrative: 2006 年 8 月 8 日。夜蛾把一份没有编号的文件拍在桌上：天内理子，十四岁，星浆体。三天后她要在薨星宫与天元同化。护卫由五条和夏油负责——他问你要不要跟去。
    trigger:
      source: pool
      probability: 1
      priority: 100
      once: true
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: chapter, eq: 1 }
        - { flag: ready1, eq: true }
        - { flag: spDone, ne: true }
        - { status: injured-sim, present: false }
        - { status: exhausted, present: false }
        - { time: { gte: { value: 215, unit: day } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch1-join
            text: 跟去。你想看看真正的任务长什么样
            effects:
              - { type: setFlag, id: ready1, value: false }
              - { type: setFlag, id: chapter, value: 2 }
              - { type: setFlag, id: spJoined, value: true }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-sp-01
          - id: opt-ch1-stay
            text: 留在学校。一年生不该上这种场面
            effects:
              - { type: setFlag, id: ready1, value: false }
              - { type: setFlag, id: chapter, value: 2 }
              - { type: setFlag, id: spJoined, value: false }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
            nextEventId: ev-sp-00

  - id: ev-sp-00
    title: 留守
    narrative: 他们走后的第二天，高专安静得不像话。第三天下午，你的手机震了一下——是五条发来的，只有四个字：「出事了。」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp0-go
            text: 冲出去
            effects:
              - { type: setFlag, id: spLate, value: true }
              - { type: adjustMood, value: -6 }
            # 「没打」= 留守线上的你赶到时，五条已经躺在血里、甚尔已经越过防线：
            # 你根本没有和他交手的机会，直接进悲剧线的台阶现场（ev-sp-04）。
            # 这样第一章的战斗只属于「跟去」的那条线，胜负也才有意义。
            nextEventId: ev-sp-04
          - id: opt-sp0-wait
            text: 守住学校——这里不能也空了
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustRelation, npcId: npc-yaga, value: 4 }
            # 因果纪律：你不在薨星宫，就不能目击现场。这里走「事后才知道」的分支
            # （ev-sp-00b），不跳到 ev-sp-05b 的现场细节里。
            nextEventId: ev-sp-00b

  # 留守线的收尾：全部信息都来自通报与事后转述，没有任何「你看着她死在台阶上」的细节。
  - id: ev-sp-00b
    title: 通报
    narrative: 消息是分三次到的。第一次说「任务出了问题」，第二次说「五条重伤」，第三次只有一行编号和一句「星浆体未能完成同化」。没有人告诉你台阶上到底发生了什么，你也没有问。三天后，高专降了半旗。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp0b-grave
            text: 去薨星宫，在台阶下放一束花
            effects:
              - { type: setFlag, id: rikoDead, value: true }
              # 生死只由同一处事实驱动：写 rikoDead 的同一组 effects 里同时落 lifecycle。
              # 留守线拿到的只是一行通报，但她确实死了（被甚尔枪杀），cause 与 ev-sp-05b 一致。
              - { type: setNpcLifecycle, npcId: npc-riko, state: inactive, reasonCode: 阵亡 }
              - { type: setFlag, id: hasGrave, value: true }
              - { type: applyStatus, status: grief, stacks: 1 }
              - { type: adjustRelation, npcId: npc-nanami, value: 4 }
              - { type: adjustMood, value: -14 }
            nextEventId: ev-sp-06
          - id: opt-sp0b-work
            text: 留在学校，把这件事咽下去
            effects:
              - { type: setFlag, id: rikoDead, value: true }
              - { type: setNpcLifecycle, npcId: npc-riko, state: inactive, reasonCode: 阵亡 }
              - { type: setFlag, id: swallowedIt, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 3 }
              - { type: adjustRelation, npcId: npc-yaga, value: 5 }
              - { type: adjustMood, value: -16 }
            nextEventId: ev-sp-06

  - id: ev-sp-01
    title: 队伍
    narrative: 理子比照片上更小。她抱着一个帆布包，努力把下巴抬得很高。「我不需要人保护。」她说。五条在旁边笑得很大声。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp1-body
            text: 贴身跟着她。一步都不离开
            effects:
              - { type: setFlag, id: spRole, value: body }
              - { type: setFlag, id: rikoBond, value: true }
              - { type: adjustRelation, npcId: npc-riko, value: 10 }
              - { type: adjustMood, value: 3 }
            nextEventId: ev-sp-02
          - id: opt-sp1-scout
            text: 走在外圈。你想先看见要来的人
            effects:
              - { type: setFlag, id: spRole, value: scout }
              - { type: adjustAttribute, attribute: agility, value: 1 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
            nextEventId: ev-sp-02
          - id: opt-sp1-mole
            text: 先查一件事：盘星教怎么知道路线的
            effects:
              - { type: setFlag, id: spRole, value: mole }
              - { type: setFlag, id: moleHint, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustRelation, npcId: npc-geto, value: 3 }
            nextEventId: ev-sp-02

  - id: ev-sp-02
    title: 薨星宫前夜
    narrative: 同化定在明天中午。今晚是最后一夜。理子坐在台阶上，把帆布包抱在膝盖上，一动不动。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp2-vigil
            text: 通宵警戒
            effects:
              - { type: setFlag, id: spAware, value: true }
              - { type: adjustMood, value: -5 }
              - { type: applyStatus, status: exhausted, stacks: 1 }
            nextEventId: ev-sp-03
          - id: opt-sp2-talk
            text: 陪她说说话
            effects:
              - { type: setFlag, id: rikoBond, value: true }
              - { type: setFlag, id: rikoWish, value: true }
              - { type: adjustRelation, npcId: npc-riko, value: 12 }
              - { type: adjustMood, value: 5 }
            nextEventId: ev-sp-03
          - id: opt-sp2-sleep
            text: 睡一觉。明天需要力气
            effects:
              - { type: adjustResource, resource: hp, value: 30 }
              - { type: adjustResource, resource: mp, value: 20 }
            nextEventId: ev-sp-03

  - id: ev-sp-03
    title: 术师杀手
    narrative: 他进来的时候没有声音。没有咒力，没有预兆——只有一把刀从背后穿进五条的胸口。夏油喊了一声，你才意识到自己已经在发抖。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-toji, levelScale: 1.15 }
        allies:
          - { ref: npc-geto, levelScale: 0.9 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: tojiBeaten, value: true }
            - { type: setFlag, id: metToji, value: true }
            - { type: adjustAttribute, attribute: reputation, value: 5 }
            - { type: adjustMood, value: 4 }
          # 因果纪律：第一章唯一的战斗，胜负必须改变后续——赢了由 ev-sp-04a 接，
          # 你挡在台阶前、理子还有救；输了才走原来的悲剧线 ev-sp-04。
          nextEventId: ev-sp-04a
        onDefeat:
          effects:
            - { type: setFlag, id: metToji, value: true }
            - { type: setFlag, id: tojiBeaten, value: false }
            - { type: applyStatus, status: injured-sim, stacks: 1 }
            - { type: adjustMood, value: -12 }
          nextEventId: ev-sp-04

  # 胜利线：甚尔没能越过你，因此「台阶上的一瞬间」由你决定。
  - id: ev-sp-04a
    title: 你把他挡住了
    narrative: 他倒在地上的时候，脸上第一次有了表情——不是痛，是意外。你回过头，理子站在台阶上，白色的裙子被风吹起来，正看着你。她还在。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp4a-shield
            text: 挡在她身前
            effects:
              - { type: setFlag, id: savedRiko, value: true }
              - { type: applyStatus, status: injured-sim, stacks: 1 }
              - { type: adjustAttribute, attribute: reputation, value: 8 }
              - { type: adjustRelation, npcId: npc-riko, value: 10 }
              - { type: adjustMood, value: 6 }
            nextEventId: ev-sp-05a
          - id: opt-sp4a-chase
            text: 先追上去，把甚尔彻底按住
            effects:
              - { type: setFlag, id: tojiCaptured, value: true }
              - { type: adjustFlag, id: truthBits, value: 3 }
              - { type: setFlag, id: metToji, value: true }
              - { type: adjustAttribute, attribute: agility, value: 2 }
              - { type: adjustMood, value: -4 }
            # 代价：你去追人的那几分钟，盘星教的人从另一侧带走了她。
            nextEventId: ev-sp-05b

  - id: ev-sp-04
    title: 台阶上的一瞬间
    narrative: 甚尔已经越过防线。理子站在薨星宫的台阶上，白色的裙子被风吹起来。你只有一瞬间——真的只有一瞬间。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp4-shield
            text: 挡在她身前
            visibleWhen:
              - { flag: spAware, eq: true }
              - { attribute: physique, gte: 8 }
            effects:
              - { type: setFlag, id: savedRiko, value: true }
              - { type: applyStatus, status: injured-sim, stacks: 1 }
              - { type: adjustAttribute, attribute: reputation, value: 8 }
              - { type: adjustMood, value: -6 }
            nextEventId: ev-sp-05a
          - id: opt-sp4-push
            text: 扑向甚尔，把他撞开
            effects:
              - { type: setFlag, id: spHurt, value: true }
              - { type: applyStatus, status: injured-sim, stacks: 1 }
              - { type: adjustAttribute, attribute: physique, value: 2 }
              - { type: adjustMood, value: -14 }
            nextEventId: ev-sp-05b
          - id: opt-sp4-freeze
            text: 动不了
            effects:
              - { type: setFlag, id: froze, value: true }
              - { type: adjustMood, value: -18 }
            nextEventId: ev-sp-05b

  - id: ev-sp-05a
    title: 她活着
    narrative: 子弹打进了你的肩膀。理子在你身后，呼吸声大得像在喊。她活着。但天元还在薨星宫深处等——同化意味着「天内理子」这个人从此不存在。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp5a-sacrifice
            text: 送她去同化。这是她生下来的意义
            effects:
              - { type: setFlag, id: rikoSacrificed, value: true }
              - { type: setFlag, id: savedRiko, value: false }
              # 「天内理子」这个人从此不存在——不是被杀，是被同化；cause 用更准确的词，
              # 与「阵亡」区分开（引擎不对 reasonCode 分支，只存下来给面板看）。
              - { type: setNpcLifecycle, npcId: npc-riko, state: inactive, reasonCode: 被同化 }
              - { type: adjustFlag, id: getoDoubt, value: 2 }
              - { type: adjustMood, value: -14 }
              - { type: log, text: 天内理子在同化中消失。 , visibility: public }
            nextEventId: ev-sp-06
          - id: opt-sp5a-escape
            text: 带她走。让天元自己想办法
            effects:
              - { type: setFlag, id: rikoEscaped, value: true }
              - { type: setFlag, id: tenjinEvolved, value: true }
              # 与上一格对称：把「她仍活着」写成显式事实，避免以后有人在 ev-sp-05a 入口
              # 统一落死亡时把「救下」这条误标成死。幂等（此处本来就 alive）。
              - { type: setNpcLifecycle, npcId: npc-riko, state: alive }
              - { type: adjustRelation, npcId: npc-riko, value: 20 }
              - { type: adjustRelation, npcId: npc-geto, value: 8 }
              - { type: adjustFlag, id: getoDoubt, value: -3 }
              - { type: adjustAttribute, attribute: reputation, value: -6 }
              - { type: adjustMood, value: 8 }
              - { type: log, text: 你带走了星浆体。天元被迫独自进化。 , visibility: public }
            nextEventId: ev-sp-06

  - id: ev-sp-05b
    title: 鼓掌
    narrative: 她死在台阶上。一枪，很轻的一声。甚尔收起枪走了，像干完一件普通的活。薨星宫外，盘星教的信徒们开始鼓掌——他们在为「星浆体没有同化」欢呼。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp5b-chase
            text: 去追甚尔
            effects:
              - { type: setFlag, id: rikoDead, value: true }
              # 她死在台阶上（被甚尔一枪）：与 rikoDead 同一组 effects，cause 统一用「阵亡」。
              - { type: setNpcLifecycle, npcId: npc-riko, state: inactive, reasonCode: 阵亡 }
              - { type: adjustAttribute, attribute: agility, value: 2 }
              - { type: adjustMood, value: -10 }
            nextEventId: ev-sp-06
          - id: opt-sp5b-geto
            text: 站到夏油旁边。他一句话都没说
            effects:
              - { type: setFlag, id: rikoDead, value: true }
              - { type: setNpcLifecycle, npcId: npc-riko, state: inactive, reasonCode: 阵亡 }
              - { type: adjustRelation, npcId: npc-geto, value: 8 }
              - { type: adjustFlag, id: getoDoubt, value: 3 }
              - { type: adjustMood, value: -12 }
            nextEventId: ev-sp-06
          - id: opt-sp5b-alone
            text: 一个人走开
            effects:
              - { type: setFlag, id: rikoDead, value: true }
              - { type: setNpcLifecycle, npcId: npc-riko, state: inactive, reasonCode: 阵亡 }
              - { type: setFlag, id: hasGrave, value: true }
              - { type: applyStatus, status: grief, stacks: 1 }
              - { type: adjustMood, value: -16 }
            nextEventId: ev-sp-06

  - id: ev-sp-06
    title: 那年夏天结束了
    narrative: 五条活了下来——他说是「反转术式」，语气轻松得像在讲别人的事，然后他一个人去把甚尔解决了。夏油开始不吃饭。八月的最后一天，高专的蝉声忽然就停了。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp6-go
            text: 把这件事收进心里
            effects:
              - { type: setFlag, id: spDone, value: true }
              - { type: setFlag, id: ready2, value: true }
              - { type: setFlag, id: chapter, value: 3 }
              - { type: adjustMood, value: -4 }
              - { type: advanceTo, value: { value: 518, unit: day } }
              - { type: log, text: 2006 年夏 · 怀玉篇结束。 , visibility: public }
          - id: opt-sp6-sit
            text: 去找夏油，陪他把这个夏天坐完
            effects:
              - { type: setFlag, id: spDone, value: true }
              - { type: setFlag, id: ready2, value: true }
              - { type: setFlag, id: chapter, value: 3 }
              - { type: adjustRelation, npcId: npc-geto, value: 7 }
              - { type: adjustFlag, id: getoDoubt, value: -2 }
              - { type: adjustMood, value: -1 }
              - { type: advanceTo, value: { value: 518, unit: day } }
              - { type: log, text: 2006 年夏 · 怀玉篇结束。 , visibility: public }

  # ══════════════════════════════════════════════════════════════
  # 六、第二章 · 玉折（2007 年 6 月 · 苦夏）
  # ══════════════════════════════════════════════════════════════

  - id: ev-ch2-gate
    title: 第二章 · 苦夏
    narrative: 2007 年 6 月 15 日。梅雨。夏油已经两周没来上课了。今天的委托单上写着一个村子：全体村民失踪。
    trigger:
      source: pool
      probability: 1
      priority: 100
      once: true
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: chapter, eq: 3 }
        - { flag: ready2, eq: true }
        - { flag: bsDone, ne: true }
        - { status: injured-sim, present: false }
        - { status: exhausted, present: false }
        - { time: { gte: { value: 526, unit: day } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-take
            text: 接下这份委托
            effects:
              - { type: setFlag, id: ready2, value: false }
              - { type: setFlag, id: chapter, value: 4 }
            nextEventId: ev-bs-01
          - id: opt-ch2-find
            text: 先去找夏油。你有点不安
            visibleWhen:
              - { relation: npc-geto, gte: 14 }
              - { flag: getoGone, ne: true }
            effects:
              - { type: setFlag, id: ready2, value: false }
              - { type: setFlag, id: chapter, value: 4 }
              - { type: setFlag, id: lookedForGeto, value: true }
            nextEventId: ev-bs-00

  - id: ev-bs-00
    title: 三天没回来的人
    narrative: 宿舍里没人。桌上摊着一本翻到一半的书，茶杯里的茶早就冷了。你去问夜蛾，他沉默了很久，说：「夏油最近在看一些……不太好的东西。」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-bs0-follow
            text: 沿着委托单上的地址追过去
            effects:
              - { type: setFlag, id: followedGeto, value: true }
              - { type: setFlag, id: spAware, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
            nextEventId: ev-bs-01
          - id: opt-bs0-report
            text: 把这件事报告给夜蛾
            effects:
              - { type: adjustRelation, npcId: npc-yaga, value: 4 }
              - { type: adjustAttribute, attribute: reputation, value: 3 }
              - { type: adjustRelation, npcId: npc-geto, value: -6 }
            nextEventId: ev-bs-01

  - id: ev-bs-01
    title: 一百一十二
    narrative: 村子里没有人。一百一十二具尸体被整整齐齐地排在广场上，没有一具是完整的。两个女孩缩在竹笼里发抖。夏油站在广场中央，袈裟上全是血。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-bs1-stop
            text: 「夏油学长。住手。」
            effects:
              - { type: setFlag, id: bsConfront, value: true }
              - { type: adjustRelation, npcId: npc-geto, value: 2 }
              - { type: adjustMood, value: -12 }
            nextEventId: ev-bs-02
          - id: opt-bs1-help
            text: 帮他把笼子里的女孩放出来
            effects:
              - { type: setFlag, id: helpedGeto, value: true }
              - { type: adjustRelation, npcId: npc-geto, value: 6 }
              - { type: adjustFlag, id: getoDoubt, value: 2 }
              - { type: adjustMood, value: -14 }
            nextEventId: ev-bs-02
          - id: opt-bs1-leave
            text: 转身就走
            effects:
              - { type: setFlag, id: walkedAway, value: true }
              - { type: applyStatus, status: grief, stacks: 1 }
              - { type: adjustMood, value: -16 }
            nextEventId: ev-bs-02

  - id: ev-bs-02
    title: 对峙
    narrative: 「他们虐杀了两个术师的孩子。」夏油说得很平静，「而这里的村民，就是咒灵诞生的土壤。你说，我杀的是人，还是诅咒？」他没有看你，像在问自己。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-bs2-stop
            text: 「跟我回去。就算你现在是对的，也不该一个人站在这里。」
            visibleWhen:
              - { relation: npc-geto, gte: 20 }
              - { flag: getoDoubt, lte: 2 }
            effects:
              - { type: setFlag, id: getoStayed, value: true }
              - { type: adjustRelation, npcId: npc-geto, value: 15 }
              - { type: adjustFlag, id: getoDoubt, value: -4 }
              - { type: adjustMood, value: 6 }
            nextEventId: ev-bs-03a
          - id: opt-bs2-listen
            text: 听他说完
            effects:
              - { type: setFlag, id: getoGone, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustFlag, id: getoDoubt, value: 3 }
              - { type: adjustMood, value: -10 }
            nextEventId: ev-bs-03b
          - id: opt-bs2-report
            text: 通知高层
            effects:
              - { type: setFlag, id: getoGone, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 8 }
              - { type: adjustRelation, npcId: npc-geto, value: -25 }
              - { type: adjustRelation, npcId: npc-gojo, value: -6 }
              - { type: adjustMood, value: -12 }
            nextEventId: ev-bs-03c
          - id: opt-bs2-join
            text: 「……我跟你走。」
            effects:
              - { type: setFlag, id: defected, value: true }
              - { type: setFlag, id: getoGone, value: true }
              - { type: adjustRelation, npcId: npc-geto, value: 20 }
              - { type: adjustRelation, npcId: npc-gojo, value: -30 }
              - { type: adjustAttribute, attribute: reputation, value: -25 }
            # P0 修复：叛逃不再是「跳去参加葬礼然后照旧当高专术师」。
            # 入口接回原本无人指向的 ev-bs-03d（编号保留），由它带出叛逃专属线 ev-df-*。
            nextEventId: ev-bs-03d

  - id: ev-bs-03a
    title: 你把他留下了
    narrative: 你们在村口的石阶上坐到天亮。他一句话都没说，你也没说。太阳出来的时候，他把沾血的袈裟脱下来，扔进沟里。「……我大概疯了。」他说，「谢谢你没让我一个人疯完。」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-bs3a-go
            text: 跟他一起回高专
            effects:
              - { type: setFlag, id: getoStayed, value: true }
              - { type: adjustRelation, npcId: npc-geto, value: 10 }
              - { type: adjustRelation, npcId: npc-gojo, value: 5 }
              - { type: adjustAttribute, attribute: reputation, value: 5 }
              - { type: adjustMood, value: 8 }
            nextEventId: ev-bs-05

  - id: ev-bs-03b
    title: 苦夏
    narrative: 他说完了。最后他说：「我没办法再保护那些人了。我没办法。」然后他转身走进雨里。你没有追——事后你无数次想起这一步，每次都记不清自己当时到底在想什么。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-bs3b-ack
            text: 站在雨里，看着他走远
            effects:
              - { type: setFlag, id: getoGone, value: true }
              - { type: applyStatus, status: grief, stacks: 1 }
              - { type: adjustMood, value: -14 }
              - { type: setFlag, id: hasGrave, value: true }
            nextEventId: ev-bs-05

  - id: ev-bs-03c
    title: 通报
    narrative: 高层的回复只有一个字：「准」。三天后，夏油杰被列为特级诅咒师，格杀勿论。五条来找你，什么也没说，只是看了你很久。「你做得对。」他最后说。听起来像在说服自己。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-bs3c-go
            text: 「……我知道。」
            effects:
              - { type: setFlag, id: getoGone, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 6 }
              - { type: adjustMood, value: -12 }
              - { type: setFlag, id: reportedGeto, value: true }
            nextEventId: ev-bs-05

  - id: ev-bs-03d
    title: 同一条路
    narrative: 你跟着他走了。盘星教的钱、咒灵、信徒，像一条黑色的河。你不会后悔——但夜里醒来时，总会想起高专食堂的三张桌子。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-bs3d-go
            text: 走下去
            effects:
              - { type: setFlag, id: defected, value: true }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 6 }
              - { type: adjustMood, value: -8 }
            nextEventId: ev-df-01
          - id: opt-bs3d-ask
            text: 先问清楚，他到底想做什么
            effects:
              - { type: setFlag, id: defected, value: true }
              - { type: adjustFlag, id: truthBits, value: 2 }
              - { type: adjustRelation, npcId: npc-geto, value: 4 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustMood, value: -6 }
            nextEventId: ev-df-01

  # ══════════════════════════════════════════════════════════════
  # 叛逃专属线（defected=true）· 2007 → 2017 → 2018
  #   与高专线并行：不走 ev-bs-05（灰原葬礼）/ ev-bs-04（十年）/ ev-bs-06 / ev-ch3-gate，
  #   因为一个被划掉名字的人不会站在哀悼的人群里，也不会「回高专」。
  # ══════════════════════════════════════════════════════════════

  - id: ev-df-01
    title: 盘星教的日子
    narrative: 信徒叫你「先生」。钱、咒灵、人脉，夏油一样一样交到你手上。第一次亲手处理掉一个来调查的术师时，你没有手抖——这件事本身让你抖了一下。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-df1-stay
            text: 留下来。这条路你走到底
            effects:
              - { type: setFlag, id: defectedLine, value: stay }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 7 }
              - { type: adjustAttribute, attribute: reputation, value: -8 }
              - { type: adjustRelation, npcId: npc-geto, value: 8 }
              - { type: adjustMood, value: -6 }
            nextEventId: ev-df-02
          - id: opt-df1-double
            text: 留下来，但开始给自己留一条后路
            effects:
              - { type: setFlag, id: defectedLine, value: double }
              - { type: setFlag, id: doubleAgent, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 3 }
              - { type: adjustFlag, id: truthBits, value: 3 }
              - { type: adjustMood, value: -4 }
            nextEventId: ev-df-02
          - id: opt-df1-solo
            text: 跟夏油分开。你不想变成他
            effects:
              - { type: setFlag, id: defectedLine, value: solo }
              - { type: adjustRelation, npcId: npc-geto, value: -20 }
              - { type: adjustAttribute, attribute: reputation, value: -4 }
              - { type: adjustAttribute, attribute: luck, value: 3 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-df-02

  - id: ev-df-02
    title: 十年 · 另一条路
    narrative: 十年。高专的名册上，你的名字被一道红线划过，再没人提起。你成了一个传闻——「那个跟夏油走掉的家伙」。有人猜你死了，有人猜你才是盘星教真正的主人。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-df2-boss
            text: 做盘星教的干部。让传闻再重一点
            effects:
              - { type: setFlag, id: dfRole, value: boss }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 10 }
              - { type: adjustAttribute, attribute: reputation, value: -14 }
              - { type: adjustMood, value: -4 }
              # 世界事实不因玩家缺席而取消：2007 年 12 月灰原战死。
              # 叛逃线拿不到葬礼（不走 ev-bs-05），只有旧频道里漏出来的一句话。
              - { type: setFlag, id: haibaraDead, value: true }
              - { type: setNpcLifecycle, npcId: npc-haibara, state: inactive, reasonCode: 阵亡 }
              - { type: setFlag, id: hasGrave, value: true }
            nextEventId: ev-df-03
          - id: opt-df2-double
            text: 做两面的人。情报卖给出价高的那一边
            effects:
              - { type: setFlag, id: dfRole, value: double }
              - { type: adjustAttribute, attribute: intellect, value: 6 }
              - { type: adjustFlag, id: truthBits, value: 4 }
              - { type: adjustAttribute, attribute: luck, value: 4 }
              # 同上：灰原的死在叛逃线里也是事实
              - { type: setFlag, id: haibaraDead, value: true }
              - { type: setNpcLifecycle, npcId: npc-haibara, state: inactive, reasonCode: 阵亡 }
              - { type: setFlag, id: hasGrave, value: true }
            nextEventId: ev-df-03
          - id: opt-df2-hide
            text: 躲起来。做几年普通人
            effects:
              - { type: setFlag, id: dfRole, value: hide }
              - { type: setFlag, id: leftJujutsu, value: true }
              - { type: adjustAttribute, attribute: reputation, value: -10 }
              - { type: adjustAttribute, attribute: luck, value: 4 }
              - { type: adjustMood, value: 12 }
              # 同上：灰原的死在叛逃线里也是事实
              - { type: setFlag, id: haibaraDead, value: true }
              - { type: setNpcLifecycle, npcId: npc-haibara, state: inactive, reasonCode: 阵亡 }
              - { type: setFlag, id: hasGrave, value: true }
            nextEventId: ev-df-03

  - id: ev-df-03
    title: 平安夜 · 另一边
    narrative: 2017 年 12 月 24 日。上百只咒灵从新宿方向涌来，你在它们这一侧。高专的结界在远处亮起来，像一场不属于你的烟火。频道里有人在喊五条的名字。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-df3-raid
            text: 跟着咒灵走。今晚之后，你就是高专的敌人
            effects:
              - { type: setFlag, id: defectedRaided, value: true }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 6 }
              - { type: adjustAttribute, attribute: reputation, value: -10 }
              - { type: adjustMood, value: -10 }
            nextEventId: ev-df-04
          - id: opt-df3-warn
            text: 把今晚的路线传到高专的旧频道
            effects:
              - { type: setFlag, id: warnedJujutsu, value: true }
              - { type: adjustFlag, id: truthBits, value: 3 }
              - { type: adjustRelation, npcId: npc-gojo, value: 5 }
              - { type: adjustAttribute, attribute: reputation, value: 4 }
              - { type: adjustMood, value: -4 }
            nextEventId: ev-df-04
          - id: opt-df3-watch
            text: 站在楼顶，谁也不帮
            effects:
              - { type: setFlag, id: watchedParade, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustMood, value: -8 }
            nextEventId: ev-df-04

  # 叛逃线跳过第四章（少年院）——你不在名册上，没人会派你去带一年级。
  - id: ev-df-04
    title: 2018 · 没有名册的一年
    narrative: 2018 年。虎杖悠仁吞下手指的新闻在诅咒师之间传得比高专还快。你看着那张照片，忽然意识到自己已经十年没见过「一年级」这个词后面跟着的名字了。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-df4-go
            text: 等着十月的到来。这次你会在场
            effects:
              - { type: setFlag, id: bsDone, value: true }
              - { type: setFlag, id: npDone, value: true }
              - { type: setFlag, id: jvDone, value: true }
              - { type: setFlag, id: era, value: 3 }
              - { type: setFlag, id: ready5, value: true }
              - { type: setFlag, id: chapter, value: 9 }
              - { type: adjustMood, value: -4 }
              - { type: advanceTo, value: { value: 4680, unit: day } }
              - { type: log, text: 2018 年 10 月 · 涩谷。 , visibility: public }
          - id: opt-df4-hide
            text: 换一座城市。这件事不该有你
            effects:
              - { type: setFlag, id: bsDone, value: true }
              - { type: setFlag, id: npDone, value: true }
              - { type: setFlag, id: jvDone, value: true }
              - { type: setFlag, id: era, value: 3 }
              - { type: setFlag, id: ready5, value: true }
              - { type: setFlag, id: chapter, value: 9 }
              - { type: setFlag, id: dfLeftTokyo, value: true }
              - { type: adjustAttribute, attribute: luck, value: 3 }
              - { type: adjustMood, value: 6 }
              - { type: advanceTo, value: { value: 4680, unit: day } }
              - { type: log, text: 2018 年 10 月 · 涩谷。 , visibility: public }

  - id: ev-bs-05
    title: 灰原
    narrative: 2007 年 12 月，灰原雄在一次任务中战死。报告上写着「遭遇特级咒灵，殉职」。七海在葬礼上没有哭，只是把手里的伞握断了。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-bs5-see
            text: 去看他最后一眼
            effects:
              - { type: setFlag, id: haibaraDead, value: true }
              # 生命周期（ADR-0012/ADR-0020）：灰原确认阵亡 ⇒ inactive；
              # 其后对他的 adjustRelation 会被自动冻结（单向棘轮），人物面板显示「已故 · 阵亡」
              - { type: setNpcLifecycle, npcId: npc-haibara, state: inactive, reasonCode: 阵亡 }
              - { type: setFlag, id: hasGrave, value: true }
              - { type: applyStatus, status: grief, stacks: 1 }
              - { type: adjustMood, value: -14 }
              - { type: adjustRelation, npcId: npc-nanami, value: 6 }
            nextEventId: ev-bs-04
          - id: opt-bs5-deny
            text: 去现场。你不信「特级咒灵」这四个字
            effects:
              - { type: setFlag, id: haibaraDead, value: true }
              # 生命周期（ADR-0012/ADR-0020）：灰原确认阵亡 ⇒ inactive；
              # 其后对他的 adjustRelation 会被自动冻结（单向棘轮），人物面板显示「已故 · 阵亡」
              - { type: setNpcLifecycle, npcId: npc-haibara, state: inactive, reasonCode: 阵亡 }
              - { type: setFlag, id: hasGrave, value: true }
              - { type: setFlag, id: truthBits, value: 2 }
              - { type: applyStatus, status: grief, stacks: 1 }
              - { type: adjustMood, value: -18 }
            nextEventId: ev-bs-04

  - id: ev-bs-04
    title: 十年
    narrative: 接下来的十年过得很快。快到你后来回想时，只剩几个画面：夏天的训练场、冬天的墓园、某次任务结束后便利店的灯。你从一个一年生，变成了别人口中的「前辈」。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-bs4-front
            text: 一直在前线。用任务填满每一年
            effects:
              - { type: setFlag, id: montage, value: front }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 9 }
              - { type: adjustAttribute, attribute: physique, value: 4 }
              - { type: adjustAttribute, attribute: reputation, value: 12 }
              - { type: adjustFlag, id: missionsCompleted, value: 20 }
            nextEventId: ev-bs-06
          - id: opt-bs4-teach
            text: 留在高专，带一届又一届的新人
            effects:
              - { type: setFlag, id: montage, value: teach }
              - { type: adjustAttribute, attribute: intellect, value: 5 }
              - { type: setFlag, id: hasKouhai, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 8 }
              - { type: adjustMood, value: 6 }
            nextEventId: ev-bs-06
          - id: opt-bs4-study
            text: 钻进档案室，研究咒灵、咒物与那个「缝合线」
            effects:
              - { type: setFlag, id: montage, value: study }
              - { type: setFlag, id: truthBits, value: 4 }
              - { type: adjustAttribute, attribute: intellect, value: 7 }
              - { type: applyStatus, status: resolved, stacks: 1 }
            nextEventId: ev-bs-06
          - id: opt-bs4-leave
            text: 离开咒术界几年。去过普通人的日子
            effects:
              - { type: setFlag, id: montage, value: leave }
              - { type: setFlag, id: leftJujutsu, value: true }
              - { type: adjustMood, value: 14 }
              - { type: adjustAttribute, attribute: reputation, value: -12 }
              - { type: adjustAttribute, attribute: luck, value: 4 }
            nextEventId: ev-bs-06

  - id: ev-bs-06
    title: 2017 年 12 月
    narrative: 2017 年 12 月。东京的天空比十年前更亮，也更冷。高专的通讯频道里在传同一件事：有人要来抢一件东西，而那个人穿着袈裟。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-bs6-go
            text: 回高专
            effects:
              - { type: setFlag, id: bsDone, value: true }
              - { type: setFlag, id: era, value: 2 }
              - { type: setFlag, id: ready3, value: true }
              - { type: setFlag, id: chapter, value: 5 }
              - { type: advanceTo, value: { value: 4352, unit: day } }
              - { type: log, text: 2007–2017 · 十年。（选择决定了你成为什么样的人） , visibility: public }
          - id: opt-bs6-grave
            text: 先绕去墓园，再回高专
            effects:
              - { type: setFlag, id: bsDone, value: true }
              - { type: setFlag, id: era, value: 2 }
              - { type: setFlag, id: ready3, value: true }
              - { type: setFlag, id: chapter, value: 5 }
              - { type: setFlag, id: visitedGrave, value: true }
              - { type: adjustRelation, npcId: npc-nanami, value: 6 }
              - { type: adjustFlag, id: resolveDepth, value: 1 }
              - { type: adjustMood, value: 5 }
              - { type: advanceTo, value: { value: 4352, unit: day } }
              - { type: log, text: 2007–2017 · 十年。（选择决定了你成为什么样的人） , visibility: public }
# JJK 世界模板 · events.yaml（第三部分：第五章~终章 · 2017 百鬼夜行 / 2018 涩谷 / 死灭回游 / 新宿决战）

  # ══════════════════════════════════════════════════════════════
  # 七、第三章 · 百鬼夜行（2017 年 12 月 24 日 · 咒术回战 0）
  # ══════════════════════════════════════════════════════════════

  - id: ev-ch3-gate
    title: 第三章 · 百鬼夜行
    narrative: 2017 年 12 月 24 日，平安夜。高专的结界在十九点整被撕开。上百只咒灵从新宿方向涌来，而它们的指挥者，穿了一件你很熟悉的袈裟。
    trigger:
      source: pool
      probability: 1
      priority: 100
      once: true
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: chapter, eq: 5 }
        - { flag: ready3, eq: true }
        - { flag: npDone, ne: true }
        - { status: injured-sim, present: false }
        - { status: exhausted, present: false }
        - { time: { gte: { value: 4370, unit: day } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch3-school
            text: 回高专。防线在那里
            effects:
              - { type: setFlag, id: ready3, value: false }
              - { type: setFlag, id: chapter, value: 6 }
              - { type: setFlag, id: npLine, value: school }
            nextEventId: ev-np-01
          - id: opt-ch3-city
            text: 去新宿。先救街上的人
            effects:
              - { type: setFlag, id: ready3, value: false }
              - { type: setFlag, id: chapter, value: 6 }
              - { type: setFlag, id: npLine, value: city }
              - { type: adjustAttribute, attribute: reputation, value: 3 }
            nextEventId: ev-np-01

  - id: ev-np-01
    title: 咒灵百鬼
    narrative: 它们从地铁口、从便利店的玻璃门、从你脚下的排水沟里出来。有人在你身后尖叫。你第一次意识到，一百只咒灵同时出现在一条街上是什么声音。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-grade1-curse, levelScale: 0.6 }
          - { ref: enemy-grade2-curse, levelScale: 0.8 }
        canFlee: false
        onVictory:
          effects:
            - { type: adjustFlag, id: missionsCompleted, value: 3 }
            - { type: adjustAttribute, attribute: reputation, value: 5 }
            # 乙骨忧太归国参战（ADR-0022 刷新机制）：第一波咒灵打完，他从海外赶到了。
            # 此前他处于 unspawned（不上屏、不自主行动）；此处转 alive 后，
            # 下面 ev-np-02a / ev-np-02b 的 allies ref 才能判活通过。
            - { type: spawnNpc, ruleId: rule-yuta-arrival }
          nextEventId: ev-np-02
        onDefeat:
          effects:
            - { type: applyStatus, status: injured-sim, stacks: 1 }
            - { type: adjustMood, value: -10 }
            # 同上：胜负都不影响「乙骨到了」这个世界事实。
            - { type: spawnNpc, ruleId: rule-yuta-arrival }
          nextEventId: ev-np-02

  - id: ev-np-02
    title: 穿袈裟的人
    narrative: 他站在十字路口正中。咒灵像潮水一样绕过他。你隔着一条街看清了他的脸。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-np2-kenjaku
            text: 「那不是夏油。」
            visibleWhen:
              - { flag: getoStayed, eq: true }
            effects:
              - { type: setFlag, id: npFoe, value: kenjaku }
              - { type: adjustFlag, id: truthBits, value: 1 }
            nextEventId: ev-np-02b
          - id: opt-np2-geto
            text: 「……学长。」
            visibleWhen:
              - { flag: getoStayed, ne: true }
            effects:
              - { type: setFlag, id: npFoe, value: geto }
              - { type: adjustMood, value: -10 }
            nextEventId: ev-np-02a

  - id: ev-np-02a
    title: 十一年
    narrative: 「好久不见。」夏油说。他的额头有一道缝合的疤，笑起来的时候那道疤没有动。「你长大了。」他说完抬起了手，身后一百只咒灵同时张开了嘴。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-geto-parade, levelScale: 0.85 }
        allies:
          - { ref: npc-yuta, levelScale: 0.7 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: npBeatGeto, value: true }
            - { type: adjustAttribute, attribute: reputation, value: 8 }
          nextEventId: ev-np-03b
        onDefeat:
          effects:
            - { type: setFlag, id: npBeatGeto, value: false }
            - { type: applyStatus, status: injured-sim, stacks: 1 }
          nextEventId: ev-np-03b

  - id: ev-np-02b
    title: 皮
    narrative: 夏油就站在你左边，脸色比雪还白。街对面那个「夏油」笑了，抬手把额上的缝合线扯开——里面不是头骨，是一枚棋子一样的东西。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-kenjaku, levelScale: 0.8 }
        allies:
          - { ref: npc-geto, levelScale: 0.85 }
          - { ref: npc-yuta, levelScale: 0.6 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: kenjakuSeen, value: true }
            - { type: adjustFlag, id: truthBits, value: 3 }
            - { type: adjustAttribute, attribute: reputation, value: 6 }
          nextEventId: ev-np-03a
        onDefeat:
          effects:
            - { type: setFlag, id: kenjakuSeen, value: true }
            - { type: applyStatus, status: injured-sim, stacks: 1 }
          nextEventId: ev-np-03a

  - id: ev-np-03a
    title: 缝合线
    narrative: 那具身体倒下去，从额头的缝里滑出来一枚带着牙的、像脑一样的东西。它落在地上，居然还在说话：「这具身体我用了十年。你们把它弄坏了。」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-np3a-ask
            text: 追问它是什么
            effects:
              - { type: setFlag, id: kenjakuKnown, value: true }
              - { type: adjustFlag, id: truthBits, value: 3 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustMood, value: -6 }
            nextEventId: ev-np-04
          - id: opt-np3a-let
            text: 把它交给五条
            effects:
              - { type: adjustRelation, npcId: npc-gojo, value: 5 }
              - { type: adjustMood, value: -4 }
            nextEventId: ev-np-04

  - id: ev-np-03b
    title: 处决
    narrative: 五条来了。他站在夏油面前，很久没有说话。然后他抬起手，指尖凝起一点光。「最后有什么想说的吗。」他问，声音很轻。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-np3b-block
            text: 挡在他们中间
            visibleWhen:
              - { relation: npc-geto, gte: 15 }
            effects:
              - { type: setFlag, id: savedGeto, value: true }
              - { type: adjustRelation, npcId: npc-gojo, value: -8 }
              - { type: adjustRelation, npcId: npc-geto, value: 10 }
              - { type: adjustAttribute, attribute: reputation, value: -6 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-np-04
          - id: opt-np3b-turn
            text: 转过身去
            effects:
              - { type: setFlag, id: gojoKilledGeto, value: true }
              - { type: applyStatus, status: grief, stacks: 1 }
              - { type: adjustMood, value: -16 }
            nextEventId: ev-np-04
          - id: opt-np3b-self
            text: 「让我来。」
            effects:
              - { type: setFlag, id: playerKilledGeto, value: true }
              - { type: applyStatus, status: grief, stacks: 1 }
              - { type: adjustAttribute, attribute: reputation, value: 5 }
              - { type: adjustMood, value: -24 }
            nextEventId: ev-np-04

  - id: ev-np-04
    title: 平安夜之后
    narrative: 街上的人在收拾碎玻璃。有人在哭，有人在拍照。凌晨三点，高专的走廊一片狼藉。没有人知道那枚「东西」最后去了哪里。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-np4-go
            text: 收拾残局
            effects:
              - { type: setFlag, id: npDone, value: true }
              - { type: setFlag, id: era, value: 3 }
              - { type: setFlag, id: ready4, value: true }
              - { type: setFlag, id: chapter, value: 7 }
              - { type: adjustMood, value: -4 }
              - { type: advanceTo, value: { value: 4531, unit: day } }
              - { type: log, text: 2017 年 12 月 24 日 · 百鬼夜行结束。 , visibility: public }
          # 第二条选项：不同的去向与不同的收获（不是换文案）。
          - id: opt-np4-trail
            text: 先去追那枚「东西」。它不该就这么不见了
            effects:
              - { type: setFlag, id: npDone, value: true }
              - { type: setFlag, id: era, value: 3 }
              - { type: setFlag, id: ready4, value: true }

# JJK Demo 世界模板 · events.yaml
# 事件三段式：trigger（触发） -> kind（类型） -> settle（结算）。
# source: pool 的事件构成世界事件池；chain 为事件链；action-hook 为行动钩子。
events:
  # ---------- 事件池：普通事件（选项支持出现条件） ----------

  - id: ev-curse-sighting
    title: 市区咒灵目击
    narrative: 新宿方向的结界出现波动，有咒灵在夜间袭击行人。
    trigger:
      source: pool
      probability: 0.3
      cooldown: { value: 4, unit: day }
      priority: 10
    kind: normal
    settle:
      normal:
        options:
          - id: opt-investigate
            text: 主动请缨参与调查
            visibleWhen:
              - { requiresSkill: sk-investigation }
            effects:
              - { type: setFlag, id: curseSighting, value: true }
              - { type: adjustFlag, id: investigationProgress, value: 1 }
            nextEventId: ev-curse-investigate
          - id: opt-report
            text: 上报高专，静待安排
            effects:
              - { type: setFlag, id: curseSighting, value: true }
              - { type: startChain, chainId: chain-curse-investigation }

  - id: ev-exchange
    title: 校际交流会预告
    narrative: 校长宣布数月后将举办京都姊妹校交流会，每个人都要选出战成员。
    trigger:
      source: pool
      probability: 0.15
      once: true
      priority: 5
    kind: normal
    settle:
      normal:
        options:
          - id: opt-volunteer
            text: 报名出战
            visibleWhen:
              - { attribute: physique, gte: 5 }
            effects:
              - { type: setFlag, id: exchangeAnnounced, value: true }
              - { type: setFlag, id: "milestone:exchangeAnnounced", value: true }
              - { type: adjustMood, value: 5 }
          - id: opt-wait
            text: 再看看情况
            effects:
              - { type: setFlag, id: exchangeAnnounced, value: true }

  - id: ev-rumor
    title: 神秘传闻
    narrative: 走廊里流传着一个传闻：有人在是与天元相关的遗迹附近，看到了不该出现的人影。
    trigger:
      source: pool
      probability: 0.2
      cooldown: { value: 6, unit: day }
      priority: 3
    kind: normal
    settle:
      normal:
        options:
          - id: opt-listen
            text: 竖起耳朵听仔细
            effects:
              - { type: setFlag, id: rumorHeard, value: true }
          - id: opt-examine-curse
            text: 用咒理知识分析传闻的可信度
            visibleWhen:
              - { requiresSkill: sk-curse-knowledge }
            effects:
              - { type: setFlag, id: rumorHeard, value: true }
              - { type: setFlag, id: rumorVerified, value: true }
              - { type: adjustProficiency, skillId: sk-curse-knowledge, value: 1 }

  - id: ev-finger
    title: 特级咒物异动
    narrative: 保管库中的"特级咒物·宿傩之指"发生了微弱但明确的反应——某处的封印在松动。
    trigger:
      source: pool
      probability: 0.12
      once: true
      priority: 8
      conditions:
        # 原「系统轮次计数 >= 5」（每轮默认 4h ≈ 20h）→ 时间维度等价表达；flags 不再承载系统轮次
        - { time: { gte: { value: 20, unit: hour } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-join-hunt
            text: 主动加入追查编队
            effects:
              - { type: setFlag, id: "milestone:fingerReacted", value: true }
              - { type: adjustFlag, id: canonDeviation, value: 2 }
              - { type: startChain, chainId: chain-finger-hunt }
          - id: opt-stay
            text: 专注校内训练，暂不掺和
            effects:
              - { type: setFlag, id: "milestone:fingerReacted", value: true }

  # ---------- 事件池：随机事件（转盘：服务端权重随机结算，前端动画揭示） ----------

  - id: ev-shrine-lottery
    title: 神社抽签
    narrative: 放学路上路过一间小神社，鸟居下的签筒看起来颇为灵验。
    trigger:
      source: pool
      probability: 0.15
      cooldown: { value: 5, unit: day }
      priority: 2
    kind: random
    settle:
      random:
        wheel:
          segments:
            - weight: 1
              weightBy: { luck: 0.4 }          # 幸运越高，大吉越容易出现
              label: 大吉
              effects:
                - { type: adjustMood, value: 10 }
                - { type: grantItem, itemId: item-talisman, count: 2 }
            - weight: 3
              label: 吉
              effects:
                - { type: adjustMood, value: 5 }
            - weight: 3
              weightBy: { luck: -0.2 }         # 幸运高时凶相收敛
              label: 凶
              effects:
                - { type: adjustMood, value: -5 }
            - weight: 1
              weightBy: { luck: -0.3, cursedEnergy: 0.1 }   # 咒力外泄反而招凶
              label: 大凶
              effects:
                - { type: adjustMood, value: -8 }
                - { type: applyStatus, status: injured-sim }

  # ---------- 行动钩子：巡逻遇袭（战斗事件） ----------

  - id: ev-curse-ambush
    title: 巡逻遇袭
    narrative: 夜色中，一道扭曲的影子从巷口扑来——是循着恐惧而来的咒灵幼虫！
    trigger:
      source: action-hook
      onActionId: patrol
      probability: 0.35
      cooldown: { value: 3, unit: day }
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-curse-larva, levelScale: 1 }
        canFlee: true
        fleeCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.5 }
        onVictory:
          effects:
            - { type: adjustFlag, id: patrolCount, value: 1 }
            - { type: adjustMood, value: 3 }
        onDefeat:
          effects:
            - { type: applyStatus, status: injured-sim }
            - { type: log, text: 你被咒灵幼虫击伤，勉强逃回高专。, visibility: public }
        onFlee:
          effects:
            - { type: log, text: 你趁隙脱离了战斗。, visibility: public }

  # ---------- 事件链：咒灵调查 ----------

  - id: ev-curse-investigate
    title: 咒灵调查开始
    narrative: 高专决定立案调查。线索指向一条废弃的地下通道。
    trigger:
      source: chain
      priority: 9
    kind: random
    settle:
      random:
        wheel:
          segments:
            - weight: 3
              label: 发现咒灵巢穴
              effects:
                - { type: adjustFlag, id: investigationProgress, value: 1 }
              nextEventId: ev-curse-find
            - weight: 2
              label: 追踪失败
              nextEventId: ev-curse-lose

  - id: ev-curse-find
    title: 讨伐二级咒灵
    narrative: 调查有了突破：你们在通道深处找到了咒灵的巢穴。战斗一触即发。
    trigger:
      source: chain
      priority: 9
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-grade2-curse, levelScale: 1 }
        canFlee: true
        fleeCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.4 }
        onVictory:
          effects:
            - { type: setFlag, id: "milestone:firstCurseExorcised", value: true }
            - { type: adjustFlag, id: canonDeviation, value: 1 }
            - { type: adjustAttribute, attribute: reputation, value: 3 }
            - { type: grantItem, itemId: item-curse-tool, count: 1 }
        onDefeat:
          effects:
            - { type: applyStatus, status: injured-sim }
            - { type: log, text: 你在咒灵爪下重伤，被同伴拖出了地下通道。, visibility: public }

  - id: ev-curse-lose
    title: 追踪失败
    narrative: 咒灵似乎察觉了调查，遁入更深的城市阴影。线索中断了。
    trigger:
      source: chain
      priority: 9
    kind: normal
    settle:
      normal:
        options:
          - id: opt-regroup
            text: 暂时收队，从长计议
            effects:
              - { type: setFlag, id: investigationStalled, value: true }

  # ---------- 事件链：宿傩之指 ----------

  - id: ev-finger-search
    title: 追查宿傩之指
    narrative: 全城通令：各组轮班追查反应的来源。这场追猎将改变许多人的命运。
    trigger:
      source: chain
      priority: 8
    kind: normal
    settle:
      normal:
        options:
          - id: opt-day-shift
            text: 白班排查市区结界
            effects:
              - { type: adjustFlag, id: fingerSearchProgress, value: 1 }
              - { type: adjustMood, value: -2 }
          - id: opt-night-shift
            text: 夜班蹲守废弃站点
            visibleWhen:
              - { attribute: agility, gte: 5 }
            effects:
              - { type: adjustFlag, id: fingerSearchProgress, value: 2 }
              - { type: adjustMood, value: -4 }

  # ---------- 主线：怀玉 · 玉折篇（星浆体事件）----------
  # 以「绝对时间事件」锚定开场（到达指定日期自动触发），
  # 后续由事件链 chain-star-plasma 驱动，分支用选项的 nextEventId 表达。

  - id: ev-sp-briefing
    title: 天元同化 · 护卫令
    narrative: 高层下达紧急任务：天元大人的同化之日将至，星浆体「天内里子」须在近日护送至仪式场。五条悟与夏油杰被指名护卫，而你也被询问是否同行。
    trigger:
      source: schedule
      window:
        start: { value: 1, unit: day }
      once: true
      priority: 12
    kind: normal
    settle:
      normal:
        options:
          - id: opt-join-guard
            text: 加入护卫队，护送里子
            effects:
              - { type: setFlag, id: spJoined, value: true }
              - { type: setFlag, id: "milestone:starPlasmaJoined", value: true }
              - { type: adjustRelation, npcId: npc-gojo, value: 5 }
              - { type: adjustRelation, npcId: npc-geto, value: 5 }
              - { type: startChain, chainId: chain-star-plasma }
          - id: opt-decline
            text: 婉拒，专注自己的修行
            effects:
              - { type: setFlag, id: spJoined, value: false }
              - { type: setFlag, id: spEnding, value: decline }
              - { type: adjustFlag, id: canonDeviation, value: 1 }
            nextEventId: ev-sp-ending-decline

  - id: ev-sp-riko-meet
    title: 星浆体 · 天内里子
    narrative: 你见到了那名少女——天内里子。被选为天元同化容器的她，明明即将与「天元」合一，却表现得像个普通的中学生，只想过完这段平静的日子。
    trigger:
      source: chain
      priority: 10
    kind: normal
    settle:
      normal:
        options:
          - id: opt-befriend-riko
            text: 与里子交心，让她安心
            effects:
              - { type: setFlag, id: rikoBond, value: true }
              - { type: adjustRelation, npcId: npc-riko, value: 10 }
              - { type: adjustMood, value: 3 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-sp-vigil
          - id: opt-plan-guard
            text: 专注制定护卫路线
            effects:
              - { type: setFlag, id: guardPlan, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-sp-vigil

  - id: ev-sp-vigil
    title: 同化前夜
    narrative: 同化之日临近，你们护送里子前往天元所在的仪式场。空旷的街道上，连风声都显得异样。
    trigger:
      source: chain
      priority: 10
    kind: normal
    settle:
      normal:
        options:
          - id: opt-watch
            text: 按计划，全程绷紧神经
            visibleWhen:
              - { flag: guardPlan, eq: true }
            effects:
              - { type: setFlag, id: spAware, value: true }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-sp-ambush
          - id: opt-relax
            text: 相信两位特级术师，稍作放松
            effects:
              - { type: adjustMood, value: 2 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-sp-ambush

  - id: ev-sp-ambush
    title: 伏黑甚尔的伏击
    narrative: 一名衣着普通、周身毫无咒力气息的男人拦在路中央——伏黑甚尔，「天与咒缚」的刺客。他的刀刃在月光下泛着冷光，直指里子。
    trigger:
      source: chain
      priority: 10
    kind: normal
    settle:
      normal:
        options:
          - id: opt-foresee
            text: 你早已看穿伏击，抢先出手
            visibleWhen:
              - { flag: spAware, eq: true }
            effects:
              - { type: setFlag, id: rikoAlive, value: true }
              - { type: setFlag, id: tojiAlive, value: true }
              - { type: setFlag, id: gojoAlive, value: true }
              - { type: setFlag, id: getoDarkened, value: false }
              - { type: setFlag, id: spEnding, value: survival }
              - { type: setFlag, id: "milestone:starPlasmaResolved", value: true }
              - { type: adjustFlag, id: canonDeviation, value: 5 }
              - { type: adjustRelation, npcId: npc-geto, value: 10 }
              - { type: adjustRelation, npcId: npc-riko, value: 15 }
              - { type: adjustMood, value: 8 }
              - { type: adjustAttribute, attribute: reputation, value: 5 }
            nextEventId: ev-sp-ending-survival
          - id: opt-shield-riko
            text: 舍身挡在里子身前
            visibleWhen:
              - { flag: rikoBond, eq: true }
            effects:
              - { type: setFlag, id: rikoAlive, value: true }
              - { type: setFlag, id: tojiAlive, value: false }
              - { type: setFlag, id: gojoAlive, value: true }
              - { type: setFlag, id: getoDarkened, value: false }
              - { type: setFlag, id: spEnding, value: riko-lives }
              - { type: setFlag, id: "milestone:starPlasmaResolved", value: true }
              - { type: adjustFlag, id: canonDeviation, value: 3 }
              - { type: adjustResource, resource: hp, value: -20 }
              - { type: applyStatus, status: injured-sim }
              - { type: adjustRelation, npcId: npc-riko, value: 15 }
              - { type: adjustRelation, npcId: npc-geto, value: 5 }
              - { type: adjustMood, value: 2 }
            nextEventId: ev-sp-ending-riko-lives
          - id: opt-hesitate
            text: 迟疑了一瞬，来不及反应
            effects:
              - { type: setFlag, id: rikoAlive, value: false }
              - { type: setFlag, id: tojiAlive, value: false }
              - { type: setFlag, id: gojoAlive, value: true }
              - { type: setFlag, id: getoDarkened, value: true }
              - { type: setFlag, id: spEnding, value: canon }
              - { type: setFlag, id: "milestone:starPlasmaResolved", value: true }
              - { type: adjustRelation, npcId: npc-geto, value: -20 }
              - { type: adjustMood, value: -5 }
            nextEventId: ev-sp-ending-canon
          - id: opt-reckless
            text: 不顾一切，孤身硬拼甚尔
            effects:
              - { type: setFlag, id: rikoAlive, value: false }
              - { type: setFlag, id: tojiAlive, value: false }
              - { type: setFlag, id: gojoAlive, value: false }
              - { type: setFlag, id: getoDarkened, value: true }
              - { type: setFlag, id: spEnding, value: gojo-dead }
              - { type: setFlag, id: "milestone:starPlasmaResolved", value: true }
              - { type: adjustFlag, id: canonDeviation, value: 8 }
              - { type: adjustResource, resource: hp, value: -30 }
              - { type: applyStatus, status: injured-sim }
              - { type: adjustRelation, npcId: npc-geto, value: -30 }
              - { type: adjustMood, value: -8 }
            nextEventId: ev-sp-ending-gojo-dead

  - id: ev-sp-ending-survival
    title: 结局 · 里子与甚尔都活了下来
    narrative: 你的先手搅乱了甚尔的杀局。五条与夏油趁势合围，天与咒缚的刺客最终选择退却——他还有家人要回去。里子安然无恙，天元同化得以和平收场；夏油眼中的光，也没有熄灭。
    trigger:
      source: chain
      priority: 10
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ack-survival
            text: 这场风波，就此平息。

  - id: ev-sp-ending-riko-lives
    title: 结局 · 里子活了下来
    narrative: 你替里子挡下了致命一击。甚尔被觉醒后的五条逼入绝境，伏诛当场；而你怀抱里的少女，终究没有成为天元的容器。夏油站在你身边，第一次觉得「守护普通人」未必毫无意义。
    trigger:
      source: chain
      priority: 10
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ack-riko-lives
            text: 幸好，你接住了她。

  - id: ev-sp-ending-canon
    title: 结局 · 玉折
    narrative: 里子死在了你眼前。五条在濒死中觉醒了反转术式，反杀甚尔；可夏油看着那些为里子之死而欢呼的人，眼神一点点冷了下去。最强与最温柔，从此走向了两条相反的路。
    trigger:
      source: chain
      priority: 10
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ack-canon
            text: 这，就是这条时间线的代价。
            effects:
              - { type: advanceTo, value: { value: 12, unit: year } }
              # 十二载修行：主角成长到足以直面百鬼夜行
              - { type: adjustAttribute, attribute: cursedEnergy, value: 35 }
              - { type: adjustAttribute, attribute: physique, value: 15 }
              - { type: adjustAttribute, attribute: agility, value: 15 }
              - { type: adjustAttribute, attribute: intellect, value: 10 }
              - { type: cureStatus, status: injured-sim }
              - { type: adjustResource, resource: hp, value: 999 }
              - { type: adjustResource, resource: mp, value: 999 }
              - { type: startChain, chainId: chain-night-parade }

  - id: ev-sp-ending-gojo-dead
    title: 结局 · 最强陨落
    narrative: 你的鲁莽让五条分了神。甚尔的刀贯穿了这位天才的胸膛——这一次，他没有再站起来。夏油抱着挚友的遗体，在漫天咒力中发出了不似人声的哀嚎。咒术界的平衡，就此彻底崩坏。
    trigger:
      source: chain
      priority: 10
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ack-gojo-dead
            text: 你永远无法原谅自己的这一瞬。

  - id: ev-sp-ending-decline
    title: 旁观 · 星浆体事件的余波
    narrative: 你婉拒了护卫任务。几天后，星浆体遇刺、五条悟觉醒、夏油杰出走的消息接连传来。你错过了改变这一切的机会，只能在旁，看这条时间线按它既定的轨迹滑落。
    trigger:
      source: chain
      priority: 10
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ack-decline
            text: 也许，下次你会做出不同的选择。

  # ---------- 主线：百鬼夜行篇（玉折之后的时间跳跃）----------

  - id: ev-night-parade-prologue
    title: 百鬼夜行 · 决战前夜
    narrative: 十二年后，2017 年的平安夜。已成为特级诅咒师的夏油杰向咒术界宣战——「百鬼夜行」发动，数千咒灵在新宿与京都同时涌出。两条战线同时告急，你必须选择其一。
    trigger:
      source: chain
      priority: 12
    kind: normal
    settle:
      normal:
        options:
          - id: opt-gojo-line
            text: 随五条悟前往新宿，迎战米格尔
            effects:
              - { type: setFlag, id: nightLine, value: shinjuku }
              - { type: adjustRelation, npcId: npc-gojo, value: 5 }
            nextEventId: ev-fight-miguel
          - id: opt-yuta-line
            text: 随乙骨忧太留守高专，迎战夏油杰
            effects:
              - { type: setFlag, id: nightLine, value: kyoto }
              - { type: adjustRelation, npcId: npc-yuta, value: 5 }
            nextEventId: ev-fight-geto

  - id: ev-fight-miguel
    title: 新宿战线 · 对阵米格尔
    narrative: 新宿的街道被咒灵潮淹没。米格尔甩开注入咒力的「黑绳」，拦在了你和五条面前——他要拖住五条，为夏油争取时间。
    trigger:
      source: chain
      priority: 11
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-miguel, levelScale: 1 }
        allies:
          - { ref: npc-gojo, levelScale: 0.5 }
        canFlee: true
        fleeCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.5 }
        onVictory:
          effects:
            - { type: setFlag, id: nightParadeWon, value: true }
            - { type: setFlag, id: "milestone:nightParadeResolved", value: true }
            - { type: adjustFlag, id: canonDeviation, value: 3 }
            - { type: adjustRelation, npcId: npc-gojo, value: 5 }
            - { type: adjustAttribute, attribute: reputation, value: 5 }
            - { type: adjustMood, value: 5 }
          nextEventId: ev-night-ending-miguel
        onDefeat:
          effects:
            - { type: applyStatus, status: injured-sim }
            - { type: setFlag, id: nightParadeWon, value: false }
          nextEventId: ev-night-ending-defeat

  - id: ev-fight-geto
    title: 高专战线 · 对阵夏油杰
    narrative: 高专的结界外，咒灵如潮水般涌来。夏油杰立于浪潮中央，冷冷地看着你与乙骨忧太——这是他给这个世界的，最后的答案。
    trigger:
      source: chain
      priority: 11
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-geto, levelScale: 1 }
        allies:
          - { ref: npc-yuta, levelScale: 0.6 }
        canFlee: true
        fleeCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.4 }
        onVictory:
          effects:
            - { type: setFlag, id: nightParadeWon, value: true }
            - { type: setFlag, id: "milestone:nightParadeResolved", value: true }
            - { type: adjustFlag, id: canonDeviation, value: 2 }
            - { type: adjustRelation, npcId: npc-yuta, value: 10 }
            - { type: adjustAttribute, attribute: reputation, value: 6 }
            - { type: adjustMood, value: 5 }
          nextEventId: ev-night-ending-geto
        onDefeat:
          effects:
            - { type: applyStatus, status: injured-sim }
            - { type: setFlag, id: nightParadeWon, value: false }
          nextEventId: ev-night-ending-defeat

  - id: ev-night-ending-miguel
    title: 新宿战线 · 米格尔败退
    narrative: 你与五条联手，将米格尔的「黑绳」压得节节败退。他最终收势认负，退出了战场。真正的决战在乙骨那边——夏油杰，正等着他。
    trigger:
      source: chain
      priority: 10
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ack-miguel
            text: 尘埃落定，百鬼夜行就此终结。

  - id: ev-night-ending-geto
    title: 高专战线 · 夏油杰败亡
    narrative: 你与乙骨忧太合力，终于让这位曾经的挚友停下了脚步。夏油杰倒下时，唇角似乎还挂着一丝释然。百鬼夜行，就此终结。
    trigger:
      source: chain
      priority: 10
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ack-geto
            text: 愿逝者安息。

  - id: ev-night-ending-defeat
    title: 百鬼夜行 · 战线崩坏
    narrative: 你身负重伤，被同伴拖出了战场。那一夜，咒灵在东京的夜空下如黑云般翻涌，咒术界为之震动。你输了，但故事还没有结束。
    trigger:
      source: chain
      priority: 10
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ack-defeat
            text: 舔舐伤口，等待下一场战斗。

# ---------- 来自「咒术转盘」的具象内容 ----------
# 设计纪律：转盘（wheel.json）55 个维度里，只有极少数作为「随机事件/转盘」落地；
# 其余维度落位到技能 / 装备 / 补正 / 结局（见对应 yaml），或作为定时/链/普通事件，
# 避免「把所有维度都写成随机事件」。

  # 主线锚点（定时事件，非转盘）：涩谷事变
  - id: ev-shibuya
    title: 涩谷事变 · 前夕
    narrative: 万圣夜的结界在涩谷被悄然封闭，数千咒灵与「脑花」的棋局，即将在此收网。
    trigger:
      source: schedule
      window:
        start: { value: 365, unit: day }
      once: true
      priority: 13
    kind: normal
    settle:
      normal:
        options:
          - id: opt-enter-shibuya
            text: 随高专精锐突入涩谷
            effects:
              - { type: setFlag, id: shibuyaEntered, value: true }
              - { type: adjustRelation, npcId: npc-gojo, value: 5 }
              - { type: startChain, chainId: chain-shibuya }
          - id: opt-hold-outside
            text: 留守外围，接应撤离的民众
            effects:
              - { type: setFlag, id: shibuyaEntered, value: false }
              - { type: adjustAttribute, attribute: reputation, value: 3 }

  - id: ev-shibuya-inside
    title: 涩谷 · 地下五层
    narrative: 你随队伍突入涩谷地下。真人、脑花、以及无数改造的咒灵在黑暗中等待。
    trigger:
      source: chain
      priority: 12
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-grade2-curse, levelScale: 2 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: shibuyaSurvived, value: true }
            - { type: adjustAttribute, attribute: reputation, value: 6 }
            - { type: adjustMood, value: 4 }
          nextEventId: ev-shibuya-resolve
        onDefeat:
          effects:
            - { type: applyStatus, status: injured-sim }
          nextEventId: ev-shibuya-resolve

  - id: ev-shibuya-resolve
    title: 涩谷 · 黎明
    narrative: 当第一缕光落进涩谷的废墟，你从瓦砾与咒力的余烬中站了起来。有些名字，永远留在了这一夜。
    trigger:
      source: chain
      priority: 12
    kind: normal
    settle:
      normal:
        options:
          - id: opt-shibuya-ack
            text: 把这一夜，记在心里。
            effects:
              - { type: adjustMood, value: -2 }


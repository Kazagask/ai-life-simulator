        options:
          - id: opt-sp-reassure
            text: 蹲下来，跟她平视：「是。我们会把你送到你想去的地方。」
            effects:
              - { type: adjustRelation, npcId: npc-riko, value: 15 }
              - { type: adjustMood, value: 5 }
              - { type: setFlag, id: rikoBond, value: true }
            nextEventId: ev-sp-vigil
          - id: opt-sp-formal
            text: 公事公办地说明护送流程
            effects:
              - { type: adjustRelation, npcId: npc-riko, value: 4 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
            nextEventId: ev-sp-vigil

  - id: ev-sp-vigil
    title: 同化前夜
    narrative: 结界外的雨下了一整夜。五条靠在门边：「明天会有人来杀她。你打算怎么守？」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp-watch
            text: 通宵警戒，把每一道咒力波动都记下来
            effects:
              - { type: setFlag, id: spAware, value: true }
              - { type: adjustResource, resource: hp, value: -8 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
            nextEventId: ev-sp-ambush
          - id: opt-sp-sleep
            text: 按五条的安排轮班，先睡一觉
            effects:
              - { type: adjustResource, resource: hp, value: 15 }
              - { type: adjustMood, value: 2 }
            nextEventId: ev-sp-ambush
          - id: opt-sp-ask
            text: 问里子：她自己想去哪里
            effects:
              - { type: adjustRelation, npcId: npc-riko, value: 10 }
              - { type: setFlag, id: rikoBond, value: true }
              - { type: setFlag, id: spAware, value: true }
            nextEventId: ev-sp-ambush

  - id: ev-sp-ambush
    title: 伏击 · 天与暴君
    narrative: 雨停的瞬间，走廊尽头的窗碎了。没有咒力，没有预警——只有一个浑身是伤的男人，和一把不该存在的刀。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-toji, levelScale: 0.5 }
        canFlee: true
        fleeCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.55 }
        onVictory:
          effects:
            - { type: setFlag, id: tojiBeaten, value: true }
            - { type: adjustFlag, id: battleWins, value: 2 }
            - { type: adjustAttribute, attribute: reputation, value: 10 }
            - { type: adjustMood, value: 6 }
          nextEventId: ev-sp-outcome
        onDefeat:
          effects:
            - { type: applyStatus, status: exhausted, stacks: 1 }
            - { type: adjustMood, value: -10 }
          nextEventId: ev-sp-outcome
        onFlee:
          effects:
            - { type: setFlag, id: spFled, value: true }
            - { type: adjustMood, value: -8 }
          nextEventId: ev-sp-outcome

  - id: ev-sp-outcome
    title: 同化的十字路口
    narrative: 里子站在天元的门前。她回头看你，什么也没说。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp-let-canon
            text: 按规矩，把她送进去
            effects:
              - { type: setFlag, id: spOutcome, value: canon }
              - { type: setFlag, id: chapter, value: 2 }
              - { type: adjustMood, value: -10 }
              - { type: adjustAttribute, attribute: reputation, value: 4 }
              - { type: advanceTo, value: { value: 60, unit: day } }
            nextEventId: ev-sp-after
          - id: opt-sp-save
            text: 牵起她的手，转身就跑
            visibleWhen:
              - { flag: spAware, eq: true }
            effects:
              - { type: setFlag, id: spOutcome, value: saved }
              - { type: setFlag, id: rikoSaved, value: true }
              - { type: setFlag, id: chapter, value: 2 }
              - { type: grantItem, itemId: item-riko-ribbon, count: 1 }
              - { type: adjustMood, value: 12 }
              - { type: adjustAttribute, attribute: reputation, value: -10 }
              - { type: advanceTo, value: { value: 60, unit: day } }
              - { type: addRelationEdge, fromId: npc-riko, toId: player, kind: friend, visibility: known, value: 60 }
            nextEventId: ev-sp-after
          - id: opt-sp-witness
            text: 什么也做不了，只是看着
            visibleWhen:
              - { flag: spAware, ne: true }
            effects:
              - { type: setFlag, id: spOutcome, value: canon }
              - { type: setFlag, id: chapter, value: 2 }
              - { type: adjustMood, value: -14 }
              - { type: advanceTo, value: { value: 60, unit: day } }
            nextEventId: ev-sp-after

  - id: ev-sp-after
    title: 第一章 · 余烬
    narrative: 那之后，高专沉默了很久。五条开始一个人训练到深夜，夏油开始一个人出任务。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp-after-ack
            text: 把那一夜记在心里
            effects:
              - { type: adjustMood, value: -3 }
              - { type: setFlag, id: chapter, value: 2 }
              - { type: setFlag, id: ready2, value: true }

  # ══════════════════════════════════════════════════════════════
  # 六、第二章：夏油叛逃（chapter 2 → 3）
  # ══════════════════════════════════════════════════════════════

  - id: ev-ch2-crisis
    title: 第二章 · 村庄
    narrative: 一个村庄的村民把两个女孩关进笼子里。夏油站在笼前，很久没有说话。
    trigger:
      source: pool
      probability: 1
      priority: 100
      conditions:
        - { flag: chapter, eq: 2 }
        - { flag: ready2, eq: true }
        - { time: { gte: { value: 60, unit: day } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch2-go
            text: 「夏油，我们该回高专了。」
            effects:
              - { type: setFlag, id: ready2, value: false }
              - { type: setFlag, id: chapter, value: 3 }
              - { type: startChain, chainId: chain-geto }
          - id: opt-ch2-wait
            text: 站在原地，看他会做什么
            effects:
              - { type: setFlag, id: ready2, value: false }
              - { type: setFlag, id: chapter, value: 3 }
              - { type: adjustFlag, id: doubt, value: 1 }
              - { type: startChain, chainId: chain-geto }

  - id: ev-geto-talk
    title: 笼子前的对话
    narrative: 「你数过吗？」夏油的声音很轻，「我们救过的人，和他们伤害过的人。」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-geto-talk-reach
            text: 「那就改变它，而不是放弃它。」
            visibleWhen:
              - { relation: npc-geto, gte: 18 }
            effects:
              - { type: adjustRelation, npcId: npc-geto, value: 10 }
              - { type: setFlag, id: getoReached, value: true }
              - { type: adjustMood, value: -4 }
            nextEventId: ev-geto-choice
          - id: opt-geto-talk-neutral
            text: 「先救人。别的以后再说。」
            effects:
              - { type: adjustRelation, npcId: npc-geto, value: 2 }
            nextEventId: ev-geto-choice
          - id: opt-geto-talk-doubt
            text: 说不出口。你也在想同一个问题。
            effects:
              - { type: adjustFlag, id: doubt, value: 1 }
              - { type: applyStatus, status: doubt, stacks: 1 }
            nextEventId: ev-geto-choice

  - id: ev-geto-choice
    title: 抉择
    narrative: 夏油背对着你，手插在口袋里：「我要走另一条路了。你要跟来，还是拦我？」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-geto-stop
            text: 拦下他——用拳头，也用你们这些年的关系
            visibleWhen:
              - { relation: npc-geto, gte: 18 }
            effects:
              - { type: setFlag, id: getoStopped, value: true }
            nextEventId: ev-geto-fight
          - id: opt-geto-let-go
            text: 让开。你拦不住一个已经想清楚的人。
            effects:
              - { type: setFlag, id: getoLeft, value: true }
              - { type: adjustMood, value: -12 }
            nextEventId: ev-geto-canon
          - id: opt-geto-join
            text: 跟上去。「这条路，我陪你走。」
            effects:
              - { type: setFlag, id: joinedCurse, value: true }
              - { type: adjustAttribute, attribute: reputation, value: -30 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 5 }
              - { type: applyStatus, status: resolved, stacks: 1 }
            nextEventId: ev-geto-join

  - id: ev-geto-fight
    title: 与夏油杰一战
    narrative: 「你果然还是这样。」夏油笑了，咒灵从他影子里涌出来，「那就让我看看，你的正确有多重。」
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-geto, levelScale: 0.5 }
        allies:
          - { ref: npc-gojo, levelScale: 0.5 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: getoSaved, value: true }
            - { type: adjustMood, value: 10 }
            - { type: adjustAttribute, attribute: reputation, value: 12 }
            - { type: adjustFlag, id: battleWins, value: 2 }
          nextEventId: ev-geto-after
        onDefeat:
          effects:
            - { type: applyStatus, status: exhausted, stacks: 1 }
            - { type: adjustMood, value: -10 }
            - { type: setFlag, id: getoLeft, value: true }
          nextEventId: ev-geto-canon

  - id: ev-geto-canon
    title: 第二章 · 叛逃
    narrative: 那一夜之后，夏油杰成了通缉犯。高专的名单上，他的名字被划掉了。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-geto-canon-ack
            text: 接受这件事
            effects:
              - { type: adjustMood, value: -6 }
              - { type: setFlag, id: chapter, value: 3 }
              - { type: setFlag, id: ready3, value: true }
              - { type: advanceTo, value: { value: 180, unit: day } }

  - id: ev-geto-join
    title: 第二章 · 同行
    narrative: 你跟着夏油走进那条没有回头路的小巷。身后，高专的钟声响了一次。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-geto-join-ack
            text: 不回头
            effects:
              - { type: adjustFlag, id: doubt, value: 2 }
              - { type: setFlag, id: chapter, value: 3 }
              - { type: setFlag, id: ready3, value: true }
              - { type: advanceTo, value: { value: 180, unit: day } }
              - { type: adjustRelation, npcId: npc-gojo, value: -20 }
              - { type: adjustRelation, npcId: npc-geto, value: 25 }

  - id: ev-geto-after
    title: 第二章 · 挽留
    narrative: 夏油被押回高专的那天，五条站在门口很久。最后他只说了一句：「谢谢。」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-geto-after-ack
            text: 「他还有救。」
            effects:
              - { type: adjustMood, value: 8 }
              - { type: adjustRelation, npcId: npc-gojo, value: 10 }
              - { type: adjustRelation, npcId: npc-geto, value: 15 }
              - { type: setFlag, id: chapter, value: 3 }
              - { type: setFlag, id: ready3, value: true }
              - { type: advanceTo, value: { value: 180, unit: day } }

  # ══════════════════════════════════════════════════════════════
  # 七、第三章：百鬼夜行（chapter 3 → 4）
  # ══════════════════════════════════════════════════════════════

  - id: ev-ch3-night
    title: 第三章 · 百鬼夜行
    narrative: 12 月 24 日，新宿与京都同时落下「帐」。上千头咒灵涌上街头——有人在等这一天很久了。
    trigger:
      source: pool
      probability: 1
      priority: 100
      conditions:
        - { flag: chapter, eq: 3 }
        - { flag: ready3, eq: true }
        - { time: { gte: { value: 180, unit: day } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-night-defend
            text: 守住高专——那里有不能失守的东西
            effects:
              - { type: setFlag, id: ready3, value: false }
              - { type: setFlag, id: chapter, value: 4 }
              - { type: setFlag, id: nightLine, value: 高专 }
              - { type: startChain, chainId: chain-night }
          - id: opt-night-hunt
            text: 冲进新宿，直接找发号施令的那个人
            effects:
              - { type: setFlag, id: ready3, value: false }
              - { type: setFlag, id: chapter, value: 4 }
              - { type: setFlag, id: nightLine, value: 新宿 }
              - { type: startChain, chainId: chain-night }

  - id: ev-night-prologue
    title: 百鬼夜行之夜
    narrative: 街上的咒灵像潮水。乙骨握紧刀，回头看你：「前辈，拜托了。」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-night-together
            text: 和乙骨并肩，把这条街守住
            effects:
              - { type: adjustRelation, npcId: npc-yuta, value: 12 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-night-fight
          - id: opt-night-solo
            text: 让乙骨去护住平民，你独自迎战
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 5 }
              - { type: setFlag, id: nightSolo, value: true }
            nextEventId: ev-night-fight

  - id: ev-night-fight
    title: 百鬼夜行 · 决战
    narrative: 咒灵的浪潮在街口分开。夏油杰站在那里，身后是整座城市的恶意。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-geto, levelScale: 0.55 }
          - { ref: enemy-grade1-curse, levelScale: 0.2 }
        allies:
          - { ref: npc-yuta, levelScale: 0.65 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: nightSurvived, value: true }
            - { type: adjustAttribute, attribute: reputation, value: 12 }
            - { type: adjustFlag, id: battleWins, value: 2 }
            - { type: adjustMood, value: 10 }
          nextEventId: ev-night-after
        onDefeat:
          # 败北不是死亡：被乙骨拖出战场，代价是声望与士气（死亡只留给涩谷终战）
          effects:
            - { type: applyStatus, status: exhausted, stacks: 1 }
            - { type: setFlag, id: nightLost, value: true }
            - { type: adjustMood, value: -14 }
            - { type: adjustAttribute, attribute: reputation, value: -6 }
          nextEventId: ev-night-after

  - id: ev-night-after
    title: 第三章 · 圣诞前夜
    narrative: 天亮之前，帐撤了。街区恢复了安静，好像什么都没发生过。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-night-after-ack
            text: 帮忙清点伤亡
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 4 }
              - { type: setFlag, id: chapter, value: 4 }
              - { type: setFlag, id: ready4, value: true }
              - { type: advanceTo, value: { value: 300, unit: day } }

  # ══════════════════════════════════════════════════════════════
  # 八、第四章：涩谷（chapter 4 → 5）
  # ══════════════════════════════════════════════════════════════

  - id: ev-ch4-shibuya
    title: 第四章 · 涩谷事变
    narrative: 万圣夜的涩谷被人流塞满。然后「帐」落了下来，把几十万人关在里面。
    trigger:
      source: pool
      probability: 1
      priority: 100
      conditions:
        - { flag: chapter, eq: 4 }
        - { flag: ready4, eq: true }
        - { time: { gte: { value: 300, unit: day } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-shibuya-in
            text: 随队突入地下
            effects:
              - { type: setFlag, id: ready4, value: false }
              - { type: setFlag, id: chapter, value: 5 }
              - { type: startChain, chainId: chain-shibuya }
          - id: opt-shibuya-out
            text: 留在外围，疏散人群
            effects:
              - { type: adjustAttribute, attribute: reputation, value: 8 }
              - { type: setFlag, id: ready4, value: false }
              - { type: setFlag, id: chapter, value: 5 }
              - { type: setFlag, id: ready5, value: true }
              - { type: advanceTo, value: { value: 360, unit: day } }

  - id: ev-shibuya-prologue
    title: 涩谷 · 地下五层
    narrative: 站台灯忽明忽暗。漏瑚的业火在上面烧，真人的手指在下面数着什么。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-shibuya-ready
            text: 把咒力拉到极限，先手
            effects:
              - { type: applyStatus, status: resolved, stacks: 1 }
              - { type: adjustResource, resource: mp, value: 20 }
            nextEventId: ev-shibuya-fight
          - id: opt-shibuya-careful
            text: 先布帐，稳住阵脚
            effects:
              - { type: applyStatus, status: veil, stacks: 1 }
              - { type: adjustResource, resource: hp, value: 15 }
            nextEventId: ev-shibuya-fight

  - id: ev-shibuya-fight
    title: 涩谷 · 五层之战
    narrative: 火与人形同时扑来。你没有退路，身后就是还没撤离的人群。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-jogo, levelScale: 0.28 }
          - { ref: enemy-mahito, levelScale: 0.28 }
        allies:
          - { ref: npc-gojo, levelScale: 0.7 }
          - { ref: npc-nanami, levelScale: 0.45 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: shibuyaSurvived, value: true }
            - { type: adjustAttribute, attribute: reputation, value: 20 }
            - { type: adjustFlag, id: battleWins, value: 3 }
            - { type: adjustMood, value: 12 }
            - { type: grantItem, itemId: item-mp-candy, count: 3 }
          nextEventId: ev-shibuya-after
        onDefeat:
          effects:
            - { type: applyStatus, status: injured-sim, stacks: 1 }
            - { type: adjustMood, value: -15 }
          nextEventId: ev-shibuya-after

  - id: ev-shibuya-after
    title: 第四章 · 黎明
    narrative: 第一缕光落进涩谷的废墟。你从瓦砾里站起来，数着还站着的人。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-shibuya-after-ack
            text: 把这一夜写进报告
            effects:
              - { type: adjustMood, value: -2 }
              - { type: setFlag, id: chapter, value: 5 }
              - { type: setFlag, id: ready5, value: true }
              - { type: advanceTo, value: { value: 360, unit: day } }

  # ══════════════════════════════════════════════════════════════
  # 九、第五章：终章（chapter 5 → 6）
  # ══════════════════════════════════════════════════════════════

  - id: ev-ch5-finale
    title: 终章 · 你成为了谁
    narrative: 一年过去了。校长把一份文件推到你面前：「该写总结了。你打算怎么介绍自己？」
    trigger:
      source: pool
      probability: 1
      priority: 100
      conditions:
        - { flag: chapter, eq: 5 }
        - { flag: ready5, eq: true }
        - { time: { gte: { value: 360, unit: day } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-finale-special
            text: 「特级术师。」——你已经走到能用实力说话的位置
            visibleWhen:
              - { attribute: cursedEnergy, gte: 28 }
            effects:
              - { type: setFlag, id: specialGrade, value: true }
              - { type: setFlag, id: ready5, value: false }
              - { type: setFlag, id: finalChoice, value: 特级 }
              - { type: setFlag, id: chapter, value: 6 }
              - { type: adjustAttribute, attribute: reputation, value: 15 }
            nextEventId: ev-epilogue
          - id: opt-finale-guardian
            text: 「守护者。」——把身边的人一个个带回来
            effects:
              - { type: setFlag, id: ready5, value: false }
              - { type: setFlag, id: finalChoice, value: 守护 }
              - { type: setFlag, id: chapter, value: 6 }
              - { type: adjustMood, value: 6 }
            nextEventId: ev-epilogue
          - id: opt-finale-leave
            text: 「前术师。」——递交退学申请
            effects:
              - { type: setFlag, id: leaveJujutsu, value: true }
              - { type: setFlag, id: ready5, value: false }
              - { type: setFlag, id: finalChoice, value: 离开 }
              - { type: setFlag, id: chapter, value: 6 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-epilogue
          - id: opt-finale-fate
            text: 合上文件：「让转盘决定吧。」
            effects:
              - { type: setFlag, id: ready5, value: false }
              - { type: setFlag, id: finalChoice, value: 转盘 }
              - { type: setFlag, id: chapter, value: 6 }
              - { type: adjustAttribute, attribute: luck, value: 5 }
            nextEventId: ev-epilogue

  - id: ev-epilogue
    title: 终章 · 落幕之前
    narrative: 走出办公楼的时候，天正在下雪。有人在校门口等你，也有人已经不在了。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-epilogue-ack
            text: 走进雪里
            effects:
              - { type: setFlag, id: chapter, value: 6 }
              - { type: setFlag, id: storyDone, value: true }
              - { type: advanceTo, value: { value: 415, unit: day } }
              - { type: adjustMood, value: 3 }
              - { type: log, text: 一学年结束。你的选择已经写完了自己的结局。, visibility: public }


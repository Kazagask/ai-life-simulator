  # ══════════════════════════════════════════════════════════════
  # 八、第四章 · 少年院（2018 年 6 月）
  # ══════════════════════════════════════════════════════════════

  - id: ev-ch4-gate
    title: 第四章 · 少年院
    narrative: 2018 年 6 月 10 日。一个叫虎杖悠仁的少年吞下了一根手指——特级咒物，两面宿傩的。他现在坐在高专的会客室里，还在为「晚饭吃什么」发愁。上面要你带一年级去少年院确认现场。
    trigger:
      source: pool
      probability: 1
      priority: 100
      once: true
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: chapter, eq: 7 }
        - { flag: ready4, eq: true }
        - { flag: jvDone, ne: true }
        - { status: injured-sim, present: false }
        - { status: exhausted, present: false }
        - { time: { gte: { value: 4538, unit: day } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch4-lead
            text: 亲自带他们去
            effects:
              - { type: setFlag, id: ready4, value: false }
              - { type: setFlag, id: chapter, value: 8 }
              - { type: setFlag, id: jvLead, value: true }
            nextEventId: ev-jv-01
          - id: opt-ch4-home
            text: 留在学校查一件事：现场的情报是谁泄出去的
            effects:
              - { type: setFlag, id: ready4, value: false }
              - { type: setFlag, id: chapter, value: 8 }
              - { type: setFlag, id: jvHome, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
            nextEventId: ev-jv-00

  - id: ev-jv-00
    title: 档案室
    narrative: 你翻了三天通讯记录。有一条从高专内部打出去的电话，接收方是「与幸吉」——京都校的二年级生。记录如下：「狱门疆的运输路线，已经确认。」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-jv0-go
            text: 把这条记下来，暂时不声张
            effects:
              - { type: setFlag, id: moleClue, value: true }
              - { type: setFlag, id: yujiHurt, value: true }
              - { type: adjustFlag, id: truthBits, value: 3 }
              - { type: adjustMood, value: -4 }
            nextEventId: ev-jv-02
          - id: opt-jv0-report
            text: 立刻上报
            effects:
              - { type: setFlag, id: moleClue, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 5 }
              - { type: adjustRelation, npcId: npc-yaga, value: 3 }
            nextEventId: ev-jv-02

  - id: ev-jv-01
    title: 少年院地下
    narrative: 地下那间屋子的墙上全是干掉的黑色。虎杖走在最前面，伏黑在后面叫他的名字，钉崎已经把手伸进包里了。然后那东西动了。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-curse-womb, levelScale: 0.95 }
        allies:
          - { ref: npc-yuji, levelScale: 0.8 }
          - { ref: npc-megumi, levelScale: 0.7 }
          - { ref: npc-nobara, levelScale: 0.6 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: yujiJoined, value: true }
            - { type: adjustAttribute, attribute: reputation, value: 5 }
          nextEventId: ev-jv-02
        onDefeat:
          effects:
            - { type: setFlag, id: yujiJoined, value: true }
            - { type: setFlag, id: yujiHurt, value: true }
            - { type: applyStatus, status: injured-sim, stacks: 1 }
          nextEventId: ev-jv-02

  - id: ev-jv-02
    title: 手指
    narrative: 特级咒胎还没死透。虎杖的右手少了两根手指，血一直在流。他抬头看了看你，然后把手伸向自己的嘴——嘴里咬着那根从咒胎身上掉下来的、像指骨的东西。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-jv2-stop
            text: 拦住他
            effects:
              - { type: setFlag, id: stoppedYuji, value: true }
              - { type: setFlag, id: yujiJoined, value: true }
              - { type: adjustRelation, npcId: npc-yuji, value: 6 }
              - { type: adjustMood, value: -4 }
            nextEventId: ev-jv-03
          - id: opt-jv2-let
            text: 让他吞
            effects:
              - { type: setFlag, id: sukunaAwake, value: true }
              - { type: setFlag, id: yujiJoined, value: true }
              - { type: adjustRelation, npcId: npc-yuji, value: 3 }
              - { type: adjustMood, value: -10 }
            nextEventId: ev-jv-03
          - id: opt-jv2-eat
            text: 把手指抢过来，自己吞下去
            visibleWhen:
              - { flag: secondTech, eq: true }
            effects:
              - { type: setFlag, id: yujiJoined, value: true }
              - { type: setFlag, id: playerAteFinger, value: true }
              - { type: setFlag, id: sukunaAwake, value: true }
              - { type: unlockSkill, skillId: sk-dismantle }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 8 }
              - { type: applyStatus, status: multi-technique, stacks: 1 }
              - { type: adjustRelation, npcId: npc-yuji, value: -4 }
              - { type: adjustMood, value: -16 }
            nextEventId: ev-jv-03

  - id: ev-jv-03
    title: 符纸
    narrative: 收拾现场时，你在走廊尽头捡到一张符纸。高专制式，但编队代码不对——这是给「外人」用的通行符。你把它塞进口袋，谁也没说。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-jv3-go
            text: 把符纸收好
            effects:
              - { type: setFlag, id: moleClue, value: true }
              - { type: setFlag, id: jvDone, value: true }
              - { type: setFlag, id: ready5, value: true }
              - { type: setFlag, id: chapter, value: 9 }
              - { type: adjustFlag, id: truthBits, value: 1 }
              - { type: advanceTo, value: { value: 4674, unit: day } }
              - { type: log, text: 2018 年 6 月 · 少年院事件。 , visibility: public }
          - id: opt-jv3-report
            text: 直接把符纸交给夜蛾，让他去查
            effects:
              - { type: setFlag, id: moleClue, value: true }
              - { type: setFlag, id: moleReported, value: true }
              - { type: setFlag, id: jvDone, value: true }
              - { type: setFlag, id: ready5, value: true }
              - { type: setFlag, id: chapter, value: 9 }
              - { type: adjustRelation, npcId: npc-yaga, value: 7 }
              - { type: adjustAttribute, attribute: reputation, value: 4 }
              - { type: adjustMood, value: -2 }
              - { type: advanceTo, value: { value: 4674, unit: day } }
              - { type: log, text: 2018 年 6 月 · 少年院事件。 , visibility: public }

  # ══════════════════════════════════════════════════════════════
  # 九、第五章 · 涩谷事变（2018 年 10 月 31 日）
  # ══════════════════════════════════════════════════════════════

  - id: ev-ch5-gate
    title: 第五章 · 涩谷事变
    narrative: 2018 年 10 月 31 日，二十点四十分。涩谷站周边被一层巨大的「帐」罩住，数万普通人被困在里面。高层批准五条悟单独进场——其余人分组支援。你分到的是哪一组？
    trigger:
      source: pool
      probability: 1
      priority: 100
      once: true
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: chapter, eq: 9 }
        - { flag: ready5, eq: true }
        - { flag: shDone, ne: true }
        - { status: injured-sim, present: false }
        - { status: exhausted, present: false }
        - { time: { gte: { value: 4680, unit: day } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch5-ground
            text: 地上一组。先把人带出去
            effects:
              - { type: setFlag, id: ready5, value: false }
              - { type: setFlag, id: chapter, value: 10 }
              - { type: setFlag, id: shLine, value: ground }
              - { type: adjustAttribute, attribute: reputation, value: 4 }
            nextEventId: ev-sh-01
          - id: opt-ch5-under
            text: 地下一组。跟着五条下站台
            effects:
              - { type: setFlag, id: ready5, value: false }
              - { type: setFlag, id: chapter, value: 10 }
              - { type: setFlag, id: shLine, value: under }
            nextEventId: ev-sh-01
          # 叛逃线的涩谷入口：同一个夜晚，你在帐的另一侧。后续链条共用，但动机与结局不同。
          - id: opt-ch5-rogue
            text: 从帐的另一侧进去。你不站在任何人的队伍里
            visibleWhen:
              - { flag: defected, eq: true }
            effects:
              - { type: setFlag, id: ready5, value: false }
              - { type: setFlag, id: chapter, value: 10 }
              - { type: setFlag, id: shLine, value: rogue }
              - { type: adjustAttribute, attribute: luck, value: 2 }
              - { type: adjustMood, value: -4 }
            nextEventId: ev-sh-01

  - id: ev-sh-01
    title: 三条路
    narrative: 帐里没有信号。人群推着你往前。左边是挤满人的地下入口，右边是着火的百货公司，正前方，一只咒灵正在把一辆巴士举过头顶。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sh1-save
            text: 先救巴士里的人
            effects:
              - { type: setFlag, id: shSaved, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 8 }
              - { type: adjustMood, value: 6 }
              - { type: adjustFlag, id: savedCivilians, value: 3 }
            nextEventId: ev-sh-02a
          - id: opt-sh1-hunt
            text: 冲向那只举着巴士的咒灵
            effects:
              - { type: setFlag, id: shAggressive, value: true }
              - { type: adjustAttribute, attribute: physique, value: 2 }
            nextEventId: ev-sh-02b
          # ev-d3-eve（万圣节前夜）里提前布下的那层帐，在这里才第一次被用到。
          - id: opt-sh1-prep
            text: 走你提前布好的那条通道
            visibleWhen:
              - { flag: shibuyaPrep, eq: true }
            effects:
              - { type: setFlag, id: shSaved, value: true }
              - { type: setFlag, id: usedPrep, value: true }
              - { type: adjustFlag, id: savedCivilians, value: 2 }
              - { type: adjustAttribute, attribute: reputation, value: 6 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-sh-02a

  - id: ev-sh-02a
    title: 火山
    narrative: 你把最后一个人推出巴士的时候，地面开始烫。一个矮小的身影站在车顶上，头顶的火山口在缓缓张开。「别挡路，小鬼。」
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-jogo, levelScale: 0.85 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: beatJogo, value: true }
            - { type: adjustAttribute, attribute: reputation, value: 10 }
          nextEventId: ev-sh-03
        onDefeat:
          effects:
            - { type: applyStatus, status: injured-sim, stacks: 1 }
          nextEventId: ev-sh-03

  - id: ev-sh-02b
    title: 真人
    narrative: 巴士被扔到街对面。那个举车的东西转过头来——它有一张孩子的脸，正歪着头看你，像在挑一件玩具。「你看起来，」它说，「很好玩。」
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-mahito, levelScale: 0.85 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: beatMahito, value: true }
            - { type: adjustAttribute, attribute: reputation, value: 10 }
          nextEventId: ev-sh-03
        onDefeat:
          effects:
            - { type: applyStatus, status: injured-sim, stacks: 1 }
          nextEventId: ev-sh-03

  - id: ev-sh-03
    title: 狱门疆
    narrative: 地下传来一声闷响，整条街的玻璃同时碎了。五条站在那里，手里捧着一个方块——不，是他被那个方块吞进去了。一个额上有缝合线的人在做手势。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sh3-disarm
            text: 按你查到的那条线索，拆掉封印阵
            visibleWhen:
              - { flag: moleClue, eq: true }
            effects:
              - { type: setFlag, id: savedGojo, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 15 }
              - { type: adjustMood, value: 16 }
              - { type: adjustFlag, id: truthBits, value: 3 }
              - { type: log, text: 你提前拆掉了狱门疆的封印阵。五条悟没有被封印。 , visibility: public }
            nextEventId: ev-sh-03b
          - id: opt-sh3-rush
            text: 冲上去，抢那个方块
            effects:
              - { type: setFlag, id: gojoSealed, value: true }
              # 封印 = 不在世（ADR-0012/ADR-0020 同一条入口）：此后他不进人物面板的「在世」名单、
              # 不参与任何以他为 ref 的战斗（引擎判活自动过滤，模板不重写判活）、关系写入冻结。
              - { type: setNpcLifecycle, npcId: npc-gojo, state: inactive, reasonCode: 封印 }
              - { type: setFlag, id: gojoGone, value: true }
              - { type: applyStatus, status: injured-sim, stacks: 1 }
              - { type: adjustMood, value: -18 }
            nextEventId: ev-sh-03b
          - id: opt-sh3-civ
            text: 先带人撤离。这一刻你救不了他
            effects:
              - { type: setFlag, id: gojoSealed, value: true }
              - { type: setNpcLifecycle, npcId: npc-gojo, state: inactive, reasonCode: 封印 }
              - { type: setFlag, id: gojoGone, value: true }
              - { type: setFlag, id: shSaved, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 6 }
              - { type: adjustFlag, id: savedCivilians, value: 4 }
              - { type: adjustMood, value: -14 }
            nextEventId: ev-sh-03b

  # ── 身体争夺 · 涩谷（原作：虎杖被打至昏迷，宿傩趁虚受肉，23:14 展开伏魔御厨子）──
  #
  # 玩法结构变更：本章新增一次「是否放任宿傩夺取身体」的选择，用**已有的** setNpcLifecycle
  # 效果 + 自由字符串 reasonCode 表达「被占据」，不新增效果类型、不改 schema。
  #   放任 ⇒ npc-yuji inactive(reasonCode=宿傩受肉) + 必须在 ev-sh-04 打这一场；战果决定
  #            shibuyaSurvived / sukunaRepelled 与救人数（高回报、可能真打不过）
  #   压制 ⇒ npc-yuji 保持 alive、无该战斗（安全），但付出人格代价：心情大跌 + 与虎杖的关系
  #   `sukunaTookOver` 记录「这一夜他是否出来过」，供后续文本/结局分支读取。
  # 两条路都仍有涩谷的收尾（ev-sh-05），不会把玩家扔在链上无路可走。
  - id: ev-sh-03b
    title: 身体里的东西
    narrative: 虎杖跪在碎石里，一只手按着地面，指节把地面按出裂纹。他抬起头——脸上正在长出一条不属于他的纹路。「……喂。」那不是他的声音，「你打算怎么办。」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sh3b-let
            text: 松手。让他出来
            effects:
              # 宿傩受肉 ⇒ 虎杖这一夜不在世（inactive）。reasonCode 只是模板自由字符串，
              # 引擎不对它分支，只原样存下来供投影展示与模板条件判断。
              - { type: setNpcLifecycle, npcId: npc-yuji, state: inactive, reasonCode: 宿傩受肉 }
              - { type: setFlag, id: sukunaTookOver, value: true }
              - { type: adjustMood, value: -12 }
              - { type: log, text: 你松开了手。虎杖的嘴角翘起来，那不是他的表情。 , visibility: public }
            nextEventId: ev-sh-04
          - id: opt-sh3b-hold
            text: 按住他，别让他出来
            effects:
              - { type: setFlag, id: sukunaTookOver, value: false }
              - { type: setFlag, id: shibuyaSurvived, value: true }
              # 人格代价：你亲手把一个朋友按回黑暗里，你们之间从此少了一层话。
              # 换来的是「领域没有展开」——没有人被那一千四百米切碎，包括你自己。
              - { type: adjustMood, value: -20 }
              - { type: adjustRelation, npcId: npc-yuji, value: -8 }
              - { type: applyStatus, status: exhausted, stacks: 1 }
              - { type: log, text: 你把他按住了。代价是你们之后谁也没提过这一夜。 , visibility: public }
            # 两条路都要经过七海的最后一战：他的死是世界事实，不由你放不放宿傩决定。
            nextEventId: ev-sh-04n

  # 只在「放任」时可达：敌人是**借虎杖之身**的宿傩，即复用的 enemy-sukuna
  # （不为同一形态造两套数值；虎杖此刻 inactive，故本场没有友军）。
  # 战败不等于死亡（前三章的战败只给重伤），故仍走 ev-sh-05 收尾。
  - id: ev-sh-04
    title: 伏魔御厨子
    narrative: 二十三点十四分，整条街以一个看不见的中心开始被切开。没有边界、没有死角，只有一千四百米半径内不断重复的斩击。领域的主人踩着人头走出来——四只手，两双眼，脸上四道纹路。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-sukuna, levelScale: 0.5 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: sukunaRepelled, value: true }
            - { type: setFlag, id: shibuyaSurvived, value: true }
            - { type: adjustAttribute, attribute: reputation, value: 12 }
            - { type: adjustFlag, id: savedCivilians, value: 5 }
            - { type: adjustMood, value: 4 }
          # 领域收了之后，天还没亮：七海那边正在发生他自己的最后一战。
          nextEventId: ev-sh-04n
        onDefeat:
          effects:
            - { type: setFlag, id: sukunaRepelled, value: false }
            - { type: setFlag, id: shibuyaSurvived, value: false }
            - { type: setFlag, id: fledShibuya, value: true }
            - { type: applyStatus, status: injured-sim, stacks: 1 }
            - { type: adjustMood, value: -18 }
          nextEventId: ev-sh-04n

  # ── 七海建人的最后一战（原作：涩谷事变中阵亡）──
  # 密度不是白给：这一战没有战斗回合，但有代价与收获——你替他守完了一个出口，
  # 或者你只来得及看见他的尸体。无论哪条路，他此后都不在世（lifecycle 唯一入口）。
  - id: ev-sh-04n
    title: 七海建人
    narrative: 七海靠在检票口的柱子上，外套叠得很整齐，放在膝边。他的下半身已经不见了。「……我算过了，」他说，声音很平，「这件事不值得做。但我还是做了。」他想再说点什么，最后只是把眼镜摘下来递给你。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sh4n-line
            text: 接下眼镜，替他守完那十分钟
            effects:
              # 阵亡 = inactive（与「受肉」「夺舍」同一条入口）。此后对他的关系写入冻结，
              # 引用他的池事件用 npcState 条件挡掉，战斗 ref 由引擎自动过滤。
              - { type: setNpcLifecycle, npcId: npc-nanami, state: inactive, reasonCode: 阵亡 }
              - { type: setFlag, id: nanamiGone, value: true }
              - { type: setFlag, id: heldNanamiLine, value: true }
              - { type: adjustFlag, id: savedCivilians, value: 4 }
              - { type: adjustAttribute, attribute: reputation, value: 5 }
              - { type: applyStatus, status: grief, stacks: 1 }
              - { type: adjustMood, value: -12 }
              - { type: log, text: 七海建人阵亡。你替他守住了那个出口。 , visibility: public }
            nextEventId: ev-sh-05
          - id: opt-sh4n-chase
            text: 不守了。你去找那个把他弄成这样的人
            effects:
              - { type: setNpcLifecycle, npcId: npc-nanami, state: inactive, reasonCode: 阵亡 }
              - { type: setFlag, id: nanamiGone, value: true }
              - { type: setFlag, id: avengedNanami, value: true }
              - { type: adjustFlag, id: truthBits, value: 2 }
              - { type: adjustAttribute, attribute: agility, value: 2 }
              - { type: applyStatus, status: grief, stacks: 1 }
              - { type: adjustMood, value: -16 }
              - { type: log, text: 七海建人阵亡。你连他的手都没握住。 , visibility: public }
            nextEventId: ev-sh-05

  - id: ev-sh-05
    title: 天亮之前
    narrative: 十一月一日凌晨。涩谷站前的十字路口被削掉了一层。消防车的水浇在烧焦的地面上，蒸汽一直升到天亮。虎杖坐在路沿上，抱着自己的膝盖——他说他不记得那段时间，但他的手一直在抖。有人在清点人数：数字比预期少很多，但比最坏的情况好。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sh5-go
            text: 在废墟里找人
            effects:
              # 身体争夺的回程入口（与「被占据」同一入口，无特权通道）：
              # 宿傩用完这具身体就退回体内 ⇒ 虎杖回到 alive，reasonCode 随新状态一起清掉。
              # 走「压制」路线时虎杖本来就活着，此处是幂等的在世确认。
              - { type: setNpcLifecycle, npcId: npc-yuji, state: alive }
              - { type: setFlag, id: shDone, value: true }
              - { type: setFlag, id: ready6, value: true }
              - { type: setFlag, id: chapter, value: 11 }
              - { type: adjustMood, value: -6 }
              - { type: advanceTo, value: { value: 4694, unit: day } }
              - { type: log, text: 2018 年 10 月 31 日 · 涩谷事变。 , visibility: public }
          - id: opt-sh5-evac
            text: 先把还活着的人抬出去
            effects:
              - { type: setNpcLifecycle, npcId: npc-yuji, state: alive }
              - { type: setFlag, id: shDone, value: true }
              - { type: setFlag, id: ready6, value: true }
              - { type: setFlag, id: chapter, value: 11 }
              - { type: setFlag, id: shEvacuated, value: true }
              - { type: adjustFlag, id: savedCivilians, value: 6 }
              - { type: adjustAttribute, attribute: reputation, value: 8 }
              - { type: applyStatus, status: exhausted, stacks: 1 }
              - { type: adjustMood, value: -10 }
              - { type: advanceTo, value: { value: 4694, unit: day } }
              - { type: log, text: 2018 年 10 月 31 日 · 涩谷事变。 , visibility: public }
          # gojoSealed 的第一次可读分叉（P0）：封印之后「五条不在」这件事必须落成文本与后果。
          - id: opt-sh5-seal
            text: 去看那个方块。他还睁着眼睛
            visibleWhen:
              - { flag: gojoSealed, eq: true }
            effects:
              - { type: setNpcLifecycle, npcId: npc-yuji, state: alive }
              - { type: setFlag, id: shDone, value: true }
              - { type: setFlag, id: ready6, value: true }
              - { type: setFlag, id: chapter, value: 11 }
              - { type: setFlag, id: gojoSealKnown, value: true }
              - { type: adjustFlag, id: truthBits, value: 2 }
              - { type: applyStatus, status: grief, stacks: 1 }
              - { type: adjustMood, value: -14 }
              - { type: advanceTo, value: { value: 4694, unit: day } }
              - { type: log, text: 五条悟被封印在狱门疆里，睁着眼睛。 , visibility: public }

  # ══════════════════════════════════════════════════════════════
  # 十、第六章 · 死灭回游（2018 年 11 月）
  # ══════════════════════════════════════════════════════════════

  - id: ev-ch6-gate
    title: 第六章 · 死灭回游
    narrative: 2018 年 11 月 20 日。十个结界在日本各地张开，规则写在里面：杀术师得分，分数可以换规则。他们叫它「死灭回游」。高专要派人进去——以玩家的身份。
    trigger:
      source: pool
      probability: 1
      priority: 100
      once: true
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: chapter, eq: 11 }
        - { flag: ready6, eq: true }
        - { flag: cgDone, ne: true }
        - { status: injured-sim, present: false }
        - { status: exhausted, present: false }
        - { time: { gte: { value: 4700, unit: day } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch6-in
            text: 进去。规则也是可以被改的
            effects:
              - { type: setFlag, id: ready6, value: false }
              - { type: setFlag, id: chapter, value: 12 }
              - { type: setFlag, id: cgJoined, value: true }
            nextEventId: ev-cg-01
          - id: opt-ch6-out
            text: 留在外面。总得有人在规则之外
            effects:
              - { type: setFlag, id: ready6, value: false }
              - { type: setFlag, id: chapter, value: 12 }
              - { type: setFlag, id: cgJoined, value: false }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
            nextEventId: ev-cg-01

  - id: ev-cg-01
    title: 结界里
    narrative: 结界内的天空是灰的。路牌上的字被改成了看不懂的符号。三十步外，一个术师正蹲在地上数手指——他刚刚杀了人，正在算分数。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-cg1-kill
            text: 动手。分数能换规则
            visibleWhen:
              - { flag: cgJoined, eq: true }
            effects:
              - { type: setFlag, id: cgPath, value: kill }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 4 }
              - { type: adjustAttribute, attribute: reputation, value: -6 }
              - { type: adjustMood, value: -12 }
            nextEventId: ev-cg-02
          - id: opt-cg1-save
            text: 先把被关在里面的普通人放出去
            effects:
              - { type: setFlag, id: cgPath, value: save }
              - { type: adjustAttribute, attribute: reputation, value: 8 }
              - { type: adjustFlag, id: savedCivilians, value: 4 }
              - { type: adjustMood, value: 6 }
            # P0 修复：cgPath 原先三条路一律汇进 ev-cg-02，等于没分支。
            # 现在三条路各有自己的中间步，再汇到 ev-cg-03（夺舍）：
            #   kill → 直接撞上「教你规矩」的术师（原有战斗）
            #   save → 护送队伍（ev-cg-02s）：不进战斗，但耽误时间、被记恨
            #   rule → 拆规则（ev-cg-02r）：无战斗，靠脑子换情报与分数
            nextEventId: ev-cg-02s
          - id: opt-cg1-rule
            text: 找规则的漏洞。规则一定有漏洞
            effects:
              - { type: setFlag, id: cgPath, value: rule }
              - { type: adjustFlag, id: truthBits, value: 3 }
              - { type: adjustAttribute, attribute: intellect, value: 3 }
            nextEventId: ev-cg-02r

  # cgPath=save 的中间步：你选了人，就得付护送的时间与代价。
  - id: ev-cg-02s
    title: 护送
    narrative: 你带着十一个普通人往结界边缘走。他们走得比你想象中慢，每走五百米就要停下来确认一次方向。结界的出口会移动，而你没有第二次机会。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-cg2s-escort
            text: 一个一个送到出口，慢一点也没关系
            effects:
              - { type: setFlag, id: cgEscorted, value: true }
              - { type: adjustFlag, id: savedCivilians, value: 3 }
              - { type: adjustAttribute, attribute: reputation, value: 10 }
              - { type: applyStatus, status: exhausted, stacks: 1 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-cg-02b
          - id: opt-cg2s-trade
            text: 用分数换一条固定的出口
            effects:
              - { type: setFlag, id: cgEscorted, value: true }
              - { type: setFlag, id: cgBoughtExit, value: true }
              - { type: adjustFlag, id: savedCivilians, value: 3 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustAttribute, attribute: reputation, value: -4 }
              - { type: adjustMood, value: -6 }
            nextEventId: ev-cg-02b

  # cgPath=rule 的中间步：不靠拳头，靠把规则读成一个人的字迹。
  - id: ev-cg-02r
    title: 规则的作者
    narrative: 你给我加一百分，我给你一条规则。」结界里最贵的不是战斗力，是逗号的位置。你花了三个小时，在临时登记的条款里找到了一句可以被读成两遍的话。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-cg2r-exploit
            text: 把那条规则改成你要的意思
            effects:
              - { type: setFlag, id: cgRuleHacked, value: true }
              - { type: adjustFlag, id: truthBits, value: 2 }
              - { type: adjustAttribute, attribute: intellect, value: 3 }
              - { type: adjustMood, value: -2 }
            nextEventId: ev-cg-02b
          - id: opt-cg2r-sell
            text: 把这条漏洞卖给出价最高的队伍
            effects:
              - { type: setFlag, id: cgRuleHacked, value: true }
              - { type: setFlag, id: cgSoldRule, value: true }
              - { type: adjustAttribute, attribute: reputation, value: 8 }
              - { type: adjustAttribute, attribute: luck, value: 3 }
              - { type: adjustMood, value: -8 }
            nextEventId: ev-cg-02b

  - id: ev-cg-02
    title: 分数
    narrative: 你还没走完一条街，就被拦住了。对方身上挂着七个人的分数，笑得很客气。「新人？我教你这里的规矩。」
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-curse-user, levelScale: 1.1 }
          - { ref: enemy-grade1-curse, levelScale: 0.5 }
        canFlee: true
        fleeCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.6 }
        onVictory:
          effects:
            - { type: adjustAttribute, attribute: reputation, value: 6 }
            - { type: adjustAttribute, attribute: cursedEnergy, value: 2 }
          nextEventId: ev-cg-02b
        onDefeat:
          effects:
            - { type: applyStatus, status: injured-sim, stacks: 1 }
            - { type: adjustMood, value: -10 }
          nextEventId: ev-cg-02b

  # ── 群像 + 密度：钉崎与伏黑各自的战场 ──
  - id: ev-cg-02b
    title: 九只与十一只
    narrative: 钉崎把钉子一根一根插进地面，摆成一条线；伏黑从影子里唤出玉犬，犬不叫，只是盯着结界深处。「那边上来了，」钉崎说，「我数了，九只。」「十一只。」伏黑说，「还有两只在楼里。」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-cg2b-line
            text: 守住这条线，让伏黑先把影铺开
            effects:
              - { type: setFlag, id: cgHordeLine, value: true }
              - { type: adjustRelation, npcId: npc-nobara, value: 6 }
              - { type: adjustRelation, npcId: npc-megumi, value: 5 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustMood, value: -2 }
            nextEventId: ev-cg-02c
          - id: opt-cg2b-split
            text: 分头：你上楼清那两只，钉崎守街
            effects:
              - { type: setFlag, id: cgSplit, value: true }
              - { type: adjustRelation, npcId: npc-nobara, value: 3 }
              - { type: adjustAttribute, attribute: agility, value: 2 }
              - { type: applyStatus, status: injured-sim, stacks: 1 }
              - { type: adjustMood, value: -6 }
            nextEventId: ev-cg-02c

  - id: ev-cg-02c
    title: 结界的十一只
    narrative: 玉犬先咬住了最前面那只，钉崎的钉子跟着飞出去，一根接一根，像有人在地面上敲一串急促的鼓点。你听见伏黑在数数——他数到十一的时候，楼里的那两只已经站在你身后了。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-grade1-curse, levelScale: 1.2 }
          - { ref: enemy-curse-user, levelScale: 1.0 }
        # 伏黑夺舍之前最后一次和你并肩；钉崎的刍灵咒法在这一场里救了一次场。
        allies:
          - { ref: npc-nobara, levelScale: 0.9 }
          - { ref: npc-megumi, levelScale: 0.9 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: cgBeatHorde, value: true }
            - { type: adjustFlag, id: savedCivilians, value: 4 }
            - { type: adjustAttribute, attribute: reputation, value: 8 }
            - { type: adjustRelation, npcId: npc-nobara, value: 5 }
            - { type: adjustRelation, npcId: npc-megumi, value: 5 }
            - { type: adjustResource, resource: hp, value: 25 }
            - { type: adjustMood, value: 4 }
          nextEventId: ev-cg-03
        onDefeat:
          effects:
            # 密度有代价：你倒了，钉崎为了把你拖出来挨了一下——她之后一整章都在带伤。
            - { type: setFlag, id: cgHordeLost, value: true }
            - { type: setFlag, id: nobaraHurt, value: true }
            - { type: applyStatus, status: injured-sim, stacks: 1 }
            - { type: adjustRelation, npcId: npc-nobara, value: -4 }
            - { type: adjustMood, value: -14 }
          nextEventId: ev-cg-03

  - id: ev-cg-03
    title: 夺舍
    narrative: 结界深处传来一阵不属于人类的咒力波动。伏黑惠倒在地上，嘴里被塞进一根手指——他正在被吞掉。旁边站着的那个人，四只手，正在笑。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-cg3-stop
            text: 冲上去，把手指从他嘴里挖出来
            effects:
              - { type: setFlag, id: triedToSaveMegumi, value: true }
              - { type: applyStatus, status: injured-sim, stacks: 1 }
              - { type: adjustAttribute, attribute: physique, value: 3 }
              - { type: adjustMood, value: -14 }
            nextEventId: ev-cg-04
          - id: opt-cg3-flee
            text: 退。你现在打不过他
            effects:
              - { type: setFlag, id: megumiTaken, value: true }
              - { type: adjustMood, value: -18 }
            nextEventId: ev-cg-04
          - id: opt-cg3-deal
            text: 「我身体里也有你的东西。谈谈？」
            visibleWhen:
              - { flag: secondTech, eq: true }
            effects:
              - { type: setFlag, id: dealtWithSukuna, value: true }
              - { type: unlockSkill, skillId: sk-cleaves }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 10 }
              - { type: adjustMood, value: -20 }
              - { type: log, text: 你与诅咒之王做了一笔交易。 , visibility: public }
            nextEventId: ev-cg-04
          # cgPath=rule 的第二次读取点：你手里那条被改过的规则在这里第一次救了人。
          - id: opt-cg3-rule
            text: 用你改过的那条规则，把结界挪开三米
            visibleWhen:
              - { flag: cgRuleHacked, eq: true }
            effects:
              - { type: setFlag, id: ruleSavedMegumi, value: true }
              - { type: adjustFlag, id: truthBits, value: 2 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustMood, value: -8 }
              - { type: log, text: 结界挪开了三米。只够你把手伸进去。 , visibility: public }
            nextEventId: ev-cg-04

  - id: ev-cg-04
    title: 十二月
    narrative: 十二月初，结界开始收缩。所有人的目光都转向同一个日子：十二月二十四日。有人要在那天把所有事情结束掉。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-cg4-go
            text: 准备去新宿
            effects:
              # ── 身体争夺 · 伏黑惠 ──
              # 原作：死灭回游末，宿傩夺舍伏黑。这里用同一个 setNpcLifecycle 入口表达「被占据」，
              # reasonCode 只是模板自由字符串（引擎不分支）。从此：
              #   · npc-megumi 不再上「在世」名单，对他的关系写入被冻结（单向棘轮）
              #   · 决战一阶段的敌人 = enemy-sukuna-megumi（借这具身体）
              #   · 引用他的日常事件用 npcState 条件挡掉（不写重复的判活逻辑）
              - { type: setNpcLifecycle, npcId: npc-megumi, state: inactive, reasonCode: 被宿傩夺舍 }
              - { type: setFlag, id: megumiTaken, value: true }
              - { type: adjustMood, value: -16 }
              - { type: log, text: 十二月初，伏黑惠的身体被宿傩占了。 , visibility: public }
              - { type: setFlag, id: cgDone, value: true }
              - { type: setFlag, id: ready7, value: true }
              - { type: setFlag, id: chapter, value: 13 }
              - { type: advanceTo, value: { value: 4728, unit: day } }
              - { type: log, text: 2018 年 11 月 · 死灭回游。 , visibility: public }

  # ══════════════════════════════════════════════════════════════
  # 十一、第七章 · 新宿决战（2018 年 12 月 24 日）
  # ══════════════════════════════════════════════════════════════

  - id: ev-ch7-gate
    title: 第七章 · 新宿决战
    narrative: 2018 年 12 月 24 日。新宿。半径两公里的居民已经疏散完毕。这不是一场能赢的战斗——但必须有人站在这里。
    trigger:
      source: pool
      probability: 1
      priority: 100
      once: true
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: chapter, eq: 13 }
        - { flag: ready7, eq: true }
        - { flag: sjDone, ne: true }
        - { status: injured-sim, present: false }
        - { status: exhausted, present: false }
        - { time: { gte: { value: 4736, unit: day } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch7-front
            text: 站到最前面
            effects:
              - { type: setFlag, id: ready7, value: false }
              - { type: setFlag, id: chapter, value: 14 }
              - { type: setFlag, id: sjPost, value: front }
              - { type: adjustAttribute, attribute: reputation, value: 8 }
            nextEventId: ev-sj-01b
          - id: opt-ch7-back
            text: 守后方。把还能救的人救下来
            effects:
              - { type: setFlag, id: ready7, value: false }
              - { type: setFlag, id: chapter, value: 14 }
              - { type: setFlag, id: sjPost, value: back }
              - { type: adjustFlag, id: savedCivilians, value: 3 }
            nextEventId: ev-sj-01b

  # ── 群像 + 密度：先头部队 ──
  # 决战开场不是直接进入 boss 战：先撞上羂索放出来的咒灵群，由一年级们接住。
  - id: ev-sj-01b
    title: 六个人
    narrative: 二十三点十分。新宿西口的这支队伍一共六个人：虎杖在最前面，钉崎在给他数倒数，乙骨站在最后面，里香在他身后。第七个位置空着——那是七海的。你站进哪一个空档，就决定了今晚你身边的人是谁。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sj1b-yuji
            text: 站到虎杖旁边。你们一起把第一波撞开
            effects:
              - { type: setFlag, id: sjPair, value: yuji }
              - { type: adjustRelation, npcId: npc-yuji, value: 6 }
              - { type: adjustAttribute, attribute: physique, value: 2 }
              - { type: adjustMood, value: 6 }
            nextEventId: ev-sj-01c
          - id: opt-sj1b-nobara
            text: 站到钉崎身后。她的钉子需要一个不被近身的人
            effects:
              - { type: setFlag, id: sjPair, value: nobara }
              - { type: adjustRelation, npcId: npc-nobara, value: 6 }
              - { type: adjustAttribute, attribute: agility, value: 2 }
              - { type: adjustMood, value: 4 }
            nextEventId: ev-sj-01c
          - id: opt-sj1b-yuta
            text: 跟乙骨一起压后排。里香需要有人在前面引
            effects:
              - { type: setFlag, id: sjPair, value: yuta }
              - { type: adjustRelation, npcId: npc-yuta, value: 6 }
              - { type: adjustAttribute, attribute: cursedEnergy, value: 3 }
              - { type: adjustMood, value: 2 }
            nextEventId: ev-sj-01c

  - id: ev-sj-01c
    title: 先头部队
    narrative: 第一波不是宿傩放的，是羂索放的。三十多只咒灵从地下街的通风口里挤出来，像被踩开的蚁巢。钉崎的钉子在地上排成三条线，乙骨把里香放了出去——她的影子盖住了整条街。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-grade1-curse, levelScale: 1.4 }
          - { ref: enemy-curse-user, levelScale: 1.2 }
          - { ref: enemy-grade2-curse, levelScale: 1.6 }
        allies:
          # 钉崎与乙骨在这一场里各有可辨识的贡献：钉崎的面积压制 + 乙骨的正面承伤。
          - { ref: npc-nobara, levelScale: 1.0 }
          - { ref: npc-yuta, levelScale: 0.9 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: sjClearedFront, value: true }
            - { type: adjustFlag, id: savedCivilians, value: 3 }
            - { type: adjustAttribute, attribute: reputation, value: 10 }
            - { type: adjustRelation, npcId: npc-nobara, value: 4 }
            - { type: adjustRelation, npcId: npc-yuta, value: 4 }
            # 换防喘息：先头部队清干净了，钉崎才能腾出手给你缝两针。
            - { type: adjustResource, resource: hp, value: 35 }
            - { type: adjustResource, resource: mp, value: 20 }
            - { type: adjustMood, value: 6 }
          nextEventId: ev-sj-01
        onDefeat:
          effects:
            # 代价：先头部队没清干净，后面 boss 战时街上还有咒灵，支援也更少。
            - { type: setFlag, id: sjFrontLost, value: true }
            - { type: applyStatus, status: injured-sim, stacks: 1 }
            - { type: adjustRelation, npcId: npc-nobara, value: -5 }
            - { type: adjustMood, value: -14 }
          nextEventId: ev-sj-01

  - id: ev-sj-01
    title: 决战前夜
    narrative: 二十三点五十分。咒术师们站成一排。有人手在抖，有人闭着眼。远处那个身影抬起了一只手——「那就开始吧。」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sj1-gojo
            text: 五条站在你旁边
            visibleWhen:
              - { flag: gojoSealed, ne: true }
            effects:
              - { type: setFlag, id: withGojo, value: true }
              - { type: adjustRelation, npcId: npc-gojo, value: 8 }
              - { type: adjustMood, value: 8 }
            # P0 修复：阵容按 flag 分成两条 combat（引擎不支持条件化 allies）。
            # 有五条 → ev-sj-02-gojo；封印线 → ev-sj-02（allies 只留虎杖）。
            nextEventId: ev-sj-02-gojo
          - id: opt-sj1-alone
            text: 没有五条。你们只能靠自己
            visibleWhen:
              - { flag: gojoSealed, eq: true }
            effects:
              - { type: setFlag, id: withGojo, value: false }
              - { type: adjustMood, value: -8 }
              - { type: setFlag, id: noGojo, value: true }
            nextEventId: ev-sj-02
          # 叛逃线的决战入口：你不在这一排人里，所以你也不该去打一场不属于你的仗。
          # 走专属收束 ev-sj-rogue（不跑命运轮、不进 boss 战），结局由 end-defected 优先命中。
          - id: opt-sj1-defected
            text: 你站在对面那排人的后面。今晚之后没人会记得谁站哪边
            visibleWhen:
              - { flag: defected, eq: true }
            effects:
              - { type: setFlag, id: withGojo, value: false }
              - { type: setFlag, id: defectedWatcher, value: true }
              - { type: adjustAttribute, attribute: luck, value: 3 }
              - { type: adjustMood, value: -10 }
            nextEventId: ev-sj-rogue

  # 叛逃者在决战夜的专属收束。与高专线共用同一个夜晚，但你不是参战方。
  - id: ev-sj-rogue
    title: 对面那排人
    narrative: 零点过后，两具身体撞在一起，新宿的天空被切开一道口子。你站在对面那排人的后面，看见有人在跑、有人在喊、有人一直没有倒下。你没有上前，也没有走。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sjr-walk
            text: 转身走进地铁口。这一夜之后，不再有你的名字
            effects:
              - { type: setFlag, id: rogueWalked, value: true }
              - { type: setFlag, id: sjDone, value: true }
              - { type: setFlag, id: storyDone, value: true }
              - { type: setFlag, id: chapter, value: 15 }
              - { type: adjustAttribute, attribute: luck, value: 3 }
              - { type: adjustMood, value: -6 }
              - { type: advanceTo, value: { value: 4752, unit: day } }
              - { type: log, text: 2018 年 12 月 24 日 · 新宿。你没有参战。 , visibility: public }
          - id: opt-sjr-watch
            text: 站着看完。你想知道自己错过了什么
            effects:
              - { type: setFlag, id: rogueWatched, value: true }
              - { type: setFlag, id: sjDone, value: true }
              - { type: setFlag, id: storyDone, value: true }
              - { type: setFlag, id: chapter, value: 15 }
              - { type: adjustFlag, id: truthBits, value: 3 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustMood, value: -14 }
              - { type: advanceTo, value: { value: 4752, unit: day } }
              - { type: log, text: 2018 年 12 月 24 日 · 新宿。你把它看完了。 , visibility: public }

  # 未封印线的一阶段：五条在场，阵容不同、战果也更轻松。
  # 与 ev-sj-02 共用同一张敌人卡（enemy-sukuna-megumi）与同一套战败处理，
  # 差别只在 allies —— 这是「拆两条 combat」而不是「给 allies 加条件」的原因。
  - id: ev-sj-02-gojo
    title: 人外魔境 · 一阶段（五条在场）
    narrative: 他动了。五条往前一步，第一道「解」在半空被「无下限」折弯了。第二道「捌」贴着你耳朵过去时，你才意识到自己被挡在了后面。对面那具身体是伏黑的——脸上四道纹路，手腕的骨节在错位地长。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          - { ref: enemy-sukuna-megumi, levelScale: 0.58 }
        allies:
          - { ref: npc-gojo, levelScale: 1.0 }
          - { ref: npc-yuji, levelScale: 0.8 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: beatSukuna, value: true }
            - { type: adjustAttribute, attribute: reputation, value: 16 }
            - { type: adjustMood, value: 12 }
            - { type: adjustResource, resource: hp, value: 45 }
            - { type: adjustResource, resource: mp, value: 25 }
          nextEventId: ev-sj-02b
        onDefeat:
          effects:
            - { type: setFlag, id: beatSukuna, value: false }
            - { type: setFlag, id: finalEnd, value: hero-death }
            - { type: applyStatus, status: injured-sim, stacks: 1 }
            - { type: adjustMood, value: -18 }
          # 战败即收束：与 ev-sj-02 同一条处理路径（不写 nextEventId）。

  - id: ev-sj-02
    title: 人外魔境 · 一阶段
    narrative: 他动了。第一道「解」切开了三百米外的大楼，第二道「捌」贴着你的耳朵过去。对面那具身体是伏黑的——脸上四道纹路，手腕的骨节在错位地长。你听见自己的心跳，比任何一次都响。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          # 一阶段：宿傩借伏黑惠之身（npc-megumi 已在 ev-cg-04 置 inactive(被宿傩夺舍)）。
          # 虎杖作为 allies 会被引擎自动判活过滤：涩谷「放任」且没顶住时他曾被占据，
          # 但 ev-sh-05 已把他还原成 alive，故常规路径下他仍能参战。
          # levelScale 0.58 是场面旋钮（不是强度声明）：这张卡本身比 enemy-sukuna 强一档，
          # 0.58 才落回旧 0.62 的手感；「一阶段 → 二阶段」两连战才是本轮真正加的分量。
          - { ref: enemy-sukuna-megumi, levelScale: 0.58 }
        allies:
          # 这条是「封印线 / 叛逃线」的一阶段。五条被封印时 lifecycle=inactive，
          # 引擎在建场前判活把他滤掉（Part 1 已验证的 resolveCombatRefs），
          # 所以这里不需要条件化阵容、也不重写判活。
          - { ref: npc-gojo, levelScale: 1.0 }
          - { ref: npc-yuji, levelScale: 0.8 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: beatSukuna, value: true }
            - { type: adjustAttribute, attribute: reputation, value: 20 }
            - { type: adjustMood, value: 12 }
            # 两场之间的喘息：反转术式与补给（否则二番战必定带伤开场，变成「必死」而不是「决战」）
            - { type: adjustResource, resource: hp, value: 45 }
            - { type: adjustResource, resource: mp, value: 25 }
          nextEventId: ev-sj-02b
        onDefeat:
          effects:
            - { type: setFlag, id: beatSukuna, value: false }
            - { type: setFlag, id: finalEnd, value: hero-death }
            - { type: applyStatus, status: injured-sim, stacks: 1 }
            - { type: adjustMood, value: -18 }
          # 战败即收束（P0 修复）：这里**不写** nextEventId。
          # 旧值指向 ev-sj-04（「你在便利店买了热咖啡」），会出「战死还去喝咖啡」。
          # 终局由 endings.yaml 的 terminationConditions（finalEnd=hero-death）在战败边界直接固化。
          # 二番战战败走同一处理，不再回日常。

  - id: ev-sj-02b
    title: 人外魔境 · 二阶段 · 受肉
    narrative: 借来的身体跪了下去，血从伏黑的嘴角流到地上。然后四只手从他背后长出来，把少年那层皮撑开——他把自己塞回了原本的形状，头上的骨冠在路灯下泛着旧血的颜色。「现在，」他说，「重新开始。」
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          # 二阶段：完全受肉的真身，显著强于一阶段
          - { ref: enemy-sukuna-incarnate, levelScale: 0.55 }
        allies:
          - { ref: npc-gojo, levelScale: 1.0 }
          - { ref: npc-yuji, levelScale: 0.8 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: beatSukuna, value: true }
            - { type: setFlag, id: beatSukunaIncarnate, value: true }
            - { type: adjustAttribute, attribute: reputation, value: 25 }
            - { type: adjustMood, value: 16 }
          # 二番战胜利后不是立刻散场：羂索一直站在远处看着，这时候才走过来。
          nextEventId: ev-sj-02c
        onDefeat:
          effects:
            - { type: setFlag, id: beatSukuna, value: false }
            - { type: setFlag, id: beatSukunaIncarnate, value: false }
            - { type: setFlag, id: finalEnd, value: hero-death }
            - { type: applyStatus, status: injured-sim, stacks: 1 }
            - { type: adjustMood, value: -20 }
          # 与一阶段战败同等处理：不写 nextEventId，由 finalEnd=hero-death 的终止条件就地收束。

  - id: ev-sj-02c
    title: 缝合线
    narrative: 宿傩倒下去的地方还在冒烟。一个人从烟里走出来，额头上有缝合线，笑得很客气。「辛苦了，」他说，「我一直想看看这具身体到底能撑到哪一步。」他抬手的动作很轻，像在摘一片叶子。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        enemies:
          # 羂索：不跟宿傩抢戏，但他是这一夜真正的布局者
          - { ref: enemy-kenjaku, levelScale: 0.5 }
        allies:
          - { ref: npc-yuta, levelScale: 0.9 }
          - { ref: npc-yuji, levelScale: 0.8 }
        canFlee: false
        onVictory:
          effects:
            - { type: setFlag, id: beatKenjaku, value: true }
            - { type: adjustFlag, id: truthBits, value: 4 }
            - { type: adjustAttribute, attribute: reputation, value: 15 }
            - { type: adjustRelation, npcId: npc-yuta, value: 6 }
            - { type: adjustMood, value: 10 }
          nextEventId: ev-sj-03
        onDefeat:
          effects:
            # 不是终局死（宿傩那两场才判死）；代价是伤与「终究没拦住他」。
            - { type: setFlag, id: beatKenjaku, value: false }
            - { type: setFlag, id: kenjakuEscaped, value: true }
            - { type: applyStatus, status: injured-sim, stacks: 1 }
            - { type: adjustMood, value: -16 }
          nextEventId: ev-sj-03

  - id: ev-sj-03
    title: 终结
    narrative: 天快亮了。烟尘里有人还站着，有人已经躺下了。命运之轮在你面前最后一次停下——这一次，它写的是「此后」。
    trigger:
      source: chain
    kind: random
    settle:
      random:
        wheel:
          segments:
            - label: 你活下来了，还站着
              weight: 20
              weightBy: { physique: 1 }
              effects:
                - { type: setFlag, id: finalEnd, value: survived }
                - { type: adjustMood, value: 10 }
              nextEventId: ev-sj-04
            - label: 你活下来了，但咒力回路断了
              weight: 8
              effects:
                - { type: setFlag, id: finalEnd, value: lost }
                - { type: applyStatus, status: exhausted, stacks: 1 }
                - { type: adjustMood, value: -8 }
              nextEventId: ev-sj-04
            - label: 你救下了所有人，代价是自己没走出来
              weight: 7
              effects:
                - { type: setFlag, id: finalEnd, value: hero-death }
                - { type: adjustAttribute, attribute: reputation, value: 30 }
              nextEventId: ev-sj-04
            - label: 你成了特级
              weight: 5
              weightBy: { cursedEnergy: 1 }
              effects:
                - { type: setFlag, id: finalEnd, value: special }
                - { type: adjustAttribute, attribute: reputation, value: 20 }
                - { type: adjustMood, value: 12 }
              nextEventId: ev-sj-04
            - label: 你成了传说
              weight: 3
              weightBy: { reputation: 1 }
              effects:
                - { type: setFlag, id: finalEnd, value: legend }
                - { type: adjustAttribute, attribute: reputation, value: 35 }
                - { type: adjustMood, value: 14 }
              nextEventId: ev-sj-04
            - label: 你活下来了，然后离开了咒术界
              weight: 12
              effects:
                - { type: setFlag, id: finalEnd, value: retire }
                - { type: adjustMood, value: 8 }
              nextEventId: ev-sj-04
            - label: 你跟着那个人的脚印走了
              weight: 6
              effects:
                - { type: setFlag, id: finalEnd, value: defected }
                - { type: setFlag, id: defected, value: true }
                - { type: adjustAttribute, attribute: cursedEnergy, value: 8 }
                - { type: adjustMood, value: -10 }
              nextEventId: ev-sj-04
            - label: 你活下来了，也什么都没了
              weight: 9
              effects:
                - { type: setFlag, id: finalEnd, value: lost-all }
                - { type: adjustMood, value: -14 }
              nextEventId: ev-sj-04

  - id: ev-sj-04
    title: 此后
    narrative: 2019 年 1 月 5 日。新宿的废墟被围上了围栏，围栏上贴着「重建中」。你在便利店买了一罐热的咖啡，站在路边喝完，然后把空罐丢进回收箱。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sj4-end
            text: 抬起头，继续走
            effects:
              - { type: cureStatus, status: injured-sim }
              - { type: cureStatus, status: exhausted }
              - { type: setFlag, id: sjDone, value: true }
              - { type: setFlag, id: storyDone, value: true }
              - { type: setFlag, id: chapter, value: 15 }
              - { type: advanceTo, value: { value: 4752, unit: day } }
              - { type: log, text: 2019 年 1 月 · 落幕。 , visibility: public }
          - id: opt-sj4-hospital
            text: 先去医院。有些伤得有人替你缝
            effects:
              - { type: cureStatus, status: injured-sim }
              - { type: cureStatus, status: exhausted }
              - { type: adjustResource, resource: hp, value: 60 }
              - { type: adjustResource, resource: mp, value: 30 }
              - { type: adjustRelation, npcId: npc-shoko, value: 8 }
              - { type: setFlag, id: sjDone, value: true }
              - { type: setFlag, id: storyDone, value: true }
              - { type: setFlag, id: chapter, value: 15 }
              - { type: adjustMood, value: 6 }
              - { type: advanceTo, value: { value: 4752, unit: day } }
              - { type: log, text: 2019 年 1 月 · 落幕。 , visibility: public }

# ══════════════════════════════════════════════════════════════
# 事件链定义
#   除创建链外，剧情章节用 nextEventId 串成事件流（每条 ≥4 步、含分支），
#   不再声明为 Chain —— 章节推进由 chapter / readyN 门闩控制，避免重复触发。
# ══════════════════════════════════════════════════════════════
chains:
  - id: chain-creation
    startEventId: ev-w01
    pauseWhenHidden: false
    steps:
      - { eventId: ev-w01, advanceWhen: onSettle }
      - { eventId: ev-w02, advanceWhen: onSettle }
      - { eventId: ev-w03, advanceWhen: onSettle }
      - { eventId: ev-w04, advanceWhen: onSettle }
      - { eventId: ev-w05, advanceWhen: onSettle }
      - { eventId: ev-w06, advanceWhen: onSettle }
      - { eventId: ev-w07, advanceWhen: onSettle }
      - { eventId: ev-w08, advanceWhen: onSettle }
      - { eventId: ev-w09, advanceWhen: onSettle }
      - { eventId: ev-w10, advanceWhen: onSettle }
      - { eventId: ev-w11, advanceWhen: onSettle }
      - { eventId: ev-w12, advanceWhen: onSettle }
      - { eventId: ev-w13, advanceWhen: onSettle }

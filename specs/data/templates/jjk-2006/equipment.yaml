# JJK 世界模板 · equipment.yaml
# 装备分域（协议 V2.1 §19）：槽位 / 品质白名单。
# 本模板不设 initialEquipment —— 玩家开局两手空空，装备只能从转盘与剧情里拿。
equipment:
  qualities: [common, uncommon, rare, cursed]
  # slots 是「能装备多少东西」的唯一真源：条数 = 槽位种类，maxCount = 该槽可同时穿戴件数。
  # panelSide 只决定人物面板摆位（ADR-0009）：左列 / 右列 / 底部方块区（缺省）。
  slots:
    - { id: weapon,    label: 武器,  allowedCategories: [blade, cursed-tool], maxCount: 1, panelSide: left }
    - { id: accessory, label: 饰品,  allowedCategories: [ring, charm],       maxCount: 2, panelSide: right }

      length: { minChars: 320, maxChars: 760, minParagraphs: 3, maxParagraphs: 6 }
      # 一整章通常超过缺省 6 轮窗口，看不到就写不出来；40 轮足够覆盖一章且不至于失控。
      historyTurns: 40
      instruction: >-
        收束刚结束的这一章：按时间顺序把这一章发生的事拢成一段完整的经历，写清主角做了什么、做了什么选择、付出了什么代价、这些事在他身上留下了什么。用具体的场景、动作和对话推进，不要罗列做过的事，不要写成「先…然后…接着…」的流程说明，也不要点评或讲道理。
      toolProfile: narrative

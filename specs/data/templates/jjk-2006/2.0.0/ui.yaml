# 展示层声明（`specs/SPEC.md` §1.5 形状 B）。
# 这份是「等价现状」的基线：每个能力都落在它今天实际所在的位置，
# 所以加载它前后页面逐字相同。改某一行即可搬迁或关掉入口，不需要改代码。
# 注意：本文件不进语义指纹 —— 改这里不会让旧存档拒载。
place:
  life: tab
  personal: tab
  world: tab
  log: tab
  records: tab
  character: slot:personal
  equipment: slot:personal
  inventory: slot:personal
  skills: slot:personal
  relations: slot:npcList
  wheel: overlay
  battle: overlay
  event: overlay

# ── 样式（ADR-002 D2）─────────────────────────────────────────────
# 模板只写「样式 id」，引擎解析、前端渲染。
# 预设按**视觉**命名，不与品级耦合：内核里没有 mythic/legendary 这种词。
#   稀有度色（8 档，从高到低）：rainbow / rainbow-static / gold / orange / pink / purple / blue / white
#   正负零（3 档）：green / red / gray
# 自定义只允许 color / background / bold / animation 四项。
styles:
  rainbow: { preset: rainbow, animation: rainbow-flow }   # 动虹
  rainbow-static: { preset: rainbow-static }              # 静虹
  gold: { preset: gold }
  orange: { preset: orange }
  pink: { preset: pink }
  purple: { preset: purple }
  blue: { preset: blue }
  white: { preset: white }

# 品质（模板自己的词）→ 样式 id。改这里即可整体换色，不用动实体。
qualityStyles:
  rainbow: rainbow
  rainbow-static: rainbow-static
  gold: gold
  orange: orange
  pink: pink
  purple: purple
  blue: blue
  white: white

# 正负零（与 quality 独立）：实体没写 style / quality 时靠它拿到绿红灰。
polarityStyles:
  positive: green
  negative: red
  neutral: gray

# ── 标签（ADR-002 D2b）───────────────────────────────────────────
# 玩家看到的**词**在这里定，引擎只给「视觉」（rainbow / green 这些名字不出现在界面上）。
# 补正 / 装备用 `tags: [id...]` 引用；顺序即优先级，靠前的标签决定名字颜色：
#   同时挂 `mythic` 与 `buff` ⇒ 名字是神话的动虹，不是增益的绿。
# 品级 8 档（高 → 低）+ 正负 3 档，和 DNF 的稀有度阶梯对齐。
tags:
  mythic: { name: 神话, style: { preset: rainbow, animation: rainbow-flow } }
  legend: { name: 传说, style: { preset: rainbow-static } }
  epic: { name: 史诗, style: { preset: gold } }
  artifact: { name: 神器, style: { preset: orange } }
  rare: { name: 稀有, style: { preset: pink } }
  superior: { name: 高级, style: { preset: purple } }
  fine: { name: 优良, style: { preset: blue } }
  common: { name: 普通, style: { preset: white } }
  buff: { name: 增益, style: { preset: green } }
  debuff: { name: 减益, style: { preset: red } }
  neutral: { name: 中性, style: { preset: gray } }

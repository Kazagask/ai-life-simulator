# 展示层声明（`specs/SPEC.md` §1.5 形状 B）。
# 这份是「等价现状」的基线：每个能力都落在它今天实际所在的位置，
# 所以加载它前后页面逐字相同。改某一行即可搬迁或关掉入口，不需要改代码。
# 注意：本文件不进语义指纹 —— 改这里不会让旧存档拒载。
place:
  life: tab
  personal: tab
  world: tab
  log: tab
  records: tab
  character: slot:personal
  equipment: slot:personal
  inventory: slot:personal
  skills: slot:personal
  relations: slot:npcList
  wheel: overlay
  battle: overlay
  event: overlay

# ── 样式（ADR-002 D2）─────────────────────────────────────────────
# 模板只写「样式 id」，引擎解析、前端渲染。预设：rainbow / gold / silver /
# bronze / crimson / azure / jade；自定义只允许 color / background / bold /
# animation 四项（颜色是 #rgb|#rrggbb|#rrggbbaa 或引擎 token）。
styles:
  # 最高品质的流动彩虹：六眼这类「原作级」特质共用同一身。
  rainbow: { preset: rainbow, animation: rainbow-flow }
  # 常见品质给个稳定的金属色，避免满屏彩虹。
  gold: { preset: gold }
  silver: { preset: silver }
  bronze: { preset: bronze }

# 品质 → 样式 id：实体未自声明 style 时按 quality 查这里。
qualityStyles:
  mythic: rainbow
  legendary: gold
  rare: silver
  common: bronze

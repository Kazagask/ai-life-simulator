    # 写成 -30 是为了「有效属性下限 0」兜底后**一定是 0**，而不是「刚好够低」。
    attributeModifiers: { cursedEnergy: -30, physique: 20, agility: 12 }
    # 2026-11-21：除了「没有咒力」，把肉体优势也写进战斗面 —— 不然它在面板上只是
    # 一组大数字，打起来和普通术师没有区别。术式碰不到他，他碰得到任何人。
    combat:
      damageDealt: 0.15
      evade: 0.08
    quality: ancient
    description: 出生时就被拿走全部咒力，换来的是一具超越常识的肉体。
    polarity: positive
    visibility: known

  - id: special-physique

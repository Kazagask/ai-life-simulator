  - id: tech-fate
    name: 术式·运势因果
    kind: talent
    # 2026-11-21：幸运从 +3 提到 +6 —— 它要能在转盘上被看见。
    # 世界内所有 `weightBy: { luck: n }` 的转盘（巡逻 / 探索 / 怀玉的几格）都会读到它，
    # 这是「术式本身加的幸运应用到转盘权重」的唯一落点，不需要额外的运气字段。
    attributeModifiers: { cursedEnergy: 4, luck: 6 }
    quality: legend
    description: 你不太用力，事情自己会往你这边倒。转盘的指针认得这种运气，只是借来的，迟早要还。
    polarity: positive

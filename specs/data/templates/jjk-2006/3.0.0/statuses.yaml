      damageTaken: -0.1
    visibility: known

  # `absorbed-curses` 已删：它靠「补正层数」当咒灵计数器，没有 combat 面（纯展示）。
  # ADR-012 D9 曾把它换成角色的专属资源池（`characters[].resources.curses`）；
  # ADR-013（2026-11-20）连池子也撤了 —— 「有几只」就等于「场上有几只」，
  # 不再需要任何一条计数槽。这里留注释只为说明这两次删除的因果。

  - id: enrage
    name: 狂化
    kind: talent
    description: 咒灵被激怒，攻击性暴增。
    polarity: positive
    combat:
      damageDealt: 0.3
    visibility: hidden

  # ══════════════ 十影 · 未调伏的魔虚罗（ADR-014） ══════════════
  # 两条补正合起来就是「越打越硬、打不死」，都不需要引擎新字段：
  # `wheel` 每回合末回血 + 给自己叠一层 `adapt`；`adapt` 开 `stacksPerLayer`，
  # 于是减伤按层数线性长 —— 5 层 −75%，7 层归零。

  - id: mahoraga-wheel
    name: 法轮
    quality: ancient
    kind: talent
    description: 背上的法轮一直在转。它转过一格，你就少一种打法。
    polarity: positive
    combat:
      onRoundEnd:
        - heal: { preset: fixed, value: 25 }
        - applyStatus:
            - { status: mahoraga-adapt }
    visibility: known

  - id: mahoraga-adapt
    name: 适应
    kind: battle
    description: 挨过一次的东西，第二次就不那么疼了。
    stacking: stack
    polarity: positive
    combat:
      damageTaken: -0.15
      stacksPerLayer: true
    visibility: known

  # ══════════════ 战斗态的战后折算（ADR-018） ══════════════
  #
  # 战斗里施加的是「这一场还在烧」；离场时按回合数折算成世界状态（`toModifier`）。
  # `timePerRound: 1 天` ⇒ 打两回合留两天，与旧的固定 2 天同量级。
  # 名字故意与折算后的世界状态不同：战斗中与战后是两件事，混用会让玩家以为是同一条。
  - id: battle-cursed-burn
    name: 咒火
    kind: battle
    description: 还在烧。战斗结束前不会熄。
    stacking: unique
    polarity: negative
    combat:
      onRoundEnd:
        - { damage: { preset: fixed, value: 4 } }
    toModifier: { id: cursed-burn, timePerRound: { value: 1, unit: day } }
    visibility: known

  - id: battle-curse-poison
    name: 咒毒
    kind: battle
    description: 毒进了血里。此刻只是发烫，散场才见功。
    stacking: unique
    polarity: negative
    combat:
      onRoundEnd:
        - { damage: { preset: fixed, value: 3 } }
    toModifier: { id: curse-poison, timePerRound: { value: 1, unit: day } }
    visibility: known

  - id: battle-exhausted
    name: 脱力
    kind: battle
    description: 术式烧空了回路。这一场还能站着，下一场才要还债。
    stacking: unique
    polarity: negative
    toModifier: { id: exhausted, timePerRound: { value: 1, unit: day } }
    visibility: known

  - id: battle-blessed
    name: 吉兆
    kind: battle
    description: 运势压在了这一边。它不在这一场结算，在你走出这一场之后。
    stacking: unique
    polarity: positive
    # 2026-11-21：原来只有 toModifier，战斗里什么也不做 —— 玩家花 10 点咒力买了个空。
    # 现在它真的改骰子：命中与伤害都往上抬，战后才折算成「大吉」。
    combat:
      hitChance: 0.15
      damageDealt: 0.1
    toModifier: { id: blessed, timePerRound: { value: 1, unit: day } }
    visibility: known

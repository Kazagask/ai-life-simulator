# JJK 世界模板 · statuses.yaml
#
# 补正（buff/debuff 统称）：单定义双面（simulation / combat，至少其一）。
#
# 方向（ADR-009）：**定义只说发生什么，不说多久**。时长是实例属性，由施加点给——
#   · 模拟域（事件 / 物品）：`duration: { value, unit }` 世界时间，或 `{ untilCured: true }`
#   · 战斗域（技能）：`{ rounds: n }` 战斗回合、`{ untilBattleEnd: true }`、或 `{ value, unit }`（打完后还持续）
#   · 挂在这里的角色档案 `statuses:` 与开局参数 = 身份，一律永久（等价 untilCured）
# 所以本文件里**不出现任何时长字段**；同一个「眩晕」被杂兵打中一回合、被 BOSS 打中三回合，
# 这件事写在 skills.yaml 的施加点上。
#
# 2026-11-12：生得术式改为「角色级补正」（tech-*）。术式不是技能列表，
# 而是给角色带来持续属性加成 + 战斗增幅的**身份**，技能只是它的外显。
statuses:
  # ══════════════ 生得术式（角色级、永久；一人可持有多个） ══════════════


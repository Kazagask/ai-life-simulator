  # ══════════════ 领域 / 黑闪（战斗域） ══════════════
  #
  # 品级纪律（2026-11-19）：**只在战斗里出现的技能效果不打品质标**。
  # 领域展开 / 黑闪 / 术式公开 / 束缚一掷 / 咒力视觉都是几回合就消失的战斗窗口，
  # 它们不是「你抽到的稀有度」，给它们挂 `mythic` / `legend` 只会让状态栏读起来像掉落物。
  # 品级标签留给**身份**（生得术式 tech-* / 六眼 / 天与咒缚这类 untilCured 的东西）。
  #
  # 配额（2026-11-21 用户裁决，全模板生效，含技能与咒具）：
  #   · 唯一·神话（mythic-unique，动态彩虹）**只有六眼**；
  #   · 一品·神话（mythic，静态彩）≤ 3：诅咒之王 / 多重术式 / 天逆鉾；
  #   · 旷古·传说（ancient，金）≤ 5：无下限 / 法轮 / 天与咒缚 / 十种影法术 / 千年术师。
  # 再往上加之前先问：它是不是比上面这几位更稀有？不是就往下走一档。

  - id: domain-active
    name: 领域展开
    kind: battle
    description: 你的法则覆盖了这片空间。攻击必中、伤害放大，敌人的防御被压到最低——但只撑三回合。
    stacking: unique
    polarity: positive
    combat:

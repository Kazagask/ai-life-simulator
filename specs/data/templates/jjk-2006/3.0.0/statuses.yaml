  # ══════════════ 角色级特质（原作人物） ══════════════

  - id: six-eyes
    name: 六眼
    kind: talent
    attributeModifiers: { cursedEnergy: 20, agility: 10, intellect: 10 }
    quality: mythic-unique
    description: 五条家相传的眼睛。看穿咒力的流动，以近乎零损耗运转咒力。
    # 品级由标签表达（mythic → 神话 / 动虹）；不再写 `quality`——那是引擎的选择器，
    # 玩家不该在详情里看到「RAINBOW」这种变量名。
    polarity: positive
    combat:
      hitChance: 0.2
      damageDealt: 0.3
      # ADR-012 D8：六眼看穿咒力流动 ⇒ 施放消耗只剩十分之一（ceil 取整）。
      # 不写这一行，五条 240 点池只够 13 发苍；写了之后战斗节奏会明显变长，这是有意的。
      costMultiplier: { mp: -0.9 }
    visibility: known

  - id: infinity
    name: 无下限
    kind: talent
    quality: ancient
    description: 把「无限」带到现实空间。任何东西靠近他都要走过无穷多的一半——无限减速、无限接近，永远停在「到达」之前。所以落不到他身上。
    # ADR-008 D1：闪避 100%。破解只有两条：必中（领域 / 世界斩）与强行术式解除。
    # 这不是「加了很多闪避」，是「到不了」——所以写成 1，不写成 0.9。
    polarity: positive
    combat:
      evade: 1
    visibility: known


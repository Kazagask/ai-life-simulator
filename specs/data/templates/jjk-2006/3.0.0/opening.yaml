# JJK 新开局 · v4（2026-11-21：天赋提前、天与收成唯一入口）
#
# 流程：抽出身（决定站位与起点年份）→ 基本信息 → **天赋**（天与咒缚唯一入口，六眼不进池）
#       → 生得术式 → 术式专属领域 → 体质 → 高阶技巧（3 格，抽到空即「不会」）→ 入场
#
# 为什么天赋要先抽（2026-11-21 用户裁决）：
#   ① 天与咒缚与「咒力天赋」是互斥的 —— 先抽术式再抽天赋，会出现「零咒力 + 特级苗子」；
#   ② 天赋是后面每一格权重的输入：术式池、体质池、高阶技巧都靠 `weightByParam` 读它。
#   抽到天与咒缚 ⇒ `goto: n-body` 直接跳过术式与领域（没有咒力就没有术式）。
#
# 三条硬约束（读代码得出，不是猜的）：
#   1. `OpeningBranchOptionSchema` 没有 conditions ⇒ **选项**不能按前置结果开关；
#      但**节点**可以（2026-11-23 · ADR-072 D3）：节点级 `when: [{ param, in }]` 读已落定参数，
#      不成立就整格静默跳过。这是「御三家才转传承」唯一不复制通道的写法。
#   2. DAG 无循环、无计数 ⇒ 「先抽 n，再抽 n 次」写不出来；用「每格可能空」等价实现；
#   3. 开局 roll 的静态 `weight` 可用，按**世界属性**加权不可用（ADR-001 D-4）。
#      按**已落定的开局参数**加权走 `weightByParam`（ADR-001 D7）——本稿用在五处：
#      天赋抬/压术式权重（n-tech-* 每条一个表）、天与抽不到反转术式（b-reverse -18）、
#      家学抬天才权重（旁支 +6 / 诅咒师世家 +4）、**出身分流原作术式**（originTag 0 基偏置）、
#      六眼（伪）在抽到无下限时加权（b-six-eyes-pseudo +10）。
#
# 2026-11-23 术式/天赋重做（按 `archive/.../咒术转盘☆第二版.wheel.json`）：
#   - 御三家旁支先转「传承」：断了就进通用池；没断才进家传池（十影 / 赤血 / 无下限）。
#     诅咒师世家与平民直接走通用池（咒灵操术 / 御厨子 / 刍灵 / 雷电 / 咒言 + 九系原创）。
#     强度不设上限，权重只决定「遇到什么」。
#   - 高阶三格的「空签 / 高级签」权重按 `rankFlag` 调：天赋越好，实际拿到的数量越多。
#   - 自建角色 id 按出身生成（`player-civilian` 等），后续剧情/提示词可用
#     `as: player-clan-branch` 或 `as: [player-clan-branch, npc-gojo]` 分线。
# 分流有两招：`option.goto`（抽到哪个扇区去哪个节点，编译期展开）与
# 节点级 `when`（前置不成立就整格跳过，运行期按已落定参数判）。
# 「按术式给领域」仍然只能靠 goto —— **每术式一个领域节点**，十个领域节点都必须
# 显式 `goto: n-body`，否则会按数组顺序连抽十个领域。
#
# 另一个必须守的纪律：**一个 param id 只能有一个写者**。
# `resolveParamMap` 是 `Object.assign`，后写覆盖先写；两个节点写同一个 id，
# 前一个的加成会静默消失（旧开局就踩过：第六格选的咒具被入学式悄悄换成急救包）。
# 所以下面的属性补正按节点分开命名：originAttr1 / ageAttr / techBodyAttr / domAttr / …
#
# 站位=起点：`era` / `chapter` / `ready1`·`ready3` / `clock` 由**出身与借名这两组选项**写，
# 不放进场节点 —— 入场节点读不到站位（DAG 只能编译期分流），而事件的 era 门必须与时间锚一致。
# 晚起点（2018 / 受肉 / 咒灵）跳过的章节旗标统一留 false，等章节表定稿（design §6.1）。
#
# 依赖（缺任何一个都会在 **commit 时**失败，不是加载期）：world.yaml 的 innateTechnique 枚举、
# skills.yaml 的 sk-tech-* / sk-domain-*、statuses.yaml 的 tech-* 与体质补正、characters.yaml 的关系端点。

openingId: op-jjk-v3
name: 命数 · 出身与术式
description: 先抽你从哪儿来（这一格决定你在哪条线上），再确定术式、天赋与领域。全程在世界实例化之前完成。
entry: n-self

params:
  # ---------- 身元 ----------
  - { id: who, kind: self, ui: { label: 你是谁, order: 0 } }
  - { id: nick, kind: name, ui: { label: 名字, component: text, order: 1 } }
  - { id: sex, kind: gender, ui: { label: 性别, component: enum, order: 2 } }
  - { id: years, kind: age, ui: { label: 年龄, component: enum, order: 3 } }
  - { id: clock, kind: time, ui: { label: 入场时间, hidden: true } }

  # ---------- 站位 / 出身（字符串旗标，供事件条件读） ----------
  - { id: line, kind: flag, ui: { label: 站位, order: 10 } }
  - { id: originTag, kind: flag, ui: { label: 出身, order: 11 } }
  # 御三家才有意义：inherited（书翻到了你）/ broken（书在别人手里）。
  # 同时作为 `n-tech-clan` 的节点前置 —— 这是「转盘按分支」在现行契约里的落地方式。
  - { id: heritage, kind: flag, ui: { label: 传承, order: 12 } }
  # 姓：所有人都会有一个（姓氏那一格转一次）；御三家「传承没断」时由家传术式覆盖成
  # 禅院 / 加茂 / 五条。它只给「姓名输入框」做预填，不参与任何判定。
  - { id: surname, kind: flag, ui: { label: 姓, order: 13 } }
  - { id: clan, kind: flag, ui: { label: 家系, hidden: true } }
  - { id: canonRole, kind: flag, ui: { label: 借用的人物, hidden: true } }

  # ---------- 术式 ----------
  - { id: techFlag, kind: flag, ui: { label: 生得术式, order: 20 } }
  - { id: techAttr, kind: attribute, ui: { label: 生得术式·枚举, hidden: true } }
  - { id: techStatus, kind: status, ui: { label: 术式补正, hidden: true } }
  - { id: techSkill, kind: skill, ui: { label: 术式技能, hidden: true } }
  - { id: techBodyAttr, kind: attribute, ui: { label: 术式换来的肉体, hidden: true } }

  # ---------- 领域（每个术式一个节点，写进独立参数，互不覆盖） ----------
  - { id: dName, kind: flag, ui: { label: 领域, order: 30 } }
  - { id: dTier, kind: flag, ui: { label: 领域完成度, hidden: true } }
  - { id: dSkill, kind: skill, ui: { label: 领域技能, hidden: true } }
  - { id: domAttr, kind: attribute, ui: { label: 领域补正, hidden: true } }

  # ---------- 天赋 ----------
  - { id: rankAttr, kind: attribute, ui: { label: 等级, hidden: true } }
  - { id: rankFlag, kind: flag, ui: { label: 天赋档, order: 40 } }
  - { id: talentAttr, kind: attribute, ui: { label: 天赋补正, hidden: true } }
  - { id: talentAttr2, kind: attribute, ui: { label: 天赋补正2, hidden: true } }
  - { id: bodyFlag, kind: flag, ui: { label: 体质, order: 41 } }
  - { id: bodyStatus, kind: status, ui: { label: 体质补正, hidden: true } }
  - { id: bodyAttr, kind: attribute, ui: { label: 体质补正值, hidden: true } }

  # ---------- 高阶技巧（3 格各占一个 skill 参数，才能叠加） ----------
  - { id: high1, kind: flag, ui: { label: 高阶技巧·一, order: 50 } }
  - { id: high2, kind: flag, ui: { label: 高阶技巧·二, order: 51 } }
  - { id: high3, kind: flag, ui: { label: 高阶技巧·三, order: 52 } }
  - { id: highSkill1, kind: skill, ui: { label: 技巧·一, hidden: true } }
  - { id: highSkill2, kind: skill, ui: { label: 技巧·二, hidden: true } }
  - { id: highSkill3, kind: skill, ui: { label: 技巧·三, hidden: true } }
  # 黑闪（ADR-073）：不再是一门技能，而是「天赋 + 资质」。
  # 资质就是「咒力操作」（派生属性），不需要单独写值；`highStatus` 只负责挂天赋。
  - { id: highStatus, kind: status, ui: { label: 技巧·特质, hidden: true } }
  # 普通攻击：任何人都会的一手。没有它，咒力耗尽时只能跳回合（2026-11-21 用户裁决）。
  - { id: basicSkill, kind: skill, ui: { label: 基础体术, hidden: true } }

  # ---------- 加点（ADR-004） ----------
  # 预算由**天赋档**决定，不是写死的 5 点：天赋越好，可塑空间越小——
  # 特级苗子的身体已经长成了，能挪的只剩「往哪儿使」；没天赋的人反而什么都能自己练。
  # 这是 ADR-004 D2 的 `budgetFrom`：预算 = 已落定的 number 参数值。
  - { id: talentRoll, kind: number, ui: { label: 天赋点, hidden: true } }
  - id: talentPoints
    kind: points
    budgetFrom: talentRoll
    targets:
      # 上限合计 13 ≥ 最大预算 5，任何天赋档都分得完（不靠「必须花完」逼人乱点）。
      - { attribute: cursedEnergyTotal, min: 0, max: 4, style: purple }
      - { attribute: intellect, min: 0, max: 3 }
      - { attribute: physique, min: 0, max: 3 }
      - { attribute: agility, min: 0, max: 3 }

  # ---------- 出身带来的初始关系与补正 ----------
  - { id: rel1, kind: relation, ui: { label: 关系, hidden: true } }
  - { id: rel2, kind: relation, ui: { label: 关系, hidden: true } }
  - { id: rel3, kind: relation, ui: { label: 关系, hidden: true } }
  - { id: originAttr1, kind: attribute, ui: { label: 出身补正, hidden: true } }
  - { id: originAttr2, kind: attribute, ui: { label: 出身补正2, hidden: true } }
  - { id: ageAttr, kind: attribute, ui: { label: 年龄补正, hidden: true } }
  - { id: enterAttr, kind: attribute, ui: { label: 入场补正, hidden: true } }

  # ---------- 收尾 ----------
  # 站位=起点年份：`era` / `chapter` / `ready*` / `clock` 由**出身与借名这两组选项**写，
  # 不放在入场节点。原因是入场节点读不到站位（DAG 只能编译期分流），
  # 而事件的 era 门（`flag: era, eq: 1`）必须与时间锚一致：2018 年入场却标 era 1，
  # 整条 2006 事件链会照常触发。每一条路径上这几个 id 只有一个写者。
  - { id: gEra, kind: flag, ui: { label: 纪元, hidden: true } }
  - { id: gChapter, kind: flag, ui: { label: 章节, hidden: true } }
  - { id: gReady, kind: flag, ui: { label: 一纪元可行动, hidden: true } }
  - { id: gReady3, kind: flag, ui: { label: 二纪元可行动, hidden: true } }
  - { id: gCreation, kind: flag, ui: { label: 建角完成, hidden: true } }
  - { id: gDone, kind: flag, ui: { label: 开局完成, hidden: true } }

  # ---------- 章节与死亡黑板（入场统一写基线，事件往后改） ----------
  # 这些旗标原开局在入学式一次性落定；事件用 `ne: true` / `eq: false` 读它们，
  # 未声明就不写会让「没发生过」与「没写过」混成同一个 undefined。
  - { id: gSpDone, kind: flag, ui: { label: 怀玉完成, hidden: true } }
  - { id: gGetoGone, kind: flag, ui: { label: 夏油离队, hidden: true } }
  - { id: gHaibaraDead, kind: flag, ui: { label: 灰原阵亡, hidden: true } }
  - { id: gGojoGone, kind: flag, ui: { label: 五条离场, hidden: true } }
  - { id: gNanamiGone, kind: flag, ui: { label: 七海离场, hidden: true } }
  - { id: gSavedRiko, kind: flag, ui: { label: 救下理子, hidden: true } }

nodes:
  # ═══════════════════════════════════════════════════════════════════
  # 0. 你先决定：从空白开始，还是借一个已经写在历史上的名字
  # ═══════════════════════════════════════════════════════════════════
  - node: n-self
    title: 此身是谁
    text: 转盘停在你面前。你可以从空白开始，让出身那一格决定你落在哪条线上；也可以借一个已经写在历史上的名字——那样你不再掷骰，直接进他的局。
    mode: choose
    options:
      - id: o-new
        text: 从空白开始（转盘决定出身）
        set:
          who: { kind: new, id: player, name: 无名氏, gender: male, age: 16, attributes: {}, skills: [] }
        goto: n-origin
      - id: o-canon
        text: 借一个原作人物的名字（出身 / 术式 / 领域 / 天赋全部跳过）
        set:
          line: { id: line, value: canon-fixed }
        goto: n-canon

  # ═══════════════════════════════════════════════════════════════════
  # 0b. 复用原作人物：整套转盘跳过
  #     reuse 路径下 name / gender / age / attribute(set) 本来就被引擎忽略，
  #     技能与领域由 characters.yaml 给；再抽一份就是白送加成（五条 + 特级苗子）。
  #     所以这里直接去入场 —— 「借名字」是换一具身体，不是重开一局。
  # ═══════════════════════════════════════════════════════════════════
  - node: n-canon
    title: 借谁的名字
    text: 名字一旦借来，你就不再是「某届的一个学生」，而是历史里那个人。术式、领域、人脉都是他本来有的——转盘这次不掷。
    mode: choose
    options:
      - id: c-gojo
        text: 五条悟 · 2006，高专二年生
        set:
          who: { kind: reuse, characterId: npc-gojo }
          canonRole: { id: canonRole, value: gojo }
          originTag: { id: origin, value: gojo }
          # 2006 春入场（纪元一，第一章）：92 天把日历推到四月。
          gEra: { id: era, value: 1 }
          gChapter: { id: chapter, value: 1 }
          gReady: { id: ready1, value: true }
          clock: { value: 92, unit: day }
        goto: n-entrance
      - id: c-geto
        text: 夏油杰 · 2006，高专二年生
        set:
          who: { kind: reuse, characterId: npc-geto }
          canonRole: { id: canonRole, value: geto }
          originTag: { id: origin, value: geto }
          gEra: { id: era, value: 1 }
          gChapter: { id: chapter, value: 1 }
          gReady: { id: ready1, value: true }
          clock: { value: 92, unit: day }
        goto: n-entrance
      - id: c-riko
        text: 天内理子 · 2006，星浆体（短线：她只有这一个夏天）
        set:
          who: { kind: reuse, characterId: npc-riko }
          canonRole: { id: canonRole, value: riko }
          originTag: { id: origin, value: riko }
          gEra: { id: era, value: 1 }
          gChapter: { id: chapter, value: 1 }
          gReady: { id: ready1, value: true }
          clock: { value: 92, unit: day }
        goto: n-entrance
  # ═══════════════════════════════════════════════════════════════════
  # 1. 出身 —— 这一格决定站位（六条线），也决定你什么时候进场
  #    权重按「遇到的人有多稀有」给，不按战斗强度给。
  # ═══════════════════════════════════════════════════════════════════
  - node: n-origin
    title: 出身
    text: 第一格不是「你有多强」，是「你从哪儿来」。这一格落定，你站在哪条线上就定了——同一段夏天，三种人，三种能做的事。
    mode: roll
    options:
      - id: o-civilian
        text: 普通人家，靠自己考进高专 —— 原作线
        weight: 30
        set:
          # 自建角色的 id 按出身区分（2026-11-23）：后续剧情/提示词用
          # `as: player-civilian`（或数组里并列多个）精确分线；
          # 不这么写，所有自建角色都叫 player，as 无法区分出身。
          who: { kind: new, id: player-civilian }
          line: { id: line, value: canon }
          originTag: { id: origin, value: civilian }
          # 没有「传承」这回事：写成 none，是为了让姓氏那一格的前置能命中
          # （与旁支的 broken 同一条判据，见 n-surname）。
          heritage: { id: heritage, value: none }
          # 原作线：没有背景、没有师承，能做的只有报警、挡一下、收尸。
          originAttr1: { id: luck, value: 2, mode: add }
          originAttr2: { id: intellect, value: 1, mode: add }
          rel1: { with: npc-nanami, value: 8, kind: friend }
          rel2: { with: npc-haibara, value: 10, kind: friend }
          rel3: { with: npc-gojo, value: 3, kind: colleague }
          gEra: { id: era, value: 1 }
          gChapter: { id: chapter, value: 1 }
          gReady: { id: ready1, value: true }
          clock: { value: 92, unit: day }
      - id: o-clan
        text: 御三家旁支，家里知道「咒术」两个字 —— 高专线
        weight: 22
        set:
          who: { kind: new, id: player-clan-branch }
          line: { id: line, value: highschool }
          originTag: { id: origin, value: clan-branch }
          clan: { id: clan, value: branch }
          originAttr1: { id: cursedEnergyTotal, value: 6, mode: add }
          originAttr2: { id: reputation, value: 10, mode: add }
          rel1: { with: npc-gojo, value: 6, kind: colleague }
          rel2: { with: npc-geto, value: 4, kind: colleague }
          rel3: { with: npc-yaga, value: 8, kind: mentor }
          gEra: { id: era, value: 1 }
          gChapter: { id: chapter, value: 1 }
          gReady: { id: ready1, value: true }
          clock: { value: 92, unit: day }
      - id: o-curse-family
        text: 诅咒师世家，从小知道钱能买命 —— 诅咒师线
        weight: 14
        set:
          who: { kind: new, id: player-curse-family }
          line: { id: line, value: curse-user }
          originTag: { id: origin, value: curse-family }
          heritage: { id: heritage, value: none }
          # 恶名是 0..2 的 ladder，+1 已经是「圈子里有人记得你」的量级。
          originAttr1: { id: infamy, value: 1, mode: add }
          originAttr2: { id: cursedEnergyTotal, value: 4, mode: add }
          rel1: { with: npc-toji, value: 10, kind: colleague }
          rel2: { with: npc-gojo, value: -30, kind: enemy }
          gEra: { id: era, value: 1 }
          gChapter: { id: chapter, value: 1 }
          gReady: { id: ready1, value: true }
          clock: { value: 92, unit: day }
  # ═══════════════════════════════════════════════════════════════════
  # 2. 基本信息
  # ═══════════════════════════════════════════════════════════════════
  - node: n-gender
    title: 性别
    text: 性别这一格对咒术界不重要，对你怎么被人叫很重要。
    mode: choose
    options:
      - { id: male, text: 男性, set: { sex: male } }
      - { id: female, text: 女性, set: { sex: female } }
      - { id: femboy, text: 男娘, set: { sex: femboy } }
      - { id: agender, text: 无性别, set: { sex: agender } }

  - node: n-age
    title: 年龄
    text: 年龄不是数字，是别人愿意把多大的事交给你。
    mode: roll
    options:
      - { id: a15, text: 十五岁, weight: 26, set: { years: 15 } }
      - { id: a16, text: 十六岁, weight: 24, set: { years: 16 } }
      - { id: a17, text: 十七岁, weight: 18, set: { years: 17 } }
      - { id: a20, text: 二十岁 · 晚入学, weight: 14, set: { years: 20 } }
      - { id: a26, text: 二十六岁 · 半路转行, weight: 10, set: { years: 26 } }
      - id: a32
        text: 三十二岁 · 之前在做别的事
        weight: 8
        set:
          years: 32
          ageAttr: { id: intellect, value: 2, mode: add }

  # ═══════════════════════════════════════════════════════════════════
  # 3. 生得术式
  #    2026-11-23：原作术式进池，按出身分流（clan-branch / curse-family / civilian），
  #    用 `weightByParam.originTag` 做 0 基偏置：base weight 0 ⇒ 没有对应出身就不会出货。
  #    不再以「两个十影」为由排除血继 / 唯一术式（用户裁决：这部分不限制强度）。
  #    借用原作人物时仍然跳过整个术式/领域节点（n-canon 直达 n-entrance）。
  # ═══════════════════════════════════════════════════════════════════
  - node: n-talent
    title: 天赋
    text: 天赋这一格最不公平。有人第一次握咒具就像握过十年，有人练到吐血也只是二级。
    mode: roll
    options:
      - id: t-none
        text: 毫无天赋 · 靠练
        weight: 5
        set:
          talentRoll: 5
          rankFlag: { id: talent, value: none }
          rankAttr: { id: grade, value: grade-4, mode: set }
          talentAttr: { id: cursedEnergyTotal, value: 1, mode: add }
          talentAttr2: { id: physique, value: 2, mode: add }
      - id: t-ordinary
        text: 普通天赋 · 够用
        weight: 30
        set:
          talentRoll: 4
          rankFlag: { id: talent, value: ordinary }
          rankAttr: { id: grade, value: grade-3, mode: set }
          talentAttr: { id: cursedEnergyTotal, value: 3, mode: add }
      - id: t-good
        text: 优秀天赋 · 教官会多看你一眼
        weight: 27
        set:
          talentRoll: 4
          rankFlag: { id: talent, value: good }
          rankAttr: { id: grade, value: grade-2, mode: set }
          talentAttr: { id: cursedEnergyTotal, value: 6, mode: add }
          talentAttr2: { id: intellect, value: 2, mode: add }
      - id: t-genius
        text: 天才级 · 乙骨那种「学一遍就会」
        weight: 15
        # 家学是真实存在的：御三家旁支与诅咒师世家从小摸咒具，出天才的比例更高。
        # 这是「出身第一次有机制后果」，不是给玩家发福利（平民的权重没动）。
        weightByParam:
          originTag:
            clan-branch: 6
            curse-family: 4
        set:
          talentRoll: 3
          rankFlag: { id: talent, value: genius }
          rankAttr: { id: grade, value: grade-1, mode: set }
          talentAttr: { id: cursedEnergyTotal, value: 12, mode: add }
          talentAttr2: { id: intellect, value: 3, mode: add }
      - id: t-special
        text: 特级苗子 · 上面会把你的名字圈起来
        weight: 6
        set:
          talentRoll: 3
          rankFlag: { id: talent, value: special-seed }
          rankAttr: { id: grade, value: grade-1, mode: set }
          talentAttr: { id: cursedEnergyTotal, value: 18, mode: add }
          talentAttr2: { id: reputation, value: 8, mode: add }
      - id: t-anomaly
        text: 异形 · 无法用等级衡量
        weight: 2
        set:
          talentRoll: 2
          rankFlag: { id: talent, value: anomaly }
          rankAttr: { id: grade, value: special, mode: set }
          talentAttr: { id: cursedEnergyTotal, value: 26, mode: add }
          talentAttr2: { id: reputation, value: 14, mode: add }
      - id: t-heavenly
        text: 天与咒缚 · 你用全部咒力换了一具不讲道理的肉体
        weight: 4
        set:
          talentRoll: 3
          rankFlag: { id: talent, value: heavenly }
          rankAttr: { id: grade, value: grade-1, mode: set }
          techFlag: { id: tech, value: none }
          techAttr: { id: innateTechnique, value: none, mode: set }
          techStatus: heavenly-restriction
          techBodyAttr: { id: physique, value: 8, mode: add }
          techSkill: [sk-heavenly-body, sk-heavenly-rush, sk-basic-strike]
        # 没有咒力 ⇒ 没有术式、没有领域（n-dom-* 整段跳过）。
        goto: n-body

  # ── 御三家的传承转盘（2026-11-23 · ADR-072 D3）──────────────────────
  # 旁支不等于「家里有术式」：书在嫡流手里，轮到谁看运气。
  # 这一格用节点前置 `when` 只给 clan-branch 看；其他人**静默跳过**
  # （不占步数、不写结果、不上屏），所以它不必被复制到三条 lane 里。
  - node: n-heritage
    title: 传承
    text: 御三家的术式不是抽的，是传的。名字写在族谱上，能不能翻开那本书，是另一回事。
    mode: roll
    when:
      - { param: originTag, in: [clan-branch] }
    options:
      - id: h-inherited
        text: 传承没断 · 那本只给嫡流的书，翻到了你的名字
        weight: 34
        set:
          heritage: { id: heritage, value: inherited }
        # 故意不写 goto：下一格「姓氏」要靠节点前置决定跑不跑，
        # goto 会把它整格跳过去（而「断了」的旁支正需要它给姓）。
      - id: h-broken
        text: 传承断了 · 你是旁支的旁支，书在别人手里
        weight: 66
        set:
          heritage: { id: heritage, value: broken }

  # ── 姓氏（2026-11-23 · ADR-072 D7）──────────────────────────────────
  # 只给「没有家传术式的人」：非御三家（heritage=none）与传承断了的旁支。
  # 传承没断的旁支会跳过它，姓由家传术式那一格覆盖成禅院 / 加茂 / 五条。
  # 这一格存在的唯一理由：给最后的姓名输入框一个「已经填好的姓」。
  - node: n-surname
    title: 姓氏
    text: 咒术界不问你从哪来，但户口本会。转盘随手给你一个姓。
    mode: roll
    when:
      - { param: heritage, in: [broken, none] }
    options:
      - { id: s-kamiya, text: 神谷, weight: 1, set: { surname: { id: surname, value: 神谷 } } }
      - { id: s-shirai, text: 白井, weight: 1, set: { surname: { id: surname, value: 白井 } } }
      - { id: s-kiryu, text: 桐生, weight: 1, set: { surname: { id: surname, value: 桐生 } } }
      - { id: s-asakura, text: 浅仓, weight: 1, set: { surname: { id: surname, value: 浅仓 } } }
      - { id: s-makihara, text: 槙原, weight: 1, set: { surname: { id: surname, value: 槙原 } } }
      - { id: s-itami, text: 伊丹, weight: 1, set: { surname: { id: surname, value: 伊丹 } } }
      - { id: s-saegusa, text: 三枝, weight: 1, set: { surname: { id: surname, value: 三枝 } } }
      - { id: s-arima, text: 有马, weight: 1, set: { surname: { id: surname, value: 有马 } } }

  # ── 家传术式（只对「传承没断」的旁支开放）──────────────────────────
  # 三家的书各记各的：十影（禅院）· 赤血（加茂）· 无下限（五条）。
  # 这一格不写 originTag 偏置 —— 能走到这里的人已经付过 34% 的运气。
  - node: n-tech-clan
    title: 家传术式
    text: 书翻开，第一页只有一行字。你认得那个字，因为它和你从小听到大的说法一模一样。
    mode: roll
    when:
      - { param: heritage, in: [inherited] }
    options:
      - id: t-ten-shadows
        text: 十种影法术 —— 影子里住着十只式神，你只是它们的门
        weight: 36
        weightByParam:
          rankFlag:
            genius: 2
            special-seed: 2
            anomaly: 1
        set:
          techFlag: { id: tech, value: ten-shadows }
          techAttr: { id: innateTechnique, value: ten-shadows, mode: set }
          techStatus: tech-ten-shadow
          surname: { id: surname, value: 禅院 }
          techSkill: [sk-ten-shadow]
        goto: n-dom-generic
      - id: t-red-blood
        text: 赤血操术 —— 血离开身体之后，仍然听你的
        weight: 36
        set:
          techFlag: { id: tech, value: red-blood }
          techAttr: { id: innateTechnique, value: red-blood, mode: set }
          techStatus: tech-red-blood
          surname: { id: surname, value: 加茂 }
          techSkill: [sk-red-blood]
        goto: n-dom-generic
      - id: t-limitless
        text: 无下限术式 —— 你与任何东西之间，都隔着一层无限
        weight: 28
        weightByParam:
          rankFlag:
            genius: 2
            special-seed: 3
            anomaly: 3
        set:
          techFlag: { id: tech, value: limitless }
          techAttr: { id: innateTechnique, value: limitless, mode: set }
          techStatus: tech-limitless
          surname: { id: surname, value: 五条 }
          # 无下限本身只给「苍」与「把无限贴到身上」：赫要反转术式，
          # 茈要赫与苍同时在手（见 events.yaml 的 pool 事件）。
          techSkill: [sk-limitless, sk-gojo-blue]
        goto: n-dom-generic

  - node: n-tech-generic
    title: 生得术式
    text: 术式不是学来的，是生下来就写在身体里的那一行字。转盘只负责让你知道它写了什么。
    mode: roll
    options:
      - id: t-space
        text: 空间系 —— 距离在你手里是可以折叠的东西
        weight: 6
        weightByParam:
          rankFlag:
            special-seed: 3
            anomaly: 4
            genius: 2
            none: -2
        set:
          techFlag: { id: tech, value: space }
          techAttr: { id: innateTechnique, value: space, mode: set }
          techStatus: tech-space
          techSkill: [sk-tech-space-shift, sk-tech-space-cut]
        goto: n-dom-space
      - id: t-illusion
        text: 精神幻术系 —— 你改的不是画面，是他确信的那一段
        weight: 5
        weightByParam:
          rankFlag:
            good: 1
            none: -1
        set:
          techFlag: { id: tech, value: illusion }
          techAttr: { id: innateTechnique, value: illusion, mode: set }
          techStatus: tech-illusion
          techSkill: [sk-tech-illusion-suggest, sk-tech-illusion-rewrite]
        goto: n-dom-illusion
      - id: t-flesh
        text: 肉体操控系 —— 细胞、骨、血管，都听你的
        weight: 5
        weightByParam:
          rankFlag:
            ordinary: 1
            none: 1
        set:
          techFlag: { id: tech, value: flesh }
          techAttr: { id: innateTechnique, value: flesh, mode: set }
          techStatus: tech-flesh
          techSkill: [sk-tech-flesh-mend, sk-tech-flesh-warp]
        goto: n-dom-flesh
      - id: t-gravity
        text: 重力力场系 —— 你决定哪边是下
        weight: 4
        weightByParam:
          rankFlag:
            special-seed: 1
            anomaly: 2
        set:
          techFlag: { id: tech, value: gravity }
          techAttr: { id: innateTechnique, value: gravity, mode: set }
          techStatus: tech-gravity
          techSkill: [sk-tech-gravity-press, sk-tech-gravity-lift]
        goto: n-dom-gravity
      - id: t-shadow
        text: 影子系 —— 有光的地方就有你的入口
        weight: 4
        weightByParam:
          rankFlag:
            good: 1
            genius: 1
        set:
          techFlag: { id: tech, value: shadow }
          techAttr: { id: innateTechnique, value: shadow, mode: set }
          techStatus: tech-shadow
          techSkill: [sk-tech-shadow-pin, sk-tech-shadow-step]
        goto: n-dom-shadow
      - id: t-sound
        text: 声波振动系 —— 你说话的时候骨头在响
        weight: 3
        weightByParam:
          rankFlag:
            none: 2
            ordinary: 1
        set:
          techFlag: { id: tech, value: sound }
          techAttr: { id: innateTechnique, value: sound, mode: set }
          techStatus: tech-sound
          techSkill: [sk-tech-sound-pulse, sk-tech-sound-shatter]
        goto: n-dom-sound
      - id: t-toxin
        text: 毒素腐蚀系 —— 你呼出的气在别人体内结算
        weight: 3
        weightByParam:
          rankFlag:
            ordinary: 1
            good: 1
        set:
          techFlag: { id: tech, value: toxin }
          techAttr: { id: innateTechnique, value: toxin, mode: set }
          techStatus: tech-toxin
          techSkill: [sk-tech-toxin-mist, sk-tech-toxin-rot]
        goto: n-dom-toxin
      - id: t-matter
        text: 物质转化系 —— 血可以变成铁，骨可以变成盐
        weight: 4
        weightByParam:
          rankFlag:
            genius: 2
            special-seed: 1
        set:
          techFlag: { id: tech, value: matter }
          techAttr: { id: innateTechnique, value: matter, mode: set }
          techStatus: tech-matter
          techSkill: [sk-tech-matter-forge, sk-tech-matter-swap]
        goto: n-dom-matter
      - id: t-rule
        text: 契约规则系 —— 你说出口的条件会成立
        weight: 3
        weightByParam:
          rankFlag:
            special-seed: 3
            anomaly: 3
            none: -3
        set:
          techFlag: { id: tech, value: rule }
          techAttr: { id: innateTechnique, value: rule, mode: set }
          techStatus: tech-rule
          techSkill: [sk-tech-rule-clause, sk-tech-rule-break]
        goto: n-dom-rule
      - id: t-fate
        text: 运势因果系 —— 你不太用力，事情自己会往你这边倒
        weight: 2
        weightByParam:
          rankFlag:
            anomaly: 5
            special-seed: 2
            none: -1
        set:
          techFlag: { id: tech, value: fate }
          techAttr: { id: innateTechnique, value: fate, mode: set }
          techStatus: tech-fate
          techSkill: [sk-tech-fate-coin, sk-tech-fate-debt]
        goto: n-dom-fate
      # ── 原作术式（2026-11-23）────────────────────────────────────
      # 御三家的三条（十影 / 赤血 / 无下限）**不在这个池子里**：它们走 `n-tech-clan`，
      # 只有「传承没断」的旁支能抽。这里是通用池，按出身偏置决定「遇到什么」。
      # 强度不做上限（用户裁决）：权重只决定「遇到什么」，不再为平衡砍效果。
      - id: t-cursed-spirits
        text: 咒灵操术 —— 吞下它，然后让它替你走完剩下的路
        weight: 0
        weightByParam:
          originTag:
            curse-family: 7
        set:
          techFlag: { id: tech, value: cursed-spirits }
          techAttr: { id: innateTechnique, value: cursed-spirits, mode: set }
          techStatus: tech-cursed-spirits
          techSkill: [sk-summon-curse]
        goto: n-dom-generic
      - id: t-shrine
        text: 御厨子 —— 斩击与火焰，不需要理由，只需要一个目标
        weight: 0
        weightByParam:
          originTag:
            curse-family: 4
          rankFlag:
            special-seed: 2
            anomaly: 3
        set:
          techFlag: { id: tech, value: shrine }
          techAttr: { id: innateTechnique, value: shrine, mode: set }
          techStatus: tech-shrine
          techSkill: [sk-dismantle, sk-cleaves]
        goto: n-dom-generic
      - id: t-doll
        text: 刍灵咒法 —— 草人与钉子，替你承受一部分因果
        weight: 0
        weightByParam:
          originTag:
            civilian: 4
            clan-branch: 1
        set:
          techFlag: { id: tech, value: doll }
          techAttr: { id: innateTechnique, value: doll, mode: set }
          techStatus: tech-doll
          techSkill: [sk-doll-curse, sk-doll-nail]
        goto: n-dom-generic
      - id: t-thunder
        text: 雷电术式 —— 你的咒力以雷的形态存在，出手总快半步
        weight: 0
        weightByParam:
          originTag:
            civilian: 3
            curse-family: 2
        set:
          techFlag: { id: tech, value: thunder }
          techAttr: { id: innateTechnique, value: thunder, mode: set }
          techStatus: tech-thunder
          techSkill: [sk-thunder]
        goto: n-dom-generic
      - id: t-speech
        text: 咒言 —— 说出口的话会成为规则，代价是喉咙一直在渗血
        weight: 0
        weightByParam:
          originTag:
            civilian: 4
            clan-branch: 1
        set:
          techFlag: { id: tech, value: speech }
          techAttr: { id: innateTechnique, value: speech, mode: set }
          techStatus: tech-speech
          techSkill: [sk-speech-command, sk-speech-seal]
        goto: n-dom-generic

      - id: t-latent
        text: 还没觉醒 —— 转盘这次什么都没说
        weight: 5
        weightByParam:
          rankFlag:
            none: 6
            ordinary: 2
            special-seed: -2
        set:
          techFlag: { id: tech, value: latent }
          techAttr: { id: innateTechnique, value: latent, mode: set }
        goto: n-body

  # ═══════════════════════════════════════════════════════════════════
  # 4. 领域（一术式一节点）
  #    这是「按术式给领域」在现行契约里唯一可行的写法：术式的每个扇区 goto 到自己的
  #    领域节点，领域名与必中效果随术式走。**不能**按天赋/属性调制权重（无 weightBy）。
  #    完度沿用转盘分布：不会 50 / 半成品 18 / 完整 18 / 开放 6（这里按 3-4 项重新配权）。
  # ═══════════════════════════════════════════════════════════════════
  - node: n-dom-space
    title: 领域 · 无间回廊
    text: 你想让一片空间只认你定的距离。门在身后关上时，走廊会自己变长。
    mode: roll
    goto: n-body
    options:
      - id: none
        text: 不会领域
        weight: 55
        set: { dName: { id: domain, value: none } }
      - id: half
        text: 半成品 · 要靠咒具或「帐」把边界撑起来
        weight: 24
        set:
          dName: { id: domain, value: 无间回廊 }
          dTier: { id: domainTier, value: 1 }
          dSkill: [sk-domain-space]
      - id: full
        text: 完整领域 · 无间回廊：对手每次移动都被搬回原点
        weight: 18
        set:
          dName: { id: domain, value: 无间回廊 }
          dTier: { id: domainTier, value: 2 }
          dSkill: [sk-domain-space]
          domAttr: { id: cursedEnergyTotal, value: 4, mode: add }
      - id: open
        text: 开放式领域 · 不设结界，把整条街变成回廊
        weight: 3
        set:
          dName: { id: domain, value: 无间回廊 }
          dTier: { id: domainTier, value: 3 }
          dSkill: [sk-domain-space]
          domAttr: { id: cursedEnergyTotal, value: 6, mode: add }

  - node: n-dom-illusion
    title: 领域 · 百八烦恼
    text: 一百零八种烦恼，一人分一种。必中的不是幻觉，是他最确信的那段记忆被换掉了一页。
    mode: roll
    goto: n-body
    options:
      - id: none
        text: 不会领域
        weight: 55
        set: { dName: { id: domain, value: none } }
      - id: half
        text: 半成品 · 只能对一个人生效
        weight: 24
        set:
          dName: { id: domain, value: 百八烦恼 }
          dTier: { id: domainTier, value: 1 }
          dSkill: [sk-domain-illusion]
      - id: full
        text: 完整领域 · 百八烦恼：进来的人先忘记自己为什么来
        weight: 18
        set:
          dName: { id: domain, value: 百八烦恼 }
          dTier: { id: domainTier, value: 2 }
          dSkill: [sk-domain-illusion]
          domAttr: { id: intellect, value: 4, mode: add }
      - id: open
        text: 开放式领域 · 没有墙，只有一句话反复被听见
        weight: 3
        set:
          dName: { id: domain, value: 百八烦恼 }
          dTier: { id: domainTier, value: 3 }
          dSkill: [sk-domain-illusion]
          domAttr: { id: intellect, value: 6, mode: add }

  - node: n-dom-flesh
    title: 领域 · 胎藏
    text: 胎藏是「还没长成」的意思。进了这里的人，身体会按你的图纸重新长一遍。
    mode: roll
    goto: n-body
    options:
      - id: none
        text: 不会领域
        weight: 55
        set: { dName: { id: domain, value: none } }
      - id: half
        text: 半成品 · 只改得动伤口，改不动骨架
        weight: 24
        set:
          dName: { id: domain, value: 胎藏 }
          dTier: { id: domainTier, value: 1 }
          dSkill: [sk-domain-flesh]
      - id: full
        text: 完整领域 · 胎藏：骨骼错位、器官移位，先痛后死
        weight: 18
        set:
          dName: { id: domain, value: 胎藏 }
          dTier: { id: domainTier, value: 2 }
          dSkill: [sk-domain-flesh]
          domAttr: { id: physique, value: 4, mode: add }
      - id: open
        text: 开放式领域 · 整片区域都是培养基
        weight: 3
        set:
          dName: { id: domain, value: 胎藏 }
          dTier: { id: domainTier, value: 3 }
          dSkill: [sk-domain-flesh]
          domAttr: { id: physique, value: 6, mode: add }

  - node: n-dom-gravity
    title: 领域 · 须弥
    text: 须弥是压在地底的那座山。这里没有上下，只有「压向哪里」。
    mode: roll
    goto: n-body
    options:
      - id: none
        text: 不会领域
        weight: 55
        set: { dName: { id: domain, value: none } }
      - id: half
        text: 半成品 · 只能压一个方向，撑不过十秒
        weight: 24
        set:
          dName: { id: domain, value: 须弥 }
          dTier: { id: domainTier, value: 1 }
          dSkill: [sk-domain-gravity]
      - id: full
        text: 完整领域 · 须弥：方向被重定义，对手被自己的体重压住
        weight: 18
        set:
          dName: { id: domain, value: 须弥 }
          dTier: { id: domainTier, value: 2 }
          dSkill: [sk-domain-gravity]
          domAttr: { id: cursedEnergyTotal, value: 4, mode: add }
      - id: open
        text: 开放式领域 · 一片没有重力的空腔，空气先被抽走
        weight: 3

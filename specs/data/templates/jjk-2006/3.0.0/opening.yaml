  # ═══════════════════════════════════════════════════════════════════
  # 6.4 姓名（ADR-072 D7）
  #     整局唯一一个「你写什么就是什么」的格子。预填由引擎算：姓 + （你在向导里写过的名字
  #     / 转盘给的 / 你自己改的）。引擎不认识「名字」这个业务 —— 它只知道「写 nick 参数」，
  #     所以这一格换成任何文本字段都是同一套（`input.param` 改一下就行）。
  #     放加点之前：先定「你是谁」，再定「你往哪儿长」。
  # ═══════════════════════════════════════════════════════════════════
  - node: n-name
    title: 姓名
    text: 名字是这一整张转盘上唯一一个不是它写的地方。姓已经替你填好了；想改就整段改掉。
    mode: input
    input:
      param: nick
      prefill:
        # 御三家：姓在前，你写过的名字接在后面（没写过就用转盘给的）。
        - when: [{ param: originTag, in: [clan-branch] }]
          require: [playerName]
          text: "{surname}{playerName}"
        - when: [{ param: originTag, in: [clan-branch] }]
          text: "{surname}{pick}"
        # 其它出身：你写了就原样用，没写就转一个。
        - require: [playerName]
          text: "{playerName}"
        - text: "{surname}{pick}"
      suggestions: [透, 恵, 澪, 悠, 湊, 葵, 律, 環, 旭, 遥, 忍, 熙]
      placeholder: 输入名字
      hint: 姓已经填好；不想用就整段改掉，也可以只留一个名。
      minLength: 1
      maxLength: 12
      pattern: "^[^<>]{1,12}$"

  # ═══════════════════════════════════════════════════════════════════
  # 6.5 加点（ADR-004）
  #     这是**唯一**一个玩家自己写数字的节点。放在高阶技巧之后、入场之前：
  #     前面每一格都在「抽」（命），这一格是「选」（人），最后再入场。
  # ═══════════════════════════════════════════════════════════════════
  - node: n-allocate
    title: 加点
    text: 天赋是把牌发到你手上，加点是决定先打哪张。落定之后，这一生都改不了。
    mode: allocate
    param: talentPoints

  # ═══════════════════════════════════════════════════════════════════
  # 7. 入场
  #    只写所有站位都成立的旗标；`chapter` / `era` / `studentYear` 的差异留给章节表，
  #    不要在这里按站位分叉（这个节点读不到出身结果）。
  # ═══════════════════════════════════════════════════════════════════
  - node: n-entrance
    title: 入场
    text: 转盘停了。你手里握着的这些东西——术式、领域、几样不教的本事——从现在起不再由它决定，由你怎么用决定。
    mode: choose
    options:
      - id: in
        text: 走进去
        set:
          gCreation: { id: creationDone, value: true }
          gDone: { id: openingDone, value: true }
          basicSkill: [sk-basic-strike]
          # 章节黑板的基线：全 false。era / chapter / ready 已由出身那一格写定，
          # 这里只补「还没发生」的那批（原开局在入学式一次性落定这些）。
          gSpDone: { id: spDone, value: false }
          gGetoGone: { id: getoGone, value: false }
          gHaibaraDead: { id: haibaraDead, value: false }
          gGojoGone: { id: gojoGone, value: false }
          gNanamiGone: { id: nanamiGone, value: false }
          gSavedRiko: { id: savedRiko, value: false }
      - id: in-look
        text: 先低头看一眼自己的手
        set:
          gCreation: { id: creationDone, value: true }
          gDone: { id: openingDone, value: true }
          basicSkill: [sk-basic-strike]
          gSpDone: { id: spDone, value: false }
          gGetoGone: { id: getoGone, value: false }
          gHaibaraDead: { id: haibaraDead, value: false }
          gGojoGone: { id: gojoGone, value: false }
          gNanamiGone: { id: nanamiGone, value: false }
          gSavedRiko: { id: savedRiko, value: false }
          # 只是多看一秒：给一点幸运，不给额外资源。
          enterAttr: { id: luck, value: 1, mode: add }

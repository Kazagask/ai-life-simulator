  # ═══════════════════════════════════════════════════════════════════
  # 6. 高阶技巧 · 三格
  #    「会几个」不是先抽个数再抽几次（DAG 无循环，写不出来），而是三格各自可能落空。
  #    七个技巧拆成三格、互不重叠 ⇒ 不会抽到重复；每格一个独立 skill 参数才能叠加。
  # ═══════════════════════════════════════════════════════════════════
  - node: n-high1
    title: 高阶技巧 · 一
    text: 高专不教这些。要么有人在尸体边上教过你，要么你在自己要死的那次里学会了。
    mode: roll
    options:
      - id: none
        text: 不会
        weight: 46
        weightByParam:
          rankFlag:
            none: 30
            ordinary: 14
            good: -2
            genius: -12
            special-seed: -20
            anomaly: -24
            heavenly: 8
        set: { high1: { id: high1, value: none } }
      - id: reverse
        text: 反转术式 · 把负的咒力乘一次负，伤口就合上了
        weight: 20
        # 反转术式是「负负得正」：两股负向咒力相乘。天与咒缚（techFlag=none）没有咒力可乘，
        # 这一格对他们几乎必然落空 —— 这是设定，不是平衡。ADR-001 D7 weightByParam。
        weightByParam:
          techFlag:
            none: -18
          rankFlag:
            good: 4
            genius: 10
            special-seed: 12
            anomaly: 12
            none: -10
        set:
          high1: { id: high1, value: reverse }
          highSkill1: [sk-reverse-heal]
      - id: black-flash
        text: 黑闪 · 你好像天生就知道那一击该落在哪一帧上
        weight: 24
        weightByParam:
          rankFlag:
            none: -12
            ordinary: -2
            good: 3
            genius: 8
            special-seed: 10
            anomaly: 10
        set:
          high1: { id: high1, value: black-flash }
          # 黑闪概率由「咒力操作」决定（每点 0.3%）—— 资质不再是单独一条属性。
          highStatus: t-black-flash
      - id: simple
        text: 简易领域 · 没有结界，只有一圈「你进不来」
        weight: 10
        weightByParam:
          rankFlag:
            good: 3
            genius: 5
            special-seed: 6
            anomaly: 6
            none: -4
        set:
          high1: { id: high1, value: simple-domain }
          highSkill1: [sk-simple-domain]


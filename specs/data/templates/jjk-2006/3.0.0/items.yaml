# JJK 世界模板 · items.yaml
#
# 2026-11-12 清理：删除旧 demo 遗留的「一级咒具 / 二级咒具 / 咒具·残刃 / 观察者护符」，
# 也删掉了 initialEquipment（玩家一开局不该白拿一把游云）。
# 玩家能拿到的装备只有两类来源：命数转盘的「咒具」维度，以及剧情里的战利品。
items:
  - id: item-first-aid
    type: consumable
    name: 急救包
    description: 高专配发的基础医疗包。纱布、止血带、一颗止痛药。
    stackable: true
    usableInBattle: true
    usableOutsideBattle: true
    use:
      - { type: adjustResource, resource: hp, value: 30 }

  - id: item-antidote
    type: consumable
    name: 净化剂
    description: 中和轻度咒毒的药剂。味道像生锈的水。
    stackable: true
    usableInBattle: true
    usableOutsideBattle: true
    use:
      - { type: cureStatus, status: curse-poison }

  - id: item-mp-candy
    type: consumable
    name: 咒力糖
    description: 高专小卖部特产。嚼一颗，咒力回路会短暂地活跃起来。
    stackable: true
    usableInBattle: true
    usableOutsideBattle: true
    use:
      - { type: adjustResource, resource: mp, value: 25 }

  - id: item-smoke
    type: consumable
    name: 线香
    description: 硝子分给你的安神线香。闻一会儿，心就静了。
    stackable: true
    usableInBattle: false
    usableOutsideBattle: true
    use:
      - { type: adjustMood, value: 10 }

  - id: item-talisman
    type: material
    name: 结界符纸
    description: 布设简易结界用的消耗性符纸。夜蛾上课时发的。
    stackable: true
    usableInBattle: false
    usableOutsideBattle: true
    use:
      - { type: adjustMood, value: 2 }

  - id: item-riko-ribbon
    type: key
    name: 理子的发带
    description: 一条普通的、带着樟脑香气的发带。有人把它塞进了你的口袋，没说是谁。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false

  # ══════════════ 特级咒具（转盘 / 战利品） ══════════════

  - id: eq-ten-spear
    type: equipment
    name: 咒具·天逆鉾
    description: 特级咒具。贯穿一切的矛，能强制解除对手的术式。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: weapon
    category: cursed-tool
    quality: mythic
    dynamicModifiers:
      - label: 咒力回路
        attribute: cursedEnergyOutput
        preset: scaled
        params: { base: 4, scaleBy: cursedEnergyTotal, multiplier: 0.2 }
      # 「贯穿一切」不是命中率 +100%，而是**跳过命中骰与闪避门**（2026-11-20）：
      # 以前这件事只能靠 `grantsSkill` 造一个带 `hit: guaranteed` 的招式，
      # 结果是玩家技能栏里凭空多一招，而它本来是这把矛的特性。
      - label: 贯穿
        combat: { guaranteedHit: true }
    # ADR-012 D7：持有时视为拥有 `sk-ten-spear`。它给的是**一个招式**（主动解除术式），
    # 与上面那条常驻的「必中」是两件事，所以两者并存。
    grantsSkill: sk-ten-spear

  - id: eq-bancho
    type: equipment
    name: 咒具·万里锁
    description: 特级咒具。一环套一环的长锁，只要有一端没人看着，它就能一直伸下去。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: accessory
    category: cursed-tool
    quality: legend
    dynamicModifiers:
      - label: 无端
        attribute: agility
        preset: scaled
        params: { base: 4, scaleBy: agility, multiplier: 0.2 }
      # 只要有一端没人看着，它就一直在伸 —— 挡的是「打不中」，不是「打不疼」。
      - label: 环环相扣
        combat: { evade: 0.12 }

  - id: eq-shakujin
    type: equipment
    name: 咒具·释魂刀
    description: 特级咒具。不去砍肉，只斩灵魂；看不见灵魂的人，握着它也只是握着一块冷铁。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: weapon
    category: cursed-tool
    quality: legend
    dynamicModifiers:
      - label: 咒力回路
        attribute: cursedEnergyOutput
        preset: scaled
        params: { base: 4, scaleBy: cursedEnergyTotal, multiplier: 0.2 }
      # 不砍肉、只斩灵魂：伤害乘区加算。它不是属性，改不到面板上的任何一格。
      - label: 斩魂
        combat: { damageDealt: 0.15 }

  - id: eq-kurobuna
    type: equipment
    name: 咒具·黑绳
    description: 特级相当的绳具。咒力绞进每一股麻线，缠上对手的术式；用一次，就烧短一截。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: accessory
    category: cursed-tool
    quality: legend
    dynamicModifiers:
      - attribute: agility
        preset: scaled
        params: { base: 3, scaleBy: agility, multiplier: 0.15 }

  - id: eq-cursed-blade
    type: equipment
    name: 咒具·游云
    description: 特级咒具。三节相连的黑棍，没有附加术式，全凭挥动它的力气说话。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: weapon
    category: cursed-tool
    quality: legend
    dynamicModifiers:
      - attribute: physique
        preset: scaled
        params: { base: 4, scaleBy: physique, multiplier: 0.2 }


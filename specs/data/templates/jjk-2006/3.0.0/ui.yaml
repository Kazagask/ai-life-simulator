# 展示层声明（`specs/SPEC.md` §1.5 形状 B）。
# 这份是「等价现状」的基线：每个能力都落在它今天实际所在的位置，
# 所以加载它前后页面逐字相同。改某一行即可搬迁或关掉入口，不需要改代码。
# 注意：本文件不进语义指纹 —— 改这里不会让旧存档拒载。
place:
  life: tab
  personal: tab
  world: tab
  log: tab
  records: tab
  character: slot:personal
  equipment: slot:personal
  inventory: slot:personal
  skills: slot:personal
  relations: slot:npcList
  wheel: overlay
  battle: overlay
  event: overlay

# ── 样式（ADR-002 D2）─────────────────────────────────────────────
# 模板只写「样式 id」，引擎解析、前端渲染。
# 预设按**视觉**命名，不与品级耦合：内核里没有 mythic/legendary 这种词。
#   稀有度色（8 档，从高到低）：rainbow / rainbow-static / gold / orange / pink / purple / blue / white
#   正负零（3 档）：green / red / gray
# 自定义只允许 color / background / bold / animation 四项。
styles:
  rainbow: { preset: rainbow, animation: rainbow-flow }   # 动虹
  rainbow-static: { preset: rainbow-static }              # 静虹
  gold: { preset: gold }
  orange: { preset: orange }
  pink: { preset: pink }
  purple: { preset: purple }
  blue: { preset: blue }
  white: { preset: white }

# 品质 → 样式 id：**只给模板自定义的品质词用**（如 cursed）。
# 品级阶梯 id（mythic-unique…poor）不需要在这里映射 —— 引擎预置标签自带配色，
# 实体写 `quality: legend` 就直接得到「二品·传说」。
qualityStyles:
  rainbow: rainbow
  rainbow-static: rainbow-static
  gold: gold
  orange: orange
  pink: pink
  purple: purple
  blue: blue
  white: white

# 正负零（与 quality 独立）：实体没写 style / quality 时靠它拿到绿红灰。
polarityStyles:
  positive: green
  negative: red
  neutral: gray

# ── 标签（ADR-002 D2b / D2c）─────────────────────────────────────
# 品级 / 增益 / 异常这些词**引擎已预置**，本模板一行都不用写。
# 品级阶梯共 **14 档**（由高到低；ADR-002 D2f）：
#   mythic-unique 唯一·神话（动态彩）  mythic 一品·神话（静态彩）
#   ancient 旷古·传说（金黄光谱）      legend 二品·传说（金）
#   sublime 绝世·史诗（橙红光谱）      epic 三品·史诗（橙）
#   precious 稀世·珍宝（品红光谱）     treasure 四品·珍宝（粉）
#   superb 超凡·卓越（蓝紫光谱）       excellent 五品·卓越（紫）
#   rare 六品·稀有（青）  fine 七品·精良（蓝）  common 八品·寻常（白）  poor 九品·粗劣（灰）
#   abnormal 异常（红）  buff 增益（绿）  neutral 中性（灰）
#
# 四档带「光谱」的是阶梯里的一档（不是叠加在别档上的形容词），彼此平铺；
# 内核只认它是个词，用哪档、什么时候用全看模板。
# 用法与其余档完全一样：`quality: superb` 或 `tags: [precious]`。
#
# 实体写 `tags: [mythic-unique, buff]` 即可（顺序即优先级：品级在前 ⇒ 名字用品级色）。
#
# 想换叫法 / 换配色，就在下面覆盖**同名 id**，其余继续继承预置：
# tags:
#   mythic-unique: { name: 神话, style: { preset: rainbow, animation: rainbow-flow } }

# 人生页人物卡展示哪些属性（2026-11-19）：等级 / 生得术式 / 名誉是身份，数值属性跟在后。
# 一行两个纯文字；ladder 独占整行（带进度条）。本文件不进语义指纹。
playerCard:
  attributes: [grade, innateTechnique, fame, cursedEnergy, intellect, physique]

# JJK Demo 世界模板 · world.yaml
# 元信息、历法、性别枚举、心情档位、状态栏、属性/资源、回复与判定默认值。
meta:
  id: jjk-2006
  name: 咒术回战 · 命数 2006
  description: 2006 年春，你转动命数转盘，成为东京咒术高专的一年生——七海建人与灰原雄的同班同学，五条悟与夏油杰的学弟学妹。那年夏天，天内理子要在薨星宫与天元同化；你只有一次机会决定站在哪一边。
  startYear: 2006
  engineProtocol: v2

# 亲缘走**模式一（边）**：本模板只有一条 `npc-megumi → npc-toji [father]`
# 和一条 `gap: true` 的远亲边，值不上家族扩展（`extensions/family/doc/FAMILY-GRAPH.md` §6 的迁移结论）。
# 因此**不声明** `extensions.family`，亲属称谓由模板自己写的边直接给出；
# 声明了反而会与本文件的亲属边冲突（加载期 `kinship_conflict`）。

# 运行包版本：这个世界按 master 0.1.0 写；主包升级到不兼容版本时加载期拒载。
requires:
  core: "^0.1.0"

time:
  # 一轮 = 一天：本模板是「一学年」节奏的人生切片，靠剧情节点的 advanceTo 跳月/跳季，
  # 而不是把 4 小时一步的细粒度强行拉长到几十年（旧模板寿终不可达的根因）。
  defaultStep: { value: 1, unit: day }
  # R2.6 / ADR-0013：真实公历（月长 28–31、闰年）；缺省 approx（1 月=30 天）。
  # TimeSpec 字符串字面量（如 "2006-12-24"、"3d2h"）自此按真实日历解析。
  calendar:
    preset: gregorian
  lifeStageSteps:
    childhood: { value: 1, unit: day }
    youth: { value: 1, unit: day }
    adulthood: { value: 1, unit: day }
    elderhood: { value: 1, unit: day }
  # 人生阶段阈值（模板可配置，替代引擎硬编码）
  lifeStages:
    - { id: childhood, label: 幼年, maxAge: 12 }
    - { id: youth, label: 青年, maxAge: 29 }
    - { id: adulthood, label: 壮年, maxAge: 59 }
    - { id: elderhood, label: 暮年 }

# 性别为世界自定义枚举（非二元），角色只能取此处 id
genders:
  - { id: male, label: 男 }
  - { id: female, label: 女 }
  - { id: femboy, label: 男娘 }
  - { id: agender, label: 无性别 }
  - { id: custom-heli, label: 武装直升机 }

mood:
  min: 0
  max: 100
  defaultValue: 60
  bands:
    - { id: low, label: 消沉, min: 0, max: 40, attributeModifiers: { intellect: -1 } }
    - { id: normal, label: 平静, min: 41, max: 70, attributeModifiers: {} }
    - { id: high, label: 高昂, min: 71, max: 100, attributeModifiers: { physique: 1 } }

statusBar:
  - { id: sb-identity, label: 基本, source: identity }
  - { id: sb-mood, label: 心情, source: mood }
  - { id: sb-hp, label: 生命, source: resource, key: hp }
  - { id: sb-mp, label: 咒力, source: resource, key: mp }
  # 人生首页的状态栏只留基础量；派生属性（输出/操作/效率/暴击/闪避/消耗）只在个人页。
  - { id: sb-attrs, label: 属性, source: attribute, keys: [cursedEnergyTotal, physique, agility, intellect, luck, reputation] }
  - { id: sb-status, label: 补正, source: status }
  - id: sb-cursed-quality
    label: 咒力质感
    source: custom
    visibleWhen:
      - { status: cursed-quality, present: true }

attributes:
  # 2026-11-23 用户裁决：原「咒力」一条拆成四条语义。
  # `cursedEnergyTotal` 是**唯一存盘**的那条（咒力总量）；输出 / 操作 / 效率由它派生，
  # 但可以各自被天赋/装备补正（`attributeModifiers` 对派生属性同样有效）。
  #
  # 派生属性（ADR-074）不落存档、按依赖顺序现算；面板显示计算后的值。
  # `critRate / evadeRate / mpCostRate` 是**百分点**：12 = 12%（mpCostRate 负数 = 更便宜）。
  order: [cursedEnergyTotal, cursedEnergyOutput, cursedEnergyControl, cursedEnergyEfficiency, critRate, evadeRate, mpCostRate, physique, agility, intellect, luck, reputation, grade, innateTechnique, infamy, virtue, fame]
  defaults: { cursedEnergyTotal: 5, physique: 5, agility: 5, intellect: 6, luck: 5, reputation: 0, grade: grade-4, innateTechnique: none, infamy: 0, virtue: 0 }
  caps: { cursedEnergyTotal: 200, cursedEnergyOutput: 220, cursedEnergyControl: 120, cursedEnergyEfficiency: 200, critRate: 60, evadeRate: 50, mpCostRate: 100, infamy: 2, virtue: 2 }
  # 显示名由模板声明：引擎/投影/前端一律读这里，不在代码里写死世界观用词
  labels:
    cursedEnergyTotal: 咒力总量
    cursedEnergyOutput: 咒力输出
    cursedEnergyControl: 咒力操作
    cursedEnergyEfficiency: 咒力效率
    critRate: 暴击率
    evadeRate: 闪避率
    mpCostRate: 咒力消耗
    intellect: 智力
    physique: 体术
    agility: 敏捷
    luck: 幸运
    reputation: 声望
    grade: 等级
    innateTechnique: 生得术式
    infamy: 恶名
    virtue: 善名
    fame: 名誉
  # ADR-003：属性类型。未声明的属性一律 number（咒力/智力…保持原样）。
  defs:
    grade:
      kind: enum
      values:
        - { id: grade-4, label: 四级, style: gray }
        - { id: grade-3, label: 三级, style: green }
        - { id: grade-2, label: 二级, style: blue }
        - { id: grade-1, label: 一级, style: purple }
        - { id: special, label: 特级, style: gold }
    innateTechnique:
      kind: enum
      values:
        - { id: ten-shadows, label: 十种影法术, style: blue }
        - { id: red-blood, label: 赤血操术, style: red }
        - { id: doll, label: 刍灵咒法, style: orange }
        - { id: thunder, label: 雷电, style: cyan }
        - { id: speech, label: 咒言, style: pink }
        - { id: cursed-spirits, label: 咒灵操术, style: purple }
        - { id: shrine, label: 御厨子, style: red }
        - { id: limitless, label: 无下限术式, style: rainbow }
        # 原创术式系（原作没有，只供玩家自定义角色抽取；label 写成术式名而非分类词）
        - { id: space, label: 空间, style: cyan }
        - { id: illusion, label: 幻象, style: pink }
        - { id: flesh, label: 血肉, style: red }
        - { id: gravity, label: 重力, style: purple }
        - { id: shadow, label: 影, style: blue }
        - { id: sound, label: 声, style: orange }
        - { id: toxin, label: 毒, style: green }
        - { id: matter, label: 物质, style: gold }
        - { id: rule, label: 规则, style: white }
        - { id: fate, label: 命运, style: rainbow }
        - { id: none, label: 无术式, style: gray }
        - { id: latent, label: 未觉醒, style: gray }
    # ── 派生属性（ADR-074）：value = base + Σ perPoint × 依赖属性的最终值 ──
    # 拆分口径：输出 = 总量 ×1.0（技能伤害）；操作 = 总量 ×0.4（暴击/黑闪）；
    # 效率 = 总量 ×0.5（mp 消耗）。三条都能被天赋/装备单独补正。
    cursedEnergyOutput:
      kind: number
      derived:
        from: [{ attribute: cursedEnergyTotal, perPoint: 1 }]
    cursedEnergyControl:
      kind: number
      derived:
        from: [{ attribute: cursedEnergyTotal, perPoint: 0.4 }]
    cursedEnergyEfficiency:
      kind: number
      derived:
        from: [{ attribute: cursedEnergyTotal, perPoint: 0.5 }]
    # 暴击率：3% 底 + 每点操作 0.2%（操作 50 ⇒ 13%）。上限 40%。
    critRate:
      kind: number
      role: critRate
      derived:
        base: 3
        from: [{ attribute: cursedEnergyControl, perPoint: 0.2 }]
        max: 40
    # 闪避率：每点敏捷 1%（敏捷 5 ⇒ 5%）。上限 50%——再高就该用「必中」说话了。
    evadeRate:
      kind: number
      role: evadeRate
      derived:
        from: [{ attribute: agility, perPoint: 1 }]
        max: 50
    # mp 消耗：每点效率 -0.6%（效率 50 ⇒ -30%）。下限 -80%：永远没有免费术式。
    mpCostRate:
      kind: number
      role: mpCostRate
      signed: true
      derived:
        from: [{ attribute: cursedEnergyEfficiency, perPoint: -0.6 }]
        min: -90

    # 恶名 / 善名：两条隐藏的 0..2 轴，只作为「名誉」的输入，不单独上面板。
    infamy:
      kind: ladder
      hidden: true
      tiers:
        - { id: none, label: "—", at: 0 }
        - { id: plus, label: "＋", at: 1 }
        - { id: plus2, label: "＋＋", at: 2 }
    virtue:
      kind: ladder
      hidden: true
      tiers:
        - { id: none, label: "—", at: 0 }
        - { id: plus, label: "＋", at: 1 }
        - { id: plus2, label: "＋＋", at: 2 }
    # 名誉 = 恶名 × 善名 的派生称号（优先序：先匹配先得，兜底默默无闻）。
    fame:
      kind: composite
      sources: [infamy, virtue]
      cases:
        - when: { infamy: { gte: 2 }, virtue: { gte: 2 } }
          label: 乱世枭雄
          style: rainbow
        - when: { infamy: { gte: 2 } }
          label: 恶贯满盈
          style: red
        - when: { infamy: { gte: 1 }, virtue: { gte: 1 } }
          label: 亦正亦邪
          style: purple
        - when: { infamy: { gte: 1 } }
          label: 声名狼藉
          style: orange
        - when: { virtue: { gte: 2 } }
          label: 名震天下
          style: gold
        - when: { virtue: { gte: 1 } }
          label: 声名远扬
          style: green
      fallback: { label: 默默无闻, style: gray }

# HP/MP 为共享资源池：战斗与模拟读写同一池子（见规格 10.3）
# 上限 = base + perLevel × growthLevel + Σ perAttribute[attr] × 基础属性值
#
# 咒力上限**只由咒力属性决定**（2026-11-19 用户裁决）：base 从 40 改成 0。
# 这样「天与咒缚」不需要任何特判 —— 基础咒力 0 的人上限自然是 0，而不是
# 一个「没有咒力却有 40 点咒力池」的怪东西。
#
# 注意分母变了：玩家开局咒力 5 时 MP 从 50 掉到 10，所以技能消耗（苍 18 / 赫 32）
# 必须按新的池子重调 —— 这件事不再靠手算，用 `pnpm inspect sim` 打木桩量。
resources:
  # 体术也进 hp（2026-11-23）：天与咒缚把总量换成肉体之后，血条要跟着长。
  hp: { base: 75, perLevel: 10, perAttribute: { cursedEnergyTotal: 4, physique: 2 } }
  mp: { base: 0, perLevel: 5, perAttribute: { cursedEnergyTotal: 2 } }

# 召唤名额：**世界维度、按档共享**（2026-11-20 用户裁决）。
# 所有英雄档召唤物共用 hero 个位置、所有杂兵共用 minion 个位置 ——
# 不是「玉犬 1 个、円鹿 1 个」各算各的。技能只写「一次几只」与「强度系数」。
# 这条也是「十影只能同时站一只式神」的来源：想换手先收回（进 bench，状态原样保留）。
summonLimits: { minion: 3, hero: 1 }

# 战斗的世界级默认（ADR-073）：引擎不写死任何数值，缺省 = 没有暴击。
# 6% / 1.5x 是「偶尔会看见一次红字」的量级；真正的黑闪挂在天赋上（见 statuses.yaml），
# 且必须以这次暴击为前提（`when: [{ crit: true }]`）。
combat:
  # 暴击率不再写在这里：它由 `critRate` 派生（3% 底 + 咒力操作 ×0.2）。
  # 世界这一层只保留倍率；写成 chance 会与派生属性叠成两个底。
  crit: { multiplier: 1.5 }

  # 黑闪（世界通用规则，2026-11-24 用户裁决）：不是天赋、不是术式，
  # 而是「打击与咒力卡进百万分之一秒」这件事本身。**任何人**暴击后都可能触发。
  # 触发率 = 咒力操作 × 0.3%（操作 60 ≈ 18%）；天赋只负责记录成长，不负责放行。
  hooks:
    - id: black-flash
      phase: afterHit
      when:
        - { crit: true }
        - { chance: { attribute: cursedEnergyControl, perPoint: 0.003 } }
      effects:
        - { type: critExponent, value: 2.5 }
        # 不写 rounds：层数留到战斗结束；`stacking: stack` 让它一直累加。
        - { type: applyStatus, status: black-flash, target: self }
        - { type: log, text: "打击与咒力在百万分之一秒里重合——黑闪。" }

  # 战评（ADR-075 §2）：黑闪的战后成长挂在这里。引擎不认识黑闪——
  # 这是**世界规则**，不是内置行为；没有这条，天赋永远停在初始阶。
  evaluation:
    hooks:
      - id: black-flash-growth
        when:
          - { statusStacks: black-flash, gte: 1 }
        effects:
          # 一场里觉醒几次就记几次（**不设上限**：以前写 `max: 3`，连闪四下也只记 3）。
          # `create: true` ⇒ **没有天赋的人也能拿到它**：第一次打出黑闪时天赋被建出来，
          # 阶 1 的加点与咒力操作立刻结算 —— 战评就是「获得可成长天赋」的入口。
          - type: advanceTalent
            talent: t-black-flash
            amount: { metric: statusStacks, status: black-flash }
            create: true

# 死亡路由（ADR-075 §5）：死亡结局的唯一权威。
# 2006 只有「挡枪失败」一种死法；兜底也指向它（本模板没有第二种死斗）。
deathRoutes:
  - id: hv-early-death
    when:
      - { flag: hvEarlyDeath, eq: true }
    then: { kind: ending, endingId: end-hv-early-death }

  - id: default-death
    when: []
    then: { kind: ending, endingId: end-hv-early-death }

# 回复节奏跟模拟轮次
regen:
  perTurn: { hp: 2, mp: 1 }
  actions:
    rest: { hp: 20, mp: 10 }

# 玩家行动（action-hook 事件引用此处 id；rest 同时享受 regen.actions.rest 额外回复）
# 设计意图：六个行动各自挂着不同的「钩子」——修炼/上课/交友是稳定收益，
# 巡逻/探索是高风险高回报的转盘，休息是回血与推进剧情的安全键。
actions:
  - id: train
    label: 修炼
    description: 打熬咒力与体术。咒力 +1，代价是耗掉一些体力。
    duration: { value: 1, unit: day }
    effects:
      - { type: adjustAttribute, attribute: cursedEnergyTotal, value: 1 }
      - { type: adjustResource, resource: mp, value: -5 }
  - id: patrol
    label: 巡逻
    description: 在结界薄弱处巡逻——大概率遇见什么，小概率什么也没遇见。
    duration: { value: 1, unit: day }
    effects:
      - { type: adjustFlag, id: patrolCount, value: 1 }
  - id: explore
    label: 探索
    description: 钻进废弃校舍、地下道与咒灵巢穴。风险自负。
    duration: { value: 1, unit: day }
    effects:
      - { type: adjustFlag, id: exploreCount, value: 1 }
  - id: study
    label: 上课
    description: 高专的咒理课程。智力 +1，偶尔会被点名。
    duration: { value: 1, unit: day }
    effects:
      - { type: adjustAttribute, attribute: intellect, value: 1 }
  - id: socialize
    label: 交往
    description: 与同伴度过一天。心情与羁绊都会变好。
    duration: { value: 1, unit: day }
    effects:
      - { type: adjustMood, value: 4 }
  - id: rest
    label: 休息
    description: 回宿舍休整，恢复 HP/MP。
    duration: { value: 1, unit: day }
  # 战败后的恢复手段：把「受伤 / 力竭」真正治好，否则下一章会因带伤而被拒之门外。
  - id: recuperate
    label: 疗养
    description: 去医务室躺两天。治好伤势与力竭，但这两天什么也做不了。
    duration: { value: 2, unit: day }
    effects:
      - { type: cureStatus, status: injured-sim }
      - { type: cureStatus, status: exhausted }
      - { type: adjustResource, resource: hp, value: 30 }
      - { type: adjustResource, resource: mp, value: 20 }
      - { type: adjustMood, value: 4 }

# NPC 自主行动（触发式 + 效用评分；goalMatch/traitAffinity 对应角色的 private.goals/traits）
npcActions:
  # 角色创建（命数转盘 13 步 + 入学式）期间冻结所有 NPC 自主行动；
  # 否则玩家还在选出身时，History 里已经在刷「某 NPC 找同伴闲聊」。
  - id: npc-train
    summary: "{name} 独自打熬咒力。"
    trigger: { probability: 0.25, cooldownTurns: 2 , conditions: [{ flag: creationDone, eq: true }] }
    utility:
      base: 1
      goalMatch: [become-stronger]
      traitAffinity: [diligent]
    effects:
      - { type: adjustRelation, npcId: __self__, value: 1 }
  - id: npc-mission
    summary: "{name} 接下了一项祓除任务。"
    trigger: { probability: 0.2, requireKnowledge: [missions] , conditions: [{ flag: creationDone, eq: true }] }
    utility:
      base: 1
      traitAffinity: [diligent, vigilant]
    effects:
      - { type: adjustFlag, id: missionsCompleted, value: 1 }
  - id: npc-socialize
    summary: "{name} 找同伴闲聊。"
    trigger: { probability: 0.3 , conditions: [{ flag: creationDone, eq: true }] }
    utility:
      base: 1
      traitAffinity: [caring, confident]
    effects:
      - { type: adjustRelation, npcId: __self__, value: 2 }

# NPC 刷新规则（ADR-0022：配置层 → 实例层队列 → spawnLog 事实层）
#
# 被规则管辖的角色在世界创建时处于 `unspawned`：不上人物面板、不进入自主行动候选、
# 不参与任何以他为 ref 的战斗（引擎默认判活，模板无需再写判活条件）。
#
# **本节只说「这个人是谁、登场时几岁」**：哪天登场写在下面 `scheduledFacts` 里
# （ADR-007 D1 把时间搬到统一时间表，规则不再自带 `when`）。
#
# 参战更要紧的一层保险：任何以他们为 `enemies[].ref` 的事件都同时声明 `npcs:`，
# 占槽时先 materialize（`materializeEventNpcs`）。定时是常态，事件内兜底是为了
# 不让「时间没走到 / 档被跳读」把一场战斗变成空场（空 enemies 会被判即胜）。
#
# `age` = 登场时的年龄；spawnNpc 按它重算 birthTime，所以 2006 年不会把 2018 年
# 才入学的人投影成「12 年前就 15 岁」。
npcSpawnRules:
  # ── 2006 夏 · 怀玉（第 1 章）──────────────────────────────
  # 甚尔：星浆体事件的杀手。他是这一章唯一「按时间登场」的人 ——
  # 其余角色 2006 年就在校内（五条 / 夏油 / 七海 / 灰原 / 硝子 / 夜蛾）。
  - { id: rule-toji-2006, characterRef: npc-toji, age: 31 }

  # ── 2007 以后的人：**只挂规则、不挂事实** ──────────────────
  # 引擎把「被规则管辖的角色」在开局置为 `unspawned`：没有人物的面板条目、
  # 不参与自主行动、不会被战斗 ref 拉出来。2006 单章不需要他们登场，
  # 但角色卡与关系边要留着（重写下一章时直接用），所以用规则把他们关在门外，
  # 而不是删卡。等那一章开工，再往 `scheduledFacts` 里加一条 `spawnNpc`。
  - { id: rule-yuta-arrival, characterRef: npc-yuta, age: 16 }
  - { id: rule-kenjaku-2017, characterRef: npc-kenjaku, age: 1000 }
  - { id: rule-yuji-2018, characterRef: npc-yuji, age: 15 }
  - { id: rule-megumi-2018, characterRef: npc-megumi, age: 15 }
  - { id: rule-nobara-2018, characterRef: npc-nobara, age: 15 }
  - { id: rule-sukuna-2018, characterRef: npc-sukuna, age: 1000 }

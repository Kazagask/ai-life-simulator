            effects:
              - { type: adjustRelation, npcId: npc-haibara, value: 6 }
              - { type: adjustAttribute, attribute: virtue, value: 1 }
              - { type: adjustMood, value: 5 }
          - id: opt-hbb-2
            text: 认真地纠正她
            effects:
              - { type: adjustRelation, npcId: npc-haibara, value: -3 }
              - { type: adjustRelation, npcId: npc-nanami, value: 2 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustFlag, id: truthBits, value: 1 }
          - id: opt-hbb-3
            text: 只是吃
            effects:
              - { type: adjustResource, resource: hp, value: 15 }
              - { type: adjustMood, value: 4 }

  # 三、行动钩子（巡逻 / 探索 / 交往）
  # ══════════════════════════════════════════════════════════════

  - id: ev-patrol-wheel
    title: 巡逻 · 命数
    narrative: 结界薄弱的地方总在移动。你沿着线索走了一天，风里有一点铁锈味。
    trigger:
      source: action-hook
      onActionId: patrol
      conditions:
        - { flag: creationDone, eq: true }
    kind: random

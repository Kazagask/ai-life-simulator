            - label: 一级咒灵 · 你踩到了它的领域边缘
              weight: 7
              nextEventId: ev-combat-grade1

  - id: ev-social-hook
    title: 今天和谁过
    narrative: 一天的空闲。你翻了翻手机，通讯录里的人比你以为的多。
    trigger:
      source: action-hook
      onActionId: socialize
      conditions:
        - { flag: creationDone, eq: true }

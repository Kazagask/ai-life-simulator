        options:
          - id: opt-sc-1
            text: 找五条
            visibleWhen:
              - { flag: gojoGone, ne: true }
              # 死亡/被封印不诈尸：本事件跨全部 era，必须自己判活（战斗 ref 才有默认判活）。
              - { npcState: { npcId: npc-gojo, state: alive } }
            effects:
              - { type: adjustRelation, npcId: npc-gojo, value: 4 }
              - { type: adjustMood, value: 5 }
          - id: opt-sc-2
            text: 找夏油
            visibleWhen:
              - { flag: getoGone, ne: true }

# JJK 世界模板 · events.yaml（第一部分：开局创建 / 日常 / 行动钩子 / 遭遇）
#
# ══════════════════════════════════════════════════════════════════════════
# 2026-11-21 收束：**只做 2006 这一年**。
#
#   2006 春 入学（与七海、灰原同班；五条、夏油是二年生学长）
#   2006 夏 怀玉 · 星浆体护卫（天内理子 / 黑井美里 / 伏黑甚尔 / Q）
#   2006 秋 余波（怀玉的四个出口各自落到冬天）
#
# 为什么砍掉 2007 以后：那六年是 2026-11-12 那版一次写成的，事件密度与机制都停在
# 旧协议上（没有战斗、状态、关系可见性这些今天的内核能力）。与其维护一条「写了一半
# 又对不上机制」的十二年，不如把 2006 写到能用，后面一章一章重写。
# 旧版完整留档：`archive/2026-11-21-jjk-2006-full-12y/`。
#
# 因果纪律：每个关键选择都落成 flag，下一幕的门、选项的出现条件、结局判定都读它。
#   savedRiko → 理子活没活下来；她活着，星浆体这条链就断在第一环
#   rikoOutcome（shot / saved / merged / dead-intervene）→ 四个结局出口
#   getoDoubt → 夏油还没崩，但已经开始记数（2026 只留种子，不做叛逃）
# 命运纪律：转盘负责「命」（术式、资质、命定一转、每一幕的处境），玩家负责「选择」。
# ══════════════════════════════════════════════════════════════════════════

events:
  # ══════════════════════════════════════════════════════════════
  # 一、开局第一幕（2026-11-19）
  #     位置：`/api/openings/:id/commit` 在写完开局序章之后**直接把它请上桌**
  #     （`presentQueuedEventV2`，不推 turnIndex、不耗行动）。
  #     所以它必须是 `source: schedule` + `window.start = 0`：世界初始化即入队、立刻到期。
  #     正文对六种出身（原作 / 高专 / 诅咒师 / 预知 / 受肉 / 咒灵）都成立 —— 只写此刻，
  #     不写身份细节；身份由序章与后面的章节门去说。
  # ══════════════════════════════════════════════════════════════

  - id: ev-open-01
    title: 第零天 · 东京
    narrative: |
      东京。天亮得比你预想的早，楼下有人在收摊，铁架相碰的声音一下一下地传上来。
      你手里有一件刚办下来的东西：一张学生证，一张通行证，或者一个本不该存在的名字。
      风里有铁锈味。你知道那不是铁锈。
    trigger:
      source: schedule
      # 1 分钟 = 「立刻」：TimeAmount 要求 value > 0；世界初始化即入队，第一个动作前就到期。
      window: { start: { value: 1, unit: minute } }
      once: true
      conditions:
        - { flag: creationDone, eq: true }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-open-report
            text: 按地址过去。先把该报的到报掉
            # 判人（选项级）：咒灵线没有「报到」这回事 —— 它不隶属于任何人类组织。
            # 这里用**状态门**而不是文案回避（design §7.3：门开在选项上）。
            visibleWhen:
              - { flag: line, ne: curse-spirit }
            effects:
              - { type: setFlag, id: openPath, value: report }
              - { type: adjustRelation, npcId: npc-yaga, value: 3 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: advanceBy, value: { value: 1, unit: day } }
          - id: opt-open-walk
            text: 先在城市里走一圈，认认路
            effects:
              - { type: setFlag, id: openPath, value: walk }
              - { type: adjustAttribute, attribute: luck, value: 1 }
              - { type: adjustMood, value: 4 }
              - { type: advanceBy, value: { value: 1, unit: day } }
          - id: opt-open-probe
            text: 把地址收起来，先找一个能问话的人
            effects:
              - { type: setFlag, id: openPath, value: probe }
              - { type: adjustAttribute, attribute: reputation, value: 2 }
              - { type: adjustMood, value: -2 }
              - { type: advanceBy, value: { value: 1, unit: day } }

  # ══════════════════════════════════════════════════════════════
  # 二、日常（按时代分段：era 1 = 2006 学生 / era 2 = 2007–2016 术师 / era 3 = 2018 东京）
  #     每个日常都带前置条件：人死了、走了、时代过了，事件就不再出现。
  # ══════════════════════════════════════════════════════════════

  # ---------- era 1 · 2006 高专一年生 ----------

  - id: ev-d-class
    title: 咒骸课
    narrative: 夜蛾把一具没缝完的布偶扔在讲台上。「让它动。做不到就下课。」教室里一片安静。
    # 判人（2026-11-19）：正文点名的人必须在场，出队前复核存活，不符判错失。
    actors: [npc-yaga]
    trigger:
      source: pool
      probability: 0.045
      priority: 10
      cooldown: { value: 30, unit: day }
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: era, eq: 1 }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-dc-1
            text: 把咒力灌进布偶的关节
            effects:
              - { type: adjustAttribute, attribute: cursedEnergyTotal, value: 1 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustRelation, npcId: npc-yaga, value: 2 }
          - id: opt-dc-2
            text: 拆开布偶，看它里面怎么缝的
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: grantItem, itemId: item-talisman, count: 1 }
              - { type: adjustRelation, npcId: npc-yaga, value: 1 }
          - id: opt-dc-3
            text: 抄七海的答案
            effects:
              - { type: adjustMood, value: 3 }
              - { type: adjustRelation, npcId: npc-nanami, value: 3 }

  - id: ev-d-canteen
    title: 食堂的三张桌子
    narrative: 高专食堂只有三张桌子。一张坐着五条和夏油，一张是七海和灰原，还有一张没人坐。
    # 判人（2026-11-19）：正文点名的人必须在场，出队前复核存活，不符判错失。
    actors: [npc-gojo, npc-geto, npc-nanami, npc-haibara]
    trigger:
      source: pool
      probability: 0.05
      priority: 10
      cooldown: { value: 30, unit: day }
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: era, eq: 1 }
        # 场景前提（ADR-0024 决策 7）：正文点名了灰原，所以「灰原在世」是**事件级**前提，
        # 不是选项级可见性。用 npcState 而不是 haibaraDead —— lifecycle 是单一真源（ADR-0020），
        # haibaraDead 是模板黑板，两者会漂移成双真源。
        # 引擎在 fire 时与每次呈现前都复核它（ADR-0024）：排队期间灰原阵亡则本场景撤下。
        - { npcState: { npcId: npc-haibara, state: alive } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ct-1
            text: 坐到五条那桌，听他们讲任务
            effects:
              - { type: adjustRelation, npcId: npc-gojo, value: 3 }
              - { type: adjustRelation, npcId: npc-geto, value: 2 }
              - { type: adjustAttribute, attribute: cursedEnergyTotal, value: 1 }
          - id: opt-ct-2
            text: 坐到七海和灰原那桌
            effects:
              - { type: adjustRelation, npcId: npc-nanami, value: 3 }
              - { type: adjustRelation, npcId: npc-haibara, value: 3 }
              - { type: adjustMood, value: 4 }
          - id: opt-ct-3
            text: 一个人坐
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustMood, value: -2 }
              - { type: setFlag, id: aloneCount, value: 1 }

  - id: ev-d-gojo
    title: 五条学长翘课了
    narrative: 五条从窗户翻进来，把书包扔在你桌上。「今天天气这么好，上课是犯罪。走不走？」
    # 判人（2026-11-19）：正文点名的人必须在场，出队前复核存活，不符判错失。
    actors: [npc-gojo]
    trigger:
      source: pool
      probability: 0.04
      priority: 10
      cooldown: { value: 30, unit: day }
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: era, eq: 1 }
        - { flag: gojoGone, ne: true }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-gj-1
            text: 跟他走
            effects:
              - { type: adjustRelation, npcId: npc-gojo, value: 5 }
              - { type: adjustAttribute, attribute: agility, value: 2 }
              - { type: adjustMood, value: 6 }
              - { type: adjustAttribute, attribute: reputation, value: -1 }
            nextEventId: ev-d-gojo-b
          - id: opt-gj-2
            text: 留下来上课
            effects:
              - { type: adjustRelation, npcId: npc-yaga, value: 3 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
          - id: opt-gj-3
            text: 问他「你为什么这么强」
            effects:
              - { type: adjustRelation, npcId: npc-gojo, value: 3 }
              - { type: setFlag, id: askedGojo, value: true }
              - { type: adjustAttribute, attribute: cursedEnergyTotal, value: 2 }

  - id: ev-d-geto
    title: 夏油学长的道理
    narrative: 夏油坐在台阶上，手里捏着一只刚吞下去的咒灵留下的残渣。「你说，」他忽然问，「我们保护的这些人，真的值得吗？」
    # 判人（2026-11-19）：正文点名的人必须在场，出队前复核存活，不符判错失。
    actors: [npc-geto]
    trigger:
      source: pool
      probability: 0.045
      priority: 10
      cooldown: { value: 30, unit: day }
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: era, eq: 1 }
        - { flag: getoGone, ne: true }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-gt-1
            text: 「值得。总有人值得。」
            effects:
              - { type: adjustRelation, npcId: npc-geto, value: 4 }
              - { type: setFlag, id: answeredGeto, value: true }
              - { type: adjustMood, value: 4 }
          - id: opt-gt-2
            text: 「我不知道。但我不想变成不保护任何人的人。」
            effects:
              - { type: adjustRelation, npcId: npc-geto, value: 2 }
              - { type: adjustFlag, id: getoDoubt, value: -1 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
          - id: opt-gt-3
            text: 什么都不说，陪他坐着
            effects:
              - { type: adjustRelation, npcId: npc-geto, value: 3 }
              - { type: adjustFlag, id: getoDoubt, value: 1 }
              - { type: adjustMood, value: -2 }

            nextEventId: ev-d-geto-b
  - id: ev-d-shoko
    title: 医务室的灯
    narrative: 硝子把剪刀往桌上一扔。「又是你。说吧，这次哪儿断了。」她头都没抬。
    # 判人（2026-11-19）：正文点名的人必须在场，出队前复核存活，不符判错失。
    actors: [npc-shoko]
    trigger:
      source: pool
      probability: 0.04
      priority: 10
      cooldown: { value: 30, unit: day }
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: era, eq: 1 }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sk-1
            text: 让她把伤治好
            effects:
              - { type: cureStatus, status: injured-sim }
              - { type: cureStatus, status: exhausted }
              - { type: adjustResource, resource: hp, value: 40 }
              - { type: adjustRelation, npcId: npc-shoko, value: 3 }
          - id: opt-sk-2
            text: 问她反转术式怎么练
            effects:
              - { type: adjustRelation, npcId: npc-shoko, value: 2 }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: setFlag, id: askedReverse, value: true }
            nextEventId: ev-d-shoko-b
          - id: opt-sk-3
            text: 只要一支止痛药就走
            effects:
              - { type: grantItem, itemId: item-first-aid, count: 1 }
              - { type: adjustMood, value: -1 }

  - id: ev-d-spar
    title: 训练场的切磋
    narrative: 七海把外套脱下来叠好，放在场地边缘。「三分钟。」他说，「我不会放水，你也不用。」
    # 判人（2026-11-19）：正文点名的人必须在场，出队前复核存活，不符判错失。
    actors: [npc-nanami]
    trigger:
      source: pool
      probability: 0.05
      priority: 10
      cooldown: { value: 30, unit: day }
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: era, eq: 1 }
        - { flag: nanamiGone, ne: true }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-sp-1
            text: 认真打
            effects:
              # 2026-11-20：这一场不再硬编码「体术 +2、敏捷 +1」——
              # 三分钟里学到的东西该由玩家自己分（世界内加点，ADR-019）。
              # 同一笔 id 反复授予是幂等的（这个事件在池子里会再刷到）。
              - type: grantAllocation
                id: alloc-spar-2006
                budget: 2
                reason: 三分钟里学到的
                targets:
                  - { attribute: physique, max: 2 }
                  - { attribute: agility, max: 2 }
                  - { attribute: cursedEnergyTotal, max: 2 }
              - { type: adjustRelation, npcId: npc-nanami, value: 3 }
              - { type: adjustMood, value: -2 }
          - id: opt-sp-2
            text: 用术式压他
            effects:
              - { type: adjustAttribute, attribute: cursedEnergyTotal, value: 2 }
              - { type: adjustRelation, npcId: npc-nanami, value: 1 }
          - id: opt-sp-3
            text: 打完一起去吃拉面
            effects:
              - { type: adjustRelation, npcId: npc-nanami, value: 4 }
              - { type: adjustMood, value: 6 }

  - id: ev-d-haibara
    title: 灰原的便当
    narrative: 灰原把一个巨大的便当盒拍在你桌上。「我妈做的太多了！」他笑得像夏天，「你不吃我就得自己吃完。」
    # 判人（2026-11-19）：正文点名的人必须在场，出队前复核存活，不符判错失。
    actors: [npc-haibara]
    trigger:
      source: pool
      probability: 0.04
      priority: 10
      cooldown: { value: 30, unit: day }
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: era, eq: 1 }
        - { flag: haibaraDead, ne: true }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-hb-1
            text: 吃
            effects:
              - { type: adjustRelation, npcId: npc-haibara, value: 4 }
              - { type: adjustMood, value: 6 }
              - { type: adjustResource, resource: hp, value: 15 }
          - id: opt-hb-2
            text: 问他为什么想当术师
            effects:
              - { type: adjustRelation, npcId: npc-haibara, value: 3 }
              - { type: setFlag, id: haibaraWhy, value: true }
              - { type: adjustMood, value: 3 }
            nextEventId: ev-d-haibara-b
          - id: opt-hb-3
            text: 分一半给七海
            effects:
              - { type: adjustRelation, npcId: npc-haibara, value: 2 }
              - { type: adjustRelation, npcId: npc-nanami, value: 3 }

  - id: ev-d-mission
    title: 第一份委托
    narrative: 公告栏上钉着一张新的委托单：某栋公寓的二级咒灵。报酬栏写着一个让你心跳加速的数字。
    trigger:
      source: pool
      probability: 0.04
      priority: 10
      cooldown: { value: 30, unit: day }
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: era, eq: 1 }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ms-1
            text: 接下它
            effects:
              - { type: adjustFlag, id: missionsCompleted, value: 1 }
              - { type: adjustAttribute, attribute: reputation, value: 2 }
              - { type: adjustMood, value: -3 }

  - id: ev-d-rumor
    title: 都市传说
    narrative: 灰原压低声音说，最近有个「会说话的缝合线」在涩谷一带出现。七海说那是谣言。你想起自己身上的那道疤。
    # 判人（2026-11-19）：正文点名的人必须在场，出队前复核存活，不符判错失。
    actors: [npc-haibara, npc-nanami]
    trigger:
      source: pool
      probability: 0.03
      priority: 10
      cooldown: { value: 30, unit: day }
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: era, eq: 1 }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-rm-1
            text: 去查
            effects:
              - { type: adjustFlag, id: truthBits, value: 1 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustMood, value: -3 }
          - id: opt-rm-2
            text: 当成谣言
            effects:
              - { type: adjustMood, value: 2 }

  - id: ev-d-market
    title: 黑市
    narrative: 高专后面的巷子里有人在卖东西。卖家戴着口罩，只收现金，不问来历。摊上摆着几件来路不明的咒具——大多是真的残骸，配上编得不错的故事。
    trigger:
      source: pool
      probability: 0.03
      priority: 10
      cooldown: { value: 30, unit: day }
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: era, eq: 1 }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-mk-1
            text: 买他手里那叠符纸
            effects:
              - { type: grantItem, itemId: item-talisman, count: 2 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
          - id: opt-mk-2
            text: 什么都不买，记住这个地方
            effects:
              - { type: setFlag, id: knowsMarket, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 1 }

  # ---------- 角色的第二拍（2026-11-21：pool 事件只走一次，但要「做完」） ----------
  #
  # 第一拍是抽到的那次相遇；第二拍由那一拍的选择接进来（nextEventId），
  # 所以一个人物不是「一个随机场景」，而是一次有后续的小经历。

  - id: ev-d-gojo-b
    title: 天台上的那一手
    narrative: |
      天台风很大。五条把一枚硬币立在栏杆上，弹了一下，硬币没有倒。
      「术式这东西，」他说，「不是你想让它做什么，是你肯为它放弃什么。」
      他把硬币按进你手里，凉得像刚从水里捞出来。
    actors: [npc-gojo]
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-gjb-1
            text: 问他放弃了什么
            effects:
              - { type: adjustRelation, npcId: npc-gojo, value: 5 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: setFlag, id: askedGojoCost, value: true }
              - { type: adjustFlag, id: truthBits, value: 1 }
          - id: opt-gjb-2
            text: 把硬币弹回去
            effects:
              - { type: adjustRelation, npcId: npc-gojo, value: 3 }
              - { type: adjustAttribute, attribute: agility, value: 1 }
              - { type: adjustMood, value: 3 }
          - id: opt-gjb-3
            text: 收下硬币，什么也不问
            effects:
              - { type: grantItem, itemId: item-talisman, count: 1 }
              - { type: adjustMood, value: -1 }

  - id: ev-d-geto-b
    title: 他带你去看了那个人
    narrative: |
      夏油没说是去哪。车停在一条很旧的商店街，卷帘门全拉着。
      他指给你看一个人：蹲在自动贩卖机旁边，怀里抱着一只不属于他的手。
      「他偷的。」夏油说，「可他是为了救那只猫。你说这算不算值得。」
    actors: [npc-geto]
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-gtb-1
            text: 「算。猫也是命。」
            effects:
              - { type: adjustRelation, npcId: npc-geto, value: 4 }
              - { type: adjustFlag, id: getoDoubt, value: -2 }
              - { type: adjustAttribute, attribute: virtue, value: 1 }
          - id: opt-gtb-2
            text: 「不算。他偷了东西。」
            effects:
              - { type: adjustRelation, npcId: npc-geto, value: 3 }
              - { type: adjustFlag, id: getoDoubt, value: 2 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
          - id: opt-gtb-3
            text: 「你为什么问我」
            effects:
              - { type: adjustRelation, npcId: npc-geto, value: 5 }
              - { type: adjustFlag, id: truthBits, value: 1 }
              - { type: adjustMood, value: -3 }

  - id: ev-d-shoko-b
    title: 第一次反转
    narrative: |
      硝子把一把钝剪刀放在你手边。「不用真的剪。」她说，「你就想，把两个负数乘起来。」
      你盯着自己的手背看了很久。什么都没有发生。她笑了一声，很难听，但没有恶意。
    actors: [npc-shoko]
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-skb-1
            text: 再试一次
            effects:
              - { type: adjustAttribute, attribute: intellect, value: 2 }

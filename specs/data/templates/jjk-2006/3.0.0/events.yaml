    trigger:
      source: action-hook
      onActionId: explore
      conditions:
        - { flag: creationDone, eq: true }
    kind: random
    settle:
      random:
        wheel:
          segments:
            - label: 空空的地下室
              weight: 22
              weightBy: { luck: 2 }
              effects:
                - { type: adjustMood, value: -2 }
                - { type: adjustAttribute, attribute: intellect, value: 1 }
            - label: 一堆旧委托书 · 有一份被撕掉了名字
              weight: 14
              weightBy: { intellect: 1 }
              effects:
                - { type: adjustFlag, id: truthBits, value: 1 }
                - { type: adjustAttribute, attribute: intellect, value: 1 }
            - label: 一只受伤的咒灵幼体
              weight: 12
              effects:
                - { type: adjustMood, value: 3 }
                - { type: adjustAttribute, attribute: cursedEnergyTotal, value: 1 }
            - label: 二级咒灵 · 巢就在里面
              weight: 20
              nextEventId: ev-combat-grade2
            - label: 特级咒物的碎片
              weight: 5
              weightBy: { luck: 2 }
              effects:
                - { type: grantItem, itemId: eq-cursed-blade, count: 1 }

              - { type: adjustRelation, npcId: npc-shoko, value: 4 }
              - { type: adjustMood, value: -2 }
              - { type: setFlag, id: noReverse, value: true }
              - { type: adjustFlag, id: truthBits, value: 1 }
          - id: opt-skb-3
            text: 问她当年怎么学会的
            effects:
              - { type: adjustRelation, npcId: npc-shoko, value: 2 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustMood, value: 3 }

  - id: ev-d-haibara-b
    title: 灰原的家里
    narrative: |
      灰原家在一栋很旧的公寓里，门口的鞋摆得整整齐齐。
      他妈妈把炸鸡端出来，说「你们这些孩子怎么都这么瘦」。灰原在旁边小声说：「她以为我们是社团。」
    actors: [npc-haibara]
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-hbb-1

              effects:
                - { type: adjustMood, value: 3 }
            - label: 二级咒灵 · 从排水口爬出来
              weight: 18
              nextEventId: ev-combat-grade2
            - label: 诅咒师 · 正在给咒灵喂东西
              weight: 10
              nextEventId: ev-combat-curse-user
            - label: 一枚咒具残骸
              weight: 8
              weightBy: { luck: 1.5 }
              effects:
                - { type: grantItem, itemId: item-mp-candy, count: 1 }
                - { type: adjustAttribute, attribute: intellect, value: 1 }
            - label: 平民被咒灵追着跑

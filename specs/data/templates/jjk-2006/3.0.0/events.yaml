  # ══════════════════════════════════════════════════════════════
  # 四、遭遇战（巡逻 / 探索转盘落到战斗时进入）
  # ══════════════════════════════════════════════════════════════

  - id: ev-combat-grade2
    title: 遭遇 · 二级咒灵
    narrative: 它从墙里挤出来，形状像一件被穿坏的衣服。你后退半步，它就往前一寸。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        # ADR-075：默认 stake 是 deaths（硬核）。本模板只有第六幕挡枪是死局，
        # 其余四场先按恶战（hp 锁 1、绝不判死）；挡枪在死亡路由落地后改 deaths。
        stake: hard
        enemies:
          - { ref: enemy-grade2-curse, levelScale: 0.7 }
        canFlee: true
        fleeCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.6 }
        onVictory:
          effects:
            - { type: adjustFlag, id: missionsCompleted, value: 1 }
            - { type: adjustFlag, id: truthBits, value: 1 }
            - { type: adjustAttribute, attribute: cursedEnergyTotal, value: 1 }
            - { type: adjustAttribute, attribute: reputation, value: 2 }
            - { type: adjustMood, value: 3 }
        onDefeat:
          effects:
            - { type: applyStatus, status: exhausted, stacks: 1 , duration: { value: 2, unit: day } }
            - { type: adjustMood, value: -8 }
        onFlee:
          effects:
            - { type: adjustMood, value: -4 }

  - id: ev-combat-curse-user
    title: 遭遇 · 诅咒师
    narrative: 他蹲在咒灵旁边，手里拿着勺子。「哦，」他站起来，「你也是来抢的？」
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        # ADR-075：默认 stake 是 deaths（硬核）。本模板只有第六幕挡枪是死局，
        # 其余四场先按恶战（hp 锁 1、绝不判死）；挡枪在死亡路由落地后改 deaths。
        stake: hard
        enemies:
          - { ref: enemy-curse-user, levelScale: 0.8 }
        canFlee: true
        fleeCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.6 }
        onVictory:
          effects:
            - { type: adjustAttribute, attribute: reputation, value: 4 }
            - { type: adjustFlag, id: truthBits, value: 1 }
            - { type: grantItem, itemId: item-first-aid, count: 1 }
        onDefeat:
          effects:
            - { type: applyStatus, status: exhausted, stacks: 1 , duration: { value: 2, unit: day } }
            - { type: adjustMood, value: -8 }

  - id: ev-combat-grade1
    title: 遭遇 · 一级咒灵
    narrative: 空气先变了。你的咒力在皮肤上收紧，像被谁握了一下。它从阴影里走出来，比房子还高。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        # ADR-075：默认 stake 是 deaths（硬核）。本模板只有第六幕挡枪是死局，
        # 其余四场先按恶战（hp 锁 1、绝不判死）；挡枪在死亡路由落地后改 deaths。
        stake: hard
        enemies:
          - { ref: enemy-grade1-curse, levelScale: 0.75 }
        # ADR-012 D3：一级咒灵会招来同类。第 3 回合起，每 2 回合掷一次，五成概率来人，
        # 最多同时两只 —— 「回合 / 间隔 / 概率 / 上限」四个旋钮各写一遍示例。
        reinforcements:
          - id: grade1-brood
            ref: enemy-grade2-curse
            tier: minion
            atRound: 3
            everyRounds: 2
            chance: 0.5
            maxAlive: 2
            levelScale: 0.7
            when:
              # 你最近在这一带动过手，血腥味把它引来了（没清过任务就不来）。
              - { flag: missionsCompleted, gte: 1 }
        canFlee: true
        fleeCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.6 }
        onVictory:
          effects:
            - { type: adjustFlag, id: missionsCompleted, value: 2 }
            - { type: adjustFlag, id: truthBits, value: 1 }
            - { type: adjustAttribute, attribute: cursedEnergyTotal, value: 2 }
            - { type: adjustAttribute, attribute: reputation, value: 6 }
            - { type: adjustMood, value: 6 }
        onDefeat:
          effects:
            - { type: applyStatus, status: injured-sim, stacks: 1 , duration: { value: 3, unit: day } }
            - { type: adjustMood, value: -10 }

  # ══════════════════════════════════════════════════════════════
  # 五、第一章 · 怀玉（2006 年 8 月 · 星浆体护卫）
  #     2026-11-21 重写：七幕改成「每天一幕、每幕一次拍板」，并补上两场真正的战斗——
  #       · 第二幕 廉直女学院：Q 的人堵楼梯（levelScale 0.7 的诅咒师 + 0.55 的二级咒灵）
  #       · 第六幕 本殿：挡在理子前面，对甚尔撑过三回合（survive_rounds，打不过才正常）
  #     出口仍是四个：shot / saved / merged / dead-intervene（早夭）。
  #     旗标契约不变（hvRole / qOutcome / kuroiKidnap / spAware / hvSplit / rikoOutcome…），
  #     所以第七幕与结局不必跟着改。
  # ══════════════════════════════════════════════════════════════

  - id: ev-ch1-gate
    title: 第一章 · 星浆体
    narrative: |
      2006 年 8 月。夜蛾把一份没有编号的文件放在桌上：天内理子，十四岁，星浆体。
      三天后，她要在薨星宫与天元同化。
      「护卫是五条和夏油。」夜蛾说，「你可以不去。去了，就別指望高层替你收尸。」
    trigger:
      # 主线定时（2026-11-19）：world 初始化即入队，window 换算成绝对分钟固化；
      # 到期且前提成立才上桌 —— 门的出现由时间表决定，不由池子抽取决定（pool 只留日常）。
      source: schedule
      window: { start: { value: 215, unit: day } }
      once: true
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: spDone, ne: true }
        - { status: injured-sim, present: false }
        - { status: exhausted, present: false }
        - { time: { gte: { value: 215, unit: day } } }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-ch1-join
            text: 跟去。你想看看真正的任务长什么样
            effects:
              - { type: setFlag, id: spJoined, value: true }
              - { type: setFlag, id: hvJoined, value: true }
              - { type: setFlag, id: ready1, value: false }
              - { type: adjustMood, value: 4 }
              - { type: adjustRelation, npcId: npc-yaga, value: 1 }
            nextEventId: ev-hv-01
          - id: opt-ch1-stay
            text: 留在学校。一年生不该上这种场面
            effects:
              - { type: setFlag, id: spJoined, value: false }
              - { type: setFlag, id: hvJoined, value: false }
              - { type: setFlag, id: ready1, value: false }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustRelation, npcId: npc-yaga, value: 2 }
            nextEventId: ev-hv-01

  # ── 无下限的两次越界（2026-11-23）──────────────────────────────
  # 苍是顺转，生得就会；赫要反转术式，茈要赫与苍同时在手。门票是「无下限术式 + 已学会反转术式」。
  # 六眼（伪）把第二条路打开：它看得见「术式本该长成什么样」，于是顺手把常时无下限也拿到手。
  # 两条事件用 `present: true / false` 互斥，玩家只会见到其中一条 —— 效果 DSL 没有
  # 「有某个状态才给某个效果」的写法，只能拆成两个互斥的池事件。
  - id: ev-pool-limitless-red
    title: 赫与茈
    narrative: |
      医务室值夜。伤口早就结痂了，你还是把反转术式又走了一遍。
      第三遍的时候，指尖那点正向的咒力没有散掉——它反过来，把空气里的咒力推开了一寸。
      你试着把「苍」压上去。两股力量相撞的地方，出现了一个不属于任何一侧的点。
    trigger:
      source: pool
      probability: 0.08
      priority: 18
      cooldown: { value: 5, unit: day }
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: era, eq: 1 }
        - { attribute: innateTechnique, eq: limitless }
        - { requiresSkill: sk-reverse-heal }
        - { status: six-eyes-pseudo, present: false }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-lr-1
            text: 把那个点按下去
            effects:
              - { type: unlockSkill, skillId: sk-gojo-red }
              - { type: unlockSkill, skillId: sk-gojo-hollow-purple }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustMood, value: 6 }
          - id: opt-lr-2
            text: 先记下来。这种东西不该在没有人的走廊里试
            effects:
              - { type: unlockSkill, skillId: sk-gojo-red }
              - { type: unlockSkill, skillId: sk-gojo-hollow-purple }
              - { type: adjustAttribute, attribute: intellect, value: 3 }
              - { type: adjustMood, value: -2 }

  - id: ev-pool-limitless-void
    title: 观空 · 茈
    narrative: |
      你还没动手，眼睛先看见了。
      苍与赫在你看来的样子不是两股力，而是同一道算式被写了两遍——第一遍取负，第二遍把负再取一次。
      中间那一项本该是零。可它没有消掉，它停在那里，等你把它念出来。
    trigger:
      source: pool
      probability: 0.1
      priority: 18
      cooldown: { value: 5, unit: day }
      conditions:
        - { flag: creationDone, eq: true }
        - { flag: era, eq: 1 }
        - { attribute: innateTechnique, eq: limitless }
        - { requiresSkill: sk-reverse-heal }
        - { status: six-eyes-pseudo, present: true }
    kind: normal
    settle:
      normal:
        options:
          - id: opt-lv-1
            text: 把它念出来
            effects:
              - { type: unlockSkill, skillId: sk-gojo-red }
              - { type: unlockSkill, skillId: sk-gojo-hollow-purple }
              # 天赋无下限：这双眼睛看得见「无限」，于是它不必再被主动开启。
              - { type: applyStatus, status: infinity }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustMood, value: 8 }
          - id: opt-lv-2
            text: 先闭上眼。看得太清楚的人通常活不长
            effects:
              - { type: unlockSkill, skillId: sk-gojo-red }
              - { type: unlockSkill, skillId: sk-gojo-hollow-purple }
              - { type: applyStatus, status: infinity }
              - { type: adjustMood, value: -4 }

  # ──────────────────────────────────────────────────────────────
  # L1 怀玉 · 七幕（ev-hv-01 … ev-hv-07）
  #   惯例（design.md §8.1）：ev-hv-0N = 第 N 幕的选择；ev-hv-0Nb = 同幕的转盘。
  #   每一幕只给**一组**选项（牌桌上真正要玩家拍板的那一次），其余交给转盘。
  # ──────────────────────────────────────────────────────────────

  - id: ev-hv-01
    title: 第一幕 · 任务下达
    narrative: |
      夜里，夜蛾把三份不同的文件摊在桌上。最上面那份没有编号，只有一个名字和一张证件照：
      天内理子，十四岁，廉直女学院二年生。照片上的女孩没有笑。
      五条和夏油已经站在门口。夜蛾没有抬头，只问了一句：「你想站在哪一边？」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-hv1-escort
            text: 争取同行。你想亲眼看着她把那几天走完
            visibleWhen:
              - { flag: hvJoined, eq: true }
            effects:
              - { type: setFlag, id: hvRole, value: escort }
              - { type: adjustRelation, npcId: npc-gojo, value: 3 }
              - { type: adjustRelation, npcId: npc-geto, value: 3 }
              - { type: adjustMood, value: 3 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-01b
          - id: opt-hv1-support
            text: 接受后勤。名单、路线、车，你来盯
            effects:
              - { type: setFlag, id: hvRole, value: support }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustRelation, npcId: npc-yaga, value: 2 }
              - { type: adjustRelation, npcId: npc-kuroi, value: 3 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-01b
          - id: opt-hv1-rogue
            text: 私下调查。你想先弄明白盘星教是怎么知道路线的
            effects:
              - { type: setFlag, id: hvRole, value: rogue }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustFlag, id: truthBits, value: 1 }
              - { type: adjustMood, value: -2 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-01b

  - id: ev-hv-01b
    title: 第一幕 · 出发前
    trigger:
      source: chain
    kind: random
    settle:
      random:
        wheel:
          segments:
            - label: 夜蛾把一份旧档案推给你，最上面写着「星浆体」
              weight: 16
              weightBy: { intellect: 3 }
              effects:
                - { type: adjustFlag, id: truthBits, value: 1 }
                - { type: adjustAttribute, attribute: intellect, value: 1 }
              nextEventId: ev-hv-02
            - label: 黑井在校门口等你，把一张写着三个地址的纸塞进你手里
              weight: 18
              effects:
                - { type: adjustRelation, npcId: npc-kuroi, value: 6 }
                - { type: adjustFlag, id: truthBits, value: 1 }
              nextEventId: ev-hv-02
            - label: 装备室的老头多塞给你两卷符纸，说「用得上」
              weight: 22
              effects:
                - { type: grantItem, itemId: item-talisman, count: 2 }
              nextEventId: ev-hv-02
            - label: 你在走廊撞见五条，他什么也没问，只是把墨镜往下推了一点
              weight: 24
              effects:
                - { type: adjustRelation, npcId: npc-gojo, value: 2 }
                - { type: adjustMood, value: 3 }
              nextEventId: ev-hv-02
            - label: 高层把你的名字写进了随行名单的备注栏
              weight: 14
              effects:
                - { type: adjustAttribute, attribute: reputation, value: -2 }
                - { type: adjustRelation, npcId: npc-yaga, value: -2 }
                - { type: adjustMood, value: -4 }
              nextEventId: ev-hv-02
            - label: 你在电话里听见有人报出「星浆体」三个字，然后挂断
              weight: 10
              weightBy: { luck: 2 }
              effects:
                - { type: adjustFlag, id: truthBits, value: 1 }
                - { type: setFlag, id: metToji, value: false }
                - { type: adjustMood, value: -2 }
              nextEventId: ev-hv-02
            - label: 连夜准备，天亮时你的手在抖
              weight: 12
              effects:
                - { type: applyStatus, status: exhausted, stacks: 1, duration: { value: 2, unit: day } }
                - { type: adjustMood, value: -3 }
              nextEventId: ev-hv-02

  - id: ev-hv-02
    title: 第二幕 · 廉直女学院
    narrative: |
      廉直女学院的走廊比外面暗。理子抱着帆布包走在中间，脚步很快，像怕被谁看见。
      黑井跟在她半步后面，替她把校服的领子翻好。
      「你就是那个一年生？」理子先开口，「先说好，我不需要人看着。」
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-hv2-formal
            text: 公事公办。把三天的流程讲清楚
            effects:
              - { type: setFlag, id: hvStance, value: formal }
              - { type: adjustRelation, npcId: npc-riko, value: 1 }
              - { type: adjustRelation, npcId: npc-kuroi, value: 3 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-02b
          - id: opt-hv2-soft
            text: 顺着她。问她在学校过得怎么样
            effects:
              - { type: setFlag, id: hvStance, value: soft }
              - { type: adjustRelation, npcId: npc-riko, value: 6 }
              - { type: adjustMood, value: 4 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-02b
          - id: opt-hv2-sharp
            text: 先不看人，先看路线。这栋楼有几个出口
            effects:
              - { type: setFlag, id: hvStance, value: sharp }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustFlag, id: truthBits, value: 1 }
              - { type: adjustRelation, npcId: npc-riko, value: -2 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-02b

  - id: ev-hv-02b
    title: 第二幕 · Q 的人
    narrative: |
      拐角处，空气先凉了下来。两个人站在楼梯口，袖口在动——不是风。
      「把星浆体留下。」其中一个说，「我们只要她。」
      理子的手在你背后抓紧了书包带。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        # ADR-075：默认 stake 是 deaths（硬核）。本模板只有第六幕挡枪是死局，
        # 其余四场先按恶战（hp 锁 1、绝不判死）；挡枪在死亡路由落地后改 deaths。
        stake: hard
        enemies:
          - { ref: enemy-curse-user, levelScale: 0.7 }
          - { ref: enemy-grade2-curse, levelScale: 0.55 }
        canFlee: true
        fleeCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.65 }
        onVictory:
          effects:
            - { type: setFlag, id: qOutcome, value: shield }
            - { type: adjustRelation, npcId: npc-riko, value: 5 }
            - { type: adjustRelation, npcId: npc-kuroi, value: 5 }
            - { type: adjustAttribute, attribute: reputation, value: 2 }
            - { type: adjustMood, value: 2 }
          nextEventId: ev-hv-02c
        onDefeat:
          effects:
            - { type: setFlag, id: qOutcome, value: retreat }
            - { type: applyStatus, status: injured-sim, stacks: 1, duration: { value: 3, unit: day } }
            - { type: adjustRelation, npcId: npc-riko, value: -2 }
            - { type: adjustMood, value: -8 }
          nextEventId: ev-hv-02c
        onFlee:
          effects:
            - { type: setFlag, id: qOutcome, value: retreat }
            - { type: adjustRelation, npcId: npc-riko, value: -4 }
            - { type: adjustMood, value: -4 }
          nextEventId: ev-hv-02c

  - id: ev-hv-02c
    title: 第二幕 · 余波
    trigger:
      source: chain
    kind: random
    settle:
      random:
        wheel:
          segments:
            - label: Q 的人退得比想象中快，像只是来确认什么
              weight: 22
              effects:
                - { type: adjustMood, value: 3 }
                - { type: adjustFlag, id: truthBits, value: 1 }
              nextEventId: ev-hv-03
            - label: 理子在车里一直没说话。快到学校时才开口：「刚才那个，你杀了吗」
              weight: 24
              effects:
                - { type: adjustRelation, npcId: npc-riko, value: 4 }
              nextEventId: ev-hv-03
            - label: 你在楼梯上捡到一张写着路线的纸，字迹很工整
              weight: 14
              weightBy: { intellect: 2 }
              effects:
                - { type: adjustFlag, id: truthBits, value: 1 }
                - { type: setFlag, id: knowsRoute, value: true }
              nextEventId: ev-hv-03
            - label: 黑井替理子挡了一下，手臂上多了一道口子
              weight: 16
              effects:
                - { type: adjustRelation, npcId: npc-kuroi, value: 6 }
                - { type: adjustRelation, npcId: npc-riko, value: 2 }
                - { type: adjustMood, value: -4 }
              nextEventId: ev-hv-03
            - label: 五条赶到时已经打完了。他看了看地上的东西，说「还行」
              weight: 14
              effects:
                - { type: adjustRelation, npcId: npc-gojo, value: 4 }
                - { type: adjustAttribute, attribute: reputation, value: 1 }
              nextEventId: ev-hv-03
            - label: 夏油蹲下去看那两具身体，很久没有说话
              weight: 10
              effects:
                - { type: adjustRelation, npcId: npc-geto, value: 3 }
                - { type: adjustFlag, id: getoDoubt, value: 1 }
              nextEventId: ev-hv-03

  - id: ev-hv-03
    title: 第三幕 · 黑井被绑
    narrative: |
      消息是夏油带回来的：黑井在去车站的路上被人带走了，现场没有咒力残留。
      理子站在走廊尽头，帆布包掉在地上，没有去捡。
      夜蛾给了你一天时间。怎么用，你自己定。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-hv3-okinawa
            text: 跟去冲绳。她要去的地方，总得有人先到
            visibleWhen:
              - { flag: hvRole, ne: rogue }
            effects:
              - { type: setFlag, id: kuroiKidnap, value: okinawa }
              - { type: adjustAttribute, attribute: agility, value: 1 }
              - { type: adjustRelation, npcId: npc-riko, value: 4 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-03b
          - id: opt-hv3-investigate
            text: 留在东京查内鬼。路线只可能从里面漏出去
            effects:
              - { type: setFlag, id: kuroiKidnap, value: investigate }
              - { type: adjustAttribute, attribute: intellect, value: 2 }
              - { type: adjustFlag, id: truthBits, value: 2 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-03b
          - id: opt-hv3-report
            text: 报告高层。让他们派人，你只负责说清楚
            effects:
              - { type: setFlag, id: kuroiKidnap, value: report }
              - { type: adjustAttribute, attribute: reputation, value: 4 }
              - { type: adjustRelation, npcId: npc-yaga, value: 2 }
              - { type: adjustRelation, npcId: npc-gojo, value: -2 }
              - { type: adjustRelation, npcId: npc-riko, value: -3 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-03b

  - id: ev-hv-03b
    title: 第三幕 · 绑匪的线索
    trigger:
      source: chain
    kind: random
    settle:
      random:
        wheel:
          segments:
            - label: 黑井的电话打通了三秒，只有呼吸声
              weight: 24
              effects:
                - { type: adjustRelation, npcId: npc-riko, value: 4 }
                - { type: adjustMood, value: 2 }
              nextEventId: ev-hv-04
            - label: 内鬼的痕迹指向一份更早的委托
              weight: 16
              weightBy: { intellect: 3 }
              effects:
                - { type: adjustFlag, id: truthBits, value: 1 }
              nextEventId: ev-hv-04
            - label: 甚尔的名字第二次出现，这一次是在收款记录上
              weight: 12
              effects:
                - { type: adjustFlag, id: truthBits, value: 1 }
                - { type: setFlag, id: knowsToji, value: true }
                - { type: adjustMood, value: -3 }
              nextEventId: ev-hv-04
            - label: 你追出去，只看见一辆车的尾灯
              weight: 18
              effects:
                - { type: applyStatus, status: exhausted, stacks: 1, duration: { value: 2, unit: day } }
                - { type: adjustMood, value: -5 }
              nextEventId: ev-hv-04
            - label: 高层让你别再插手，说这不是一年生该碰的案子
              weight: 16
              effects:
                - { type: adjustAttribute, attribute: reputation, value: -3 }
                - { type: adjustRelation, npcId: npc-yaga, value: -3 }
              nextEventId: ev-hv-04
            - label: 理子问你，黑井会不会死
              weight: 14
              effects:
                - { type: adjustMood, value: -4 }
                - { type: adjustRelation, npcId: npc-riko, value: 3 }
              nextEventId: ev-hv-04

  - id: ev-hv-04
    title: 第四幕 · 冲绳
    narrative: |
      第二天，队伍到了冲绳。海比照片上更亮。理子脱了鞋站在水边，裤脚卷到膝盖，回头喊你过去。
      黑井还没有消息。五条在不远处打哈欠，夏油看着海，谁都没有先提那件事。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-hv4-play
            text: 陪她玩。她问起同化的事，你没有骗她
            effects:
              - { type: setFlag, id: spAware, value: true }
              - { type: adjustRelation, npcId: npc-riko, value: 10 }
              - { type: adjustMood, value: 5 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-04b
          - id: opt-hv4-interrogate
            text: 去审那个被抓住的绑匪
            visibleWhen:
              - { flag: qOutcome, eq: shield }
            effects:
              - { type: setFlag, id: spAware, value: true }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustFlag, id: truthBits, value: 2 }
              - { type: setFlag, id: knowsToji, value: true }
              - { type: adjustMood, value: -3 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-04b
          - id: opt-hv4-solo
            text: 一个人去找甚尔的线索
            visibleWhen:
              - { flag: kuroiKidnap, eq: investigate }
            effects:
              - { type: setFlag, id: spAware, value: false }
              - { type: adjustAttribute, attribute: agility, value: 1 }
              - { type: adjustFlag, id: truthBits, value: 2 }
              - { type: setFlag, id: knowsToji, value: true }
              - { type: adjustMood, value: -5 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-04b
          - id: opt-hv4-kuroi
            text: 陪黑井去买东西。她说理子小时候怕黑
            effects:
              # 黑井会把理子的事讲给你听 —— 这也是「她知道自己要面对什么」的一条来源。
              - { type: setFlag, id: spAware, value: true }
              - { type: adjustRelation, npcId: npc-kuroi, value: 8 }
              - { type: adjustRelation, npcId: npc-riko, value: 3 }
              - { type: adjustMood, value: 4 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-04b

  - id: ev-hv-04b
    title: 第四幕 · 冲绳的夜
    trigger:
      source: chain
    kind: random
    settle:
      random:
        wheel:
          segments:
            - label: 海很平。理子第一次笑得像个十四岁的人
              weight: 24
              effects:
                - { type: adjustRelation, npcId: npc-riko, value: 6 }
                - { type: adjustMood, value: 5 }
              nextEventId: ev-hv-05
            - label: 五条坐在防波堤上，说了句什么，海风把它吹散了
              weight: 22
              effects:
                - { type: adjustRelation, npcId: npc-gojo, value: 2 }
                - { type: adjustMood, value: 2 }
              nextEventId: ev-hv-05
            - label: 你在一张旧地图背面看见铅笔标过的路线
              weight: 14
              weightBy: { intellect: 2 }
              effects:
                - { type: adjustFlag, id: truthBits, value: 1 }
              nextEventId: ev-hv-05
            - label: 夜里有人在你窗下站了很久
              weight: 16
              effects:
                - { type: applyStatus, status: exhausted, stacks: 1, duration: { value: 2, unit: day } }
                - { type: adjustMood, value: -6 }
              nextEventId: ev-hv-05
            - label: 理子忽然问你，她是不是活不到秋天
              weight: 14
              effects:
                - { type: adjustRelation, npcId: npc-riko, value: -2 }
                - { type: adjustMood, value: -8 }
              nextEventId: ev-hv-05
            - label: 你把那张地图烧了，灰落进海里
              weight: 10
              effects:
                - { type: adjustMood, value: -3 }
                - { type: adjustFlag, id: truthBits, value: 1 }
              nextEventId: ev-hv-05

  - id: ev-hv-05
    title: 第五幕 · 薨星宫外
    narrative: |
      薨星宫的石阶很长。台阶下站着一个没有咒力的男人，肩上没有咒具，像只是路过。
      五条先看见了他。夏油按住你的肩。理子在你身后，呼吸很轻。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-hv5-upstairs
            text: 跟五条上楼
            effects:
              - { type: setFlag, id: hvSplit, value: upstairs }
              - { type: adjustRelation, npcId: npc-gojo, value: 4 }
              - { type: adjustMood, value: -2 }
            nextEventId: ev-hv-05b
          - id: opt-hv5-honden
            text: 护着理子去本殿
            effects:
              - { type: setFlag, id: hvSplit, value: honden }
              - { type: adjustRelation, npcId: npc-riko, value: 5 }
              - { type: adjustMood, value: 2 }
            nextEventId: ev-hv-05b
          - id: opt-hv5-cult
            text: 绕去盘星教那边堵人
            effects:
              - { type: setFlag, id: hvSplit, value: cult }
              - { type: adjustAttribute, attribute: reputation, value: 2 }
              - { type: adjustAttribute, attribute: intellect, value: 1 }
              - { type: adjustMood, value: -3 }
            nextEventId: ev-hv-05b

  - id: ev-hv-05b
    title: 第五幕 · 台阶下
    trigger:
      source: chain
    kind: random
    settle:
      random:
        wheel:
          segments:
            - label: 楼上的动静像地震，然后停了
              weight: 22
              effects:
                - { type: adjustMood, value: -4 }
              nextEventId: ev-hv-06
            - label: 阶下的人比昨天多了一倍，都在等一个结果
              weight: 20
              effects:
                - { type: adjustAttribute, attribute: reputation, value: 2 }
                - { type: adjustMood, value: -3 }
              nextEventId: ev-hv-06
            - label: 你在侧廊看见一道没有咒力的影子
              weight: 14
              weightBy: { agility: 3 }
              effects:
                - { type: adjustFlag, id: truthBits, value: 2 }
                - { type: setFlag, id: metToji, value: true }
              nextEventId: ev-hv-06
            - label: 你被甚尔留下的人截住，挨了一下
              weight: 18
              effects:
                - { type: applyStatus, status: injured-sim, stacks: 1, duration: { value: 3, unit: day } }
                - { type: adjustMood, value: -6 }
              nextEventId: ev-hv-06
            - label: 你选的那条路上，什么也没有
              weight: 16
              effects:
                - { type: adjustMood, value: -5 }
              nextEventId: ev-hv-06
            - label: 夏油站在台阶下，很久没有动
              weight: 10
              effects:
                - { type: adjustRelation, npcId: npc-geto, value: 3 }
                - { type: adjustMood, value: -2 }
              nextEventId: ev-hv-06

  - id: ev-hv-06
    title: 第六幕 · 本殿
    narrative: |
      你赶回本殿的时候，门已经开着。光从里面漫出来，照到门槛前的一小块石地上。
      理子站在那道光里，没有往前走。台阶上传来脚步声，不是五条的。
    trigger:
      source: chain
    kind: normal
    settle:
      normal:
        options:
          - id: opt-hv6-block
            text: 挡在她前面
            visibleWhen:
              - { flag: hvSplit, eq: honden }
              - { flag: spAware, eq: true }
              - { attribute: physique, gte: 6 }
            effects:
              - { type: setFlag, id: hvGuard, value: true }
              - { type: adjustMood, value: -3 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-06-block
          - id: opt-hv6-pull
            text: 拉住她，往侧廊跑
            visibleWhen:
              - { flag: hvSplit, eq: honden }
              - { flag: spAware, eq: true }
              - { attribute: agility, gte: 7 }
            effects:
              - { type: setFlag, id: hvPull, value: true }
              - { type: adjustMood, value: -2 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-06-pull
          - id: opt-hv6-merge
            text: 劝她走进本殿，接受同化
            visibleWhen:
              - { flag: hvSplit, eq: honden }
              - { flag: spAware, eq: true }
            effects:
              - { type: setFlag, id: hvMerge, value: true }
              - { type: adjustMood, value: -6 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-06-merge
          - id: opt-hv6-idle
            text: 什么都不做
            effects:
              - { type: setFlag, id: hvIdle, value: true }
              - { type: adjustMood, value: -8 }
              - { type: advanceBy, value: { value: 1, unit: day } }
            nextEventId: ev-hv-06-idle

  - id: ev-hv-06-block
    title: 第六幕 · 挡住他
    narrative: |
      甚尔从台阶上下来，一步一步，不快。
      「让开。」他说。他没有拿咒具，也没有看你——像在跟一件家具说话。
      你听见自己身后理子的呼吸。你不能让开。
    trigger:
      source: chain
    kind: combat
    settle:
      combat:
        # ADR-075：第六幕是**死斗**——挡不住甚尔就是早夭，由 world.deathRoutes 收束。
        stake: deaths
        enemies:
          - { ref: npc-toji, levelScale: 0.55 }
        canFlee: false
        # 撑过三回合就算「挡住」：一年生打不赢术师杀手，但可以让他慢三回合。
        # 打不死他（levelScale 0.55 只是让他的伤害落在「撑得住」的区间），
        # 所以这里不需要「击杀」也判胜。
        victory: [{ kind: survive_rounds, rounds: 3 }]
        defeat: [{ kind: player_down }]
        onVictory:
          effects:
            - { type: setFlag, id: rikoOutcome, value: saved }
            - { type: setFlag, id: savedRiko, value: true }
            - { type: setFlag, id: debtRiko, value: true }
            - { type: setFlag, id: spDone, value: true }
            - { type: setFlag, id: assimilationFailed, value: false }
            - { type: setFlag, id: starVesselGone, value: false }
            - { type: setFlag, id: tengenCursed, value: false }
            - { type: setFlag, id: metToji, value: true }
            - { type: setNpcLifecycle, npcId: npc-riko, state: alive }
            - { type: adjustRelation, npcId: npc-riko, value: 15 }
            - { type: adjustRelation, npcId: npc-kuroi, value: 8 }

    cost: { mp: 8 }
    target: none
    summon:
      ref: enemy-grade2-curse
      tier: minion          # 普通单位：前端三分之一宽的小框，上限 3
      count: 3              # 一次都放出来 —— 逐只召只是多点几下鼠标
      levelScale: 0.8
      onSummonerDown: dismiss
    cooldownTurns: 1
    usableInBattle: true


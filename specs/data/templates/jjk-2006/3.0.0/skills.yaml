  # ⚠️ 已删 `sk-gather-curses`（原「命中 +1 咒灵」）。
  # ADR-013（2026-11-20）：**咒灵数量不再是一个资源池**。池子当初要解决两件事 ——
  # 「限制强度」与「旋涡有祭品」—— 前者由场上的 `limit` 直接表达，后者由「献祭场上单位」
  # 表达。少一份计数，就少一处能对不上的地方（旧设计里「打完一场咒灵回不来」正是账本问题）。
  # 于是：杂兵是兵力（无限，本场最多三只），虹龙是个体（死了就永远没了）。

  - id: sk-summon-curse
    kind: combat
    name: 咒灵操术·召灵

# JJK 世界模板 · skills.yaml
#
# 设计原则（2026-11-12 重做）：
# - 生得术式不是「一个技能」，而是一整套能力：术式补正（见 statuses.yaml）+ 2–3 个技能
#   + 1 个领域展开。角色可以同时持有多个术式（宿傩、羂索、以及玩家的隐藏分支）。
# - 引擎没有「暴击」机制，因此黑闪不做随机暴击，改为**会心窗口**：
#   一记必中的重击 + 给自身挂 1 回合的伤害增幅补正（damageDealt），下一击才是真正的黑闪。
# - 领域展开用补正实现：自身大幅增幅 + 全体敌人「领域压制」（受伤增加、命中下降），限 3 回合。
skills:
  # ────────────────────────────── 通用 ──────────────────────────────

  - id: sk-basic-strike
    kind: combat
    name: 体术打击
    description: 不依赖咒力的基础体术。任何一个咒术师的第一课。
    cost: { mp: 0 }
    target: enemy
    hitCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.7 }
    damage:
      - { preset: fixed, value: 8 }
    cooldownTurns: 0
    usableInBattle: true

  - id: sk-cursed-strike
    kind: combat
    name: 咒力斩击
    description: 把咒力凝在拳锋或刃上，一击夹带灼烧。
    cost: { mp: 10 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: agility, baseChance: 0.6 }
    damage:
      - { preset: scaled, base: 10, scaleBy: cursedEnergy, multiplier: 1.2 }
    applyStatus:
      - { status: battle-cursed-burn, chance: 0.3, duration: { rounds: 2 } }
    cooldownTurns: 1
    usableInBattle: true

  - id: sk-reverse-heal
    kind: combat
    name: 反转术式·治疗
    description: 负负得正。把两股负向咒力相乘，造出能重建血肉的正向能量。
    cost: { mp: 15 }
    target: self
    heal:
      - { preset: scaled, base: 12, scaleBy: cursedEnergy, multiplier: 0.9 }
    cooldownTurns: 2
    usableInBattle: true

  - id: sk-reverse-heal-ally
    kind: combat
    name: 反转术式·接续
    description: 把手按在别人身上。自己的伤能拖，别人的不行。
    cost: { mp: 14 }
    # 友军**单体**（ADR-012 D6 补）：医生治的从来不是自己。目标由指令里的
    # `targetInstanceId` 指定，不传就是自己。
    target: ally
    heal:
      - { preset: scaled, base: 10, scaleBy: cursedEnergy, multiplier: 0.8 }
    cooldownTurns: 2
    usableInBattle: true

  - id: sk-curtain
    kind: combat
    name: 简易领域·帐
    description: 不追求必中，只求不被秒。薄薄一层帐，挡掉一部分伤害。
    cost: { mp: 10 }
    target: self
    heal:
      - { preset: scaled, base: 6, scaleBy: cursedEnergy, multiplier: 0.4 }
    applyStatus:
      - { status: veil, chance: 1.0, stacks: 1, target: self, duration: { rounds: 2 } }
    cooldownTurns: 3
    usableInBattle: true

  # 黑闪：不是随机暴击，而是「会心窗口」——这一击必中且重，窗口留给下一击
  - id: sk-black-flash
    kind: combat
    name: 黑闪
    description: 物理打击与咒力在百万分之一秒的误差内重合。这一击之后，咒力的运转会短暂地变得异常顺滑——真正的杀招是下一击。
    cost: { mp: 16 }
    target: enemy
    damage:
      - { preset: scaled, base: 16, scaleBy: cursedEnergy, multiplier: 1.4 }
    applyStatus:
      - { status: black-flash, chance: 1.0, stacks: 1, target: self, duration: { rounds: 1 } }
    cooldownTurns: 4
    usableInBattle: true

  - id: sk-investigation
    kind: general
    name: 调查
    description: 系统地搜集与核查线索。能问出别人问不出的东西。
    unlocksOptions: [opt-investigate]
    proficiency: { maxLevel: 5, growthPerUse: 1 }

  - id: sk-curse-knowledge
    kind: general
    name: 咒理知识
    description: 对咒灵习性、术式构造与结界原理的书本理解。
    unlocksOptions: [opt-examine-curse]
    efficiency: { key: study, bonus: 0.2 }
    proficiency: { maxLevel: 5, growthPerUse: 1 }

  # ────────────────────── 领域展开（术式共通的顶点） ──────────────────────

  - id: sk-domain-expansion
    kind: combat
    name: 领域展开
    description: 把生得术式推到极致，用自己的法则覆盖一片空间。领域内你的攻击必中且被放大，敌人的防御被压到最低——但它只撑得住三个回合。
    cost: { mp: 50 }
    target: all_enemies
    # 领域是必中（ADR-008 D1）：不掷命中骰，也不吃对方的闪避。没有这一行，无下限会把领域也挡掉。
    hit: guaranteed
    damage:
      - { preset: scaled, base: 26, scaleBy: cursedEnergy, multiplier: 1.0 }
    applyStatus:
      - { status: domain-active, chance: 1.0, stacks: 1, target: self, duration: { rounds: 3 } }
      - { status: domain-pin, chance: 1.0, stacks: 1, target: all_enemies, duration: { rounds: 3 } }
    cooldownTurns: 99
    usableInBattle: true

  # ────────────────────── 生得术式 ①：十种影法术 ──────────────────────
  #
  # 十影走的是**召唤流**（ADR-013 D7），与咒灵操术的献祭流是两回事：
  #   · 脱兔 = 杂兵档：一次放三只，稀缺性只由场上 `limit` 表达；
  #   · 其余全是**英雄档**：`limit` 1，阵亡即永久失去（`state.lostSummons`），本局再也召不出来；
  #   · **没有 `sacrifice`** —— 十影没有旋涡那种「烧自己人换伤害」的解法，那是咒灵操术的私有玩法。
  #
  # 用户口径（2026-11-20）：「除了脱兔全是英雄单位（实际上是削弱了，原作能同时召唤多个）」。
  # 英雄档上限按**档**统计（ADR-012 D2），所以场上永远只有一只式神 —— 想换手就
  # `sk-ten-recall` 收回去（进 `battle.bench`，hp / 补正 / 冷却原样保留），再召另一只。
  # 玉犬在原作里是黑、白**两只**，这里合成一张卡（一对犬一起打）：拆成两张卡会让
  # 「一次只能站一只」变得滑稽，而合成一张刚好保住「十种」的手感。

  - id: sk-ten-rabbits
    kind: combat
    name: 影法术·脱兔
    description: 影子里涌出的一群兔子。它们什么也咬不穿，但能替你把那一秒撑住。
    cost: { mp: 8 }
    target: none
    summon:
      ref: shiki-rabbits
      tier: minion
      count: 3
      # 兔子是「数量」不是「个体」：同一张卡压到 0.7，三只合起来才挡得住一次。
      levelScale: 0.7
      onSummonerDown: dismiss
    cooldownTurns: 1
    usableInBattle: true

  - id: sk-ten-shadow
    kind: combat
    name: 影法术·玉犬
    description: 从影子里唤出一对犬。它们咬住的地方，影子会跟着缠上去。
    cost: { mp: 12 }
    target: none
    summon:
      ref: shiki-gyokuken
      tier: hero
      onSummonerDown: dismiss
    cooldownTurns: 1
    usableInBattle: true

  - id: sk-ten-nue
    kind: combat
    name: 影法术·鵺
    description: 影中飞出的黑色羽翼。它抓着对手直冲上天，再摔下来。
    cost: { mp: 14 }
    target: none
    summon:
      ref: shiki-nue
      tier: hero
      onSummonerDown: dismiss
    cooldownTurns: 1
    usableInBattle: true

  - id: sk-ten-gama
    kind: combat
    name: 影法术·蝦蟇
    description: 一只不愿挪窝的大蛙。舌头比影子还长，能把人从十步外拽回来。
    cost: { mp: 10 }
    target: none
    summon:
      ref: shiki-gama
      tier: hero
      onSummonerDown: dismiss
    cooldownTurns: 1
    usableInBattle: true

  - id: sk-ten-orochi
    kind: combat
    name: 影法术·大蛇
    description: 影子里游出来的巨蛇。它不需要咬，只要把你整个圈进去。
    cost: { mp: 18 }
    target: none
    summon:
      ref: shiki-orochi
      tier: hero
      onSummonerDown: dismiss
    cooldownTurns: 2
    usableInBattle: true

  - id: sk-ten-enzuru
    kind: combat
    name: 影法术·円鹿
    description: 一头安静的鹿。它不咬人——它把角抵在伤口上，让血倒着流回去。
    cost: { mp: 16 }
    target: none
    summon:
      ref: shiki-enzuru
      tier: hero
      onSummonerDown: dismiss
    cooldownTurns: 2
    usableInBattle: true

  - id: sk-ten-kangyu
    kind: combat
    name: 影法术·貫牛
    description: 一头只认直线的牛。它跑过的距离越长，撞上你的时候就越不讲道理。
    cost: { mp: 16 }
    target: none
    summon:
      ref: shiki-kangyu
      tier: hero
      onSummonerDown: dismiss
    cooldownTurns: 2
    usableInBattle: true

  - id: sk-ten-mahoraga
    kind: combat
    name: 影法术·八握剑异戒神将魔虚罗
    description: 十种影法术的最后一手。它出现时，你已经在拿命换时间了——但它会适应对手的一切。
    cost: { mp: 40 }
    target: none
    summon:
      ref: shiki-mahoraga
      tier: hero
      # ADR-014：**未调伏**。它站中间，打你，也打你对面 —— 这不是「同阵营的强力召唤」。
      faction: neutral
      # 你倒下它也不走：暴走的东西没有「召唤者」可跟。
      onSummonerDown: stay
    # 代价留在**施放点**上（ADR-013 D7）：召它要拿两天状态换，与召唤物本身无关。
    applyStatus:
      - { status: battle-exhausted, chance: 1.0, stacks: 1, target: self, duration: { rounds: 2 } }
    cooldownTurns: 99
    usableInBattle: true

  - id: sk-ten-recall
    kind: combat
    name: 影法术·收
    description: 把式神送回影子里。它还活着，只是不在场上了——伤也一起带回去。
    cost: { mp: 0 }
    target: ally
    # 收灵只能收**自己的**召唤物：选自己 / 真实友军 / 别人的召唤物都不是合法目标。
    legalTarget: { summonedBy: self, disableReason: 你只能选中自己的召唤物 }
    recall: { count: 1 }
    cooldownTurns: 0
    usableInBattle: true

  # ── 式神自己的招式（`summon.ref` 那张卡带着它们上场，不是给术师的技能）──

  - id: sk-shiki-nibble
    kind: combat

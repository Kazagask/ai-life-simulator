  # ══════════════ 共通高阶技巧（咒力操作层，不是术式） ══════════════
  #
  # 这几条人人可学，差别只在熟练度。注意它们与 sk-curtain（帐）职能不同：
  # 帐是藏，简易领域是「不被秒」，展延是「中和术式」，弥虚葛笼是简易领域的原型。

  - id: sk-simple-domain
    kind: combat
    name: 简易领域
    description: 新阴流的架势。不追求必中，只求在别人的领域里不被一刀秒掉——撑住，再想办法。
    cost: { mp: 18 }
    target: self
    heal:
      - { preset: scaled, base: 6, scaleBy: cursedEnergy, multiplier: 0.4 }
    applyStatus:
      - { status: veil, chance: 1.0, stacks: 1, target: self, duration: { rounds: 3 } }
    cooldownTurns: 4
    usableInBattle: true

  - id: sk-domain-envelopment
    kind: combat
    name: 领域展延
    description: 不设结界，只把咒力裹满全身，用它去中和对手的术式。代价是自己的术式也一起被裹住。
    cost: { mp: 22 }
    target: self
    applyStatus:
      - { status: veil, chance: 1.0, stacks: 1, target: self, duration: { rounds: 3 } }
      - { status: battle-exhausted, chance: 1.0, stacks: 1, target: self, duration: { rounds: 2 } }
    cooldownTurns: 4
    usableInBattle: true

  - id: sk-technique-disclosure
    kind: combat
    name: 术式公开
    description: 把自己的术式讲给对手听。情报一旦说出口就收不回，但咒力的运转会因此顺滑一次。
    cost: { mp: 5 }
    target: self
    applyStatus:
      - { status: disclosure, chance: 1.0, stacks: 1, target: self, duration: { rounds: 3 } }
    cooldownTurns: 3
    usableInBattle: true

  - id: sk-mishu-kago
    kind: combat
    name: 弥虚葛笼
    description: 真·阴流的奥义，简易领域的原型。以咒力编一只笼子罩住自己，让结界的必中落空。
    cost: { mp: 24 }
    target: self
    heal:
      - { preset: scaled, base: 8, scaleBy: cursedEnergy, multiplier: 0.5 }
    applyStatus:
      - { status: veil, chance: 1.0, stacks: 1, target: self, duration: { rounds: 3 } }
    cooldownTurns: 5
    usableInBattle: true

  - id: sk-self-binding-vow
    kind: combat
    name: 自缚束缚
    description: 给自己加一条限制：不逃、不用咒具。换来的是一次「这次一定成」——束缚越窄，回报越狠。
    cost: { mp: 8 }
    target: self
    applyStatus:
      - { status: vow-boost, chance: 1.0, stacks: 1, target: self, duration: { rounds: 1 } }
    cooldownTurns: 4
    usableInBattle: true

  - id: sk-curse-sight

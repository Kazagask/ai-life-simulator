# JJK 世界模板 · equipment.yaml
# 装备分域（协议 V2.1 §19）：槽位 / 品质白名单。
# 本模板不设 initialEquipment —— 玩家开局两手空空，装备只能从转盘与剧情里拿。
equipment:
  # 不再声明 qualities：引擎的品级阶梯（14 档：mythic-unique / mythic / ancient / legend /
  # sublime / epic / precious / treasure / superb / excellent / rare / fine / common / poor）
  # 本身就是合法取值，装备只写 `quality: legend`。四档「光谱」是平铺的阶梯档，不是形容词前缀。
  # slots 是「能装备多少东西」的唯一真源：条数 = 槽位种类，maxCount = 该槽可同时穿戴件数。
  # panelSide 只决定人物面板摆位（ADR-0009）：左列 / 右列 / 底部方块区（缺省）。
  # 类别显示名（2026-11-20）：`category` 是判定用的词（槽位 allowedCategories 按它匹配），
  # 面板上不该出现 `cursed-tool` 这种 id。
  categories:
    - { id: cursed-tool, label: 咒具 }
    - { id: blade, label: 刀剑 }
  slots:
    - { id: weapon,    label: 武器,  allowedCategories: [blade, cursed-tool], maxCount: 1, panelSide: left }
    - { id: accessory, label: 饰品,  allowedCategories: [ring, charm, cursed-tool], maxCount: 2, panelSide: right }

# JJK-2006 开局分域（协议 V2.1 §16 · R-OP-01..06）
#
# 2026-11-12 用户裁决：主线剧情事件链已删除，两个开局的 handoff 均直接挂载
# 「咒术转盘」入口事件 ev-opening-wheel（chain 源、不属于任何链）。
# 玩家创建世界后的首个待决事件即开局转盘，选「转动命数转盘」进入
# chain-wheel-creation（43 维角色创建）。
# 差异保留在「起始关系 + 起始 flag」两处，不新增世界状态结构。

- openingId: op-2006-tokyo
  name: 2006 · 东京高专
  description: 以东京咒术高专一年级新生的身份入学，从命数转盘开始书写此身。
  entryConditions: []
  steps:
    - { id: step-enter-tokyo, kind: required }
  characterSetup:
    effects:
      - { type: grantItem, itemId: item-first-aid, count: 1 }
    flags:
      openingPath: tokyo
  worldSetup:
    flags:
      openingDone: true
  npcSetup:
    relations:
      - { npcId: npc-gojo, value: 5, source: 入学引导 }
      - { npcId: npc-shoko, value: 3, source: 同班同学 }
    visibility:
      npc-riko: unknown
      npc-yuta: unknown
  eventPools: []
  objectives:
    flags:
      objective: 成为能独当一面的术师
  choices: {}
  completionConditions:
    - { flag: openingDone, eq: true }
  handoff:
    pendingEvents: [ev-opening-wheel]
    schedule: []

- openingId: op-2006-kyoto
  name: 2006 · 京都校交流
  description: 以京都校交流生的身份来到东京，起点关系不同，同样从命数转盘开始。
  entryConditions: []
  steps:
    - { id: step-enter-kyoto, kind: required }
  characterSetup:
    flags:
      openingPath: kyoto
  worldSetup:
    flags:
      openingDone: true
  npcSetup:
    relations:
      - { npcId: npc-geto, value: 3, source: 交流生接待 }

      npc-gojo: unknown
      npc-riko: unknown
  eventPools: []
  objectives: {}
  choices:
    flags:
      transfer: kyoto
  completionConditions:
    - { flag: openingDone, eq: true }
  handoff:
    pendingEvents: [ev-opening-wheel]
    schedule: []

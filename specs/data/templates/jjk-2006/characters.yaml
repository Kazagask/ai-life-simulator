# JJK Demo 世界模板 · characters.yaml
# NPC 与敌人角色；玩家由 playerTemplate + 创建输入生成。
characters:
  - id: npc-gojo
    isEnemy: false
    visibility: public
    identity:
      name: 五条悟
      age: 17
      gender: male
      description: 白发的天才特级术师，言行张扬，实力深不可测。
    mood: { value: 75 }
    attributes: { cursedEnergy: 100, intellect: 9, physique: 9, agility: 9, reputation: 90 }
    skills: [sk-gojo-blue, sk-gojo-red, sk-domain-void]
    statuses: [six-eyes]
    public:
      personality: 轻浮不定，以强者的姿态俯瞰咒术界。
      knownGoals:
        - 培养能改变咒术界的学生
        - 让强者的傲慢不再主宰界内秩序
    private:
      knowledge: [jujutsu, missions, rumor-star-plasma]
      goals: [become-stronger, protect-students]
      traits: [diligent, confident, vigilant]
      combatHints:
        skillWeights: { sk-gojo-blue: 3, sk-gojo-red: 2, sk-domain-void: 1 }
      secrets:
        - 知晓世界线偏差的存在，并暗中观察它的走向
    relationship: 0
    relations:
      - { to: npc-geto, kind: friend, visibility: known, value: 70 }
      - { to: npc-shoko, kind: colleague, visibility: known, value: 60 }
      - { to: npc-yuta, kind: disciple, visibility: known, value: 80 }
      # 原作：五条称乙骨为「远亲」（同出菅原道真一脉），代数不可考 ⇒ gap 只出粗称谓
      - { to: npc-yuta, kind: relative, visibility: known, gap: true }

  - id: npc-geto
    isEnemy: false
    visibility: public
    identity:
      name: 夏油杰
      age: 17
      gender: male
      description: 沉静自律的高专学生，以正义自持，深受同伴信任。
    mood: { value: 65 }
    attributes: { cursedEnergy: 80, intellect: 8, physique: 7, agility: 6, reputation: 60 }
    skills: [sk-gather-curses, sk-uzumaki]
    public:
      personality: 温和有礼，语调永远不疾不徐。
      knownGoals:
        - 建立由术师保护普通人的秩序
    private:
      knowledge: [jujutsu, missions]
      goals: [establish-order]
      traits: [calm, idealistic, diligent]
      secrets:
        - 对"非术师"的失望正在悄悄积累
    relationship: 0
    relations:
      - { to: npc-gojo, kind: friend, visibility: known, value: 70 }
      - { to: npc-shoko, kind: colleague, visibility: known, value: 60 }

  - id: npc-shoko
    isEnemy: false
    visibility: public
    identity:
      name: 家入硝子
      age: 17
      gender: female
      description: 高专的治疗师预备生，慵懒随性，烟不离手。
    mood: { value: 55 }
    attributes: { cursedEnergy: 60, intellect: 8, physique: 4, agility: 5, reputation: 40 }
    public:
      personality: 慵懒毒舌，但对同伴的伤势从不含糊。
      knownGoals:
        - 成为独当一面的反转术师
    private:
      knowledge: [jujutsu, medical]
      goals: [become-healer]
      traits: [lazy, caring]
    relationship: 0
    relations:
      - { to: npc-gojo, kind: colleague, visibility: known, value: 60 }
      - { to: npc-geto, kind: colleague, visibility: known, value: 60 }

  - id: npc-riko
    isEnemy: false
    visibility: public
    identity:
      name: 天内里子
      age: 14
      gender: female
      description: 被选为天元同化容器的"星浆体"，一名向往普通生活的女中学生。
    mood: { value: 60 }
    attributes: { cursedEnergy: 3, intellect: 6, physique: 3, agility: 4, reputation: 10 }
    public:
      personality: 开朗直率，珍惜平凡日常，对天元同化心有不甘。
      knownGoals:
        - 在天元同化之前，尽量像普通少女一样生活
    private:
      knowledge: [school]
      goals: [live-ordinary-life]
      traits: [cheerful, determined]
    relationship: 0
    relations:
      - { to: npc-gojo, kind: friend, visibility: known, value: 40 }

  - id: npc-yuta
    isEnemy: false
    visibility: public
    identity:
      name: 乙骨忧太
      age: 16
      gender: male
      description: 被五条悟寄予厚望的特级咒术师，咒力总量深不可测。
    mood: { value: 65 }
    attributes: { cursedEnergy: 95, intellect: 7, physique: 5, agility: 6, reputation: 70 }
    skills: [sk-cursed-strike, sk-reverse-heal]
    public:
      personality: 温和腼腆，为守护同伴而战。
      knownGoals:
        - 保护同伴
        - 结束夏油杰发动的百鬼夜行
    private:
      knowledge: [jujutsu, missions]
      goals: [protect-comrades]
      traits: [kind, determined]
      combatHints:
        skillWeights: { sk-cursed-strike: 3, sk-reverse-heal: 1 }
    relationship: 0
    relations:
      - { to: npc-gojo, kind: mentor, visibility: known, value: 80 }


# JJK 世界模板 · skills.yaml
#
# 设计原则（2026-11-12 重做）：
# - 生得术式不是「一个技能」，而是一整套能力：术式补正（见 statuses.yaml）+ 2–3 个技能
#   + 1 个领域展开。角色可以同时持有多个术式（宿傩、羂索、以及玩家的隐藏分支）。
# - 引擎没有「暴击」机制，因此黑闪不做随机暴击，改为**会心窗口**：
#   一记必中的重击 + 给自身挂 1 回合的伤害增幅补正（damageDealt），下一击才是真正的黑闪。
# - 领域展开用补正实现：自身大幅增幅 + 全体敌人「领域压制」（受伤增加、命中下降），限 3 回合。
skills:
  # ────────────────────────────── 通用 ──────────────────────────────

  - id: sk-basic-strike
    kind: combat
    name: 体术打击
    description: 不依赖咒力的基础体术。任何一个咒术师的第一课。
    cost: { mp: 0 }
    target: enemy
    hitCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.7 }
    damage:
      - { preset: fixed, value: 8 }
    cooldownTurns: 0
    usableInBattle: true

  - id: sk-cursed-strike
    kind: combat
    name: 咒力斩击
    description: 把咒力凝在拳锋或刃上，一击夹带灼烧。
    cost: { mp: 10 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: agility, baseChance: 0.6 }
    damage:
      - { preset: scaled, base: 10, scaleBy: cursedEnergy, multiplier: 1.2 }
    applyStatus:
      - { status: cursed-burn, chance: 0.3 }
    cooldownTurns: 1
    usableInBattle: true

  - id: sk-reverse-heal
    kind: combat
    name: 反转术式·治疗
    description: 负负得正。把两股负向咒力相乘，造出能重建血肉的正向能量。
    cost: { mp: 15 }
    target: self
    heal:
      - { preset: scaled, base: 12, scaleBy: cursedEnergy, multiplier: 0.9 }
    cooldownTurns: 2
    usableInBattle: true

  - id: sk-curtain
    kind: combat
    name: 简易领域·帐
    description: 不追求必中，只求不被秒。薄薄一层帐，挡掉一部分伤害。
    cost: { mp: 10 }
    target: self
    heal:
      - { preset: scaled, base: 6, scaleBy: cursedEnergy, multiplier: 0.4 }
    applyStatus:
      - { status: veil, chance: 1.0, stacks: 1, onSelf: true }
    cooldownTurns: 3
    usableInBattle: true

  # 黑闪：不是随机暴击，而是「会心窗口」——这一击必中且重，窗口留给下一击
  - id: sk-black-flash
    kind: combat
    name: 黑闪
    description: 物理打击与咒力在百万分之一秒的误差内重合。这一击之后，咒力的运转会短暂地变得异常顺滑——真正的杀招是下一击。
    cost: { mp: 16 }
    target: enemy
    damage:
      - { preset: scaled, base: 16, scaleBy: cursedEnergy, multiplier: 1.4 }
    applyStatus:
      - { status: black-flash, chance: 1.0, stacks: 1, onSelf: true }
    cooldownTurns: 4
    usableInBattle: true

  - id: sk-investigation
    kind: general
    name: 调查
    description: 系统地搜集与核查线索。能问出别人问不出的东西。
    unlocksOptions: [opt-investigate]
    proficiency: { maxLevel: 5, growthPerUse: 1 }

  - id: sk-curse-knowledge
    kind: general
    name: 咒理知识
    description: 对咒灵习性、术式构造与结界原理的书本理解。
    unlocksOptions: [opt-examine-curse]
    efficiency: { key: study, bonus: 0.2 }
    proficiency: { maxLevel: 5, growthPerUse: 1 }

  # ────────────────────── 领域展开（术式共通的顶点） ──────────────────────

  - id: sk-domain-expansion
    kind: combat
    name: 领域展开
    description: 把生得术式推到极致，用自己的法则覆盖一片空间。领域内你的攻击必中且被放大，敌人的防御被压到最低——但它只撑得住三个回合。
    cost: { mp: 50 }
    target: all_enemies
    damage:
      - { preset: scaled, base: 26, scaleBy: cursedEnergy, multiplier: 1.0 }
    applyStatus:
      - { status: domain-active, chance: 1.0, stacks: 1, onSelf: true }
      - { status: domain-pin, chance: 1.0, stacks: 1 }
    cooldownTurns: 99
    usableInBattle: true


# JJK Demo 世界模板 · skills.yaml
# 战斗技能（消耗/命中/伤害/治疗/施加补正/冷却）与通用技能（解锁选项/效率/熟练度）。
skills:
  - id: sk-basic-strike
    kind: combat
    name: 体术打击
    description: 不依赖咒力的基础体术。
    cost: { mp: 0 }
    target: enemy
    hitCheck: { preset: opposed, attacker: agility, defender: agility, baseChance: 0.7 }
    damage:
      - { preset: fixed, value: 8 }
    cooldownTurns: 0
    usableInBattle: true

  - id: sk-cursed-strike
    kind: combat
    name: 咒力斩击
    description: 将咒力凝聚于刃上斩出一击，可能灼伤对手。
    cost: { mp: 10 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: agility, baseChance: 0.6 }
    damage:
      - { preset: scaled, base: 10, scaleBy: cursedEnergy, multiplier: 1.5 }
    applyStatus:
      - { status: cursed-burn, chance: 0.3 }
    cooldownTurns: 1
    usableInBattle: true

  - id: sk-reverse-heal
    kind: combat
    name: 反转术式·初阶
    description: 以正向咒力修复自身伤势。
    cost: { mp: 15 }
    target: self
    heal:
      - { preset: scaled, base: 10, scaleBy: cursedEnergy, multiplier: 0.8 }
    cooldownTurns: 2
    usableInBattle: true

  - id: sk-cursed-speech
    kind: combat
    name: 咒言术
    description: 以咒力加持的话语命令现实，束缚甚至击退对手。
    cost: { mp: 15 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: cursedEnergy, baseChance: 0.6 }
    damage:
      - { preset: scaled, base: 14, scaleBy: cursedEnergy, multiplier: 1.3 }
    applyStatus:
      - { status: stun, chance: 0.4 }
    cooldownTurns: 2
    usableInBattle: true

  # ---------- 五条悟 kit ----------

  - id: sk-gojo-blue
    kind: combat
    name: 术式顺转·苍
    description: 造出负的咒力漩涡将目标吸引撕裂，稳定而致命。
    cost: { mp: 20 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: agility, baseChance: 0.7 }
    damage:
      - { preset: scaled, base: 15, scaleBy: cursedEnergy, multiplier: 0.8 }
    cooldownTurns: 1
    usableInBattle: true

  - id: sk-gojo-red
    kind: combat
    name: 术式反转·赫
    description: 咒力反转的排斥爆发，威力远超顺转。
    cost: { mp: 35 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: agility, baseChance: 0.6 }
    damage:
      - { preset: scaled, base: 30, scaleBy: cursedEnergy, multiplier: 1.2 }
    cooldownTurns: 2
    usableInBattle: true

  - id: sk-domain-void
    kind: combat
    name: 领域展开·无量空处
    description: 将无限制的咒力信息灌入领域内一切对象——必中全体，令人无法行动。
    cost: { mp: 60 }
    target: all_enemies            # 必中全体（hitCheck 省略 = 必中）
    damage:
      - { preset: scaled, base: 40, scaleBy: cursedEnergy, multiplier: 1.0 }
    applyStatus:
      - { status: stun, chance: 1.0, stacks: 1 }
    cooldownTurns: 99              # V0.1 用长冷却近似"每场战斗一次"；独占机制见 OPEN_QUESTIONS
    usableInBattle: true

  # ---------- 夏油杰 kit（无召唤物系统：咒灵以补正代替） ----------

  - id: sk-gather-curses
    kind: combat
    name: 咒灵操术·收集
    description: 以咒力降伏并吞下弱小咒灵，为自身积蓄咒灵储备（可叠层）。
    cost: { mp: 10 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: cursedEnergy, baseChance: 0.6 }
    damage:
      - { preset: fixed, value: 5 }
    applyStatus:
      - { status: absorbed-curses, chance: 1.0, stacks: 1, onSelf: true }
    cooldownTurns: 0
    usableInBattle: true

  - id: sk-uzumaki
    kind: combat
    name: 旋涡
    description: 将收集的咒灵合而为一，献祭它们释放出毁灭性的一击——献祭的数量决定威力。
    cost: { mp: 25 }
    target: enemy
    hitCheck: { preset: opposed, attacker: cursedEnergy, defender: agility, baseChance: 0.6 }
    damage:
      - { preset: stack-scaled, base: 10, perStack: 15, status: absorbed-curses }
    consumeStatus: { status: absorbed-curses }   # 献祭 = 失去全部收集的咒灵
    cooldownTurns: 2
    usableInBattle: true

  # ---------- 咒灵敌人技能 ----------

  - id: sk-curse-bite
    kind: combat
    name: 诅咒撕咬
    description: 以扭曲的颚撕咬猎物。
    cost: { mp: 0 }
    target: enemy
    hitCheck: { preset: opposed, attacker: physique, defender: agility, baseChance: 0.6 }
    damage:
      - { preset: scaled, base: 8, scaleBy: physique, multiplier: 1.0 }
    cooldownTurns: 0
    usableInBattle: true

  - id: sk-curse-wail
    kind: combat
    name: 诅咒尖啸
    description: 释放凝聚怨念的音波，冲击所有对手。
    cost: { mp: 5 }
    target: all_enemies
    damage:
      - { preset: fixed, value: 6 }
    cooldownTurns: 2
    usableInBattle: true

  - id: sk-miguel-strike
    kind: combat
    name: 黑绳·打切
    description: 以注入咒力的黑绳抽打目标，力道惊人。
    cost: { mp: 10 }
    target: enemy
    hitCheck: { preset: opposed, attacker: physique, defender: agility, baseChance: 0.6 }
    damage:
      - { preset: scaled, base: 12, scaleBy: physique, multiplier: 1.0 }
    cooldownTurns: 0
    usableInBattle: true

  - id: sk-investigation
    kind: general
    name: 调查
    description: 系统地搜集与核查线索。
    unlocksOptions: [opt-investigate]
    proficiency: { maxLevel: 5, growthPerUse: 1 }

  - id: sk-curse-knowledge
    kind: general
    name: 咒理知识
    description: 对咒灵习性与术式构造的书本理解。
    unlocksOptions: [opt-examine-curse]
    efficiency: { key: study, bonus: 0.2 }
    proficiency: { maxLevel: 5, growthPerUse: 1 }


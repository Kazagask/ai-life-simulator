# JJK 世界模板 · items.yaml
#
# 2026-11-12 清理：删除旧 demo 遗留的「一级咒具 / 二级咒具 / 咒具·残刃 / 观察者护符」，
# 也删掉了 initialEquipment（玩家一开局不该白拿一把游云）。
# 玩家能拿到的装备只有两类来源：命数转盘的「咒具」维度，以及剧情里的战利品。
items:
  - id: item-first-aid
    type: consumable
    name: 急救包
    description: 高专配发的基础医疗包。纱布、止血带、一颗止痛药。
    stackable: true
    usableInBattle: true
    usableOutsideBattle: true
    use:
      - { type: adjustResource, resource: hp, value: 30 }

  - id: item-antidote
    type: consumable
    name: 净化剂
    description: 中和轻度咒毒的药剂。味道像生锈的水。
    stackable: true
    usableInBattle: true
    usableOutsideBattle: true
    use:
      - { type: cureStatus, status: curse-poison }

  - id: item-mp-candy
    type: consumable
    name: 咒力糖
    description: 高专小卖部特产。嚼一颗，咒力回路会短暂地活跃起来。
    stackable: true
    usableInBattle: true
    usableOutsideBattle: true
    use:
      - { type: adjustResource, resource: mp, value: 25 }

  - id: item-smoke
    type: consumable
    name: 线香
    description: 硝子分给你的安神线香。闻一会儿，心就静了。
    stackable: true
    usableInBattle: false
    usableOutsideBattle: true
    use:
      - { type: adjustMood, value: 10 }

  - id: item-talisman
    type: material
    name: 结界符纸
    description: 布设简易结界用的消耗性符纸。夜蛾上课时发的。
    stackable: true
    usableInBattle: false
    usableOutsideBattle: true
    use:
      - { type: adjustMood, value: 2 }

  - id: item-riko-ribbon
    type: key
    name: 理子的发带
    description: 一条普通的、带着樟脑香气的发带。有人把它塞进了你的口袋，没说是谁。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false

  # ══════════════ 特级咒具（转盘 / 战利品） ══════════════

  - id: eq-ten-spear
    type: equipment
    name: 咒具·天逆鉾
    description: 特级咒具。贯穿一切的矛，能强制解除对手的术式。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: weapon
    category: cursed-tool
    quality: cursed
    dynamicModifier:
      attribute: cursedEnergy
      preset: scaled
      params: { base: 4, scaleBy: cursedEnergy, multiplier: 0.2 }

  - id: eq-bancho
    type: equipment
    name: 咒具·万里锁
    description: 特级咒具。无限伸缩的锁链，远近皆宜。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: accessory
    category: charm
    quality: cursed
    dynamicModifier:
      attribute: agility
      preset: scaled
      params: { base: 3, scaleBy: agility, multiplier: 0.15 }

  - id: eq-shakujin
    type: equipment
    name: 咒具·释魂刀
    description: 特级咒具。能切割灵魂的利刃，对咒灵尤为致命。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: weapon
    category: cursed-tool
    quality: cursed
    dynamicModifier:
      attribute: cursedEnergy
      preset: scaled
      params: { base: 3, scaleBy: cursedEnergy, multiplier: 0.18 }

  - id: eq-kurobuna
    type: equipment
    name: 咒具·黑绳
    description: 特级咒具。注入咒力的特制黑绳，专门干扰术式运转。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: weapon
    category: cursed-tool
    quality: cursed
    dynamicModifier:
      attribute: agility
      preset: scaled
      params: { base: 4, scaleBy: agility, multiplier: 0.2 }

  - id: eq-cursed-blade
    type: equipment
    name: 咒具·游云
    description: 经年保养的咒具刀。术者的咒力越强，刀身越沉。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: weapon
    category: cursed-tool
    quality: rare
    dynamicModifier:
      attribute: cursedEnergy
      preset: scaled
      params: { base: 2, scaleBy: cursedEnergy, multiplier: 0.1 }

# JJK Demo 世界模板 · items.yaml
# 物品：使用效果为效果 DSL；战斗内/外可用性分开声明。
items:
  - id: item-first-aid
    type: consumable
    name: 急救包
    description: 高专配发的基础医疗包。
    stackable: true
    usableInBattle: true
    usableOutsideBattle: true
    use:
      - { type: adjustResource, resource: hp, value: 30 }

  - id: item-antidote
    type: consumable
    name: 净化剂
    description: 中和轻度咒毒的药剂。
    stackable: true
    usableInBattle: true
    usableOutsideBattle: true
    use:
      - { type: cureStatus, status: curse-poison }

  - id: item-curse-tool
    type: key
    name: 咒具·残刃
    description: 从咒灵巢穴回收的残破咒具，隐约有诅咒残留。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false

  - id: item-talisman
    type: material
    name: 结界符纸
    description: 布设简易结界用的消耗性符纸。
    stackable: true
    usableInBattle: false
    usableOutsideBattle: true
    use:
      - { type: adjustMood, value: 2 }

  # ---- 装备（协议 V2.1 §19；统一动态补正，无 static|dynamic 二选一） ----

  - id: eq-cursed-blade
    type: equipment
    name: 咒具·游云
    description: 经年保养的咒具刀，术者的咒力越强，刀身越沉。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: weapon
    category: cursed-tool
    quality: rare
    # 动态补正：按穿戴者当前有效属性现算（scaled），不写回基础属性
    dynamicModifier:
      attribute: cursedEnergy
      preset: scaled
      params: { base: 2, scaleBy: cursedEnergy, multiplier: 0.1 }

  - id: eq-watcher-charm
    type: equipment
    name: 观察者护符
    description: 积攒的怨念越多，护符越亮。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: accessory
    category: charm
    quality: uncommon
    # 动态补正：按身上「咒灵怨念」层数现算（stack-scaled）
    dynamicModifier:
      attribute: agility
      preset: stack-scaled
      params: { base: 1, perStack: 1, status: absorbed-curses }
      conditions:
        - { mood: { gte: 40 } }

  # ---- 来自「咒术转盘·咒具」维度的特级咒具（角色创建维度的具象化） ----

  - id: eq-ten-spear
    type: equipment
    name: 咒具·天逆鉾
    description: 特级咒具。贯穿一切的矛，可强制解除对手的术式。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: weapon
    category: cursed-tool
    quality: cursed
    dynamicModifier:
      attribute: cursedEnergy
      preset: scaled
      params: { base: 4, scaleBy: cursedEnergy, multiplier: 0.2 }

  - id: eq-bancho
    type: equipment
    name: 咒具·万里锁
    description: 特级咒具。无限伸缩的锁链，远近皆宜。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: accessory
    category: charm
    quality: cursed
    dynamicModifier:
      attribute: agility
      preset: scaled
      params: { base: 3, scaleBy: agility, multiplier: 0.15 }

  - id: eq-shakujin
    type: equipment
    name: 咒具·释魂刀
    description: 特级咒具。能切割灵魂的利刃，对咒灵尤为致命。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: weapon
    category: cursed-tool
    quality: cursed
    dynamicModifier:
      attribute: cursedEnergy
      preset: scaled
      params: { base: 3, scaleBy: cursedEnergy, multiplier: 0.18 }

  - id: eq-kurobuna
    type: equipment
    name: 咒具·黑绳
    description: 特级咒具。注入咒力的特制黑绳，专门干扰术式运转。
    stackable: false
    usableInBattle: false
    usableOutsideBattle: false
    slot: weapon
    category: cursed-tool
    quality: cursed
    dynamicModifier:
      attribute: agility
      preset: scaled
      params: { base: 4, scaleBy: agility, multiplier: 0.2 }

  - id: eq-takatsuki
    type: equipment
    name: 咒具·退魔之剑
    description: 特级咒具。一剑斩出，咒灵灰飞烟灭。
    stackable: false

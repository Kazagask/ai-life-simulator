  # ══════════════ 决战宿傩 · 两阶段 ══════════════
  #
  # 同一存在、两种形态，**分开建两张卡**（用户要求：是两个 NPC）；三个形态都是 NPC
  # （2026-11-19：有戏的人不做 `isEnemy`），只是 `visibility: hidden`、登场时点不同：
  #   一阶段 = 借伏黑惠之身（死灭回游末被夺舍，ev-cg-04 把 npc-megumi 置 inactive）
  #   二阶段 = 完全受肉真身（四臂两面），显著强于一阶段
  # 涩谷那个「借虎杖之身」的形态**复用 npc-sukuna**，不为同一形态造两套数值。

  - id: npc-sukuna-megumi
    isEnemy: false

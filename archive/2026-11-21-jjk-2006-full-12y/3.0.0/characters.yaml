# JJK 世界模板 · characters.yaml
#
# 阵容按原作时间线铺开：2006 高专（夜蛾/五条/夏油/硝子/七海/灰原/理子/甚尔）
# → 2017 咒术回战 0（乙骨）→ 2018 本篇（虎杖/伏黑/钉崎/真人/漏瑚/羂索/宿傩）。
# 玩家是 2006 年入学的一年生 —— 七海与灰原的同班同学，五条与夏油的学弟/学妹。
#
# `isEnemy` 的判据（2026-11-19 用户裁决）：**有没有戏**，不是「打不打得起来」。
#   * 有名字、有立场、会被玩家记住的人 ⇒ NPC（`isEnemy: false`）。他们在实例表里，
#     能当关系边的端点、有卡、会自己行动；不想让玩家看见就 `visibility: hidden`。
#     漏瑚 / 羂索 / 宿傩（三形态）/ 甚尔 都属于这一档：**打他们仍然可以用 combat
#     settle 的 `enemies[].ref` 直接引用**——参战与实例化是两件事。
#   * 完全没剧情的野怪（二级咒灵 / 一级咒灵 / 诅咒师 / 咒胎）才是 `isEnemy: true`：
#     永不实例化、无卡、不能当关系端点。
#
# 登场时点写在 `world.yaml npcSpawnRules`（定时，见 ADR-006 D2）；本文件只写「这个人是谁」。
#
# 关于 `to: player` 的初始边（2026-11-12 修复「面板看不到 NPC 视你为 X」）：
#   * 关系是**世界事实**，`scope` 说明「多少人知道」：public 大家都知道 / limited 部分人
#     知道（配 `knownBy`）/ private 仅当事人。玩家是当事人 ⇒ 一定看得到。
#   * 边语义仍是「`to` 是 `from` 的 kind」⇒ 要表达「夜蛾视你为弟子」必须写
#     `{ from: npc-yaga, to: player, kind: disciple }`；写成 `mentor` 会读成
#     「你视夜蛾为师父」（方向反了，见 npc-yaga 下的历史坑注释）。
#   * 必须显式 `scope: public`（ADR-007 D3）：缺省按 `private` 处理，只有当事人看得到。
#   * **省略 `value`**：人物卡片已有 `relationship` 标量 chip，两处关系值会同卡自相矛盾；
#     且模板里 `{ relation: npc-x, gte: N }` 条件走的是标量形态，不写 value 才不会改变既有分支。
characters:
  # ══════════════ 2006 · 东京咒术高专 ══════════════

  - id: npc-yaga
    isEnemy: false
    visibility: public
    identity:
      name: 夜蛾正道
      age: 34
      gender: male
      description: 一年生班主任，一级术师。沉默、魁梧、会缝布偶，也会在你偷懒时把布偶扔到你脸上。
    mood: { value: 55 }
    attributes: { cursedEnergy: 30, intellect: 9, physique: 8, agility: 6, reputation: 35 }
    skills: [sk-puppet, sk-basic-strike]
    public:
      personality: 严厉、护短，从不把「保护学生」四个字说出口。
      knownGoals: [把学生活着送出高专]
    private:
      secrets: [他在秘密制造一种能自我判断的咒骸]
      goals: [protect-students]
      traits: [stern, caring]
      combatHints:
        skillWeights: { sk-puppet: 4, sk-basic-strike: 1 }
    relationship: 8
    relations:
      # 夜蛾是二人之师：边语义为「to 是 from 的 kind」，故此处是 disciple（弟子），
      # 不是 mentor。原写成 mentor 会读成「五条/七海是夜蛾的师父」（2026-11-12 面板验收发现）。
      - { to: npc-gojo, kind: disciple, scope: public, value: 80 }
      - { to: npc-nanami, kind: disciple, scope: public, value: 70 }
      # 夜蛾视你为弟子（玩家是他名下的一年生）
      - { to: player, kind: disciple, scope: public }

  - id: npc-gojo
    isEnemy: false
    visibility: public
    identity:
      name: 五条悟
      age: 17
      gender: male
      description: 二年生，五条家的六眼。全世界最强的两个咒术师之一，也是最吵的那个。
    mood: { value: 80 }
    attributes: { cursedEnergy: 120, intellect: 10, physique: 9, agility: 11, reputation: 60, grade: special, innateTechnique: limitless }
    # ADR-010 D6：开局只会顺转。赫与领域由 world.yaml 的 scheduledFacts 在
    # 怀玉收束（518 天）与苦夏之后（760 天）解锁 —— 2006 年秋天的五条悟还不会反转。
    skills: [sk-gojo-blue, sk-basic-strike]
    statuses: [six-eyes, infinity]
    public:
      personality: 轻浮、自大、随时在开玩笑。真的危险时，他会站在最前面。
      knownGoals: [把咒术界翻过来]
    private:
      secrets: [他正在摸索「反转术式」能不能治别人]
      goals: [become-strongest, protect-students]
      traits: [confident, playful]
      combatHints:
        skillWeights: { sk-gojo-blue: 4, sk-gojo-red: 3, sk-domain-empty: 1 }
    relationship: 10
    relations:
      - { to: npc-geto, kind: friend, scope: public, value: 70 }
      - { to: npc-shoko, kind: colleague, scope: public, value: 60 }
      - { to: npc-yaga, kind: mentor, scope: public, value: 80 }
      - { to: npc-yuta, kind: relative, scope: public, value: 20, gap: true }
      # 「五条视惠为弟子」是 2018 年一年级编成时才有的事，写在这里会让 2006 年的
      # 五条卡上凭空出现一个 15 岁的徒弟（ADR-007 D1：改由 scheduledFacts 定时建立）。
      # 五条视你为弟子（学弟/学妹，名义上的带教关系）
      - { to: player, kind: disciple, scope: public }

  - id: npc-geto

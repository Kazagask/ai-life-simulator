# ══════════════ 召唤物卡（`summon.ref` 点名用的角色卡）══════════════
#
# 它们与上面的杂兵同形（`isEnemy: true` = 没有剧情、只有数值形状），差别只在**谁把它们叫出来**：
# 杂兵是 combat settle 的 `enemies[].ref`，这些是技能里 `summon.ref` 点名的单位。
# 从卡里实例化 ⇒ 装备、补正、技能集与开场单位同源，不是另一套迷你数值（ADR-012 D1）。
#
# 「英雄档」不是属性更高的杂兵，而是**个体**：阵亡 / 被献祭 ⇒ `state.lostSummons` 记下这张卡，
# 本局再也召不出来（ADR-013 D3）。所以这些卡的数值按「一个能打的角色」写，不按「一次性的弹幕」写。

  # ── 咒灵操术：虹龙（ADR-013 D7 补）──
  # 以前 `sk-summon-dragon.ref` 指着 `enemy-grade1-curse`，夏油放出来的「虹龙」其实是张一级咒灵的皮。
  # 现在它有自己的一张卡：更硬、更快，招式也换成盘绕与虹光。

  - id: curse-rainbow-dragon

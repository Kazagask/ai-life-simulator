      goals: [protect-weak]
      traits: [caring, thoughtful]
      combatHints:
        skillWeights: { sk-summon-curse: 2, sk-uzumaki: 2, sk-summon-dragon: 1, sk-recall: 1, sk-basic-strike: 1 }
    relationship: 10
    relations:
      - { to: npc-gojo, kind: friend, scope: public, value: 70 }
      - { to: npc-shoko, kind: colleague, scope: public, value: 60 }
      # 夏油视你为朋友
      - { to: player, kind: friend, scope: public }

  - id: npc-shoko

# ══════════════ 玩家初始模板 ══════════════
# 只给「一个新生应有的东西」：一具身体、一门基础体术、一个急救包。
# 术式 / 咒具 / 战斗风格 / 补正全部由开局的命数转盘决定（旧 demo 的遗留技能与护符已清空）。
playerTemplate:
  identity:
    age: 15
    gender: female
  mood: 60
  attributes: { cursedEnergy: 5, intellect: 6, physique: 5, agility: 5, luck: 5, reputation: 0 }
  skills: [sk-basic-strike]
  items:
    - { itemId: item-first-aid, count: 1 }
  # 玩家这一侧的关系（2026-11-20）：以前只有 NPC 声明「他视你为 X」，玩家自己一侧一条都没有 ——
  # 关系图只画出边之后，个人页的图会**整张空掉**。这里把六个入边逐条写出镜像
  # （夜蛾/五条是老师、夏油/灰原是朋友、硝子/七海是同僚），与 characters.yaml 里那六条一一对应。
  # 边语义照旧：`to` 是 `from` 的 kind —— 所以是 mentor / friend / colleague，不是 disciple。
  # 不写 `value`：**你自己的观感由行为养成**（ADR-017 D1，加载期直接拒载）。
  relations:
    - { to: npc-yaga, kind: mentor, scope: public }
    - { to: npc-gojo, kind: mentor, scope: public }
    - { to: npc-geto, kind: friend, scope: public }
    - { to: npc-shoko, kind: colleague, scope: public }
    - { to: npc-nanami, kind: colleague, scope: public }
    - { to: npc-haibara, kind: friend, scope: public }
